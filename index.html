  /* ---------------- C. 弱点 → 题干关键词映射 ---------------- */
  var TAG_TO_KEYWORDS = {
    "找不到材料":  ["概括", "总结", "归纳", "提炼", "梳理", "指出", "分析"],
    "不会归纳":    ["概括", "总结", "归纳", "提炼", "概述"],
    "原词vs提炼":  ["概括", "归纳", "提炼"],
    "不知格式":    ["通知", "倡议书", "讲话稿", "报告", "函", "公开信", "建议", "简报", "短评", "提纲", "宣传"],
    "不知写什么":  ["为题", "围绕", "结合", "论述", "文章", "自拟"],
    "看不懂题干":  ["谈谈", "分析", "阐述", "说明", "理解", "看法"],
    "时间不够":    []
  };

  /* 教练一句话（每个弱点的打穿要领） */
  var TAG_TIP = {
    "找不到材料":  "先练「圈画定位」：读题圈主体+对象，回材料只找这一类信息。",
    "不会归纳":    "先练「同类合并」：去例子、留观点，一条一个核心词。",
    "原词vs提炼":  "先练「转化判断」：政策术语照抄，口语现象提炼成规范词。",
    "不知格式":    "先练「文种模板」：标题-称谓-正文-落款，背熟五种常考文种。",
    "不知写什么":  "先练「立意+分论点」：从材料主旨切三刀，别自己另起炉灶。",
    "看不懂题干":  "先练「拆题干」：作答对象、范围、限定词，逐个标出来再动笔。",
    "时间不够":    "先练「限时找点」：小题按分值卡时间，作文留够 50 分钟。"
  };

  /* ---------------- 样式自挂载（主站未 link _b20.css 时兜底） ---------------- */
  function ensureCss(){
    try{
      var ls = document.getElementsByTagName("link"), i;
      for(i = 0; i < ls.length; i++){
        if(String(ls[i].getAttribute("href") || "").indexOf("_b20.css") >= 0) return;
      }
      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b20.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  /* ---------------- 安全访问 ---------------- */
  function isArr(x){ return Object.prototype.toString.call(x) === "[object Array]"; }
  function D(){
    try{ return (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null); }
    catch(e){ return null; }
  }
  function papers(){
    try{ var d = D(); return (d && isArr(d.papers)) ? d.papers : []; }catch(e){ return []; }
  }
  function loadAnswers(){
    try{
      var raw = localStorage.getItem(ANS_KEY);
      var o = raw ? JSON.parse(raw) : {};
      return (o && typeof o === "object") ? o : {};
    }catch(e){ return {}; }
  }
  function loadToday(){
    try{
      var raw = localStorage.getItem(TODAY_KEY);
      var a = raw ? JSON.parse(raw) : [];
      return isArr(a) ? a : [];
    }catch(e){ return []; }
  }
  function saveToday(a){
    try{
      if(!isArr(a)) a = [];
      if(a.length > TODAY_CAP) a = a.slice(a.length - TODAY_CAP);
      localStorage.setItem(TODAY_KEY, JSON.stringify(a));
      return true;
    }catch(e){ return false; }
  }
  function keyOf(pid, qno){ return String(pid) + "#" + String(qno); }
  function inToday(pid, qno){
    var a = loadToday(), i;
    for(i = 0; i < a.length; i++){
      if(a[i] && String(a[i].pid) === String(pid) && String(a[i].qno) === String(qno)) return true;
    }
    return false;
  }
  function addToday(pid, qno, tag){
    if(inToday(pid, qno)) return "already";
    var a = loadToday();
    a.push({ pid: String(pid), qno: qno, ts: Date.now(), tag: String(tag || "") });
    return saveToday(a) ? "ok" : "fail";
  }

  /* ---------------- 题型归一：库里 qtype → 规范题型类目 ---------------- */
  function qtypeCat(t){
    t = String(t == null ? "" : t);
    if(!t) return "";
    if(t.indexOf("概括") >= 0 || t.indexOf("归纳") >= 0) return "概括题";
    if(t.indexOf("贯彻") >= 0 || t.indexOf("公文") >= 0 || t.indexOf("应用文") >= 0) return "公文题";
    if(t.indexOf("对策") >= 0 || t.indexOf("建议") >= 0) return "对策题";
    if(t.indexOf("作文") >= 0 || t.indexOf("文章") >= 0 || t.indexOf("写作") >= 0) return "大作文";
    if(t.indexOf("分析") >= 0 || t.indexOf("理解") >= 0) return "分析题";
    return "";
  }

  /* ---------------- 题库索引（每次渲染构建一次） ---------------- */
  function buildIndex(){
    var list = [];
    try{
      var ps = papers(), i, j;
      for(i = 0; i < ps.length; i++){
        var p = ps[i];
        if(!p || !isArr(p.questions)) continue;
        for(j = 0; j < p.questions.length; j++){
          var q = p.questions[j];
          if(!q) continue;
          var txt = "";
          try{
            if(isArr(q.stem))     txt += q.stem.join(" ");
            if(isArr(q.material)) txt += " " + q.material.join(" ");
            else if(typeof q.material === "string") txt += " " + q.material;
          }catch(e){ txt = ""; }
          list.push({
            pid:   p.id,
            qno:   q.no,
            year:  p.year,
            label: String(p.year == null ? "" : p.year) +
                   String(p.province || "") + String(p.paper || ""),
            qtype: String(q.qtype || ""),
            cat:   qtypeCat(q.qtype),
            text:  txt.slice(0, 3000)
          });
        }
      }
    }catch(e){}
    return list;
  }

  /* ---------------- 聚合过程标签 ---------------- */
  function aggregate(){
    var data = loadAnswers();
    var count = {};             /* 规范tag -> 次数 */
    var byKey = {};             /* pid#qno -> {score, tags[], answered} */
    var totalRec = 0, withProc = 0;
    try{
      Object.keys(data).forEach(function(k){
        var rec = data[k];
        if(!rec || typeof rec !== "object") return;
        totalRec++;
        var sc = null;
        if(typeof rec.score === "number") sc = rec.score;
        else if(typeof rec.total === "number" && rec.total > 0)
          sc = Math.round((Number(rec.hitCount) || 0) / rec.total * 100);
        var tags = [];
        var pr = rec.process;
        if(pr && typeof pr === "object" && isArr(pr.tags)){
          pr.tags.forEach(function(t){
            var nt = normTag(t);
            if(!nt) return;
            tags.push(nt);
            count[nt] = (count[nt] || 0) + 1;
          });
          if(tags.length) withProc++;
        }
        byKey[k] = { score: sc, tags: tags, answered: true };
      });
    }catch(e){}
    var sorted = Object.keys(count).map(function(t){ return { tag: t, n: count[t] }; })
      .sort(function(a, b){ return b.n - a.n; });
    return { count: count, sorted: sorted, byKey: byKey, totalRec: totalRec, withProc: withProc };
  }

  /* ---------------- 单个弱点 → 同类题桶 ---------------- */
  function buildBucket(tag, idx, agg){
    var cats = TAG_TO_QTYPE[tag] || [];
    var kws  = TAG_TO_KEYWORDS[tag] || [];
    var hitCats = {}, hitKws = {};
    var out = [], i, j;

    for(i = 0; i < idx.length; i++){
      var it = idx[i];
      var rec = agg.byKey[keyOf(it.pid, it.qno)] || null;
      var why = [], w = 0;

      /* 条件1：题型同类 */
      for(j = 0; j < cats.length; j++){
        if(it.cat && it.cat === cats[j]){
          why.push("题型≈" + cats[j]); w += 2; hitCats[cats[j]] = 1; break;
        }
      }
      /* 条件2：题干/材料含弱点关键词 */
      for(j = 0; j < kws.length; j++){
        if(kws[j] && it.text.indexOf(kws[j]) >= 0){
          why.push("题干含「" + kws[j] + "」"); w += 1; hitKws[kws[j]] = 1; break;
        }
      }
      /* 条件3：这道题你已经卡过同一个点 */
      if(rec && rec.tags && rec.tags.length){
        for(j = 0; j < rec.tags.length; j++){
          if(rec.tags[j] === tag){ why.push("你在此题卡过"); w += 3; break; }
        }
      }
      if(!why.length) continue;

      var sc = (rec && typeof rec.score === "number") ? rec.score : null;
      out.push({
        pid: it.pid, qno: it.qno, label: it.label, qtype: it.qtype, cat: it.cat,
        year: Number(it.year) || 0,
        answered: !!rec, score: sc, why: why, w: w
      });
    }

    /* 兜底：条件全不命中时，给出通用推荐，保证桶非空 */
    if(!out.length){
      for(i = 0; i < idx.length; i++){
        var t2 = idx[i];
        var r2 = agg.byKey[keyOf(t2.pid, t2.qno)] || null;
        out.push({
          pid: t2.pid, qno: t2.qno, label: t2.label, qtype: t2.qtype, cat: t2.cat,
          year: Number(t2.year) || 0,
          answered: !!r2,
          score: (r2 && typeof r2.score === "number") ? r2.score : null,
          why: ["通用推荐"], w: 0
        });
      }
    }

    /* 排序：已答且命中低 → 已答中等 → 未作答 → 已答命中高 */
    function rank(o){
      if(o.answered){
        if(o.score == null) return 1;
        if(o.score < 60) return 0;
        if(o.score < 80) return 1;
        return 3;
      }
      return 2;
    }
    out.sort(function(a, b){
      var ra = rank(a), rb = rank(b);
      if(ra !== rb) return ra - rb;
      if(b.w !== a.w) return b.w - a.w;
      var sa = (a.score == null) ? 101 : a.score;
      var sb = (b.score == null) ? 101 : b.score;
      if(sa !== sb) return sa - sb;
      return b.year - a.year;
    });

    return {
      tag: tag,
      list: out.slice(0, MAX_PER_BUCKET),
      totalFound: out.length,
      cats: Object.keys(hitCats),
      kws: Object.keys(hitKws)
    };
  }

  /* ---------------- 渲染片段 ---------------- */
  function weakChips(sorted){
    if(!sorted.length) return "";
    var h = "", i;
    for(i = 0; i < sorted.length && i < TOP_WEAK; i++){
      var s = sorted[i];
      h += "<span class='b20-weak" + (i < 2 ? " b20-weak-top" : "") + "'>" +
             esc(s.tag) + "<b class='b20-x'>×" + s.n + "</b></span>";
    }
    return h;
  }

  function drillBtns(buckets){
    var h = "", i;
    for(i = 0; i < buckets.length; i++){
      var b = buckets[i];
      h += "<button type='button' class='b20-btn" + (S.focus === b.tag ? " on" : "") +
           "' data-b20act='focus' data-tag='" + attr(b.tag) + "'>练【" + esc(b.tag) +
           "】的同类题（" + b.list.length + " 道）</button>";
    }
    return h;
  }

  function rowHtml(o, tag){
    var right = o.answered
      ? ("你的命中率 <b class='" + (o.score != null && o.score < 60 ? "b20-low" : "b20-ok") + "'>" +
         (o.score == null ? "—" : (o.score + "%")) + "</b>（已答）")
      : "<span class='b20-none'>未作答</span>";
    var whys = "", i;
    for(i = 0; i < o.why.length; i++){
      whys += "<span class='b20-why'>" + esc(o.why[i]) + "</span>";
    }
    var added = inToday(o.pid, o.qno);
    return "<div class='b20-card'>" +
             "<div class='b20-main'>" +
               "<span class='b20-src'>" + esc(o.label) + "</span>" +
               "<span class='b20-sep'>·</span><span class='b20-qno'>第" + esc(o.qno) + "题</span>" +
               "<span class='b20-sep'>·</span><span class='b20-qt'>" + esc(o.cat || o.qtype || "未分类") + "</span>" +
               "<span class='b20-sep'>·</span><span class='b20-rate'>" + right + "</span>" +
               "<span class='b20-whys'>" + whys + "</span>" +
             "</div>" +
             "<div class='b20-ops'>" +
               "<button type='button' class='b20-op' data-b20act='ans' data-pid='" + attr(o.pid) +
                 "' data-qno='" + attr(o.qno) + "'>✍️作答</button>" +
               "<button type='button' class='b20-op b20-add" + (added ? " done" : "") +
                 "' data-b20act='today' data-pid='" + attr(o.pid) + "' data-qno='" + attr(o.qno) +
                 "' data-tag='" + attr(tag) + "'>" + (added ? "✅已在今日" : "📌加入今日") + "</button>" +
             "</div>" +
           "</div>";
  }

  function groupHtml(b, i, n){
    var open = !!(S.open && S.open[b.tag]);
    var catTxt = b.cats.length ? ("题型≈" + b.cats.join(" / ")) : "题型不限";
    var kwTxt  = b.kws.length  ? ("题干含 " + b.kws.slice(0, 5).join(" / ")) : "无关键词命中";
    var sub = "系统从题库按「" + catTxt + "」或「" + kwTxt + "」过滤出 " +
              b.totalFound + " 道同类题，优先推 " + b.list.length + " 道";
    var h = "<section class='b20-group" + (open ? " open" : "") + (S.focus === b.tag ? " focus" : "") +
              "' id='b20g-" + attr(b.tag) + "'>";
    h += "<div class='b20-ghead' data-b20act='toggle' data-tag='" + attr(b.tag) + "'>" +
           "<span class='b20-gt'>" + (i < 2 ? "🔴" : "🟠") + " " + esc(b.tag) +
             "（你卡了 " + n + " 次）" + (i < 2 ? " — 推荐先攻" : "") + "</span>" +
           "<span class='b20-fold'>" + (open ? "收起 ▲" : "展开 ▼") + "</span>" +
         "</div>";
    h += "<div class='b20-gsub'>" + esc(sub) + "</div>";
    if(TAG_TIP[b.tag]) h += "<div class='b20-gtip'>💡 " + esc(TAG_TIP[b.tag]) + "</div>";
    if(open){
      if(!b.list.length){
        h += "<div class='b20-empty'>题库里暂时没有匹配到同类题。</div>";
      }else{
        var s = "", k;
        for(k = 0; k < b.list.length; k++) s += rowHtml(b.list[k], b.tag);
        h += "<div class='b20-list'>" + s + "</div>";
      }
    }
    h += "</section>";
    return h;
  }

  /* ---------------- 主绘制 ---------------- */
  function draw(){
    ensureCss();
    var box = document.getElementById("content");
    if(!box) return;

    var agg = aggregate();
    var head = "<div class='b20-wrap'>" +
      "<div class='b20-hero'>" +
        "<div class='b20-title'>🎯 同类薄弱题聚合</div>" +
        "<div class='b20-coach'>把一类卡点彻底打穿再换下一类，比杂刷 100 道不同题型更提分</div>" +
      "</div>";

    if(S.flash){
      head += "<div class='b20-flash'>" + esc(S.flash) + "</div>";
      S.flash = "";
    }

    /* 空状态 */
    if(!agg.sorted.length){
      box.innerHTML = head +
        "<div class='b20-empty b20-empty-big'>还没过程笔记记录，去作答几次带勾选难点标签后再来。</div>" +
        "</div>";
      return;
    }

    var idx = buildIndex();
    if(!idx.length){
      box.innerHTML = head +
        "<div class='b20-empty b20-empty-big'>题库数据未加载，暂时无法聚合同类题。</div>" +
        "</div>";
      return;
    }

    /* 初始化展开态：默认展开 Top3 */
    if(!S.open){
      S.open = {};
      for(var a = 0; a < agg.sorted.length && a < OPEN_DEFAULT; a++) S.open[agg.sorted[a].tag] = true;
    }

    /* 构建各弱点桶 */
    var buckets = [], i;
    for(i = 0; i < agg.sorted.length; i++){
      buckets.push(buildBucket(agg.sorted[i].tag, idx, agg));
    }

    /* 弱点画像 */
    var top = agg.sorted.slice(0, 2).map(function(x){ return x.tag; }).join("、");
    var html = head +
      "<section class='b20-panel'>" +
        "<div class='b20-ph'>📊 我的弱点画像" +
          "<span class='b20-meta'>共 " + agg.withProc + " 次作答留下过程笔记 / 记录 " + agg.totalRec + " 条</span>" +
        "</div>" +
        "<div class='b20-pbody'>" +
          "<div class='b20-chips'>" + weakChips(agg.sorted) + "</div>" +
          "<div class='b20-advice'>系统建议你先攻最常卡的 1-2 类：<b>" + esc(top) + "</b></div>" +
        "</div>" +
      "</section>";

    /* 一键专攻 */
    html += "<section class='b20-panel'>" +
              "<div class='b20-ph'>⚡ 一键专攻</div>" +
              "<div class='b20-btns'>" + drillBtns(buckets) +
                (S.focus ? "<button type='button' class='b20-btn b20-ghost' data-b20act='unfocus'>显示全部弱点</button>" : "") +
              "</div>" +
            "</section>";

    /* 分组题列表 */
    var groups = "";
    for(i = 0; i < buckets.length; i++){
      if(S.focus && buckets[i].tag !== S.focus) continue;
      groups += groupHtml(buckets[i], i, agg.sorted[i].n);
    }
    html += "<div class='b20-groups'>" + groups + "</div></div>";

    box.innerHTML = html;
  }

  /* ---------------- 事件委托（只绑一次） ---------------- */
  function findAct(el){
    var n = 0;
    while(el && el !== document && n < 8){
      if(el.getAttribute && el.getAttribute("data-b20act")) return el;
      el = el.parentNode; n++;
    }
    return null;
  }
  function onClick(ev){
    var t = null;
    try{ t = findAct(ev.target || ev.srcElement); }catch(e){ t = null; }
    if(!t) return;
    var act = t.getAttribute("data-b20act");
    var tag = t.getAttribute("data-tag") || "";
    var pid = t.getAttribute("data-pid") || "";
    var qno = t.getAttribute("data-qno") || "";

    try{
      if(act === "toggle"){
        if(!S.open) S.open = {};
        S.open[tag] = !S.open[tag];
        draw(); return;
      }
      if(act === "focus"){
        S.focus = tag;
        if(!S.open) S.open = {};
        S.open[tag] = true;
        draw();
        try{
          var g = document.getElementById("b20g-" + tag);
          if(g && g.scrollIntoView) g.scrollIntoView(true);
        }catch(e){}
        return;
      }
      if(act === "unfocus"){ S.focus = ""; draw(); return; }
      if(act === "ans"){
        var n = parseInt(qno, 10);
        var real = isNaN(n) ? qno : n;
        if(typeof window.openAnswerModal === "function"){
          window.openAnswerModal(pid, real);
        }else{
          S.flash = "作答弹窗未加载，请回主站真题库中作答"; draw();
        }
        return;
      }
      if(act === "today"){
        var n2 = parseInt(qno, 10);
        var real2 = isNaN(n2) ? qno : n2;
        var r = addToday(pid, real2, tag);
        S.flash = (r === "ok")      ? ("已加入今日清单：" + pid + " 第" + real2 + "题（过程教练下次会展示）")
                : (r === "already") ? "这道题已经在今日清单里了"
                                    : "写入失败，浏览器拒绝本地存储";
        draw(); return;
      }
    }catch(err){
      try{ console.error("[_b20]", err); }catch(e){}
    }
  }
  function bindOnce(){
    if(window.__b20Bound) return;
    try{
      document.addEventListener("click", onClick, false);
      window.__b20Bound = true;
    }catch(e){}
  }

  /* ================= 路由入口 ================= */
  window.renderWeakAgg = function(){
    bindOnce();
    try{
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = "<div class='b20-empty b20-empty-big'>同类薄弱聚合运行出错：" +
          esc(String((err && err.message) || err)) + "</div>";
      }catch(e){}
      try{ console.error("[_b20]", err); }catch(e){}
    }
  };

})();

</script>
<script>/* === _b21.js === */
/* =====================================================================
   第21批：数据存档 · 导出 / 导入 JSON  (_b21.js)
   「先做 A」方案：把本机全部作答与训练记录打包成一个 JSON 文件，
   由你自己通过网盘在电脑 / Pad / 手机之间搬运；换设备时导入即合并。
   设计铁律：
     - 纯前端、离线可用、隐私优先（数据只经过你的设备与你的网盘）
     - 导入时【绝不覆盖本机已有记录】
         · 答案(shenlun_answers_v2) 按 pid#qno + ts 取较新一条做合并
         · 其余键本机优先：本机有则保留本机，仅补入本机缺少的键
     - 导入前先自动备份本机当前存档，确认后再写回
   后续「方案 C」局域网同步会复用本模块暴露的合并函数与存档页。
   依赖：主站 window.esc（存在则用，否则兜底）
   ===================================================================== */
(function(){
  "use strict";

  const APP = "求是申论素材库";
  const SCHEMA = 1;
  const ANS_KEY = "shenlun_answers_v2";   // 与主站 STORE_KEY 保持一致
  const GRADE_KEY = "xiaoti_grade_v1";    // _b25 小题批改记录（数组，按 pid#pno + ts 合并）

  function esc2(s){ const f = window.esc; return (typeof f==="function") ? f(s) : String(s==null?"":s); }
  function $(id){ return document.getElementById(id); }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }

  // ---- 取本机全部 localStorage 键值（同源下所有键，保证不漏）----
  function snapshot(){
    const keys = {};
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k==null) continue;
        try{ keys[k] = localStorage.getItem(k); }catch(_){}
      }
    }catch(e){}
    return keys;
  }

  // ---- 递归清除 base64 图片（data: 开头的字符串）----
  function stripImages(v){
    if(typeof v === "string"){
      return /^data:/.test(v.trim()) ? "" : v;
    }
    if(Array.isArray(v)){ return v.map(stripImages); }
    if(v && typeof v === "object"){
      const o = {};
      for(const k in v){ o[k] = stripImages(v[k]); }
      return o;
    }
    return v;
  }

  function download(name, text){
    const blob = new Blob([text], {type:"application/json;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 120);
  }

  // ---- 当前存档概览 ----
  function storeStats(){
    const keys = snapshot();
    const out = { keyCount:0, ansCount:0, imgBytes:0, jsonBytes:0 };
    out.keyCount = Object.keys(keys).length;
    for(const k in keys){
      const raw = keys[k] || "";
      out.jsonBytes += raw.length;
      if(/^data:/.test(raw.trim())){ out.imgBytes += raw.length; }
      if(k === ANS_KEY){
        try{ out.ansCount = Object.keys(JSON.parse(raw)||{}).length; }catch(_){}
      }
    }
    return out;
  }

  // ============================ 导出 ============================
  function doExport(noImg){
    const keys = snapshot();
    if(noImg){
      // 仅对 JSON 值去图，非 JSON 原样保留
      for(const k in keys){
        try{ keys[k] = JSON.stringify(stripImages(JSON.parse(keys[k]))); }
        catch(_){ /* 非 JSON，保持原字符串 */ }
      }
    }
    const payload = {
      _app: APP,
      _schema: SCHEMA,
      exportedAt: new Date().toISOString(),
      mode: noImg ? "noimg" : "full",
      device: (navigator.userAgent||"").slice(0,90),
      note: "由「求是申论素材库」存档同步模块导出；导入时按题号+时间戳合并，不覆盖本机。",
      keys: keys
    };
    const sizeKB = (JSON.stringify(payload).length/1024).toFixed(0);
    download("求是申论存档_"+todayStr()+(noImg?"_无图":"")+".json", JSON.stringify(payload,null,2));
    const tip = noImg
      ? "已导出【不含图片】存档，约 "+sizeKB+" KB。\n照片已剥离，适合发微信/网盘小文件；在另一台设备导入即可合并。"
      : "已导出【含图片】存档，约 "+sizeKB+" KB。\n含你拍照/圈画的材料图；传到网盘后在另一台设备导入即可合并。";
    alert(tip);
    if(window.renderArchive) renderArchive();
  }

  // ============================ 合并 ============================
  // 返回 {merged, report}，merged 为合并后完整键值；绝不删除本机键
  function mergeInto(imp){
    const target = snapshot();
    const merged = {};
    for(const k in target){ merged[k] = target[k]; }   // 先全量保留本机
    const impKeys = (imp && imp.keys) || {};
    const rep = { newKeys:0, addAns:0, updAns:0, sameAns:0, conflictOther:0, keptOther:0 };

    for(const k in impKeys){
      if(!(k in merged)){ merged[k] = impKeys[k]; rep.newKeys++; continue; }

      if(k === ANS_KEY){
        try{
          const tgt = JSON.parse(merged[k]||"{}");
          const src = JSON.parse(impKeys[k]||"{}");
          for(const rk in src){
            if(!(rk in tgt)){ tgt[rk] = src[rk]; rep.addAns++; }
            else{
              const tt = (tgt[rk] && tgt[rk].ts) || 0;
              const st = (src[rk] && src[rk].ts) || 0;
              if(st > tt){ tgt[rk] = src[rk]; rep.updAns++; }
              else { rep.sameAns++; }
            }
          }
          merged[k] = JSON.stringify(tgt);
        }catch(_){ rep.conflictOther++; /* 解析失败保留本机 */ }
        continue;
      }

      if(k === GRADE_KEY){
        try{
          const tgt = JSON.parse(merged[k]||"[]");
          const src = JSON.parse(impKeys[k]||"[]");
          const map = {};
          tgt.forEach(function(r){ if(r && r.pid!=null) map[r.pid+"#"+(r.pno!=null?r.pno:"")] = r; });
          src.forEach(function(r){
            if(!r || r.pid==null) return;
            const key = r.pid+"#"+(r.pno!=null?r.pno:"");
            const cur = map[key];
            const rt = r.ts||0, ct = cur ? (cur.ts||0) : 0;
            if(!cur){ map[key] = r; rep.addAns++; }
            else if(rt > ct){ map[key] = r; rep.updAns++; }
            else { rep.sameAns++; }
          });
          merged[k] = JSON.stringify(Object.keys(map).map(function(kk){ return map[kk]; }));
        }catch(_){ rep.conflictOther++; }   // 解析失败保留本机
        continue;
      }

      // 其余键：本机优先。不同则统计冲突，但不覆盖本机
      if(merged[k] !== impKeys[k]){ rep.conflictOther++; }
      else { rep.keptOther++; }
    }
    return { merged: merged, report: rep };
  }

  function applyMerged(merged){
    for(const k in merged){
      try{ localStorage.setItem(k, merged[k]); }catch(e){ console.warn("写入失败", k, e); }
    }
  }

  // ============================ 导入流程 ============================
  let _pending = null;   // 暂存待确认合并结果

  function onFilePicked(file){
    if(!file){ return; }
    const reader = new FileReader();
    reader.onload = function(){
      let imp = null;
      try{ imp = JSON.parse(reader.result); }catch(e){ alert("文件解析失败：不是有效的存档 JSON。"); return; }
      if(!imp || imp._app !== APP || !imp.keys){ alert("这不是「求是申论素材库」的存档文件。"); return; }

      // 先自动备份本机当前存档
      const bakName = "求是申论备份_"+todayStr()+"_导入前.json";
      try{ download(bakName, JSON.stringify({_app:APP,_schema:SCHEMA,_autoBackup:true,exportedAt:new Date().toISOString(),keys:snapshot()},null,2)); }
      catch(_){}

      const { merged, report } = mergeInto(imp);
      _pending = merged;
      renderConfirm(report, file.name, bakName);
    };
    reader.readAsText(file);
  }

  function doApply(){
    if(!_pending){ return; }
    applyMerged(_pending);
    _pending = null;
    alert("导入完成：本机记录已与存档合并。记录只增不删，原记录全部保留。");
    if(window.renderArchive) renderArchive();
  }

  // ============================ 渲染 ============================
  function renderArchive(){
    const st = storeStats();
    const sizeKB = (st.jsonBytes/1024).toFixed(0);
    const sizeMB = (st.jsonBytes/1024/1024).toFixed(2);
    const sz = st.jsonBytes > 1024*1024 ? sizeMB+" MB" : sizeKB+" KB";

    let h = '<div class="b21-wrap">';
    h += '<div class="b21-h2">💾 存档同步 <span class="b21-sub">把记录装进一个文件，由你自己搬运 · 隐私优先 · 不覆盖本机</span></div>';

    // 当前状态卡
    h += '<div class="b21-card">';
    h += '<div class="b21-row"><span class="b21-k">本机已存</span><span class="b21-v"><b>'+st.ansCount+'</b> 道作答记录 · 共 <b>'+st.keyCount+'</b> 个数据键</span></div>';
    h += '<div class="b21-row"><span class="b21-k">占用体积</span><span class="b21-v">约 '+sz+(st.imgBytes>0?'（含图片 '+ (st.imgBytes/1024/1024).toFixed(1) +' MB）':'')+'</span></div>';
    h += '<div class="b21-tip">浏览器按「设备+浏览器+网址」各自存一份，换设备打开是空的。用下面的导出/导入，把记录带走或合并回来。</div>';
    h += '</div>';

    // 导出区
    h += '<div class="b21-card">';
    h += '<div class="b21-h3">① 导出存档（带走 / 备份）</div>';
    h += '<div class="b21-btns">';
    h += '<button class="b21-btn" onclick="b21Export(false)">📦 导出（含图片）</button>';
    h += '<button class="b21-btn b21-ghost" onclick="b21Export(true)">📄 导出（不含图片·更小）</button>';
    h += '</div>';
    h += '<div class="b21-tip">导出后把 .json 传到网盘（光鸭/夸克/微信文件传输助手均可）。出门用 Pad/手机时，从网盘下载再「导入」。</div>';
    h += '</div>';

    // 导入区
    h += '<div class="b21-card">';
    h += '<div class="b21-h3">② 导入存档（合并到本机）</div>';
    h += '<div class="b21-btns"><label class="b21-btn b21-file">📥 选择存档文件<input type="file" id="b21File" accept=".json,application/json" onchange="b21Pick(this.files[0])"></label></div>';
    h += '<div class="b21-tip">导入会按题号+时间戳合并：电脑做过的、Pad 做过的，合并后全在；本机原有记录绝不丢失。导入前会自动备份本机当前存档。</div>';
    h += '<div id="b21Confirm"></div>';
    h += '</div>';

    // 局域网同步（方案 C）占位：若已加载桥接则填充
    h += '<div id="b21Sync"></div>';

    // 方案 B 异地同步（坚果云）占位
    h += '<div id="b22Cloud"></div>';

    // 用法
    h += '<div class="b21-card b21-usage">';
    h += '<div class="b21-h3">怎么在家里 / 外面用 Pad 刷题</div>';
    h += '<ul>';
    h += '<li><b>家里（同 WiFi）</b>：电脑开「局域网同步」后，Pad 浏览器访问电脑地址即可实时共用一份记录（见上方同步区）。</li>';
    h += '<li><b>外面 / 换设备</b>：用「导出存档」→ 传网盘 → 在目标设备下载 →「导入存档」合并。</li>';
    h += '<li><b>记录是真的在存</b>：每次作答/训练都写进本机，下次打开仍在，并随你导出带走、随导入累积成长。</li>';
    h += '</ul>';
    h += '</div>';

    h += '</div>';

    const c = $("content");
    if(c) c.innerHTML = h;
    const s = $("stats");
    if(s) s.textContent = "存档同步 · 本机 "+st.ansCount+" 道作答";

    // 若已加载局域网桥接，渲染同步区
    if(typeof window.b21RenderSync === "function"){ try{ window.b21RenderSync(); }catch(_){} }
  }

  function renderConfirm(rep, fname, bakName){
    const box = $("b21Confirm");
    if(!box) return;
    const parts = [];
    if(rep.addAns>0) parts.push("新增 <b>"+rep.addAns+"</b> 条作答");
    if(rep.updAns>0) parts.push("更新 <b>"+rep.updAns+"</b> 条作答（取较新）");
    if(rep.sameAns>0) parts.push(rep.sameAns+" 条已是最新");
    if(rep.newKeys>0) parts.push("补入 <b>"+rep.newKeys+"</b> 个其他数据键");
    if(rep.conflictOther>0) parts.push(rep.conflictOther+" 个其他键本机优先保留");
    const summary = parts.length ? parts.join("，") : "无新增，本机已是最新";
    box.innerHTML =
      '<div class="b21-confirm">'+
      '<div class="b21-crow">待合并文件：<code>'+esc2(fname)+'</code></div>'+
      '<div class="b21-crow">合并结果：'+summary+'</div>'+
      '<div class="b21-crow b21-ok">✅ 已自动备份本机到 <code>'+esc2(bakName)+'</code></div>'+
      '<div class="b21-btns">'+
      '<button class="b21-btn" onclick="b21Apply()">确认合并并写入</button>'+
      '<button class="b21-btn b21-ghost" onclick="b21Cancel()">取消</button>'+
      '</div></div>';
  }

  function b21Cancel(){ _pending = null; const box=$("b21Confirm"); if(box) box.innerHTML=""; }

  // ============================ 暴露全局 ============================
  window.b21Export = doExport;
  window.b21Pick   = onFilePicked;
  window.b21Apply  = doApply;
  window.b21Cancel = b21Cancel;
  window.renderArchive = renderArchive;
  // 调试句柄（无害）：供 jsdom 实测合并逻辑使用
  window.__b21 = { mergeInto: mergeInto, snapshot: snapshot, ANS_KEY: ANS_KEY, GRADE_KEY: GRADE_KEY };

  // 供方案 C（局域网同步）桥接调用：在 #b21Sync 渲染同步状态与按钮
  // 桥接脚本需设置 window.__shenlunSync = { status, lastSync, push, pull, url }
  window.b21RenderSync = function(){
    const sync = window.__shenlunSync;
    const box = $("b21Sync");
    if(!box || !sync) return;
    let h = '<div class="b21-card">';
    h += '<div class="b21-h3">③ 局域网同步（家里同 WiFi 实时共用）</div>';
    h += '<div class="b21-row"><span class="b21-k">状态</span><span class="b21-v '+(sync.status==="on"?"b21-on":"b21-off")+'">'+(sync.status==="on"?"已连接服务器 · 实时同步中":"未连接（用 file:// 或不在同一 WiFi）")+'</span></div>';
    if(sync.lastSync) h += '<div class="b21-row"><span class="b21-k">上次同步</span><span class="b21-v">'+esc2(sync.lastSync)+'</span></div>';
    h += '<div class="b21-btns">';
    h += '<button class="b21-btn" onclick="if(window.__shenlunSync)window.__shenlunSync.pull()">⬇️ 从服务器拉取</button>';
    h += '<button class="b21-btn b21-ghost" onclick="if(window.__shenlunSync)window.__shenlunSync.push()">⬆️ 推送到服务器</button>';
    h += '</div>';
    h += '<div class="b21-tip">在家里电脑启动同步服务器后，Pad/手机连同一 WiFi 访问服务器地址，记录自动共用一份，无需手动导出导入。</div>';
    h += '</div>';
    box.innerHTML = h;
  };

})();

</script>
<script>/* === _b22.js === */
/* =====================================================================
   第22批：坚果云 WebDAV 异地同步  · 配置 UI  (_b22.js)
   - 在「存档同步」模块下渲染一组"云端配置 + 状态 + 手动操作"卡片
   - 配置存在 localStorage（key: shenlun_cloud_v1，账号/密码以 base64 存）
   - 桥接由 _b22_cloud.js 自动做 push/pull；这里只暴露手动按钮
   - 隐私：账号密码只在浏览器内 / 局域网转发到坚果云（标准 WebDAV Basic）
           服务器进程不持久化任何密码
   ===================================================================== */
(function(){
  "use strict";

  const STORAGE_KEY = "shenlun_cloud_v1";

  function $(id){ return document.getElementById(id); }
  function esc(s){ const f = window.esc; return (typeof f==="function") ? f(s) : String(s==null?"":s); }

  function loadCfg(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { account:"", password:"", path:"", autoSync:false, lastSync:"" };
      return Object.assign({ account:"", password:"", path:"", autoSync:false, lastSync:"" }, JSON.parse(raw));
    }catch(_){ return { account:"", password:"", path:"", autoSync:false, lastSync:"" }; }
  }
  function saveCfg(c){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); }catch(_){}
  }
  function clearCfg(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(_){}
  }

  function renderPanel(){
    const box = $("b22Cloud");
    if(!box) return;
    const cfg = loadCfg();
    const st = (window.__shenlunCloud && window.__shenlunCloud.status) || "off";

    const onoff = (s)=> s==="on" ? "b22-on" : s==="err" ? "b22-err" : "b22-off";
    const onoffLabel = (s)=> s==="on" ? "已连接 · 自动同步中" : s==="err" ? "连接异常 · 见下方提示" : "未连接";
    const lastSync = cfg.lastSync || (window.__shenlunCloud && window.__shenlunCloud.lastSync) || "—";
    const lastErr  = (window.__shenlunCloud && window.__shenlunCloud.lastErr) || "";

    let h = "";
    h += '<div class="b22-card">';
    h += '<div class="b22-h3">☁️ 坚果云异地同步（跨网络 / 电脑关机也能带走）</div>';
    h += '<div class="b22-row"><span class="b22-k">状态</span><span class="b22-v '+onoff(st)+'">'+onoffLabel(st)+'</span></div>';
    h += '<div class="b22-row"><span class="b22-k">上次同步</span><span class="b22-v">'+esc(lastSync)+'</span></div>';
    if(lastErr) h += '<div class="b22-err">'+esc(lastErr)+'</div>';
    h += '</div>';

    h += '<div class="b22-card">';
    h += '<div class="b22-h3">① 配置坚果云账号</div>';
    h += '<div class="b22-tip">去 <code>https://www.jianguoyun.com/d/</code> 注册（免费 1GB/月）→ 账号设置 → 高级 → 加一个「应用授权密码」→ 复制粘贴到下面。原始密码不要填，填「应用授权密码」更安全。</div>';
    h += '<div class="b22-form">';
    h += '<label>账号（手机号/邮箱）<input id="b22Acct" type="text" autocomplete="off" placeholder="例如 13800000000" value="'+esc(cfg.account)+'"></label>';
    h += '<label>应用授权密码 <input id="b22Pwd" type="password" autocomplete="off" placeholder="不是登录密码，是在坚果云后台生成的应用授权密码"></label>';
    h += '<label>云端文件路径 <input id="b22Path" type="text" autocomplete="off" placeholder="/shenlun_store.json" value="'+esc(cfg.path||"/shenlun_store.json")+'"></label>';
    h += '</div>';
    h += '<div class="b22-btns">';
    h += '<button class="b22-btn" onclick="b22Save()">💾 保存配置</button>';
    h += '<button class="b22-btn b22-ghost" onclick="b22Test()">🔌 测试连接</button>';
    h += '<button class="b22-btn b22-danger" onclick="b22Clear()">🗑 清除配置</button>';
    h += '</div>';
    h += '<div id="b22TestResult"></div>';
    h += '</div>';

    h += '<div class="b22-card">';
    h += '<div class="b22-h3">② 手动同步</h3>';
    h += '<div class="b22-btns">';
    h += '<button class="b22-btn" onclick="if(window.__shenlunCloud)window.__shenlunCloud.pull()">⬇️ 从云端拉取</button>';
    h += '<button class="b22-btn b22-ghost" onclick="if(window.__shenlunCloud)window.__shenlunCloud.push()">⬆️ 推送到云端</button>';
    h += '<label class="b22-toggle"><input type="checkbox" id="b22Auto" '+(cfg.autoSync?"checked":"")+' onchange="b22AutoToggle(this.checked)"> 开启自动同步（每 25 秒）</label>';
    h += '</div>';
    h += '<div class="b22-tip">自动同步只在浏览器开着时生效。电脑关机时不会丢数据——下次打开浏览器会自动从云端拉取最新记录。</div>';
    h += '</div>';

    box.innerHTML = h;
  }

  function setTestResult(msg, ok){
    const box = $("b22TestResult"); if(!box) return;
    box.innerHTML = '<div class="'+(ok?"b22-ok":"b22-err")+'">'+esc(msg)+'</div>';
  }

  function save(){
    const cfg = loadCfg();
    cfg.account = ($("b22Acct")||{}).value || "";
    cfg.password = ($("b22Pwd")||{}).value || "";
    cfg.path = (($("b22Path")||{}).value || "/shenlun_store.json").trim() || "/shenlun_store.json";
    saveCfg(cfg);
    if(typeof window.__shenlunCloudRebind === "function"){ try{ window.__shenlunCloudRebind(); }catch(_){} }
    setTestResult("已保存。下一步点「测试连接」确认能连上。", true);
    if(window.renderArchive) try{ window.renderArchive(); }catch(_){}
  }

  async function test(){
    const cfg = loadCfg();
    if(!cfg.account || !cfg.password){
      setTestResult("请先填账号和应用授权密码。", false); return;
    }
    setTestResult("正在连接坚果云…", true);
    try{
      const r = await fetch("/api/cloud/ping?u=" + encodeURIComponent(cfg.account) + "&p=" + encodeURIComponent(cfg.password), {cache:"no-store"});
      const j = await r.json();
      if(j.ok){ setTestResult("连通成功 ✓ 可用。", true); }
      else    { setTestResult("失败：" + (j.err||"未知错误"), false); }
    }catch(e){
      setTestResult("网络错误：" + e, false);
    }
  }

  function clearAll(){
    if(!confirm("确定要清除云端配置吗？这会断开自动同步，已上传的云端文件不会删除。")) return;
    clearCfg();
    if(typeof window.__shenlunCloudRebind === "function"){ try{ window.__shenlunCloudRebind(); }catch(_){} }
    if(window.renderArchive) try{ window.renderArchive(); }catch(_){}
  }

  function autoToggle(on){
    const cfg = loadCfg();
    cfg.autoSync = !!on;
    saveCfg(cfg);
    if(typeof window.__shenlunCloudRebind === "function"){ try{ window.__shenlunCloudRebind(); }catch(_){} }
  }

  // 暴露
  window.b22Save = save;
  window.b22Test = test;
  window.b22Clear = clearAll;
  window.b22AutoToggle = autoToggle;
  window.b22Render = renderPanel;
  window.b22LoadCfg = loadCfg;
  window.b22SaveCfg = saveCfg;

  // 主站 renderArchive() 每次被调用后，#b22Cloud 占位区就重新挂一次
  // 避免依赖外部顺序声明
  function hook(){
    const orig = window.renderArchive;
    if(typeof orig === "function" && !orig.__b22Patched){
      const wrapped = function(){
        try{ orig.apply(this, arguments); }catch(_){}
        try{ renderPanel(); }catch(_){}
      };
      wrapped.__b22Patched = true;
      window.renderArchive = wrapped;
    } else if(typeof orig !== "function") {
      setTimeout(hook, 200);
    }
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", hook);
  } else {
    hook();
  }
})();

</script>
<script>/* === _b24.js === */
/* =====================================================================
   第二十四批：求是时评 (_b24.js)
   展示 _qs_collect.py 采集的求是网公开文章（含正文），
   每篇带「AI拆解」按钮：复制全文 + 结构化拆解任务到剪贴板，
   用户粘贴到 WorkBuddy（同会话）即可当场拆解，AI 回写
   data/qs_articles.json 该篇的 analysis 字段，刷新本页即见。
   依赖：window.esc / window.QS_ARTICLES（主站提供）
   ===================================================================== */
(function () {
  "use strict";
  var openId = null;

  function esc(s) {
    var f = (typeof window !== "undefined" && typeof window.esc === "function") ? window.esc : null;

<script>/* === _b25.js === */
/* =====================================================================
   第二十五批：小题 AI 即时批改 + 弱项诊断 (_b25.js)
   纯前端、离线、零外链。核心：写完答案即时判分（采分点逐条命中判定

   类型分布 + 高频遗漏要点 + 补弱路径）。
   依赖：window.esc / DATA / state / 省考分包全局函数
   路线：本地引擎为主 + AI 增强（可选，AI 精批经本地队列/剪贴板兜底）
   ===================================================================== */
(function () {
  "use strict";
  var LS_KEY = "xiaoti_grade_v1";

  function esc(s) {
    var f = (typeof window !== "undefined" && typeof window.esc === "function") ? window.esc : null;
    return f ? f(s) : String(s == null ? "" : s);
  }
  function $(id) { return document.getElementById(id); }

  /* ---------------- 模块本地状态 ---------------- */
  var B = { tab: "grade", prov: "国考", year: "全部", qt: "全部", pid: "", pno: -1, ansMap: {}, resMap: {} };

  /* ---------------- 题型分类（归一为 4 类小题 + 大作文/其他） ---------------- */
  function classify(qt) {
    if (!qt) return "其他";
    if (qt.indexOf("文章写作") >= 0 || qt.indexOf("申发论述") >= 0) return "大作文";
    if (qt.indexOf("贯彻执行") >= 0) return "公文";
    if (qt.indexOf("对策") >= 0) return "对策";
    if (qt.indexOf("概括") >= 0 || qt.indexOf("归纳") >= 0) return "概括";
    if (qt.indexOf("分析") >= 0 || qt.indexOf("理解") >= 0 || qt.indexOf("评析") >= 0 ||
        qt.indexOf("启示") >= 0 || qt.indexOf("评价") >= 0) return "分析";
    return "其他";
  }
  var BUCKETS = ["概括", "分析", "对策", "公文"];

  /* ---------------- 题库池 ---------------- */
  function gkPapers() { return DATA.papers.filter(function (p) { return p.province === "国考"; }); }
  function papersOfProv(prov) {
    if (prov === "国考") return gkPapers();
    // 省考：优先已加载的真实卷，否则返回 meta 占位（由 loadSKProv 触发加载后重渲染）
    var real = DATA.papers.filter(function (p) { return p.province === prov; });
    if (real.length) return real;
    if (typeof skPapersOf === "function") {
      var meta = skPapersOf(prov);
      if (meta && meta.length) return meta;
    }
    return [];
  }
  function poolYears(prov) {
    return Array.from(new Set(papersOfProv(prov).map(function (p) { return p.year; }))).sort(function (a, b) { return b - a; });
  }
  function pickablePapers(prov) {
    var ps = papersOfProv(prov).filter(function (p) {
      if (B.year !== "全部" && String(p.year) !== B.year) return false;
      if (p._meta) return true; // 省考占位，加载后即见题
      // 小题数量 > 0
      return (p.questions || []).some(function (q) { return classify(q.qtype) !== "大作文"; });
    });
    return ps;
  }

  /* ---------------- 中文处理 / 词典 ---------------- */
  var STOP = new Set(("的了我与及等都是是在对把被我们可以需要通过进行实现提升加强完善建立健全推进落实推动促进" +
    "提高增加优化规范强化保障坚持发挥作用下要求问题能够应该必须要将也就而以为使让给向从到并且或" +
    "其之上下内外后前时所该各项个一二三四五六七八九十不无有新大小多少好更最这那此它他她们我你您本共" +
    "全总已未可能会话即如若做作制定设开展取得获得出来去入进退加减乘除分合同异变化成为").split(""));

  function norm(t) { return String(t == null ? "" : t).replace(/\s+/g, ""); }
  function keysOf(t) {
    t = norm(t);
    var ks = new Set();
    for (var i = 0; i < t.length - 1; i++) ks.add(t.substr(i, 2));
    return ks;
  }
  function meaningful(ks) {
    var out = new Set();
    ks.forEach(function (g) {
      var allStop = true;
      for (var i = 0; i < g.length; i++) if (!STOP.has(g[i])) { allStop = false; break; }
      if (!allStop) out.add(g);
    });
    return out;
  }

  /* 规范词库 -> 同义词簇（运行时一次性构建，缓存） */
  var WBGROUPS = null;
  function buildWordbank() {
    if (WBGROUPS) return WBGROUPS;
    var groups = [];
    (DATA.entries || []).forEach(function (e) {
      if (e.lib !== "规范词库") return;
      (e.lines || []).forEach(function (line) {
        var head = String(line).split("｜")[0];
        head = head.replace(/^规范词[:：]\s*/, "");
        var parts = head.split(/\s*[\/／、]\s*/).map(function (s) { return s.trim(); })
          .filter(function (s) { return s.length >= 2 && s.length <= 12; });
        if (parts.length >= 2) groups.push(parts);
      });
    });
    WBGROUPS = groups;
    return groups;
  }
  function synBoost(pt, a) {
    buildWordbank();
    var boost = 0;
    WBGROUPS.forEach(function (g) {
      var inPt = false, inAns = false;
      g.forEach(function (w) { if (pt.indexOf(w) >= 0) inPt = true; if (a.indexOf(w) >= 0) inAns = true; });
      if (inPt && inAns) boost = Math.max(boost, 0.3);
    });
    return boost;
  }

  /* ---------------- 单点匹配 ---------------- */
  function matchPoint(ptText, ans) {
    var a = norm(ans), pt = norm(ptText);
    if (!pt) return { status: "na", cov: 0 };
    if (a && a.indexOf(pt) >= 0) return { status: "hit", cov: 1 };
    var pk = meaningful(keysOf(pt));
    if (pk.size === 0) {
      var any = false;
      for (var i = 0; i < pt.length; i++) { if (a.indexOf(pt[i]) >= 0) { any = true; break; } }
      return { status: any ? "partial" : "miss", cov: any ? 0.3 : 0 };
    }
    var matched = 0;
    pk.forEach(function (g) { if (a.indexOf(g) >= 0) matched++; });
    var cov = matched / pk.size;
    if (cov < 0.5) cov = Math.min(1, cov + synBoost(pt, a));
    var status = cov >= 0.5 ? "hit" : (cov >= 0.2 ? "partial" : "miss");
    return { status: status, cov: cov };
  }

  /* ---------------- 解析分数 / 字数 ---------------- */
  function parseScore(s) { var m = String(s || "").match(/\d+/); return m ? parseInt(m[0], 10) : 10; }
  function parseLimit(s) { var m = String(s || "").match(/\d+/); return m ? parseInt(m[0], 10) : 0; }

  /* ---------------- 公文格式自检 ---------------- */
  function checkFormat(ans) {
    ans = norm(ans);
    if (!ans) return 0;
    var title = /关于|通报|通知|报告|请示|意见|方案|讲话|倡议|公开信|简报|提纲|发言|报道|宣传|经验|汇报|调研|推荐|纪要|导言|摘要|结语|函/.test(ans) ||
      /：|:/.test((ans.split("\n")[0] || ""));
    var sal = /尊敬的|敬爱的|各位|先生|女士|同志|：|:/.test(ans);
    var sign = /\d{4}年|\d{1,2}月\d{1,2}日|[一-龥]{2,}(公司|政府|委员会|办公室|局|部|处|科|协会|单位|组)$/.test(ans) ||
      /\d{4}\s*[-/年]\s*\d{1,2}\s*[-/月]\s*\d{1,2}\s*日/.test(ans);
    return (title ? 1 : 0) + (sal ? 1 : 0) + (sign ? 1 : 0);
  }

  /* ---------------- 评分主函数 ---------------- */
  function grade(q, ans) {
    var base = parseScore(q.score);
    var contentPts = (q.points || []).filter(function (p) { return p.tag !== "格式"; });
    var fmtPts = (q.points || []).filter(function (p) { return p.tag === "格式"; });
    var detail = [], coreHit = 0, coreTot = 0, flexHit = 0, flexTot = 0, missPoints = [];
    contentPts.forEach(function (p) {
      var m = matchPoint(p.text, ans);
      var isCore = p.tag === "核心";
      if (isCore) { coreTot++; if (m.status === "hit") coreHit++; }
      else { flexTot++; if (m.status === "hit" || m.status === "partial") flexHit++; }
      detail.push({ text: p.text, tag: p.tag, status: m.status, cov: m.cov });
      if (m.status === "miss") missPoints.push(p.text);
      else if (m.status === "partial") missPoints.push("（部分）" + p.text);
    });
    var num = coreHit + 0.5 * flexHit;
    var den = coreTot + 0.5 * flexTot;
    var ratio = den > 0 ? num / den : 0;

    var isGw = classify(q.qtype) === "公文" || fmtPts.length > 0;
    var fmtPresent = 0, fmtMiss = false;
    if (isGw) {
      fmtPresent = checkFormat(ans);
      fmtMiss = fmtPresent < 2;
    }
    var fmtPortion = fmtPts.length > 0 ? Math.min(0.2, fmtPts.length * 0.06)
      : (classify(q.qtype) === "公文" ? 0.15 : 0);
    if (fmtMiss && fmtPortion > 0) ratio *= (1 - fmtPortion);
    ratio = Math.max(0, Math.min(1, ratio));
    var score = Math.round(base * ratio);

    // 冗余 / 跑题
    var userKeys = meaningful(keysOf(ans));
    var totalMatched = new Set();
    detail.forEach(function (d) {
      if (d.status !== "miss") {
        meaningful(keysOf(d.text)).forEach(function (g) { if (norm(ans).indexOf(g) >= 0) totalMatched.add(g); });
      }
    });
    var coverage = userKeys.size > 0 ? totalMatched.size / userKeys.size : 1;
    var redund = coverage < 0.3 && norm(ans).length >= 30;
    var limit = parseLimit(q.words);
    var overWord = limit > 0 && norm(ans).length > limit * 1.1;

    return {
      base: base, score: score, ratio: ratio, coreHit: coreHit, coreTot: coreTot,
      flexHit: flexHit, flexTot: flexTot, fmtMiss: fmtMiss, fmtPresent: fmtPresent,
      missPoints: missPoints, detail: detail, coverage: coverage, redund: redund,
      overWord: overWord, limit: limit, ansLen: norm(ans).length
    };
  }

  /* ---------------- 记录存取（按 pid#pno 去重 upsert） ---------------- */
  function recKey(pid, pno) { return pid + "#" + pno; }
  function loadRecords() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; } }
  function saveRecord(rec) {
    var a = loadRecords();
    var k = recKey(rec.pid, rec.pno);

    for (var i = 0; i < a.length; i++) {
      if (recKey(a[i].pid, a[i].pno) === k) { a[i] = rec; found = true; break; }
    }
    if (!found) a.push(rec);
    try { localStorage.setItem(LS_KEY, JSON.stringify(a)); } catch (e) {}
  }

  function renderResult(q, r) {
    var h = '<div class="b25-res">';
    var color = r.ratio >= 0.7 ? "var(--green)" : (r.ratio >= 0.4 ? "#d97706" : "#dc2626");
    h += '<div class="b25-score"><span class="big" style="color:' + color + '">' + r.score + '</span>' +
      '<span style="font-size:15px;color:var(--sub)">/ ' + r.base + ' 分</span>' +
      '<span class="pct">命中率 ' + Math.round(r.ratio * 100) + '% · 核心 ' + r.coreHit + '/' + r.coreTot +
      (r.flexTot ? ' · 弹性 ' + r.flexHit + '/' + r.flexTot : '') + '</span></div>';

    // 失分预警
    if (r.overWord) h += '<div class="b25-warn red">⚠️ 超字数：本题要求' + r.limit + '字以内，你已写约 ' + (r.ansLen || 0) + ' 字（按字符计）。建议精简。</div>';
    if (r.fmtMiss) h += '<div class="b25-warn red">⚠️ 公文格式缺项：检测到标题/称谓/落款不完整（命中 ' + r.fmtPresent + '/3）。公文题格式分不可丢。</div>';
    if (r.redund) h += '<div class="b25-warn">⚠️ 冗余/跑题预警：你的作答中约 ' + Math.round((1 - r.coverage) * 100) + '% 的内容未命中任何标准采分点，建议紧扣材料要点、少写空话。</div>';
    if (!r.overWord && !r.fmtMiss && !r.redund) h += '<div class="b25-warn ok">✅ 字数 / 格式 / 冗余 检测通过</div>';

    // 采分点逐条
    h += '<div style="font-weight:700;color:var(--accent);margin:8px 0 4px">✅ 采分点逐条判定</div>';
    r.detail.forEach(function (d) {
      var ico = d.status === "hit" ? "✅" : (d.status === "partial" ? "⚠️" : "❌");
      var cls = d.status === "hit" ? "hit" : (d.status === "partial" ? "part" : "miss");
      var tg = d.tag === "核心" ? '<span class="b25-tg core">核心</span>' : (d.tag === "弹性" ? '<span class="b25-tg flex">弹性</span>' : '<span class="b25-tg fmt">格式</span>');
      var statusTxt = d.status === "hit" ? "命中" : (d.status === "partial" ? "部分" : "遗漏");
      h += '<div class="b25-ptrow"><span class="b25-ico ' + cls + '">' + ico + '</span>' + tg +
        '<span>' + esc(d.text) + ' <span style="color:var(--sub);font-size:11px">[' + statusTxt + ']</span></span></div>';
    });

    // 规范提示：遗漏/偏弱的标准要点
    if (r.missPoints.length) {
      h += '<div class="b25-std"><b>📌 你遗漏/偏弱的标准要点（建议背诵）</b><br>' +
        r.missPoints.map(function (t) { return esc(t); }).join("<br>") + '</div>';
    }
    h += '</div>';
    return h;
  }

    };

      "试卷：" + f.p.year + " " + f.p.paper + " · 题" + pno + "\n题型：" + f.q.qtype + " · 分值：" + f.q.score + " · 字数：" + f.q.words + "\n" +

    if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(function () { alert("AI 精批任务已复制 ✅\n粘贴给 WorkBuddy（同会话）即可获得语义级精批，结果可回写本题。"); },

  function fallbackCopy(txt) {

  /* ===================================================================
     诊断页
     =================================================================== */
  function renderDiagInner() {
    var recs = loadRecords();
    if (!recs.length) {
      return '<div class="b25-empty">还没有批改记录。<br>去「即时批改」写完答案点「保存记录」，这里会自动生成你的弱项画像。</div>';
    }
    var h = '';
    // KPI
    var avg = recs.reduce(function (s, r) { return s + r.ratio; }, 0) / recs.length;
    var avgScore = recs.reduce(function (s, r) { return s + r.score; }, 0) / recs.length;
    h += '<div class="b25-kpis">' +
      kpi(recs.length, "已批改小题") +
      kpi(Math.round(avg * 100) + "%", "平均命中率") +
      kpi(Math.round(avgScore * 10) / 10, "平均得分") +
      kpi(bucketLowest(recs), "最弱题型") +
      '</div>';

    // 题型雷达
    var radarData = BUCKETS.map(function (b) {
      var rs = recs.filter(function (r) { return r.bucket === b; });
      return { name: b, val: rs.length ? rs.reduce(function (s, r) { return s + r.ratio; }, 0) / rs.length : 0, n: rs.length };
    });
    h += '<div class="b25-radar"><div class="b25-sec-h" style="border:none;margin:0 0 4px;padding:0">题型命中率雷达</div>' + radarSvg(radarData) + '</div>';

    // 失分类型分布
    var loss = { 漏点: 0, 表述不规范: 0, 冗余跑题: 0, 超字数: 0, 格式缺项: 0 };
    recs.forEach(function (r) {
      if (r.missPoints && r.missPoints.length) loss["漏点"]++;
      if ((r.missPoints || []).some(function (t) { return t.indexOf("（部分）") >= 0; })) loss["表述不规范"]++;
      if (r.redund) loss["冗余跑题"]++;
      if (r.overWord) loss["超字数"]++;
      if (r.fmtMiss) loss["格式缺项"]++;
    });
    h += '<div class="b25-sec-h">失分类型分布</div><div class="b25-list">';
    Object.keys(loss).forEach(function (k) {
      var c = loss[k], pct = recs.length ? Math.round(c / recs.length * 100) : 0;
      h += '<div class="b25-li"><span>' + k + ' <span style="color:var(--sub)">(' + c + ' 次)</span></span>' +
        '<span style="display:flex;gap:8px;align-items:center;flex:1;max-width:260px"><span class="b25-bar"><i style="width:' + pct + '%"></i></span><span class="cnt">' + pct + '%</span></span></div>';
    });
    h += '</div>';

    // 高频遗漏采分点 TOP10
    var cnt = {};
    recs.forEach(function (r) { (r.missPoints || []).forEach(function (t) { t = t.replace(/^（部分）/g, ""); cnt[t] = (cnt[t] || 0) + 1; }); });
    var top = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).slice(0, 10);
    if (top.length) {
      h += '<div class="b25-sec-h">高频遗漏采分点 TOP10（重点补弱）</div><div class="b25-list">';
      top.forEach(function (t) {
        h += '<div class="b25-li"><span>' + esc(t) + '</span><span class="cnt">遗漏 ' + cnt[t] + ' 次</span></div>';
      });
      h += '</div>';
    }

    // 补弱路径
    var weak = radarData.slice().sort(function (a, b) { return a.val - b.val; })[0];
    var tip = weak && weak.n > 0
      ? '你最弱的题型是 <b>' + weak.name + '</b>（' + weak.n + ' 次批改，平均命中率 ' + Math.round(weak.val * 100) + '%）。建议：①优先练 ' + weak.name + ' 类真题（「即时批改」里按题型筛选）；②对照「方法论」卡片看该类题踩分结构；③背熟上方高频遗漏的标准要点。'
      : '样本还太少，多批改几道就能给出精准补弱路径。';
    h += '<div class="b25-sec-h">补弱路径建议</div><div class="b25-list"><div class="b25-tip">' + tip + '</div>' +
      '<div class="b25-tip">通用提分：每次批改后看「你遗漏/偏弱的标准要点」并背诵；公文题务必补齐标题/称谓/落款；控制字数不超 1.1 倍。</div></div>';

    return h;
  }
  function kpi(v, l) { return '<div class="b25-kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }
  function bucketLowest(recs) {
    var best = { b: "—", v: 2 };
    BUCKETS.forEach(function (b) {
      var rs = recs.filter(function (r) { return r.bucket === b; });
      if (rs.length) { var v = rs.reduce(function (s, r) { return s + r.ratio; }, 0) / rs.length; if (v < best.v) best = { b: b, v: v }; }
    });
    return best.b;
  }

  /* ---------------- 雷达图（内联 SVG，离线） ---------------- */
  function radarSvg(data) {
    var n = data.length, cx = 160, cy = 150, R = 100;
    var ang = function (i) { return -Math.PI / 2 + i * 2 * Math.PI / n; };
    var pt = function (i, r) { return [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))]; };
    var s = '<svg viewBox="0 0 320 320" width="320" height="320">';
    // 网格
    [0.25, 0.5, 0.75, 1].forEach(function (g) {
      var pts = [];
      for (var i = 0; i < n; i++) { var p = pt(i, R * g); pts.push(p[0].toFixed(1) + "," + p[1].toFixed(1)); }
      s += '<polygon points="' + pts.join(" ") + '" fill="none" stroke="#eee"/>';
    });
    // 轴 + 标签
    for (var i = 0; i < n; i++) {

<script>/* === _b26.js === */
/* =====================================================================

(function(){
  "use strict";

  var PRIMARY = [
    { s:"真题库",   i:"📚" },
    { s:"小题批改", i:"✍️" },
    { s:"省考库",   i:"🗺️" },

  function isNarrow(){ try{ return window.matchMedia("(max-width:900px)").matches; }catch(_){ return false; } }

  function build(){
    if(!isNarrow()) return;

    // 底部 Tab 栏
    var bar = document.createElement("div");
    bar.id = "tabbar";
    PRIMARY.forEach(function(t){
      var el = document.createElement("div");
      el.className = "tab"; el.dataset.scope = t.s;
      el.innerHTML = '<span class="ti">' + t.i + '</span><span>' + t.s + '</span>';
      el.onclick = function(){

    panel.querySelectorAll(".si").forEach(function(it){

    document.body.appendChild(panel);

    var cur = curScope();

  function setupPWA(){

    var standalone = (window.navigator && window.navigator.standalone) ||
                     (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

    document.addEventListener("DOMContentLoaded", build);
  } else {
    build();
  }
})();

<script>/* === _b21_sync.js === */

    const merged = {};
    for(const k in target){ merged[k] = target[k]; }
    const impKeys = (imp && imp.keys) || {};
    for(const k in impKeys){
      if(!(k in merged)){ merged[k] = impKeys[k]; continue; }
      if(k === ANS_KEY){
        try{
          const t = JSON.parse(merged[k]||"{}");
          const s = JSON.parse(impKeys[k]||"{}");
          for(const rk in s){
            if(!(rk in t)){ t[rk] = s[rk]; }
            else{
              const tt = (t[rk] && t[rk].ts) || 0;
              const st = (s[rk] && s[rk].ts) || 0;
              if(st > tt){ t[rk] = s[rk]; }
            }
          }
          merged[k] = JSON.stringify(t);
        }catch(_){}
        continue;
      }
      if(k === GRADE_KEY){
        try{
          const tgt = JSON.parse(merged[k]||"[]");
          const src = JSON.parse(impKeys[k]||"[]");
          const map = {};
          tgt.forEach(function(r){ if(r && r.pid!=null) map[r.pid+"#"+(r.pno!=null?r.pno:"")] = r; });
          src.forEach(function(r){
            if(!r || r.pid==null) return;
            const key = r.pid+"#"+(r.pno!=null?r.pno:"");
            const cur = map[key];
            const rt = r.ts||0, ct = cur ? (cur.ts||0) : 0;
            if(!cur){ map[key] = r; }
            else if(rt > ct){ map[key] = r; }
          });
          merged[k] = JSON.stringify(Object.keys(map).map(function(kk){ return map[kk]; }));
        }catch(_){}
        continue;
      }
      // 其余键本机优先，不覆盖
    }
    return merged;
  }
  function applyMerged(m){
    for(const k in m){ try{ localStorage.setItem(k, m[k]); }catch(_){} }
  }
  function setStatus(){
    if(window.__shenlunSync){ window.__shenlunSync.status = enabled ? "on" : "off"; window.__shenlunSync.lastSync = lastSync; }
    if(typeof window.b21RenderSync === "function"){ try{ window.b21RenderSync(); }catch(_){} }
  }

  /* 正在动笔就别打扰：作答弹窗开着、或光标停在任何输入框里 */
  function busy(){
    try{
      if(document.getElementById("ansText")) return true;
      const a = document.activeElement;
      if(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.isContentEditable)) return true;
    }catch(_){}
    return false;
  }

  function toast(msg){
    try{
      let t = document.getElementById("b21SyncToast");
      if(!t){
        t = document.createElement("div");
        t.id = "b21SyncToast";
        t.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:99999;background:#1f2937;color:#fff;"
                        + "padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;"
                        + "box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transition:opacity .25s;pointer-events:none;";
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = "1";
      if(t.__tm) clearTimeout(t.__tm);
      t.__tm = setTimeout(function(){ t.style.opacity = "0"; }, 3200);
    }catch(_){}
  }

  async function pull(opt){
    opt = opt || {};
    try{
      const r = await fetch(SERVER, {cache:"no-store"});
      if(!r.ok) return false;
      const imp = await r.json();
      const before = hashOf(snapshot());
      const merged = mergeInto(snapshot(), imp);
      applyMerged(merged);
      const after = hashOf(snapshot());
      lastSync = new Date().toLocaleString();
      setStatus();
      const changed = (before !== after);
      if(changed && opt.notify){
        toast("已同步到其他设备的新记录");
        if(!busy() && typeof window.__render === "function"){
          try{ window.__render(); }catch(_){}
        }
      }
      return changed;
    }catch(e){ return false; }
  }

  async function push(){
    try{
      const cur = snapshot();
      const h = hashOf(cur);
      if(h === lastHash) return;          // 未变化不推
      const r = await fetch(SERVER, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({_app:"求是申论素材库", keys:cur})});
      if(r.ok){ lastHash = h; lastSync = new Date().toLocaleString(); setStatus(); }
    }catch(e){}
  }

  (async function init(){
    try{
      const r = await fetch(SERVER, {cache:"no-store"});
      if(!r.ok) return;
      enabled = true;
      window.__shenlunSync = { status:"on", lastSync:"", url: location.origin, pull:pull, push:push };
      await pull();          // 首次加载：把服务器共享记录合并进本机
      await push();          // 再把本机独有记录推上去，双向补齐
      setStatus();
      setInterval(function(){ if(enabled) push(); }, PUSH_MS);                       // 防抖回写
      setInterval(async function(){                                                  // 自动拉取
        if(!enabled || busy()) return;
        if(document.hidden) return;      // 页面在后台不折腾
        await pull({notify:true});
        await push();
      }, PULL_MS);
      // 从后台切回前台立刻拉一次，省得等
      document.addEventListener("visibilitychange", function(){
        if(!document.hidden && enabled && !busy()) pull({notify:true});
      });
    }catch(e){ /* file:// 或未启动服务器：静默禁用 */ }
  })();

})();

</script>
