<style>/* === _b16.css === */
/* ============ _b16 申论成长史时间线 样式 ============ */
/* 复用主站 :root 变量；全部 b16- 前缀隔离，不污染主站 */

.b16-wrap{max-width:960px;margin:0 auto;padding:4px 2px 40px}

/* ---- 头部 ---- */
.b16-head h2{font-size:20px;margin:0 0 6px}
.b16-lead{font-size:13px;line-height:1.85;color:var(--sub);margin:0 0 12px}
.b16-lead b{color:var(--accent)}

/* ---- 通用卡片 ---- */
.b16-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.b16-empty{color:var(--sub);font-size:13.5px;line-height:1.9;text-align:center;padding:26px 16px}

/* ---- 成长概览 ---- */
.b16-ov{margin-bottom:12px}
.b16-ovh{font-size:14px;font-weight:700;color:var(--accent);
  padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.b16-ovg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.b16-kv{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.b16-kv span{display:block;font-size:11.5px;color:var(--sub);margin-bottom:2px}
.b16-kv b{font-size:16px;color:var(--txt)}

.b16-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  font-size:12.5px;color:var(--sub);line-height:1.9;padding:5px 0}
.b16-line b{color:var(--txt);font-size:14px}
.b16-lb{flex:0 0 auto;font-size:11.5px;color:var(--sub);background:#f3f4f6;
  border-radius:9px;padding:2px 9px;margin-right:2px}
.b16-flat{color:var(--sub)}

/* 趋势：升=红（进步），降=绿（回落）——沿用申论站配色约定 */
.b16-trend{font-weight:700;padding:1px 9px;border-radius:10px;white-space:nowrap}
.b16-trend.up{color:var(--red);background:var(--red-soft)}
.b16-trend.down{color:var(--green);background:var(--green-soft)}
.b16-trend.flat{color:var(--sub);background:#f3f4f6}

/* ---- 标签 chips ---- */
.b16-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.7;
  padding:2px 10px;border-radius:11px;background:var(--blue-soft);color:#4338ca;
  border:1px solid transparent;cursor:pointer;white-space:nowrap}
.b16-chip:hover{border-color:var(--blue);background:#e4e9ff}
.b16-chip.hot{background:var(--red-soft);color:var(--accent)}
.b16-chip.hot:hover{border-color:var(--red);background:#fbe6e2}
.b16-chip i{font-style:normal;font-size:10.5px;background:#fff;border-radius:8px;padding:0 6px;opacity:.85}

/* ---- 搜索栏 ---- */
.b16-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 6px}
.b16-search{flex:1 1 280px;min-width:220px;border:1px solid var(--line);border-radius:18px;
  background:var(--panel);color:var(--txt);padding:7px 14px;font-size:13px;outline:none}
.b16-search:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.08)}
.b16-mini{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:14px;
  padding:5px 12px;font-size:12px;cursor:pointer;line-height:1.6;white-space:nowrap}
.b16-mini:hover{border-color:var(--red);color:var(--accent);background:var(--red-soft)}
.b16-cnt{font-size:12px;color:var(--sub);margin:0 0 12px 4px}
.b16-cnt b{color:var(--accent);font-size:13px}

/* ---- 时间线主体 ---- */
.b16-tl{position:relative;padding-left:24px}
.b16-tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(to bottom,var(--line),#eceef1)}

.b16-mon{position:relative;font-size:12.5px;font-weight:700;color:var(--accent);
  margin:14px 0 8px;padding-left:2px}
.b16-mon:first-child{margin-top:2px}
.b16-mdot{position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--red-soft)}

.b16-item{position:relative;margin-bottom:12px}
.b16-dot{position:absolute;left:-23px;top:18px;width:10px;height:10px;border-radius:50%;
  background:var(--sub);border:2px solid var(--panel);box-shadow:0 0 0 2px #eceef1}
.b16-dot.pass{background:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.b16-dot.low{background:var(--green);box-shadow:0 0 0 2px var(--green-soft)}

.b16-it{padding:12px 14px;transition:border-color .15s,box-shadow .15s}
.b16-it:hover{border-color:#d9dce1;box-shadow:0 2px 10px rgba(31,41,55,.06)}

.b16-ih{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.b16-il{min-width:0;flex:1}
.b16-date{font-size:11.5px;color:var(--sub);margin-bottom:4px}
.b16-tt{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--txt)}
.b16-qn{font-size:11px;font-weight:400;padding:1px 8px;border-radius:9px;background:#f3f4f6;color:var(--sub)}
.b16-qt{font-size:11px;font-weight:400;padding:1px 8px;border-radius:9px;background:var(--red-soft);color:var(--accent)}

/* 命中率大字：≥60 红/达标，<60 绿/待提升 */
.b16-ir{flex:0 0 auto;text-align:right;min-width:74px}
.b16-sc{font-size:26px;font-weight:800;line-height:1.1;color:var(--sub)}
.b16-sc i{font-style:normal;font-size:13px;font-weight:600;margin-left:1px}
.b16-sct{font-size:11px;color:var(--sub);margin-top:2px}
.b16-ir.pass .b16-sc{color:var(--red)}
.b16-ir.pass .b16-sct{color:var(--red)}
.b16-ir.low .b16-sc{color:var(--green)}
.b16-ir.low .b16-sct{color:var(--green)}

/* 过程笔记 */
.b16-proc{margin-top:10px;padding:9px 11px;background:#fafbfc;border:1px dashed var(--line);border-radius:10px}
.b16-tags{display:flex;flex-wrap:wrap;gap:6px}
.b16-note{font-size:12.5px;line-height:1.85;color:var(--txt);white-space:pre-wrap;word-break:break-word;margin-top:7px}
.b16-imgtip{font-size:11.5px;color:var(--sub);margin-top:6px}

/* 操作按钮 */
.b16-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.b16-btn{border:1px solid var(--red);background:#fff;color:var(--red);border-radius:14px;
  padding:4px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap;line-height:1.6}
.b16-btn:hover{background:var(--red);color:#fff}
.b16-btn.ghost{border-color:var(--line);color:var(--sub)}
.b16-btn.ghost:hover{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}

/* 加载更多 */
.b16-morebox{text-align:center;margin-top:14px}
.b16-more{border:1px solid var(--line);background:var(--panel);color:var(--accent);
  border-radius:18px;padding:7px 22px;font-size:13px;cursor:pointer}
.b16-more:hover{border-color:var(--red);background:var(--red-soft)}
.b16-end{font-size:12px;color:var(--sub)}

@media (max-width:620px){
  .b16-tl{padding-left:20px}
  .b16-dot,.b16-mdot{left:-19px}
  .b16-ih{flex-direction:column;gap:6px}
  .b16-ir{text-align:left}
  .b16-sc{font-size:22px}
}

</style>
<style>/* === _b17.css === */
/* ============ _b17 单题限时模考 · 考场节奏复盘 样式 ============ */
/* 复用主站 :root 变量；全部 b17- 前缀隔离，不污染主站 */

.b17-wrap{max-width:1180px;margin:0 auto;padding:4px 2px 44px;color:var(--txt)}

/* ---- 头部 / 标签页 ---- */
.b17-head h2{font-size:20px;margin:0 0 6px}
.b17-lead{font-size:13px;line-height:1.85;color:var(--sub);margin:0 0 12px}
.b17-lead b{color:var(--accent)}
.b17-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.b17-tab{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:16px;
  padding:5px 16px;font-size:13px;cursor:pointer;line-height:1.6;font-family:inherit}
.b17-tab:hover{border-color:var(--red);color:var(--accent);background:var(--red-soft)}
.b17-tab.on{border-color:var(--red);background:var(--red);color:#fff;font-weight:700}

/* ---- 卡片 ---- */
.b17-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:14px}
.b17-h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:700;
  color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.b17-h3 .b17-num{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;
  border-radius:50%;background:var(--red);color:#fff;font-size:12px}
.b17-sub{font-size:12px;font-weight:400;color:var(--sub);margin-left:auto}
.b17-empty{color:var(--sub);font-size:13px;padding:8px 2px;line-height:1.9}
.b17-empty b{color:var(--accent)}
.b17-label{font-size:12px;color:var(--sub);margin:12px 0 4px}

/* ---- 按钮 ---- */
.b17-btn{border:1px solid var(--red);background:var(--red);color:#fff;border-radius:16px;
  padding:6px 18px;font-size:13px;cursor:pointer;line-height:1.6;font-family:inherit}
.b17-btn:hover{background:var(--accent);border-color:var(--accent)}
.b17-btn[disabled]{opacity:.45;cursor:not-allowed}
.b17-mini{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:14px;
  padding:4px 12px;font-size:12px;cursor:pointer;line-height:1.6;font-family:inherit}
.b17-mini:hover{border-color:var(--red);color:var(--accent);background:var(--red-soft)}
.b17-mini.del:hover{border-color:#b91c1c;color:#b91c1c;background:#fef2f2}
.b17-ops{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.b17-tip{font-size:12px;color:var(--sub);line-height:1.7}
.b17-tip.over{color:var(--red);font-weight:700}
.b17-flash{font-size:12px;color:var(--green);background:var(--green-soft);
  border:1px solid #bbe7cd;border-radius:12px;padding:3px 12px}

/* ---- 选择行 ---- */
.b17-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.b17-row.wrap{flex-wrap:wrap;align-items:flex-start}
.b17-lbl2{font-size:12.5px;color:var(--sub);min-width:34px;padding-top:5px}
.b17-sel{flex:1;min-width:0;max-width:520px;padding:7px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;color:var(--txt);font-size:13px;font-family:inherit;outline:none}
.b17-sel:focus{border-color:var(--red)}
.b17-qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 12px;padding-left:44px}
.b17-tag{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:10px;
  background:var(--blue-soft);color:var(--blue);margin-left:8px}
.b17-mt{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:1px 9px}
.b17-mt.sug{color:var(--accent);border-color:#f0c9c2;background:var(--red-soft)}

/* ---- 时长 chips ---- */
.b17-chips{display:flex;flex-wrap:wrap;gap:6px}
.b17-chip{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:14px;
  padding:3px 12px;font-size:12.5px;cursor:pointer;line-height:1.7;font-family:inherit}
.b17-chip:hover{border-color:var(--red);background:var(--red-soft);color:var(--accent)}
.b17-chip.on{border-color:var(--red);background:var(--red-soft);color:var(--accent);font-weight:700}
.b17-chip.sug{background:var(--blue-soft);border-color:#dbe3ff;color:var(--blue)}
.b17-chip.sug.on{background:var(--red-soft);border-color:var(--red);color:var(--accent)}
.b17-custom{font-size:12.5px;color:var(--sub);padding-top:3px}
.b17-numin{width:66px;padding:3px 8px;border:1px solid var(--line);border-radius:8px;
  font-size:13px;font-family:inherit;color:var(--txt);outline:none}
.b17-numin:focus{border-color:var(--red)}

/* ---- 计时作答区 ---- */
.b17-run{border-color:#f0c9c2}
.b17-runhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.b17-rtitle{font-size:14px;font-weight:700;color:var(--accent)}
.b17-clock{font-size:44px;line-height:1.1;font-weight:700;letter-spacing:2px;color:var(--txt);
  font-family:Consolas,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.b17-clock.warn{color:#b45309}
.b17-clock.over{color:var(--red)}
.b17-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 2px}
.b17-bar > i{display:block;height:100%;background:var(--green);transition:width .4s linear}
.b17-bar > i.warn{background:#d97706}
.b17-bar > i.over{background:var(--red)}
.b17-stem{border:1px solid var(--line);border-radius:10px;background:#fcfcfd;padding:10px 12px;
  font-size:13.5px;line-height:1.95;max-height:260px;overflow:auto}
.b17-stem > div{margin-bottom:4px}
.b17-text{width:100%;box-sizing:border-box;min-height:260px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;font-size:14px;line-height:1.95;font-family:inherit;color:var(--txt);
  outline:none;resize:vertical;background:#fff}
.b17-text:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.08)}
.b17-cnt{font-size:12px;color:var(--sub);margin-top:4px;text-align:right}

/* ---- 成绩 ---- */
.b17-res{border-color:#bbe7cd}
.b17-resline{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}
.b17-big{font-size:34px;font-weight:700;color:var(--accent);line-height:1.1}
.b17-kv{font-size:13px;color:var(--txt)}
.b17-note{margin-top:10px;font-size:13px;line-height:1.9;color:var(--txt);
  background:var(--green-soft);border:1px solid #bbe7cd;border-radius:10px;padding:8px 12px}
.b17-pts{list-style:none;margin:12px 0 0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.b17-pts li{font-size:12.5px;line-height:1.8;padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.b17-pts li.hit{background:var(--green-soft);border-color:#bbe7cd;color:var(--green)}
.b17-pts li.miss{background:var(--red-soft);border-color:#f0c9c2;color:var(--red)}

/* ---- 复盘概览 ---- */
.b17-ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.b17-ovi{border:1px solid var(--line);border-radius:10px;background:#fcfcfd;padding:10px 12px;
  display:flex;flex-direction:column;gap:4px}
.b17-ovn{font-size:18px;font-weight:700;color:var(--txt);line-height:1.3}
.b17-ovl{font-size:12px;color:var(--sub)}
.b17-over{color:var(--red)}
.b17-under{color:var(--green)}
.b17-coach{margin-top:12px;font-size:13px;line-height:1.95;color:var(--txt);
  background:var(--blue-soft);border:1px solid #dbe3ff;border-radius:10px;padding:9px 12px}

/* ---- 复盘表格 ---- */
.b17-tbwrap{overflow-x:auto}
.b17-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.b17-tb th,.b17-tb td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;
  white-space:nowrap;line-height:1.7}
.b17-tb th{color:var(--sub);font-weight:400;background:#fafafa}
.b17-tb td:nth-child(2){white-space:normal;min-width:180px}
.b17-tb tr.b17-tr-over td{background:var(--red-soft)}

@media(max-width:720px){
  .b17-clock{font-size:34px}
  .b17-qmeta{padding-left:0}
  .b17-sel{max-width:none}
}

</style>
<style>/* === _b18.css === */
/* ===== _b18 错词 → 规范词 实时标红 ===== */

.b18-wrap{ padding:2px 0 24px; color:var(--txt,#1f2937); }

.b18-head{ margin:0 0 12px; }
.b18-title{ font-size:19px; font-weight:700; color:var(--accent,#8e2f22); letter-spacing:.5px; }
.b18-sub{ margin-top:4px; font-size:13px; color:var(--sub,#6b7280); line-height:1.7; }

.b18-flash{
  margin:0 0 12px; padding:8px 12px; border-radius:8px; font-size:13px;
  background:var(--green-soft,#ecfdf5); color:var(--green,#15803d);
  border:1px solid rgba(21,128,61,.22);
}

.b18-grid{ display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
.b18-col{ flex:1 1 380px; min-width:320px; display:flex; flex-direction:column; gap:14px; }

.b18-card{
  background:var(--panel,#fff); border:1px solid var(--line,#e5e7eb);
  border-radius:10px; padding:12px 14px 14px;
}
.b18-card-h{
  font-size:14px; font-weight:700; color:var(--accent,#8e2f22);
  padding-bottom:8px; margin-bottom:10px; border-bottom:1px dashed var(--line,#e5e7eb);
  display:flex; align-items:center; gap:8px;
}
.b18-right{ margin-left:auto; }

/* ---- 输入区 ---- */
.b18-ta{
  width:100%; box-sizing:border-box; min-height:190px; resize:vertical;
  padding:10px 12px; font-size:14px; line-height:1.9;
  border:1px solid var(--line,#e5e7eb); border-radius:8px;
  background:var(--bg,#f6f7f9); color:var(--txt,#1f2937);
  font-family:inherit; outline:none;
}
.b18-ta:focus{ border-color:var(--accent,#8e2f22); background:var(--panel,#fff); }

.b18-row{ margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.b18-stat{ margin-left:auto; font-size:12px; color:var(--sub,#6b7280); }
.b18-stat b{ color:var(--txt,#1f2937); }
.b18-hot{ color:var(--red,#c0392b); }

/* ---- 按钮 ---- */
.b18-btn{
  padding:6px 12px; font-size:13px; line-height:1.4; cursor:pointer;
  border:1px solid var(--line,#e5e7eb); border-radius:6px;
  background:var(--panel,#fff); color:var(--txt,#1f2937);
  font-family:inherit; transition:all .15s;
}
.b18-btn:hover{ border-color:var(--accent,#8e2f22); color:var(--accent,#8e2f22); }
.b18-btn-sm{ padding:3px 8px; font-size:12px; }
.b18-btn-red{
  background:var(--red-soft,#fdf0ee); border-color:rgba(192,57,43,.35); color:var(--red,#c0392b); font-weight:600;
}
.b18-btn-red:hover{ background:var(--red,#c0392b); color:#fff; border-color:var(--red,#c0392b); }
.b18-btn-blue{
  background:var(--blue-soft,#eef2ff); border-color:rgba(29,78,216,.3); color:var(--blue,#1d4ed8); font-weight:600;
}
.b18-btn-blue:hover{ background:var(--blue,#1d4ed8); color:#fff; }

/* ---- 高亮预览 ---- */
.b18-prev{
  min-height:120px; max-height:340px; overflow:auto;
  padding:10px 12px; font-size:14px; line-height:2.1;
  background:var(--bg,#f6f7f9); border:1px solid var(--line,#e5e7eb); border-radius:8px;
  word-break:break-all;
}
.b18-bad{
  background:var(--red-soft,#fdf0ee); color:var(--red,#c0392b);
  border-bottom:2px solid var(--red,#c0392b);
  padding:0 2px; border-radius:3px 3px 0 0; font-weight:600;
}
.b18-good{ color:var(--green,#15803d); font-size:12px; margin:0 2px; }
.b18-arrow{ color:var(--sub,#6b7280); margin:0 4px; font-size:12px; }
.b18-dim{ color:var(--sub,#6b7280); font-size:13px; }

/* ---- 建议列表 ---- */
.b18-list{ max-height:320px; overflow:auto; }
.b18-item{
  padding:8px 10px; margin-bottom:8px;
  border:1px solid var(--line,#e5e7eb); border-radius:8px; background:var(--bg,#f6f7f9);
}
.b18-item-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.b18-pos{ font-size:12px; color:var(--sub,#6b7280); min-width:56px; }
.b18-item-h .b18-btn{ margin-left:auto; }
.b18-opts{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

.b18-chip{
  padding:3px 9px; font-size:12px; cursor:pointer; font-family:inherit;
  border:1px solid rgba(21,128,61,.3); border-radius:12px;

<style>/* === _b19.css === */
/* ============ _b19 申论成长史 → Obsidian 双推 样式 ============ */
/* 复用主站 :root 变量；全部 b19- 前缀隔离，不污染主站 */

.b19-wrap{max-width:1180px;margin:0 auto;padding:4px 2px 44px;color:var(--txt)}

/* ---- 头部 ---- */
.b19-head h2{font-size:20px;margin:0 0 6px}

/* ---- 顶部飞行提示 ---- */
.b19-flash{max-height:0;overflow:hidden;opacity:0;transition:max-height .18s ease,opacity .18s ease,margin .18s ease;

  background:var(--green-soft);border:1px solid var(--green);color:var(--green)}

/* ---- 卡片 ---- */
.b19-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:14px}

  color:var(--accent);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.b19-h3 .b19-num{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;
  border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700}
.b19-sub{font-size:12px;font-weight:400;color:var(--sub);margin-left:auto}

/* ---- 配置区 ---- */
.b19-grid{display:flex;flex-wrap:wrap;gap:12px}
.b19-field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);flex:1 1 320px}

.b19-inp{flex:1 1 auto;min-width:120px;border:1px solid var(--line);border-radius:8px;

.b19-inp:focus{border-color:var(--red);background:var(--panel)}
.b19-inp:disabled{opacity:.45;cursor:not-allowed}
.b19-days{flex:0 0 78px;min-width:78px;max-width:78px;text-align:center}

.b19-hint{font-size:12px;line-height:1.9;color:var(--sub);margin:10px 0 2px;word-break:break-all}

.b19-scope{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;
  padding-top:12px;border-top:1px dashed var(--line)}
.b19-lb{font-size:13px;color:var(--sub);margin-right:2px}
.b19-lb2{font-size:12px;color:var(--sub)}
.b19-radio{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);
  color:var(--sub);border-radius:16px;padding:4px 14px;font-size:13px;cursor:pointer;line-height:1.6}
.b19-radio:hover{border-color:var(--red);color:var(--accent);background:var(--red-soft)}
.b19-radio.on{border-color:var(--red);background:var(--red-soft);color:var(--accent);font-weight:700}
.b19-radio input{margin:0;cursor:pointer}

.b19-advline{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:12px;
  padding-top:12px;border-top:1px dashed var(--line)}
.b19-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
.b19-check input{margin:0;cursor:pointer}

/* ---- 按钮行 ---- */

  font-family:Consolas,Menlo,Monaco,'Courier New',monospace;white-space:pre}

.b19-uri{margin-top:10px;font-size:12.5px;line-height:1.9;color:var(--sub);word-break:break-all}
.b19-link{color:var(--blue);text-decoration:none;border-bottom:1px dashed var(--blue)}
.b19-link:hover{color:var(--accent);border-bottom-color:var(--accent)}

/* ---- 窄屏 ---- */

  .b19-field{flex:1 1 100%}
  .b19-cnt{margin-left:0;width:100%}
  .b19-md{min-height:260px}

<style>/* === _b26.css === */
/* =====================================================================
   第26批：平板 / iPad 适配 + 底部 Tab 栏（app 手感）
   - iPad 竖屏(~768) 与手机：隐藏左侧 nav，改用固定底部 Tab 栏 + 「更多」抽屉
   - 字号/触控目标放大，内容居中限宽，适配刘海/Home 指示区（安全区）
   - 桌面(>=901px)维持原侧栏，本文件不生效
   ===================================================================== */

/* ---------- 平板/手机基础排版 ---------- */
@media (max-width: 900px){
  body{ font-size: 16px; -webkit-text-size-adjust: 100%; }
  header{ padding: 12px 14px; }

  .layout{ display: block; max-width: 760px; margin: 0 auto; padding: 12px 12px 88px; gap: 0; }
  nav{ display: none !important; }
  main{ min-width: 0; }
  .card{ padding: 16px 16px; margin-bottom: 14px; border-radius: 12px; }
  .themeHead{ font-size: 18px; }
  .stem{ font-size: 15px; line-height: 1.9; }

  .more{ font-size: 15px; padding: 10px 30px; }
  .sk-grid{ grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }

  /* 标注工具条在平板更友好 */
  #annotBar{ bottom: calc(72px + env(safe-area-inset-bottom)); }
}

/* ---------- 底部 Tab 栏 ---------- */
#tabbar{
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
  height: calc(56px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(255,255,255,.96);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--line);
  box-shadow: 0 -2px 12px rgba(0,0,0,.08);
}
#tabbar .tab{
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 11px; color: var(--sub); cursor: pointer; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#tabbar .tab .ti{ font-size: 21px; line-height: 1; }
#tabbar .tab.on{ color: var(--accent); font-weight: 700; }
#tabbar .tab:active{ opacity: .6; }

/* ---------- 「更多」抽屉 ---------- */
#sheetMask{
  display: none; position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,.35);
}
#sheetMask.on{ display: block; }
#sheetPanel{
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 91;
  background: #fff; border-radius: 16px 16px 0 0;
  padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
  transform: translateY(110%); transition: transform .25s ease;
  max-height: 70vh; overflow: auto;
  box-shadow: 0 -6px 24px rgba(0,0,0,.18);
}
#sheetPanel.on{ transform: translateY(0); }
#sheetPanel .sheet-hd{
  display: flex; justify-content: space-between; align-items: center;
  font-size: 15px; font-weight: 700; color: var(--accent); padding: 6px 4px 12px;
}
#sheetPanel .sheet-hd .x{ font-size: 22px; color: var(--sub); cursor: pointer; padding: 0 8px; }
#sheetGrid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
#sheetGrid .si{
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 8px; text-align: center; font-size: 14px; color: var(--txt);
  cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: center;
}
#sheetGrid .si.on{ background: var(--red-soft); color: var(--accent); border-color: var(--red); font-weight: 700; }
#sheetGrid .si:active{ opacity: .7; }

/* 桌面隐藏移动件 */
@media (min-width: 901px){
  #tabbar, #sheetMask, #sheetPanel{ display: none !important; }
}

/* ---------- PWA 安装提示条 ---------- */
#pwaTip{
  display: none; position: fixed; left: 50%; top: 8px; transform: translateX(-50%);

  max-width: 92vw; text-align: center;

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hi(s,terms){let h=esc(s);if(!terms.length)return h;
  terms.forEach(t=>{if(!t)return;const r=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");h=h.replace(r,m=>"\x01"+m+"\x02");});
  return h.replace(/\x01/g,"<mark>").replace(/\x02/g,"</mark>");}

/* 省份标签：国考→"国考"，其余→"XX省考" */
function provLabelOf(p){const v=(p&&p.province)||"";return v==="国考"?"国考":(v?v+"省考":"");}
/* 当前作用域下的卷池（真题库=国考；省考库=全部非国考省份，可按 state.prov 收窄） */
function tikuPool(scope,useProv){
  if(scope!=="省考库")return DATA.papers.filter(p=>p.province==="国考");
  if(useProv!==false&&state.prov)return skPapersOf(state.prov);
  let out=[];skProvStats().forEach(x=>{out=out.concat(skPapersOf(x.prov));});
  return out;
}
function yearsFor(scope){
  if(scope==="真题库"||scope==="省考库")
    return[...new Set(tikuPool(scope).map(p=>p.year))].sort((a,b)=>b-a);
  return[...new Set(DATA.entries.map(e=>e.year))].sort();
}

}

function filtered(){
  const terms=state.q?state.q.split(/\s+/).filter(Boolean):[];
  let es=DATA.entries.filter(e=>
    (state.scope==="全部"||state.scope===e.lib)&&
    (state.year==="全部"||String(e.year)===state.year)&&
    (!state.theme||e.theme===state.theme));
  if(terms.length){
    es=es.filter(e=>{const blob=(e.theme+" "+e.title+" "+e.lines.join(" ")).toLowerCase();
      return terms.every(t=>blob.includes(t.toLowerCase()));});}
  return {es,terms};
}

function qBlob(q){

    q.orgs.map(o=>o.name+" "+o.lines.join(" ")).join(" "),
    q.points.map(p=>p.text).join(" "),q.review.join(" "),q.ai.join(" ")].join(" ").toLowerCase();
}

/* ---- 省考库：分包按需加载（skdata/sk_NN.js）+ 省份 → 卷列表 → 卷详情 三级 ---- */
window.SKDATA=window.SKDATA||{};
const skLoaded={};
function skIdx(){return DATA.skIndex||[];}
function skEntry(p){return skIdx().find(x=>x.prov===p);}
function skProvOfId(id){const m=/^SK_([^_]+)_/.exec(id||"");return m?m[1]:"";}
function qCount(p){return p&&p._meta?(p.nq||0):((p&&p.questions)?p.questions.length:0);}
function skMerge(prov){
  if(skLoaded[prov])return true;
  const arr=window.SKDATA[prov];if(!arr)return false;
  const have={};DATA.papers.forEach(p=>have[p.id]=1);
  arr.forEach(p=>{if(!have[p.id])DATA.papers.push(p);});
  skLoaded[prov]=true;return true;
}
/* 单文件版专用：省考卷以 gzip+base64 内联在 window.__SKZ，用时解压 */
function skUnzip(prov,cb){
  try{
    if(typeof DecompressionStream==="undefined"){cb&&cb(false);return;}
    const bin=Uint8Array.from(atob(window.__SKZ[prov]),c=>c.charCodeAt(0));
    new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip')))
      .text().then(function(t){
        window.SKDATA[prov]=JSON.parse(t);
        cb&&cb(skMerge(prov));
      }).catch(function(){cb&&cb(false);});
  }catch(e){cb&&cb(false);}
}
function loadSKProv(prov,cb){
  if(!prov){cb&&cb(true);return;}
  if(skLoaded[prov]){cb&&cb(true);return;}
  if(!skEntry(prov)){skLoaded[prov]=true;cb&&cb(true);return;}   // 内联省份（黑龙江）
  if(skMerge(prov)){cb&&cb(true);return;}
  if(window.__SKZ&&window.__SKZ[prov]){skUnzip(prov,cb);return;}
  const s=document.createElement('script');
  s.src="skdata/"+skEntry(prov).file;
  s.onload=function(){cb&&cb(skMerge(prov));};
  s.onerror=function(){cb&&cb(false);};
  document.head.appendChild(s);
}
function skBusy(msg){const b=document.getElementById('content');if(b)b.innerHTML='<div class="empty">'+esc(msg)+'</div>';}
function skFail(prov){
  const b=document.getElementById('content');if(!b)return;
  if(window.__SKZ){
    b.innerHTML='<div class="empty">未能解压「'+esc(prov)+'」省考数据包。<br><br>'+
      '单文件版把省考真题压缩内联，需要较新的浏览器（iPad 需 iOS 16.4 以上 / 安卓 Chrome 80 以上）。<br>'+
      '如果打不开，请改用 <b>求是素材库.html + skdata 文件夹</b> 的组合版，兼容性最好。</div>';
    return;
  }
  b.innerHTML='<div class="empty">未能加载「'+esc(prov)+'」省考数据包。<br><br>'+
    '省考真题体积较大，已拆到网页同目录的 <b>skdata</b> 文件夹按需加载。<br>'+
    '请确认 <b>skdata</b> 文件夹与本网页放在同一个目录里（拷贝到平板/其他电脑时要一起拷）。</div>';
}
function skProvStats(){
  const map={};
  DATA.papers.forEach(p=>{
    if(p.province==="国考")return;
    const e=map[p.province]=map[p.province]||{prov:p.province,n:0,nq:0,ys:[]};
    e.n++;e.nq+=p.questions.length;if(p.year)e.ys.push(p.year);
  });
  skIdx().forEach(x=>{
    if(skLoaded[x.prov])return;
    const e=map[x.prov]=map[x.prov]||{prov:x.prov,n:0,nq:0,ys:[]};
    e.n+=x.n;e.nq+=x.nq;if(x.y0)e.ys.push(x.y0,x.y1);
  });
  return Object.keys(map).map(k=>map[k]).sort((a,b)=>b.n-a.n||a.prov.localeCompare(b.prov,'zh'));
}
function skPapersOf(prov){
  const inl=DATA.papers.filter(p=>p.province===prov);
  const e=skEntry(prov);
  if(!e||skLoaded[prov])return inl;
  return e.papers.map(x=>({id:x.id,year:x.year,paper:x.paper,subject:x.subject,
                           province:prov,nq:x.nq,_meta:true}));
}
function pickProv(v){
  state.prov=v;state.paper="";state.year="全部";state.limit=120;
  if(!v||skLoaded[v]){render();scrollTo(0,0);return;}
  skBusy("正在加载「"+v+"」省考真题…");
  loadSKProv(v,function(ok){ok?(render(),scrollTo(0,0)):skFail(v);});
}
function pickPaper(id){
  const pv=skProvOfId(id);
  if(pv&&!skLoaded[pv]){
    skBusy("正在加载「"+pv+"」省考真题…");
    loadSKProv(pv,function(ok){
      if(!ok){skFail(pv);return;}
      state.prov=pv;state.paper=id;state.limit=120;render();scrollTo(0,0);});
    return;
  }
  state.paper=id;state.limit=120;render();scrollTo(0,0);
}
/* 错题本/学情里引用了某省的卷时，启动后自动把这些省的数据包预载回来 */
function preloadSKFromStorage(){
  const provs={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i)||"";
      let blob=k;
      if(k.indexOf("SK_")<0){const v=localStorage.getItem(k)||"";if(v.indexOf("SK_")<0)continue;blob=v;}
      const re=/SK_([^_"',\]\}\s]+)_/g;let m;
      while((m=re.exec(blob)))provs[m[1]]=1;
    }
  }catch(e){}
  Object.keys(provs).forEach(p=>{if(skEntry(p))loadSKProv(p,function(){});});
}

function renderPaperList(pool,terms){
  const rows=[];
  pool.forEach(p=>{
    let n=qCount(p);
    if(terms.length){
      const hit=p._meta?0:p.questions.filter(q=>terms.every(t=>qBlob(q).includes(t.toLowerCase()))).length;
      const pb=((p.subject||"")+" "+(p.paper||"")+" "+((p.materials||[]).join(" "))).toLowerCase();
      if(!hit&&!terms.every(t=>pb.includes(t.toLowerCase())))return;
      if(hit)n=hit;
    }
    rows.push({p,n});
  });
  rows.sort((a,b)=>b.p.year-a.p.year||String(a.p.province).localeCompare(String(b.p.province),'zh'));
  document.getElementById('stats').textContent=
    `${state.prov?state.prov+"省考":"全国省考"} · ${state.year==="全部"?"全部年份":state.year}${state.q?" · 搜索“"+state.q+"”":""} — ${rows.length} 套卷`;
  if(!rows.length){document.getElementById('content').innerHTML='<div class="empty">没有匹配试卷</div>';return;}
  let h='<table><tr><th>年份</th><th>省份</th><th>试卷</th><th>主题</th><th>题数</th></tr>';
  rows.slice(0,state.limit).forEach(({p,n})=>{

let annotColor="#1f2937", annotSize=3, annotErase=false, annotPid="";
function annotKey(pid){return "annot_v1_"+pid;}
function loadAnnot(pid){try{return JSON.parse(localStorage.getItem(annotKey(pid))||'{"strokes":[],"note":""}');}catch(e){return{strokes:[],note:""};}}
function saveAnnot(pid,o){try{localStorage.setItem(annotKey(pid),JSON.stringify(o));}catch(e){}}
function selSw(el,c){annotColor=c;annotErase=false;document.getElementById("abErase").classList.remove("on");
  document.querySelectorAll("#annotBar .sw").forEach(s=>s.classList.remove("on"));el.classList.add("on");}
function toggleAnnot(){

  t.textContent=on?"✏️ 退出标注":"✏️ 标注模式"; t.classList.toggle("on",on);
  if(on)initAnnotLayers();

function initAnnotLayers(){
  document.querySelectorAll(".paper-annot").forEach(w=>{
    const pid=w.dataset.pid, cv=w.querySelector("canvas.annot-canvas"); if(!cv)return;
    const ctx=cv.getContext("2d");
    const fit=()=>{const r=w.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
      cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);redrawAnnot(cv,pid);};
    if(cv._fit){cv._fit();}else{cv._fit=fit;fit();new ResizeObserver(fit).observe(w);}
    if(cv._bound)return;cv._bound=true;
    const ta=w.querySelector("textarea.annot-note");
    if(ta){ta.value=loadAnnot(pid).note||"";
      ta.addEventListener("input",()=>{const o=loadAnnot(pid);o.note=ta.value;saveAnnot(pid,o);});}
    let drawing=false,cur=null;
    cv.addEventListener("pointerdown",e=>{
      if(e.pointerType!=="pen"&&e.pointerType!=="mouse")return;
      e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
      annotPid=pid;const r=cv.getBoundingClientRect();
      cur={color:annotColor,size:annotSize,erase:annotErase,pts:[{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pressure>0?e.pressure:0.5}]};
      drawing=true;redrawAnnot(cv,pid);
    });
    cv.addEventListener("pointermove",e=>{
      if(!drawing)return;const r=cv.getBoundingClientRect();
      cur.pts.push({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pressure>0?e.pressure:0.5});
      redrawAnnot(cv,pid);
    });
    const end=()=>{if(!drawing)return;drawing=false;const o=loadAnnot(pid);o.strokes.push(cur);saveAnnot(pid,o);cur=null;};
    cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
    redrawAnnot(cv,pid);
  });
}
function redrawAnnot(cv,pid){const ctx=cv.getContext("2d");const r=cv.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);loadAnnot(pid).strokes.forEach(s=>drawStroke(ctx,s,r.width,r.height));}
function drawStroke(ctx,s,W,H){
  if(!s.pts||!s.pts.length)return;
  ctx.lineJoin="round";ctx.lineCap="round";
  ctx.globalCompositeOperation=s.erase?"destination-out":"source-over";
  ctx.strokeStyle=s.erase?"rgba(0,0,0,1)":s.color;
  if(s.pts.length===1){const p=s.pts[0],x=p.x*W,y=p.y*H,w=(s.size||3)*(p.p||0.5)+0.6;
    ctx.beginPath();ctx.arc(x,y,w/2,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill();return;}
  for(let i=1;i<s.pts.length;i++){const a=s.pts[i-1],b=s.pts[i];
    ctx.lineWidth=((s.size||3)*((a.p||0.5)+(b.p||0.5))/2)+0.6;
    ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke();}
  ctx.globalCompositeOperation="source-over";
}
function curCanvas(){return annotPid?document.querySelector('canvas.annot-canvas[data-pid="'+annotPid+'"]'):null;}
function annotUndo(){const cv=curCanvas();if(!cv)return;const o=loadAnnot(annotPid);o.strokes.pop();saveAnnot(annotPid,o);redrawAnnot(cv,annotPid);}
function annotClear(){const cv=curCanvas();if(!cv)return;if(!confirm("清空本卷所有笔迹？"))return;const o=loadAnnot(annotPid);o.strokes=[];saveAnnot(annotPid,o);redrawAnnot(cv,annotPid);}
function annotExportPNG(){const cv=curCanvas();if(!cv)return;const t=document.createElement("canvas");t.width=cv.width;t.height=cv.height;
  const c=t.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,t.width,t.height);c.drawImage(cv,0,0);
  const a=document.createElement("a");a.download=annotPid+"_笔迹.png";a.href=t.toDataURL("image/png");a.click();}
function annotExportJSON(){const all={};document.querySelectorAll(".paper-annot").forEach(w=>{all[w.dataset.pid]=loadAnnot(w.dataset.pid);});

  "审题偏题":   "未准确理解题意、作答对象或范围（答非所问）",
  "找点不全":   "材料要点遗漏，找点能力弱",
  "归纳整合弱": "照抄原文、未归并提炼、表达口语化",
  "结构混乱":   "逻辑顺序乱、缺条理层次",
  "分论点弱":   "大作文不会立分论点、分论点不扣题",
  "论证无力":   "有观点无论据、分析浮浅",
  "规范词缺乏": "表达不规范、未使用规范术语",
  "素材积累少": "案例/金句/数据积累不足"
};
const DIMS = ["概括","分析","对策","公文","作文"];
const SPACED = [0,1,2,4,7,15,30]; // 艾宾浩斯间隔(天)
const STOP = new Set(["可以","应该","我们","他们","这个","那个","以及","通过","由于","对于",
  "进行","问题","方面","需要","必须","一个","没有","这样","就是","因此","所以","但是","并且",
  "而且","如果","因为","为了","能够","实现","提供","建立","加强","完善","提高","在于","成为",
  "方面","工作","开展","推动","促进","发挥","作用","重要","不断","进一步","切实","有效"]);

/* ---------------- 存储层 ---------------- */
function loadAll(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; } }
function saveAll(o){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)); }catch(e){ console.warn("存储失败",e); } }
function recKey(pid,qno){ return pid+"#"+qno; }
function getRec(pid,qno){ return loadAll()[recKey(pid,qno)] || null; }
function setRec(pid,qno,rec){
  const a=loadAll();
  a[recKey(pid,qno)] = Object.assign({pid,qno,ts:Date.now()}, rec);
  saveAll(a);
}
function allRecs(){ return Object.values(loadAll()); }

/* ---------------- 工具：题型→维度 ---------------- */
function dimOf(qtype){
  if(!qtype) return null;
  if(/概括|归纳/.test(qtype)) return "概括";
  if(/分析/.test(qtype)) return "分析";
  if(/对策|建议|措施|做法/.test(qtype)) return "对策";
  if(/公文|应用文|信|通知|报告|请示|函|稿|简报|倡议/.test(qtype)) return "公文";
  if(/作文|议论|策论|文章/.test(qtype)) return "作文";
  return null;
}

/* ---------------- 评分引擎（离线规则） ---------------- */
function extractKeywords(text){
  const clean = (text||"").replace(/[^\u4e00-\u9fa5]/g,"");
  const set = new Set();
  for(let i=0;i<clean.length;i++){
    for(let L=2; L<=4 && i+L<=clean.length; L++){
      const w = clean.substr(i,L);
      if(!STOP.has(w)) set.add(w);
    }
  }
  return [...set];
}
function scoreAnswer(answer, q){
  const a = (answer||"").toLowerCase();
  const pts = q.points||[];
  const hits=[], missed=[];
  pts.forEach(pt=>{
    const kws = extractKeywords(pt.text);
    let matched=false;
    for(const kw of kws){ if(a.includes(kw)){ matched=true; break; } }
    (matched?hits:missed).push(pt);
  });
  const total = pts.length || 1;
  const rate = hits.length/total;
  const reasons = inferReasons(missed, q, answer, pts);
  return {
    hits, missed, rate, reasons,
    score: Math.round(rate*100),
    total: pts.length,
    hitCount: hits.length
  };
}
function inferReasons(missed, q, answer, pts){
  const r = new Set();
  const qtype = q.qtype||"";
  if(!missed.length) return r;
  if(missed.length >= Math.max(1, Math.ceil((pts.length||1)*0.6))) r.add("找点不全");
  if((answer||"").length > 600 && missed.length>0) r.add("归纳整合弱");
  if(/概括|归纳/.test(qtype) && missed.length) r.add("归纳整合弱");
  if(/作文|议论|策论/.test(qtype)){ r.add("分论点弱"); r.add("论证无力"); }
  if(/公文|应用文/.test(qtype)){ r.add("结构混乱"); }
  if(missed.some(p=>/规范|术语|表述|准确/.test(p.text))) r.add("规范词缺乏");
  if(missed.length>=2) r.add("规范词缺乏");
  if(/审题|对象|范围|针对/.test((q.stem||[]).join("")) && missed.length>=(pts.length||1)) r.add("审题偏题");
  if(missed.length>=3) r.add("素材积累少");
  return r;
}

/* ---------------- 跨卷聚合（学情分析核心） ---------------- */
function aggregate(){
  const recs = allRecs();
  const reasonCount = {};
  const byDim = {}; DIMS.forEach(d=>byDim[d]={hit:0,total:0});
  const trend = [];
  recs.forEach(rec=>{
    (rec.reasons||[]).forEach(r=> reasonCount[r]=(reasonCount[r]||0)+1 );
    const d = dimOf(rec.qtype);
    if(d){
      const total = rec.total||1;
      byDim[d].hit += Math.round((rec.rate||0)*total);
      byDim[d].total += total;
    }
    trend.push({ts:rec.ts, score:rec.score, pid:rec.pid, qno:rec.qno, qtype:rec.qtype});
  });
  const radar = DIMS.map(d=> byDim[d].total? Math.round(byDim[d].hit/byDim[d].total*100):0 );
  const avg = recs.length? Math.round(recs.reduce((s,r)=>s+(r.score||0),0)/recs.length):0;
  return {recs, reasonCount, byDim, radar, trend, total:recs.length, avg};
}

/* ---------------- 规范词自动注入 ---------------- */
function normHints(answer){
  const hints=[];
  const norms = (DATA.entries||[]).filter(e=>e.lib==="规范词库");
  norms.forEach(n=>{
    const title = n.title||"";
    (n.lines||[]).forEach(l=>{
      const m = l.match(/适用[：:]\s*(.+)/);
      if(!m) return;
      const scene = m[1].replace(/[，。、；,]/g,"");
      // 取场景里 2~3 字片段做触发
      for(let i=0;i<scene.length-1;i++){
        const frag = scene.substr(i,3);
        if(frag.length>=2 && answer.includes(frag) && !answer.includes(title) && title){
          hints.push({norm:title, scene:frag}); break;
        }
      }
    });
  });
  // 去重
  const seen=new Set(); const out=[];
  hints.forEach(h=>{ const k=h.norm; if(!seen.has(k)){seen.add(k); out.push(h);} });
  return out.slice(0,14);
}

/* ---------------- 间隔重做排期 ---------------- */
function duePlan(){
  const now = Date.now();
  const due=[];
  allRecs().forEach(rec=>{
    const last = rec.reviewTs || rec.ts;
    const reps = rec.reps||0;
    const interval = SPACED[Math.min(reps, SPACED.length-1)]*86400000;
    if(now-last >= interval) due.push(rec);
  });
  return due.sort((a,b)=>(a.reviewTs||a.ts)-(b.reviewTs||b.ts));
}
function markReviewed(pid,qno){
  const a=loadAll(); const k=recKey(pid,qno);
  if(a[k]){ a[k].reps=(a[k].reps||0)+1; a[k].reviewTs=Date.now(); saveAll(a); }
}

/* ---------------- 针对性推送 ---------------- */
function recommend(rec){
  const d = dimOf(rec.qtype);
  const picks=[];
  (DATA.papers||[]).forEach(p=>{
    (p.questions||[]).forEach(q=>{
      if(q.qtype===rec.qtype && p.id!==rec.pid){
        picks.push({pid:p.id, qno:q.no, paper:p.paper, year:p.year, qtype:q.qtype});
      }
    });
  });
  return picks.slice(0,6);
}

/* 找题 */
function findQ(pid,qno){
  const p=(DATA.papers||[]).find(x=>x.id===pid);
  if(!p) return null;
  const q=(p.questions||[]).find(x=>x.no===qno);
  return q?{p,q}:null;
}

function reqWords(stem){
  const t=(stem||[]).join(" ");
  const ms=t.match(/(\d{3,4})\s*字/g);
  if(!ms) return 0;
  let mx=0; ms.forEach(x=>{ const n=parseInt(x,10); if(n>mx) mx=n; });
  return mx;
}
function updateCount(ta, req){
  const n=ta.value.replace(/\s/g,"").length;
  let s="已写 "+n+" 字";
  if(req){
    const diff=req-n;
    s+= diff>=0 ? "（要求 ≤ "+req+" 字，还差 "+diff+" 字）" : "（已超出 "+(-diff)+" 字 ⚠）";
  }
  const el=document.getElementById("ansCount");
  if(el) el.textContent=s;
}
function closeAnswerModal(){
  const o=document.getElementById("ansOverlay");
  if(o) o.style.display="none";
}
function renderHints(text){
  const box=document.getElementById("ansHints");
  if(!box) return;
  const hints=normHints(text);
  if(!hints.length){ box.innerHTML=""; return; }
  box.innerHTML="<b>💡 规范词提示（你答案里疑似口语化处，可改为规范表达）：</b>"+
    hints.map(h=>`<span class="hint-chip">「${esc(h.scene)}」→ <b>${esc(h.norm)}</b></span>`).join("");
}
function saveDraft(pid,qno){
  const ta=document.getElementById("ansText");
  const prev=getRec(pid,qno)||{};
  setRec(pid,qno, Object.assign(prev,{text:ta.value, draft:true}, ansProcPayload()));
  flash("已暂存草稿");
}
function submitAnswer(pid,qno){
  const ta=document.getElementById("ansText");
  const f=findQ(pid,qno); if(!f) return;
  const text=ta.value.trim();
  if(text.length<10){ alert("作答内容太短，请先写出完整答案"); return; }
  const sc=scoreAnswer(text, f.q);
  setRec(pid,qno, {
    text, qtype:f.q.qtype, rate:sc.rate, score:sc.score,
    total:sc.total, hitCount:sc.hitCount,
    reasons:[...sc.reasons], missed:(sc.missed||[]).map(p=>p.text),
    hit:(sc.hits||[]).map(p=>p.text),
    ts: Date.now(),
    procTags: ansProcPayload().procTags,
    note: ansProcPayload().note,
    imgs: ansProcPayload().imgs
  });
  // 追加一版修订史（第三批模块，缺失时静默跳过）
  if(typeof window.saveRevision==="function"){
    try{ window.saveRevision(pid,qno,text,sc.score); }catch(e){ console.warn("修订史写入失败",e); }
  }
  renderReport(pid,qno, Object.assign({text},sc), false);
  // 刷新学情中心（若正在看）
  if(state.scope==="我的学情") renderStudyCenter();
}

function buildReco(ag){
  // 取最近一次有根因的作答作为薄弱代表
  const recs=allRecs().slice().sort((a,b)=>b.ts-a.ts);
  if(!recs.length) return '<div class="muted">暂无推荐</div>';
  const target=recs.find(r=>r.qtype)||recs[0];
  const picks=recommend(target);
  if(!picks.length) return '<div class="muted">题库暂无同类题可推送</div>';
  return `<div class="muted">基于薄弱题型「${esc(target.qtype)}」推荐同类真题练习：</div>`+
    picks.map(p=>`<div class="reco-item" onclick="gotoPaper('${p.pid}');openAnswerModal('${p.pid}',${p.qno})">
      <span>${esc(p.year+" "+p.paper+" 题"+p.qno)}</span><span class="tag gr">${esc(p.qtype)}</span></div>`).join("");
}
function gotoPaper(pid){
  // 跳到对应卷：切到真题库/省考库并定位
  const p=(DATA.papers||[]).find(x=>x.id===pid);
  if(!p) return;
  state.scope = p.province==="国考"?"真题库":"省考库";
  state.prov  = p.province==="国考"?"":p.province;
  state.year = String(p.year);
  state.paper = p.id;
  render();
}

  const weakDim = DIMS[ag.radar.indexOf(Math.min(...ag.radar))];
  const strongDim = DIMS[ag.radar.indexOf(Math.max(...ag.radar))];

    .slice(0,3).map(([r,c])=>`${r}(${c}次)`).join("、");

/* ---- 雷达图 ---- */
function drawRadar(cv, vals){
  if(!cv) return;
  const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-40;
  ctx.clearRect(0,0,W,H);
  const n=DIMS.length;
  const angs=DIMS.map((_,i)=>-Math.PI/2 + i*2*Math.PI/n);
  // 网格
  ctx.strokeStyle="#ddd"; ctx.fillStyle="#888"; ctx.font="12px sans-serif"; ctx.textAlign="center";
  for(let ring=1;ring<=4;ring++){
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const r=R*ring/4, x=cx+Math.cos(angs[i])*r, y=cy+Math.sin(angs[i])*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }
  DIMS.forEach((d,i)=>{
    const x=cx+Math.cos(angs[i])*R, y=cy+Math.sin(angs[i])*R;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillText(d, cx+Math.cos(angs[i])*(R+18), cy+Math.sin(angs[i])*(R+18)+4);
  });
  // 数据多边形
  ctx.beginPath();
  vals.forEach((v,i)=>{
    const r=R*Math.max(0,Math.min(100,v))/100;
    const x=cx+Math.cos(angs[i])*r, y=cy+Math.sin(angs[i])*r;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle="rgba(163,45,45,.25)"; ctx.strokeStyle="#A32D2D"; ctx.lineWidth=2;
  ctx.fill(); ctx.stroke();
  // 数值
  ctx.fillStyle="#A32D2D"; ctx.font="bold 11px sans-serif";
  vals.forEach((v,i)=>{
    const r=R*Math.max(0,Math.min(100,v))/100;
    ctx.fillText(v+"%", cx+Math.cos(angs[i])*r, cy+Math.sin(angs[i])*r-4);
  });
}

/* ---- 趋势折线 ---- */
function drawTrend(cv, trend){
  if(!cv) return;
  const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  if(trend.length<1){ ctx.fillStyle="#999"; ctx.font="13px sans-serif"; ctx.textAlign="center"; ctx.fillText("暂无数据",W/2,H/2); return; }
  const pad=36, x0=pad, y0=H-pad, x1=W-pad, y1=pad;
  // 轴
  ctx.strokeStyle="#ccc"; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); ctx.moveTo(x0,y0); ctx.lineTo(x0,y1); ctx.stroke();
  ctx.fillStyle="#999"; ctx.font="11px sans-serif";
  ctx.fillText("100%", 4, y1+4); ctx.fillText("0%", 14, y0);
  const N=trend.length;
  const px=i=> N===1? (x0+x1)/2 : x0+(x1-x0)*i/(N-1);
  const py=v=> y0-(y0-y1)*Math.max(0,Math.min(100,v))/100;
  // 线
  ctx.beginPath();
  trend.forEach((t,i)=>{ const x=px(i),y=py(t.score); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle="#185FA5"; ctx.lineWidth=2; ctx.stroke();
  // 点
  trend.forEach((t,i)=>{ const x=px(i),y=py(t.score);
    ctx.beginPath(); ctx.arc(x,y,3,0,2*Math.PI); ctx.fillStyle="#A32D2D"; ctx.fill(); });
  ctx.fillStyle="#666"; ctx.textAlign="center";
  ctx.fillText(N+" 次作答", (x0+x1)/2, H-8);
}

/* ---- 分论点诊断 ---- */
function diagFL(){
  const topic=(document.getElementById("flTopic").value||"").trim();
  const raw=(document.getElementById("flText").value||"");
  const points=raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const box=document.getElementById("flResult");
  if(!points.length){ box.innerHTML='<span class="muted">请先列出分论点</span>'; return; }
  const tips=[];
  if(!topic) tips.push("⚠ 未填主题：无法判断分论点是否扣题，建议先填材料中心话题。");
  let onTopic=0;
  points.forEach((p,i)=>{
    const ok = topic? (p.includes(topic.slice(0,2)) || p.includes(topic)) : true;
    if(ok) onTopic++;
    tips.push(`分论点${i+1}：${ok?"✅ 扣题":"⚠ 疑似未直接扣「"+topic+"」"} —— ${(p.length<8?"过短、需展开":p.length>40?"偏长、宜凝练":"长度合适")}`);
  });
  if(points.length<3) tips.push("⚠ 分论点偏少（大作文一般 3~4 个），论证展开空间不足。");
  if(onTopic===points.length && topic) tips.push("✅ 全部扣题，结构基础合格。");
  box.innerHTML=tips.map(t=>`<div class="fl-tip">${esc(t)}</div>`).join("");
}

/* ============ B 增强：LLM 深度批改（名师/阅卷人视角） ============ */
const LLM_KEY="shenlun_llm_cfg";
function loadLLM(){ try{return JSON.parse(localStorage.getItem(LLM_KEY))||{};}catch(e){return {};} }
function saveLLM(o){ try{localStorage.setItem(LLM_KEY,JSON.stringify(o));}catch(e){} }
function llmConfigUI(){
  const c=loadLLM();
  const base=prompt("LLM 接口地址（OpenAI 兼容，如 https://api.openai.com/v1、https://api.deepseek.com/v1）：", c.base||"https://api.openai.com/v1");
  if(base===null) return null;
  const key=prompt("API Key（仅存本机浏览器，请求直接发往厂商，不经任何第三方）：", c.key||"");
  if(key===null) return null;
  const model=prompt("模型名（如 gpt-4o-mini / deepseek-chat / qwen-max）：", c.model||"gpt-4o-mini");
  if(model===null) return null;
  const cfg={base:base.trim().replace(/\/$/,""), key:key.trim(), model:model.trim()};
  saveLLM(cfg); return cfg;
}
async function deepReview(pid,qno){
  let cfg=loadLLM();
  if(!cfg.base||!cfg.key||!cfg.model){ cfg=llmConfigUI(); if(!cfg) return; }
  const f=findQ(pid,qno); if(!f){ alert("未找到该题"); return; }
  const rec=getRec(pid,qno);
  if(!rec||!rec.text){ alert("请先在上方提交作答，再点深度批改。"); return; }
  const btn=document.getElementById("deepBtn"); if(btn) btn.disabled=true;
  let box=document.getElementById("deepBox");
  if(!box){ box=document.createElement("div"); box.id="deepBox"; box.className="ans-deep"; const r=document.getElementById("ansReport"); if(r) r.after(box); }
  box.innerHTML='<div class="rep-tip">⏳ 正在调用 LLM 生成名师视角批改（请求直连厂商，不经第三方）…</div>';
  const q=f.q;
  const stem=(q.stem||[]).join("\n");
  const points=(q.points||[]).map((p,i)=>(i+1)+". "+p.text).join("\n");
  const orgs=(q.orgs||[]).map(o=>"【"+o.name+"】\n"+o.lines.join("\n")).join("\n\n");
  const user=`【题型】${q.qtype||"未知"}\n【题干】\n${stem}\n\n【采分点（满分参照）】\n${points}\n\n【参考机构答案】\n${orgs||"（无）"}\n\n【考生作答】\n${rec.text}`;
  const sys=`你是资深申论阅卷专家与备考名师，熟悉国考/省考申论阅卷规则。请基于考生作答，从阅卷人视角做深度批改，严格按以下结构输出（用中文、条理清晰）：\n1. 逐句/逐段批注：指出哪句表达好、哪句偏题/啰嗦/空泛/不规范；\n2. 得分点与失分点：对照采分点列出命中与遗漏；\n3. 失分根因归类（从：审题偏题/找点不全/归纳整合弱/结构混乱/分论点弱/论证无力/规范词缺乏/素材积累少 中选，可多选）；\n4. 提升建议（针对性训练）：给出可立即执行的具体改法与本卷对应的练习方向。`;
  try{
    const resp=await fetch(cfg.base+"/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({model:cfg.model,messages:[{role:"system",content:sys},{role:"user",content:user}],temperature:0.3,max_tokens:1600})
    });
    if(!resp.ok) throw new Error("HTTP "+resp.status+" "+resp.statusText);
    const data=await resp.json();
    const txt=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||"（模型未返回内容）";
    box.innerHTML='<div class="rep-head">🎓 名师 / 阅卷人视角 · 深度批改</div><div class="deep-body">'+esc(txt).replace(/\n/g,"<br>")+'</div>';
    const a=loadAll(); const k=recKey(pid,qno);
    if(a[k]){ a[k].deep=txt; saveAll(a); flash("已保存名师批注，可随时在本题重看"); }
  }catch(e){
    box.innerHTML='<div class="rep-tip no">⚠ 调用失败：'+esc(e.message)+'<br>请检查：①接口地址/Key/模型是否正确 ②该厂商是否允许浏览器跨域(CORS)（OpenAI/DeepSeek/通义均支持；本地 Ollama 需开启 CORS）。</div>';
  }finally{ if(btn) btn.disabled=false; }
}

/* ============ PDF 精批卷导出 ============ */
function papersWithRecs(){
  const map={};
  allRecs().forEach(r=>{ if(!map[r.pid]){ const p=(DATA.papers||[]).find(x=>x.id===r.pid); if(p) map[r.pid]={pid:r.pid,label:p.year+" "+p.paper}; } });
  return Object.values(map);
}
function buildPaperPDF(pid){
  const p=(DATA.papers||[]).find(x=>x.id===pid); if(!p) return null;
  const recs=allRecs().filter(r=>r.pid===pid);
  if(!recs.length){ return null; }
  recs.sort((a,b)=>a.qno-b.qno);
  let html=`<div class="pdf-h1">${esc(p.year)} ${esc(p.province==="国考"?"国考":(p.province||"")+"省考")}申论 · 精批卷</div>`;
  if(p.materials&&p.materials.length){
    html+=`<div class="pdf-sec"><div class="pdf-h2">📜 给定资料</div>`+p.materials.map(m=>{
      const mm=m.match(/^(材料\s*\d+)[：:]\s*(.*)$/);
      return mm?`<div class="pdf-mat"><b>${esc(mm[1])}</b> ${esc(mm[2])}</div>`:`<div class="pdf-mat">${esc(m)}</div>`;
    }).join("")+`</div>`;
  }
  recs.forEach(r=>{
    const f=findQ(pid,r.qno); if(!f) return;
    const q=f.q; const sc=scoreAnswer(r.text,q);
    html+=`<div class="pdf-sec"><div class="pdf-h2">题${q.no}（${esc(q.qtype||"")}）· 命中率 ${sc.score}%</div>`;
    html+=`<div class="pdf-sub">题干</div><div class="pdf-p">${(q.stem||[]).map(esc).join("<br>")}</div>`;
    html+=`<div class="pdf-sub">我的作答</div><div class="pdf-p">${esc(r.text)}</div>`;
    const ann=loadAnnot(pid);
    if(ann&&ann.strokes&&ann.strokes.length){

/* ============ 异步数据引导 ============
 * 真题/会员/时评数据库在 gkdata/gk_all.js（defer）加载完成后才初始化，
 * 首屏框架（HTML+CSS+模块）先渲染，数据到达即填充，避免内联 10MB 阻塞首屏。
 * 单文件版会把 gkdata 内联到本脚本之前，window.__GK_DATA__ 已就绪，直接 boot()。 */
var __booted=false;
function boot(){
  if(__booted) return; __booted=true;
  if(!window.__GK_DATA__){
    var bc=document.getElementById('content');
    if(bc) bc.innerHTML='<div class="empty">⚠️ 申论数据库加载失败，请检查网络后重新打开。</div>';
    return;
  }
  DATA=window.__GK_DATA__;
  window.QS_ARTICLES=DATA.qsArticles||[];
  themeOrder=[...new Set((DATA.entries||[]).map(function(e){return e.theme;}))];
  init();
}
if(window.__GK_DATA__){ boot(); }
else{
  window.addEventListener('gkdata-ready', boot, {once:true});
  // 120ms 兜底：万一事件被错过但数据已就绪，立即 boot
  setTimeout(function(){ if(!__booted && window.__GK_DATA__) boot(); }, 120);
  // 20s 仍未就绪：提示网络慢，但继续等待（数据到达后事件会照常 boot，不误报失败）
  setTimeout(function(){
    var bc=document.getElementById('content');
    if(!__booted && bc && bc.innerHTML.indexOf('正在加载')>=0){
      bc.innerHTML='<div class="empty">⏳ 数据仍在加载（网络较慢）…若长时间无响应，请检查网络后刷新。</div>';
    }
  }, 20000);
}

<script>
/* === _b2.js === */
/* =====================================================================
   第二批功能：每日晨读打卡 + 主动背诵卡（间隔重复）  (_b2.js)
   依赖：全局 DATA / state / render() / esc() / hi()
   存储：localStorage（纯前端、离线可用、数据不出本机）
     shenlun_morning_v1  晨读打卡
     shenlun_recite_v1   背诵卡
   ===================================================================== */
(function(){
"use strict";

/* ---------------- 常量 ---------------- */
const MORNING_KEY = "shenlun_morning_v1";
const RECITE_KEY  = "shenlun_recite_v1";
const SPACED = [0,1,2,4,7,15,30];   // 间隔序列(天)
const MASTER_LVL = 5;               // 达到该等级视为已掌握(间隔≥15天)
const NEW_PER_DAY = 20;             // 单轮最多引入新卡
const SESSION_CAP = 60;             // 单轮卡片上限
const WEEK = ["日","一","二","三","四","五","六"];

/* ---------------- 存储层（读失败一律降级） ---------------- */
function readJSON(key){
  try{
    const o = JSON.parse(localStorage.getItem(key));
    return (o && typeof o === "object") ? o : {};
  }catch(e){ return {}; }
}
function writeJSON(key, obj){
  try{ localStorage.setItem(key, JSON.stringify(obj)); }
  catch(e){ console.warn("存储失败", e); }
}

/* ---------------- 日期工具 ---------------- */
function pad2(n){ return String(n).length<2 ? "0"+n : String(n); }
function dkey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function today(){ return dkey(new Date()); }
function parseKey(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function dayGap(a,b){
  const x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((y-x)/86400000);
}

/* ---------------- 确定性随机（同一天内容不变） ---------------- */
function seedFrom(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h>>>0;
}
function rng(seed){
  let s = seed>>>0;
  return function(){
    s = (s + 0x6D2B79F5)>>>0;
    let t = s;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}
function shuffleBy(arr, rand){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pickN(arr, n, rand){ return shuffleBy(arr, rand).slice(0, n); }

/* ---------------- 素材解析 ---------------- */
function cleanLine(l){ return String(l||"").replace(/^[-•>＞\s]+/, "").trim(); }
function splitParts(t){ return String(t).split(/[｜|]/).map(s=>s.trim()).filter(Boolean); }

function libEntries(lib){ return (DATA.entries||[]).filter(e=>e.lib===lib); }
function linePool(lib){
  const out = [];
  libEntries(lib).forEach(e=>{
    (e.lines||[]).forEach(l=>{
      const t = cleanLine(l);
      if(t.length >= 6) out.push({lib:lib, theme:e.theme, title:e.title, year:e.year, issue:e.issue, text:t});
    });
  });
  return out;
}
function allThemes(){ return [...new Set((DATA.entries||[]).map(e=>e.theme))]; }

/* 规范词：正文 ｜ 出处：… ｜ 适用：… */
function normParse(text){
  const ps = splitParts(text);
  let body = ps[0] || String(text), src = "", use = "";
  ps.slice(1).forEach(p=>{
    if(/^出处/.test(p)) src = p.replace(/^出处[：:]\s*/, "");
    else if(/^适用/.test(p)) use = p.replace(/^适用[：:]\s*/, "");
  });
  return {body:body, src:src, use:use};
}
/* 金句：原文 —— 出处 */
function quoteParse(text){
  const t = String(text);
  const i = t.indexOf("——");
  if(i > 0) return {body: t.slice(0,i).trim(), src: t.slice(i+2).trim()};
  const ps = splitParts(t);
  return {body: ps[0] || t, src: (ps[1]||"").replace(/^出处[：:]\s*/, "")};
}
/* 案例：案例：正文 ｜ 出处：… */
function caseParse(text){
  const ps = splitParts(text);
  let body = (ps[0] || String(text)).replace(/^案例[：:]\s*/, ""), src = "";
  ps.slice(1).forEach(p=>{ if(/^出处/.test(p)) src = p.replace(/^出处[：:]\s*/, ""); });
  return {body:body, src:src};
}

/* =====================================================================
   功能 A：每日晨读打卡
   ===================================================================== */
let monthOffset = 0;   // 日历月偏移
let planCache = null;  // 今日晨读清单缓存（供「加入背诵卡」按索引取用）

function morningState(){
  const raw = readJSON(MORNING_KEY);
  const rawDays = Array.isArray(raw.days) ? raw.days : [];
  const days = [...new Set(rawDays.filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s)))].sort();
  const streak = calcStreak(days);
  const best = Math.max(calcBest(days), Number(raw.best)||0, streak);
  return {days:days, streak:streak, best:best};
}
function calcStreak(days){
  if(!days.length) return 0;
  const set = new Set(days);
  const t = new Date();
  let cur = null;
  if(set.has(dkey(t))) cur = t;
  else { const y = new Date(t); y.setDate(y.getDate()-1); if(set.has(dkey(y))) cur = y; }
  if(!cur) return 0;                       // 断签：streak 归零（最长记录另存）
  let n = 0;
  const c = new Date(cur);
  while(set.has(dkey(c))){ n++; c.setDate(c.getDate()-1); }
  return n;
}
function calcBest(days){
  let best = 0, run = 0, prev = null;
  days.forEach(s=>{
    const d = parseKey(s); if(!d) return;
    run = (prev && dayGap(prev,d)===1) ? run+1 : 1;
    prev = d;
    if(run > best) best = run;
  });
  return best;
}
function checkIn(){
  const raw = morningState();
  const d = today();
  if(raw.days.indexOf(d) >= 0){ b2flash("今日已完成打卡 ✅"); return; }
  const days = raw.days.concat([d]).sort();
  writeJSON(MORNING_KEY, {v:1, days:days, best:Math.max(calcBest(days), raw.best), last:d});
  b2flash("打卡成功，坚持就是胜利 🌅");
  renderMorning();
}
function monthShift(n){ monthOffset += n; renderMorning(); }

/* 今日晨读清单（按日期确定性抽取） */
function morningPlan(day){
  const rand = rng(seedFrom("morning|"+day));
  return {
    day: day,
    norms:  pickN(linePool("规范词库"), 3, rand),
    quotes: pickN(linePool("金句库"),   3, rand),
    frame:  pickN(libEntries("框架库"), 1, rand)[0] || null,
    kase:   pickN(linePool("案例库"),   1, rand)[0] || null
  };
}

function calHTML(st){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth()+monthOffset, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const firstDow = new Date(y, m, 1).getDay();
  const total = new Date(y, m+1, 0).getDate();
  const set = new Set(st.days);
  const prefix = y+"-"+pad2(m+1);
  let cells = "";
  for(let i=0;i<firstDow;i++) cells += '<span class="b2-cell b2-blank"></span>';
  for(let d=1; d<=total; d++){
    const k = prefix+"-"+pad2(d);
    const cls = "b2-cell" + (set.has(k)?" b2-on":"") + (k===today()?" b2-today":"");
    cells += '<span class="'+cls+'" title="'+k+(set.has(k)?" 已打卡":"")+'">'+d+'</span>';
  }
  const monthCount = st.days.filter(k=>k.indexOf(prefix)===0).length;
  return `<div class="b2-calbar">
      <button class="b2-nav" onclick="b2MonthShift(-1)">‹</button>
      <b>${y} 年 ${m+1} 月</b>
      <span class="b2-dim">本月打卡 ${monthCount} 天</span>
      <button class="b2-nav" onclick="b2MonthShift(1)">›</button>
    </div>
    <div class="b2-cal">${WEEK.map(w=>'<span class="b2-wk">'+w+'</span>').join("")}${cells}</div>`;
}

function normItemHTML(x, i){
  const p = normParse(x.text);
  const sub = [p.use?("适用："+p.use):"", x.theme, p.src].filter(Boolean).join(" · ");
  return `<div class="b2-item">
    <div class="b2-it-main">${esc(p.body)}</div>
    <div class="b2-it-sub">${esc(sub)}</div>
    <div class="b2-it-act"><span class="b2-mini" onclick="b2AddFromPlan('norm',${i})">＋ 加入背诵卡</span></div>
  </div>`;
}
function quoteItemHTML(x, i){
  const p = quoteParse(x.text);
  const sub = [x.theme, p.src||x.title].filter(Boolean).join(" · ");
  return `<div class="b2-item">

/* 从今日清单加入背诵卡 */
function addFromPlan(kind, i){
  if(!planCache) return;
  const arr = kind==="norm" ? planCache.norms : planCache.quotes;
  const item = arr[i];
  if(!item) return;

}

/* =====================================================================
   功能 B：主动背诵卡（间隔重复）
   ===================================================================== */
let sess = null;   // 当前背诵轮次

function reciteState(){
  const raw = readJSON(RECITE_KEY);
  const src = (raw.cards && typeof raw.cards === "object") ? raw.cards : {};
  const cards = {};
  Object.keys(src).forEach(k=>{
    const c = src[k];
    if(c && typeof c === "object" && c.back) cards[k] = c;
  });
  return {cards:cards, log: Array.isArray(raw.log) ? raw.log : []};
}
function saveRecite(s){
  writeJSON(RECITE_KEY, {v:1, cards:s.cards, log:(s.log||[]).slice(-60)});
}
function hashStr(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h<<5) + h + s.charCodeAt(i))>>>0;
  return h;
}
function firstHalf(s){
  const m = /^[^，,；;。！？!?]{4,}[，,；;]/.exec(s);
  if(m && m[0].length < s.length) return m[0]+"……";
  const n = Math.max(6, Math.ceil(s.length/3));
  return s.length > n ? s.slice(0,n)+"……" : s;
}
/* 由素材条目构造卡片（正面提示 / 背面全文） */
function buildCard(lib, item){
  if(lib === "规范词库"){
    const p = normParse(item.text);
    return {
      id: "n"+hashStr(p.body).toString(36), lib:lib,
      theme: item.theme||"", title: item.title||"",
      front: p.use ? ("适用场景：" + p.use) : ("所属母题：" + (item.theme||"")),
      hint: item.theme||"", back: p.body, src: p.src||""
    };
  }
  const p = quoteParse(item.text);
  return {
    id: "q"+hashStr(p.body).toString(36), lib:lib,
    theme: item.theme||"", title: item.title||"",
    front: firstHalf(p.body), hint: item.theme||"",
    back: p.body, src: p.src || item.title || ""
  };
}
function addCard(lib, item){
  const s = reciteState();
  const c = buildCard(lib, item);
  if(s.cards[c.id]) return false;
  c.lvl = 0; c.reps = 0; c.lapses = 0;
  c.added = Date.now(); c.due = Date.now(); c.last = 0;
  s.cards[c.id] = c;
  saveRecite(s);
  return true;
}
/* 供主程序在素材库任意条目上调用 */
function addCardByText(lib, text, theme, title){
  if(lib!=="规范词库" && lib!=="金句库"){ b2flash("仅支持规范词 / 金句加入背诵卡"); return false; }
  const t = cleanLine(text);
  if(t.length < 4) return false;
  const ok = addCard(lib, {lib:lib, text:t, theme:theme||"", title:title||""});
  b2flash(ok ? "已加入背诵卡 ✅" : "该内容已在背诵卡中");
  return ok;
}

function bucket(){
  const s = reciteState();
  const now = Date.now();
  const all = Object.keys(s.cards).map(k=>s.cards[k]);
  const fresh = all.filter(c=>!(c.reps||0));
  const due = all.filter(c=>(c.reps||0)>0 && (c.due||0)<=now && (c.lvl||0)<MASTER_LVL);
  const mastered = all.filter(c=>(c.lvl||0)>=MASTER_LVL);
  const resting = all.filter(c=>(c.reps||0)>0 && (c.due||0)>now && (c.lvl||0)<MASTER_LVL);
  return {all:all, fresh:fresh, due:due, mastered:mastered, resting:resting, state:s};
}
function startSession(){
  const b = bucket();
  const due = b.due.slice().sort((x,y)=>(x.due||0)-(y.due||0));
  const ids = due.concat(b.fresh.slice(0, NEW_PER_DAY)).slice(0, SESSION_CAP).map(c=>c.id);
  if(!ids.length){
    alert("今日没有待背的卡片。可在下方「批量导入」添加新卡，或明天再来复习。");
    return;
  }
  sess = {ids:ids, i:0, flip:false, f:0, v:0, r:0, start:Date.now(), logged:false};
  renderRecite();
}
function flipCard(){ if(sess){ sess.flip = true; renderRecite(); } }
function gradeCard(g){
  if(!sess) return;
  const s = reciteState();
  const id = sess.ids[sess.i];
  const c = s.cards[id];
  if(c){
    const lvl = Math.max(0, Math.min(SPACED.length-1, c.lvl||0));
    let nl = lvl;
    if(g === 0){ nl = 0; c.lapses = (c.lapses||0)+1; }        // 忘记：回到第一级
    else if(g === 2){ nl = Math.min(SPACED.length-1, lvl+1); } // 记住：进阶
    // 模糊：原地重复，等级不变
    c.lvl = nl;
    c.reps = (c.reps||0)+1;
    c.last = Date.now();
    c.due = Date.now() + SPACED[nl]*86400000;
    s.cards[id] = c;
    saveRecite(s);
  }
  if(g === 0) sess.f++; else if(g === 1) sess.v++; else sess.r++;
  sess.i++; sess.flip = false;
  renderRecite();
}
function endSession(){ sess = null; renderRecite(); }
function dropCard(){
  if(!sess) return;
  const id = sess.ids[sess.i];
  if(!confirm("确定从背诵卡中移除这张卡片？")) return;
  const s = reciteState();
  delete s.cards[id];
  saveRecite(s);
  sess.ids.splice(sess.i, 1);
  sess.flip = false;
  b2flash("已移除该卡片");
  renderRecite();
}
function importBatch(){
  const libEl = document.getElementById("b2Lib");
  const thEl  = document.getElementById("b2Theme");
  const numEl = document.getElementById("b2Num");
  if(!libEl || !thEl || !numEl) return;
  const lib = libEl.value;
  const theme = thEl.value;
  const n = Math.max(1, Math.min(300, parseInt(numEl.value, 10) || 20));
  let pool = linePool(lib);
  if(theme && theme !== "全部") pool = pool.filter(x=>x.theme === theme);
  if(!pool.length){ alert("该范围内没有可导入的素材。"); return; }
  const s = reciteState();
  const order = shuffleBy(pool, rng(seedFrom("import|"+lib+"|"+theme+"|"+Date.now())));
  let added = 0;
  for(let i=0; i<order.length && added<n; i++){
    const c = buildCard(lib, order[i]);
    if(s.cards[c.id]) continue;
    c.lvl = 0; c.reps = 0; c.lapses = 0;
    c.added = Date.now(); c.due = Date.now(); c.last = 0;
    s.cards[c.id] = c;
    added++;
  }
  saveRecite(s);
  b2flash(added ? ("已导入 "+added+" 张新卡") : "该范围内的素材均已导入");
  renderRecite();
}
function clearCards(){
  if(!confirm("将清空全部背诵卡及其复习进度，且无法恢复。确定继续？")) return;
  if(!confirm("再次确认：确定清空全部背诵卡？")) return;
  writeJSON(RECITE_KEY, {v:1, cards:{}, log:[]});
  sess = null;
  b2flash("已清空全部背诵卡");
  renderRecite();
}

function fmtDue(ts){
  const now = Date.now();
  if(!ts || ts <= now) return "待复习";
  const d = Math.ceil((ts-now)/86400000);
  return d <= 1 ? "明天" : (d + " 天后");
}
function cardRowHTML(c){
  const lvl = Math.max(0, Math.min(SPACED.length-1, c.lvl||0));
  const badge = (c.reps||0) ? ("L"+lvl+" · 间隔 "+SPACED[lvl]+" 天") : "新卡";

    <span class="b2-rt">${esc(c.back)}</span>
    <span class="b2-rb">${esc(badge)}</span>
    <span class="b2-rd">${esc(fmtDue(c.due))}</span>
  </div>`;
}

function dashHTML(){

    const rows = arr.slice().sort((x,y)=>(x.due||0)-(y.due||0)).slice(0,120).map(cardRowHTML).join("");
    const more = arr.length>120 ? '<div class="b2-dim">仅显示前 120 张，共 '+arr.length+' 张</div>' : "";
    return rows + more;
  };
  const logRows = b.state.log.slice(-8).reverse().map(function(x){
    return '<div class="b2-row"><span class="b2-rt">'+new Date(x.ts).toLocaleString()+
      '</span><span class="b2-rb">过卡 '+(x.n||0)+' 张</span><span class="b2-rd">记住 '+(x.r||0)+' · 模糊 '+(x.v||0)+' · 忘记 '+(x.f||0)+'</span></div>';

  return `<div class="b2-wrap" id="b2rTop">

    <div class="b2-card">
      <div class="b2-stats">
        <div class="b2-stat"><b class="b2-hot">${b.due.length}</b><span>今日待复习</span></div>
        <div class="b2-stat"><b>${b.fresh.length}</b><span>新卡未学</span></div>
        <div class="b2-stat"><b class="b2-ok">${b.mastered.length}</b><span>已掌握</span></div>
        <div class="b2-stat"><b>${b.all.length}</b><span>卡片总量</span></div>
      </div>
      <div class="b2-actbar">
        <button class="b2-btn b2-primary" onclick="b2StartSession()">▶ 开始今日背诵</button>
        <span class="b2-dim">本轮最多 ${SESSION_CAP} 张（待复习优先，新卡每轮至多 ${NEW_PER_DAY} 张）；间隔序列 ${SPACED.join("/")} 天。</span>
      </div>
    </div>

    <div class="b2-card">
      <div class="b2-title">📥 批量导入</div>
      <div class="b2-form">
        <select id="b2Lib" class="b2-sel">
          <option value="规范词库">规范词库</option>
          <option value="金句库">金句库</option>
        </select>
        <select id="b2Theme" class="b2-sel">${themeOpts}</select>
        <input id="b2Num" class="b2-num" type="number" min="1" max="300" value="20">
        <button class="b2-btn" onclick="b2Import()">导入为背诵卡</button>
        <span class="b2-dim">已存在的条目自动跳过，不会重复导入。</span>
      </div>
    </div>

    <div class="b2-card">
      <div class="b2-title">🗂 卡片清单</div>
      <details class="b2-det"><summary>规范词卡（${norms.length} 张）</summary><div class="b2-rows">${listHTML(norms,"规范词")}</div></details>
      <details class="b2-det"><summary>金句卡（${quotes.length} 张）</summary><div class="b2-rows">${listHTML(quotes,"金句")}</div></details>
      ${logRows ? '<details class="b2-det"><summary>最近背诵记录</summary><div class="b2-rows">'+logRows+'</div></details>' : ""}
      <div class="b2-actbar">
        <button class="b2-btn b2-danger" onclick="b2ClearCards()">清空全部背诵卡</button>
        <span class="b2-dim">数据仅存本机浏览器（localStorage），离线可用、不出本机。</span>
      </div>
    </div>
  </div>`;
}

function cardHTML(){
  const s = reciteState();
  const id = sess.ids[sess.i];
  const c = s.cards[id];
  if(!c){ sess.i++; return sess.i >= sess.ids.length ? summaryHTML() : cardHTML(); }
  const n = sess.ids.length;
  const pos = sess.i + 1;
  const pct = Math.round(sess.i / n * 100);
  const lvl = Math.max(0, Math.min(SPACED.length-1, c.lvl||0));
  const meta = [c.lib, c.theme, (c.reps||0)?("L"+lvl+" · 已复习 "+c.reps+" 次"):"新卡"].filter(Boolean).join(" · ");

  const faceBack = `<div class="b2-face b2-back">
      <div class="b2-btext">${esc(c.back)}</div>
      ${c.src ? '<div class="b2-bsrc">'+esc(c.src)+'</div>' : ""}
    </div>
    <div class="b2-grade">
      <button class="b2-gb b2-g0" onclick="b2Grade(0)">忘记<span>回到第一级</span></button>
      <button class="b2-gb b2-g1" onclick="b2Grade(1)">模糊<span>原地重复</span></button>
      <button class="b2-gb b2-g2" onclick="b2Grade(2)">记住<span>${SPACED[Math.min(SPACED.length-1, lvl+1)]} 天后再见</span></button>
    </div>`;
  const faceFront = `<div class="b2-face b2-front">
      <div class="b2-ftip">${esc(c.front)}</div>
      <div class="b2-fhint">${esc(c.hint||"")}</div>
    </div>
    <div class="b2-actbar b2-center">
      <button class="b2-btn b2-primary" onclick="b2Flip()">显示答案</button>
    </div>`;

  return `<div class="b2-wrap">
    <div class="b2-sesbar">
      <b>🧠 今日背诵</b>
      <span class="b2-dim">第 ${pos} / ${n} 张</span>
      <span class="b2-prog"><span class="b2-progf" style="width:${pct}%"></span></span>
      <span class="b2-dim">记住 ${sess.r} · 模糊 ${sess.v} · 忘记 ${sess.f}</span>
      <button class="b2-btn b2-mini2" onclick="b2EndSession()">结束本轮</button>
    </div>
    <div class="b2-card b2-cardface">
      <div class="b2-cmeta">${esc(meta)}</div>
      ${sess.flip ? faceBack : faceFront}
      <div class="b2-cfoot"><span class="b2-mini" onclick="b2DropCard()">移除此卡</span></div>
    </div>
  </div>`;
}

function summaryHTML(){
  const n = sess.f + sess.v + sess.r;
  if(!sess.logged){
    sess.logged = true;
    const s = reciteState();
    s.log = (s.log||[]).concat([{ts:Date.now(), n:n, f:sess.f, v:sess.v, r:sess.r}]);
    saveRecite(s);
  }
  const mins = Math.max(1, Math.round((Date.now()-sess.start)/60000));
  const rate = n ? Math.round(sess.r/n*100) : 0;
  const b = bucket();
  return `<div class="b2-wrap">
    <h2 class="b2-h2">🏁 本轮小结</h2>
    <div class="b2-card">
      <div class="b2-stats">
        <div class="b2-stat"><b>${n}</b><span>本轮过卡</span></div>
        <div class="b2-stat"><b class="b2-ok">${sess.r}</b><span>记住</span></div>
        <div class="b2-stat"><b>${sess.v}</b><span>模糊</span></div>
        <div class="b2-stat"><b class="b2-hot">${sess.f}</b><span>忘记</span></div>
      </div>
      <div class="b2-sum">
        本轮用时约 <b>${mins}</b> 分钟，掌握率 <b>${rate}%</b>。
        剩余待复习 <b>${b.due.length}</b> 张，未学新卡 <b>${b.fresh.length}</b> 张，已掌握 <b>${b.mastered.length}</b> 张。
        ${sess.f ? "「忘记」的卡片已回到第一级，稍后会再次出现。" : "本轮无遗忘，状态很好。"}
      </div>
      <div class="b2-actbar">
        <button class="b2-btn b2-primary" onclick="b2EndSession();b2StartSession()">再来一轮</button>
        <button class="b2-btn" onclick="b2EndSession()">返回背诵卡主页</button>
      </div>
    </div>
  </div>`;
}

function renderRecite(){
  const box = document.getElementById("content");
  if(!box) return;
  sideNav("背诵卡", [{id:"b2rTop", label:"🧠 背诵卡主页"}]);
  if(sess){
    if(sess.i >= sess.ids.length){
      setStats("背诵卡 · 本轮小结");
      box.innerHTML = summaryHTML();
    }else{
      setStats(`背诵卡 · 进行中 ${sess.i+1}/${sess.ids.length} 张`);
      box.innerHTML = cardHTML();
    }
    return;
  }
  const b = bucket();
  setStats(`背诵卡 — 待复习 ${b.due.length} 张 · 新卡 ${b.fresh.length} 张 · 已掌握 ${b.mastered.length} 张 · 共 ${b.all.length} 张`);
  box.innerHTML = dashHTML();
}

/* ---------------- 通用小工具 ---------------- */
function setStats(t){
  const el = document.getElementById("stats");
  if(el) el.textContent = t;
}
function sideNav(title, items){
  const nav = document.getElementById("nav");
  if(!nav) return;
  let h = "<h3>"+esc(title)+"</h3>";
  items.forEach(it=>{
    h += `<div class="tlink" onclick="var t=document.getElementById('${it.id}');if(t)t.scrollIntoView({behavior:'smooth'})"><span>${esc(it.label)}</span></div>`;
  });
  nav.innerHTML = h;
}
function b2flash(msg){
  let t = document.getElementById("b2Flash");
  if(!t){
    t = document.createElement("div");
    t.id = "b2Flash";
    t.className = "b2-flash";
    document.body.appendChild(t);

/* 返回操作序列 [{t:"="|"-"|"+", v}]，a=旧，b=新 */
function diffSeq(a, b){
  const n = a.length, m = b.length;
  if(n === 0 && m === 0) return [];
  if(n === 0) return b.map(function(v){ return {t:"+", v:v}; });
  if(m === 0) return a.map(function(v){ return {t:"-", v:v}; });
  if(n * m > 600000){
    /* 超长文本降级：整段替换，避免卡死 */
    return a.map(function(v){ return {t:"-", v:v}; }).concat(b.map(function(v){ return {t:"+", v:v}; }));
  }
  const dp = new Uint32Array((n+1) * (m+1));
  const W = m + 1;
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i*W+j] = (a[i] === b[j]) ? dp[(i+1)*W+(j+1)] + 1
                                  : Math.max(dp[(i+1)*W+j], dp[i*W+(j+1)]);
    }
  }
  const ops = [];
  let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] === b[j]){ ops.push({t:"=", v:a[i]}); i++; j++; }
    else if(dp[(i+1)*W+j] >= dp[i*W+(j+1)]){ ops.push({t:"-", v:a[i]}); i++; }
    else { ops.push({t:"+", v:b[j]}); j++; }
  }
  while(i < n){ ops.push({t:"-", v:a[i]}); i++; }
  while(j < m){ ops.push({t:"+", v:b[j]}); j++; }
  return ops;
}
/* 逐字差异：返回 {left, right, add, del} */
function charDiff(oldS, newS){
  const A = String(oldS||"").split("");
  const B = String(newS||"").split("");
  const ops = diffSeq(A, B);
  let left = "", right = "", add = 0, del = 0;
  let buf = "", mode = "";
  function flush(){
    if(!buf) return;
    if(mode === "="){ const h = E(buf); left += h; right += h; }
    else if(mode === "-"){ left += '<del class="b3-del">' + E(buf) + "</del>"; del += buf.length; }
    else { right += '<ins class="b3-ins">' + E(buf) + "</ins>"; add += buf.length; }
    buf = "";
  }
  ops.forEach(function(o){
    if(o.t !== mode){ flush(); mode = o.t; }
    buf += o.v;
  });
  flush();
  return {left:left, right:right, add:add, del:del};
}

function topicTerms(p, q){
  const terms = [];

  const blob = [ (p && p.subject) || "", ((q && q.stem)||[]).join(" "),
                 ((q && q.ai)||[]).slice(0,6).join(" ") ].join(" ");
  const clean = blob.replace(/[^\u4e00-\u9fa5]/g, " ");
  const freq = {};
  clean.split(/\s+/).forEach(function(seg){
    if(seg.length < 2) return;
    for(let i=0;i<seg.length;i++){
      for(let L=2; L<=4 && i+L<=seg.length; L++){
        const w = seg.substr(i, L);

  });
  const cand = Object.keys(freq)
    .filter(function(w){ return freq[w] >= 2; })
    .sort(function(x, y){ return (freq[y]*y.length) - (freq[x]*x.length); })
    .slice(0, 12);
  cand.forEach(function(w){ if(terms.indexOf(w) < 0) terms.push(w); });
  return terms;
}

  (typeof DATA !== "undefined" ? (DATA.entries||[]) : []).forEach(function(e){

      .filter(function(e){ return e.lib === lib; }).slice(0, limit);
