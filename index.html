<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求是申论素材库</title>
<meta name="theme-color" content="#c0392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="求是申论">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e5e7eb; --txt:#1f2937; --sub:#6b7280;
  --red:#c0392b; --red-soft:#fdf0ee; --accent:#8e2f22; --hl:#ffe9a8;
  --blue:#1d4ed8; --blue-soft:#eef2ff; --green:#15803d; --green-soft:#ecfdf5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#a93226,#c0392b);color:#fff;padding:14px 22px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:19px;font-weight:700;display:inline-block;margin-right:14px}
header .meta{font-size:12px;opacity:.85}
.searchbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:260px;max-width:560px;padding:9px 14px;border:none;border-radius:8px;font-size:14px;outline:none}
.scopes{display:flex;gap:4px;flex-wrap:wrap}
.scopes button,.yearchips button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer}
.scopes button.core{border-color:#fff;background:rgba(255,255,255,.20);font-weight:700}
.scopes button.on{background:#fff;color:var(--accent);font-weight:700;border-color:#fff}
.scopes button.moreBtn{background:#fff;color:var(--accent);font-weight:700;border-color:#fff}
.morePanel{display:flex;flex-wrap:wrap;gap:4px;width:100%;margin-top:6px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.5)}
.scopes button.trashBtn{background:rgba(255,120,120,.18);border-color:rgba(255,120,120,.6);color:#ffd9d9}
.scopes button.trashBtn.open{background:rgba(255,120,120,.34)}
.trashPanel{background:rgba(70,20,20,.30);border-top-color:rgba(255,120,120,.5)}
.scopes button.hideTrashBtn{font-size:11px;color:#ffbcbc;border:1px dashed rgba(255,120,120,.6);background:transparent;margin:6px 0 2px;padding:4px 8px;border-radius:10px;cursor:pointer;width:100%}
.scopes button.showTrashBtn{font-size:11px;color:#ffd9d9;border:1px dashed rgba(255,120,120,.5);background:transparent;margin:4px 0 0;padding:3px 8px;border-radius:10px;cursor:pointer}
.toprow{display:flex;align-items:center;gap:10px}
#collapseTop{margin-left:auto;font-size:12px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
header.collapsed #searchbar{display:none}
.scopes button.on,.yearchips button.on{background:#fff;color:var(--red);font-weight:700;border-color:#fff}
.layout{display:flex;max-width:1400px;margin:0 auto;gap:16px;padding:16px 22px}
nav{width:250px;flex-shrink:0;position:sticky;top:118px;align-self:flex-start;max-height:calc(100vh - 135px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
nav h3{font-size:12px;color:var(--sub);margin:10px 0 6px;letter-spacing:1px}
nav .tlink{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
nav .tlink:hover{background:var(--red-soft)}
nav .tlink.on{background:var(--red-soft);color:var(--accent);font-weight:700}
nav .tlink .n{color:var(--sub);font-size:11px}
main{flex:1;min-width:0}
.stats{color:var(--sub);font-size:12px;margin:2px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.card .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--red-soft);color:var(--accent);white-space:nowrap}
.tag.lib{background:var(--blue-soft);color:#4338ca}
.tag.gr{background:var(--green-soft);color:var(--green)}
.card .hd b{font-size:14.5px}
.card .bd div{padding:4px 0;border-bottom:1px dashed #f0f0f0;line-height:1.75;word-break:break-all}
.card .bd div:last-child{border-bottom:none}
mark{background:var(--hl);padding:0 2px;border-radius:2px}
.themeHead{font-size:16px;font-weight:700;color:var(--accent);margin:18px 0 10px;padding-left:10px;border-left:4px solid var(--red)}
.subj{font-size:12.5px;color:var(--sub);margin:-6px 0 10px 14px;line-height:1.6}
.more{display:block;margin:14px auto;padding:8px 26px;border:1px solid var(--line);background:var(--panel);border-radius:20px;cursor:pointer;color:var(--accent);font-size:13px}
.more:hover{background:var(--red-soft)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:#faf5f4;color:var(--accent);white-space:nowrap}
td a{color:var(--blue);text-decoration:none}
td a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--sub);padding:60px 0}
#top{position:fixed;right:26px;bottom:26px;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.25);display:none}
/* 真题库 */
.stem{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.8;margin-bottom:10px;white-space:pre-wrap}
details{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#fff}
summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--accent);font-weight:600;user-select:none}
details[open] summary{border-bottom:1px solid var(--line)}
details .inner{padding:8px 14px;line-height:1.8}
details .inner div{padding:3px 0;border-bottom:1px dashed #f0f0f0;word-break:break-all}
details .inner div:last-child{border-bottom:none}
details .orgname{font-weight:700;color:#4338ca;background:var(--blue-soft);display:inline-block;padding:1px 10px;border-radius:10px;font-size:12px;margin-top:8px;border-bottom:none!important}
details.ai{border-color:#f0c9c2;background:#fffdf8}
details.ai summary{color:var(--red)}
details.meth{border-color:#dbeafe;background:#f8fbff}
details.meth summary{color:var(--blue)}
.mat-h{font-weight:700;color:var(--accent);margin:10px 0 2px;font-size:14px}
.ptbox{border:1px solid #f0c9c2;background:#fffafa;border-radius:8px;padding:10px 14px;margin:8px 0}
.ptbox .pth{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ptbox .pth b{font-size:13px;color:var(--accent)}
.scoreband{font-size:12px;color:var(--sub)}
.scoreband b{color:var(--green)}
.pt{display:flex;gap:8px;align-items:flex-start;padding:4px 0;line-height:1.7}
.pt input{margin-top:5px;accent-color:var(--red);cursor:pointer}
.pt .pl{cursor:pointer}
.pt .tg{font-size:10.5px;padding:0 6px;border-radius:8px;white-space:nowrap;margin-right:4px}
.tg.core{background:var(--red-soft);color:var(--accent)}
.tg.flex{background:#fff7ed;color:#c2410c}
.tg.fmt{background:var(--blue-soft);color:#4338ca}
.pt input:checked ~ .pl{color:var(--green)}
.review{background:var(--green-soft);border:1px solid #bbe7cd;border-radius:8px;padding:8px 12px;margin:8px 0;line-height:1.8;font-size:13px}
.qsplit{border-top:2px solid var(--red-soft);margin:16px -18px 14px;padding-top:2px}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--red-soft);color:var(--accent);white-space:nowrap}
/* 省考库 · 省份总览卡 */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sk-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.15s}
.sk-card:hover{border-color:var(--red);background:var(--red-soft);transform:translateY(-1px)}
.sk-card b{font-size:15px;color:var(--accent)}
.sk-card .sk-m{font-size:12px;color:var(--sub);margin-top:4px}
/* ===== 标注层（电容笔写画 / 笔记） ===== */
.paper-annot{position:relative}
.annot-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6;display:none;touch-action:pan-y}
body.annot .annot-canvas{display:block;pointer-events:auto}
.annot-note{display:none;width:calc(100% - 36px);margin:10px 18px;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.6 var(--sans);resize:vertical;background:#fffdf3}
body.annot .annot-note{display:block}
#annotToggle.on{background:var(--accent);color:#fff}
#annotBar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:60;flex-wrap:wrap;max-width:94vw}
body.annot #annotBar{display:flex}
#annotBar .sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
#annotBar .sw.on{box-shadow:0 0 0 2px #185FA5}
#annotBar .ab{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer}
#annotBar .ab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#annotBar .lbl{font-size:12px;color:var(--sub)}
@media(max-width:900px){nav{display:none}.layout{padding:12px}}
/* ============ 申论答题+学情系统样式 (_study.css) ============ */

/* 作答弹窗 */
.ans-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:30px 12px;overflow:auto}
.ans-modal{background:#fff;border-radius:14px;max-width:760px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:18px 20px;margin:auto}
.ans-head{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--red);margin-bottom:10px}
.ans-close{cursor:pointer;font-size:18px;color:#999;padding:0 6px}
.ans-close:hover{color:var(--red)}
.ans-label{font-size:12px;color:var(--sub);font-weight:700;margin:8px 0 4px}
.ans-stem{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;line-height:1.8;white-space:pre-wrap}
.ans-pts{margin:8px 0;font-size:13px}
.ans-pts summary{cursor:pointer;color:var(--accent)}
.ans-pts ul{margin:6px 0;padding-left:18px}
.ans-pts li{margin:3px 0}
.ans-text{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;line-height:1.9;resize:vertical;font-family:inherit}
.ans-count{font-size:12px;color:#185FA5;margin:4px 0 2px;font-weight:600}
.ans-hints{margin-top:6px;font-size:12px;line-height:1.9}
.hint-chip{display:inline-block;background:#fff7e6;border:1px solid #ffe0a3;color:#9a6b00;border-radius:10px;padding:2px 8px;margin:2px 4px 2px 0}
.ans-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ans-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.ans-btn:hover{background:#f0f4f8}
.ans-btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.ans-btn.mini{padding:3px 8px;font-size:11px}
.ans-report{margin-top:12px}
.rep-head{font-weight:700;color:var(--red);margin-bottom:8px}
.rep-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep-sub{font-weight:700;margin-bottom:4px;font-size:13px}
.rep-sub.ok{color:var(--green)} .rep-sub.no{color:var(--red)}
.rep-list{margin:0;padding-left:16px;font-size:13px;line-height:1.7}
.rep-list li.ok{color:#2e7d32} .rep-list li.no{color:#c0392b}
.rep-list li.muted,.muted{color:#999;font-size:12px}
.rep-reasons{margin-top:10px;font-size:13px}
.reason-chip{display:inline-block;background:#fdecea;color:#c0392b;border-radius:10px;padding:2px 9px;margin:2px 4px 2px 0;font-size:12px}
.ans-org{margin-top:8px;font-size:13px}
.ans-org summary{cursor:pointer;color:var(--accent)}
.orgname{font-weight:700;color:var(--red);margin-top:6px}
.rep-tip{margin-top:10px;background:#eef6ff;border:1px solid #cfe3ff;border-radius:8px;padding:8px 10px;font-size:12px;color:#1f4e79}

/* 学情中心 */
.study-empty{padding:30px;line-height:1.9}
.study-empty h2{color:var(--red)}
.study{line-height:1.7}
.study h2{color:var(--red);font-size:18px;margin-bottom:14px}
.study-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.study-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.sc-title{font-weight:700;color:var(--accent);margin-bottom:10px;font-size:14px}
.study-card canvas{display:block;margin:0 auto}
.reason-bars{font-size:13px}
.rbar-row{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;margin:7px 0}
.rbar-name{font-weight:600}
.rbar-track{background:#f0f0f0;border-radius:6px;height:14px;overflow:hidden}
.rbar-fill{display:block;height:100%;background:linear-gradient(90deg,#A32D2D,#D9794e)}
.rbar-cnt{color:#999;text-align:right}
.rbar-desc{grid-column:1/4;color:#999;font-size:11px;margin-top:-2px}
.due-list,.rec-list{font-size:13px}
.due-item,.rec-item{display:flex;gap:10px;align-items:center;padding:7px 8px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.due-item:hover,.rec-item:hover{background:#f8fafc}
.rec-score{color:var(--red);font-weight:700}
.reco-item{display:flex;justify-content:space-between;padding:7px 8px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.reco-item:hover{background:#f8fafc}
.fl-tool{display:flex;flex-direction:column;gap:8px}
.fl-input,.fl-text{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-family:inherit}
.fl-text{min-height:90px;resize:vertical}
.fl-result{font-size:13px;line-height:1.8}
.fl-tip{margin:3px 0}
.gw-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gw-item{border:1px solid #eee;border-radius:8px;padding:8px 10px}
.gw-item b{color:var(--red)}
.gw-struct{font-size:12px;color:#444;margin:4px 0;line-height:1.6}
.gw-tip{font-size:11px;color:#999}
.review-report{font-size:13px;line-height:1.9}
.review-report p{margin:6px 0}
.ans-flash{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:300;pointer-events:none}
@media(max-width:720px){.study-grid,.gw-grid{grid-template-columns:1fr}.rep-cols{grid-template-columns:1fr}}
.tg.core{background:#A32D2D;color:#fff}.tg.flex{background:#BA7517;color:#fff}.tg.fmt{background:#185FA5;color:#fff}
.tg{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;margin-right:4px}

/* B 增强：深度批注 + PDF 精批 */
.rep-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ans-deep{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ans-deep .rep-head{margin-bottom:6px}
.deep-body{font-size:13px;line-height:1.9;white-space:normal}
.rep-tip.no{background:#fdecea;border-color:#f5c6cb;color:#a3261d}

.pdf-box{display:none}
.pdf-h1{font-size:20px;font-weight:800;color:#A32D2D;margin:0 0 12px;border-bottom:2px solid #A32D2D;padding-bottom:6px}
.pdf-sec{margin-bottom:18px;page-break-inside:avoid}
.pdf-h2{font-size:15px;font-weight:700;color:#185FA5;margin:10px 0 6px}
.pdf-sub{font-size:12px;font-weight:700;color:#555;margin:8px 0 3px}
.pdf-p{font-size:13px;line-height:1.8;white-space:pre-wrap;margin:0 0 4px}
.pdf-mat{font-size:12.5px;line-height:1.8;margin:4px 0;white-space:pre-wrap}
.pdf-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pdf-ul{margin:2px 0 0 16px;padding:0;font-size:12.5px;line-height:1.7}
.pdf-orgname{font-weight:700;color:#A32D2D;margin-top:6px;font-size:13px}
.pdf-list{font-size:13px}
.pdf-canvas{border:1px solid #bbb;background:#fff;max-width:100%;border-radius:6px;margin-top:4px}
.pdf-paper{margin-bottom:24px}
.pdf-opt{font-size:12px;color:#555;margin:8px 0 4px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pdf-opt label{cursor:pointer}

/* 限时模考 */
.mock-overlay{position:fixed;inset:0;background:#eef1f5;z-index:300;display:none;flex-direction:column}
.mock-overlay.on{display:flex}
.mock-bar{position:sticky;top:0;background:#A32D2D;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;font-size:14px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mock-bar b{font-size:15px}
.mock-timer{font-variant-numeric:tabular-nums;font-size:18px;font-weight:800;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:8px}
.mock-timer.warn{background:#fff;color:#c0392b;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.mock-bar .grow{flex:1}
.mock-submit{background:#fff;color:#A32D2D;border:none;border-radius:8px;padding:7px 16px;font-weight:700;cursor:pointer;font-size:13px}
.mock-exit{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.mock-body{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;overflow:hidden}
.mock-mat{gorder:1px solid var(--line);background:#fff;padding:14px 16px;overflow:auto}
.mock-qs{background:#f7f9fc;padding:14px 16px;overflow:auto}
@media(max-width:820px){.mock-body{grid-template-columns:1fr}}
.mock-q{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;margin-bottom:12px}
.mock-q .qh{font-weight:700;color:var(--red);margin-bottom:6px}
.mock-q .qstem{font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:6px}
.mock-q textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;line-height:1.8;resize:vertical;font-family:inherit}
.mock-q .qc{font-size:11px;color:#185FA5;margin-top:3px}
.mock-res{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:320;padding:20px}
.mock-res .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px;max-height:86vh;overflow:auto}
.mock-res h3{color:var(--red);margin:0 0 10px}
.mock-res .rl{font-size:13px;line-height:1.9}
.mock-res .rl li{margin:3px 0}
@media(max-width:720px){.pdf-cols{grid-template-columns:1fr}}
@media print{
  @page{ size:A4 landscape; margin:10mm; }
  html,body{background:#fff !important}
  body>*:not(#pdfBox){display:none !important}
  #pdfBox{display:block !important;position:static;padding:0;margin:0;box-shadow:none;border:none;background:#fff;max-width:none}
  #pdfBox .pdf-sec{break-after:page;page-break-after:always}
  #pdfBox .pdf-sec:last-child{break-after:auto;page-break-after:auto}
  #pdfBox .pdf-paper{break-after:page;page-break-after:always}
  #pdfBox .pdf-paper:last-child{break-after:auto;page-break-after:auto}
  /* 连续模式（竖排不分页）*/
  body.pdf-cont #pdfBox .pdf-sec,
  body.pdf-cont #pdfBox .pdf-paper{break-after:auto;page-break-after:auto}
}

/* ============ 第二批：晨读打卡 + 背诵卡 样式 (_b2.css) ============
   配色一律复用站点 CSS 变量（--bg/--panel/--line/--txt/--sub/--red/--accent...），
   适配深浅色主题；类名统一 b2- 前缀，避免与既有样式冲突。 */

.b2-wrap{line-height:1.7;color:var(--txt)}
.b2-h2{color:var(--accent);font-size:18px;margin:0 0 14px}
.b2-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.b2-title{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:10px}
.b2-dim{color:var(--sub);font-size:12px}

/* 概览数字 */
.b2-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.b2-stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.b2-stat b{display:block;font-size:26px;line-height:1.25;color:var(--txt);font-variant-numeric:tabular-nums}
.b2-stat b.b2-hot{color:var(--red)}
.b2-stat b.b2-ok{color:var(--green)}
.b2-stat span{display:block;font-size:12px;color:var(--sub);margin-top:2px}

/* 操作条与按钮 */
.b2-actbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.b2-actbar.b2-center{justify-content:center}
.b2-btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:7px 15px;font-size:13px;cursor:pointer;font-family:inherit}
.b2-btn:hover{background:var(--red-soft);color:var(--accent)}
.b2-btn.b2-primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.b2-btn.b2-primary:hover{opacity:.9;color:#fff}
.b2-btn.b2-done{background:var(--green-soft);border-color:var(--green);color:var(--green);cursor:default}
.b2-btn.b2-danger{color:var(--red);border-color:var(--line)}
.b2-btn.b2-mini2{padding:4px 10px;font-size:12px}
.b2-mini{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:10px;background:var(--blue-soft);color:var(--blue);cursor:pointer;white-space:nowrap}
.b2-mini:hover{background:var(--red-soft);color:var(--accent)}

/* 日历热力图 */
.b2-calbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.b2-calbar b{font-size:14px;color:var(--txt)}
.b2-nav{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:6px;width:24px;height:24px;line-height:1;cursor:pointer;font-size:14px}
.b2-nav:hover{background:var(--red-soft);color:var(--accent)}
.b2-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:360px}
.b2-wk{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.b2-cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;min-height:30px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--sub);background:var(--bg)}
.b2-cell.b2-blank{border:none;background:transparent}
.b2-cell.b2-on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.b2-cell.b2-today{box-shadow:0 0 0 2px var(--hl)}

/* 折叠块 */
.b2-det{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0}
.b2-det>summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--accent);font-weight:600;user-select:none}
.b2-det[open]>summary{border-bottom:1px solid var(--line)}

/* 晨读清单 */
.b2-sec{padding:10px 14px;border-bottom:1px dashed var(--line)}
.b2-sec:last-child{border-bottom:none}
.b2-sech{font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:6px}
.b2-item{padding:7px 0;border-bottom:1px dashed var(--line)}
.b2-item:last-child{border-bottom:none}
.b2-it-main{font-size:13.5px;line-height:1.8;color:var(--txt);word-break:break-all}
.b2-it-main.b2-quote{border-left:3px solid var(--red-soft);padding-left:9px}
.b2-it-sub{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.6}
.b2-it-act{margin-top:5px}
.b2-line{font-size:13px;line-height:1.85;color:var(--txt);padding:3px 0;word-break:break-all}

/* 批量导入表单 */
.b2-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b2-sel,.b2-num{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit}
.b2-num{width:78px}

/* 卡片清单行 */
.b2-rows{padding:6px 12px 10px;max-height:420px;overflow:auto}
.b2-row{display:grid;grid-template-columns:1fr 120px 72px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.b2-row:last-child{border-bottom:none}
.b2-rt{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b2-rb{color:var(--sub);font-size:11.5px}
.b2-rd{color:var(--accent);font-size:11.5px;text-align:right}

/* 背诵进行中 */
.b2-sesbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:12px}
.b2-sesbar b{color:var(--accent);font-size:14px}
.b2-prog{flex:1;min-width:120px;height:7px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.b2-progf{display:block;height:100%;background:var(--red);transition:width .25s}
.b2-cardface{min-height:260px;display:flex;flex-direction:column}
.b2-cmeta{font-size:11.5px;color:var(--sub);margin-bottom:10px}
.b2-face{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 14px}
.b2-ftip{font-size:17px;line-height:1.9;color:var(--txt);font-weight:600;max-width:640px}
.b2-fhint{font-size:12px;color:var(--sub);margin-top:10px}
.b2-btext{font-size:16px;line-height:2;color:var(--accent);font-weight:600;max-width:680px;word-break:break-all}
.b2-bsrc{font-size:11.5px;color:var(--sub);margin-top:10px}
.b2-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.b2-gb{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;padding:10px 8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.5}
.b2-gb span{display:block;font-size:11px;font-weight:400;color:var(--sub);margin-top:2px}
.b2-gb.b2-g0:hover{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.b2-gb.b2-g1:hover{background:var(--hl);border-color:var(--hl)}
.b2-gb.b2-g2:hover{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.b2-cfoot{margin-top:10px;text-align:right}
.b2-sum{font-size:13px;line-height:1.95;margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}

/* 提示条 */
.b2-flash{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:320;pointer-events:none}

@media(max-width:720px){
  .b2-stats{grid-template-columns:repeat(2,1fr)}
  .b2-row{grid-template-columns:1fr 84px}
  .b2-rd{grid-column:2;text-align:right}
  .b2-grade{grid-template-columns:1fr}
}

/* ============ 第三批：大作文范文库 + 作答修订史 (_b3.css) ============
   变量复用主站 :root —— --bg --panel --line --txt --sub --red --red-soft
   --accent --hl --blue --blue-soft --green --green-soft
   类名统一 b3- 前缀，避免与主站/学情样式冲突
   ==================================================================== */

.b3-wrap{line-height:1.7;color:var(--txt)}
.b3-h2{color:var(--red);font-size:18px;margin:0 0 12px}
.b3-note{background:var(--blue-soft);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:12.5px;line-height:1.85;color:var(--txt);margin-bottom:14px}
.b3-note b{color:var(--accent)}
.b3-empty{text-align:center;color:var(--sub);padding:46px 20px;line-height:2;
  background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.b3-muted{color:var(--sub);font-size:12px}
.b3-grow{flex:1}
.b3-sub{font-weight:400;color:var(--sub);font-size:11.5px}

/* 标签 */
.b3-tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap;
  background:var(--red-soft);color:var(--accent)}
.b3-tag.yr{background:#f3f4f6;color:var(--sub)}
.b3-tag.pv{background:var(--blue-soft);color:#4338ca}
.b3-tag.pp{background:var(--red-soft);color:var(--accent)}
.b3-tag.no{background:var(--green-soft);color:var(--green)}
.b3-tag.ty{background:var(--blue-soft);color:#4338ca}
.b3-tag.sc{background:#fff7ed;color:#c2410c}
.b3-tag.wd{background:#f3f4f6;color:var(--sub)}
.b3-tag.th{background:var(--green-soft);color:var(--green)}

/* 按钮 */
.b3-btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);
  border-radius:8px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.b3-btn:hover{background:var(--red-soft);color:var(--accent)}
.b3-btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.b3-btn.primary:hover{opacity:.9;color:#fff}
.b3-btn.mini{padding:2px 9px;font-size:11px;border-radius:7px}
.b3-btn.danger{color:#b91c1c;border-color:#f0c9c2}
.b3-btn.danger:hover{background:#fde8e8;color:#b91c1c}
.b3-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.b3-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* 输入 */
.b3-in,.b3-sel,.b3-ta{border:1px solid var(--line);border-radius:8px;padding:6px 9px;
  font-size:13px;font-family:inherit;background:var(--panel);color:var(--txt)}
.b3-in{flex:1;min-width:180px}
.b3-ta{width:100%;min-height:120px;line-height:1.9;resize:vertical}
.b3-ta.sm{min-height:76px}
.b3-in:focus,.b3-sel:focus,.b3-ta:focus{outline:none;border-color:var(--red)}

/* ---------- 大作文：题目折叠卡 ---------- */
.b3-q{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.b3-q>summary{cursor:pointer;padding:10px 14px;display:flex;gap:6px;align-items:center;
  flex-wrap:wrap;user-select:none;font-size:13px}
.b3-q>summary:hover{background:var(--red-soft)}
.b3-q[open]>summary{border-bottom:1px solid var(--line);background:var(--red-soft)}
.b3-sumtxt{color:var(--sub);font-size:12px;flex:1;min-width:160px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b3-qbody{padding:12px 16px 16px}
.b3-stem{background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-size:13px;line-height:1.9;margin-bottom:12px}

.b3-sec{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.b3-sec:first-of-type{border-top:none;padding-top:0;margin-top:0}
.b3-sech{font-weight:700;color:var(--accent);font-size:13.5px;margin-bottom:8px}

/* ① 立意参考 */
.b3-views{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.b3-vg{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--bg)}
.b3-vgname{font-weight:700;color:#4338ca;background:var(--blue-soft);display:inline-block;
  padding:1px 10px;border-radius:10px;font-size:11.5px;margin-bottom:5px}
.b3-vline{font-size:12.5px;line-height:1.85;padding:3px 0;border-bottom:1px dashed var(--line)}
.b3-vline:last-child{border-bottom:none}
.b3-vt{display:inline-block;width:18px;text-align:center;border-radius:5px;font-size:10.5px;
  margin-right:5px;color:#fff;background:var(--sub)}
.b3-vt.t总{background:var(--red)}
.b3-vt.t分{background:var(--blue)}
.b3-vt.t题{background:var(--green)}
.b3-vt.t构{background:#c2410c}

/* ② 骨架生成器 */
.b3-skbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.b3-skbar label{font-size:12px;color:var(--sub);display:flex;gap:5px;align-items:center}
.b3-skbar .b3-in{min-width:130px;flex:0 1 170px}
.b3-skbox{min-height:24px}
.b3-sk{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px}
.b3-skmeta{font-size:12px;color:var(--sub);margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px dashed var(--line)}
.b3-skmeta b{color:var(--accent)}
.b3-skrow{margin-bottom:12px}
.b3-skrow.para{border-left:3px solid var(--red-soft);padding-left:10px}
.b3-sklab{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px}
.b3-req{background:var(--red);color:#fff;font-size:10px;border-radius:6px;padding:0 5px;margin-left:6px;font-weight:400}
.b3-skhint{font-size:11.5px;color:var(--sub);line-height:1.75;margin-top:4px}
.b3-tips{margin:6px 0 0 18px;padding:0;font-size:11.5px;color:var(--sub);line-height:1.85}
.b3-tips li{margin:1px 0}

/* ③ 素材推送 */
.b3-mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.b3-mcol{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg)}
.b3-mch{font-weight:700;font-size:12.5px;color:var(--accent);margin-bottom:6px}
.b3-mitem{border-top:1px dashed var(--line);padding:6px 0}
.b3-mitem:first-of-type{border-top:none}
.b3-mih{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.b3-mih b{font-size:12.5px}
.b3-mlines{font-size:12px;line-height:1.8;color:var(--txt)}
.b3-mlines div{padding:1px 0}

/* ④ 我的范文 */
.b3-elist{margin-bottom:10px}
.b3-essay{border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:8px;background:var(--panel)}
.b3-eh{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.b3-eh b{font-size:13px;color:var(--accent)}
.b3-stars{white-space:nowrap}
.b3-star{color:var(--line);cursor:pointer;font-size:14px;line-height:1}
.b3-star.on{color:#e0a800}
.b3-star:hover{color:#e0a800}
.b3-etoggle{border:none;background:none;margin:4px 0 0}
.b3-etoggle>summary{cursor:pointer;font-size:11.5px;color:var(--blue);padding:2px 0}
.b3-etext{white-space:pre-wrap;font-size:13px;line-height:1.95;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:5px;
  max-height:420px;overflow:auto}
.b3-eform{border:1px dashed var(--line);border-radius:9px;padding:10px;background:var(--bg)}
.b3-frow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}

/* 通用卡片 */
.b3-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;margin-bottom:14px}
.b3-cardh{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:10px;
  display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ---------- 修订史 ---------- */
/* 中国习惯：涨=红，跌=绿 */
.b3-up{color:var(--red);font-weight:700}
.b3-down{color:var(--green);font-weight:700}
.b3-trend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.b3-vchip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;
  background:var(--bg);border:1px solid var(--line);color:var(--txt);font-variant-numeric:tabular-nums}
.b3-vchip.up{border-color:#f0c9c2;background:var(--red-soft);color:var(--red)}
.b3-vchip.down{border-color:#bbe7cd;background:var(--green-soft);color:var(--green)}
.b3-arrow{font-size:12px;font-weight:700;color:var(--sub)}
.b3-arrow.up{color:var(--red)}
.b3-arrow.down{color:var(--green)}
.b3-arrow.flat{color:var(--sub)}
.b3-spark{margin-left:6px;vertical-align:middle}

.b3-vers{margin-bottom:10px}
.b3-vrow{border:1px solid var(--line);border-radius:9px;margin:6px 0;background:var(--bg)}
.b3-vrow>summary{cursor:pointer;padding:6px 11px;display:flex;gap:8px;align-items:center;
  flex-wrap:wrap;font-size:12.5px;user-select:none}
.b3-vrow>summary:hover{background:var(--red-soft)}
.b3-vrow[open]>summary{border-bottom:1px solid var(--line)}
.b3-vno{font-weight:800;color:var(--red);font-size:13px;min-width:26px}
.b3-vnote{color:var(--sub);font-size:11.5px;flex:1;min-width:120px}
.b3-vtext{white-space:pre-wrap;font-size:13px;line-height:1.95;padding:9px 12px;
  max-height:360px;overflow:auto;background:var(--panel)}
.b3-vrow .b3-acts{padding:0 12px 9px}

.b3-diffbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;
  color:var(--sub);border-top:1px dashed var(--line);padding-top:10px}
.b3-diffbar .b3-sel{max-width:230px}
.b3-vs{color:var(--red);font-weight:700}
.b3-diffbox{margin-top:10px}
.b3-diffhead{font-size:12.5px;color:var(--txt);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;margin-bottom:6px}
.b3-difflegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-bottom:6px}
.b3-lg{display:inline-flex;align-items:center;gap:4px}
.b3-lg::before{content:"";width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.b3-lg.ins::before{background:var(--green-soft);border-color:#bbe7cd}
.b3-lg.del::before{background:var(--red-soft);border-color:#f0c9c2}
.b3-lg.same::before{background:var(--panel)}

.b3-diffcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b3-diffcol{border:1px solid var(--line);border-radius:9px;background:var(--panel);
  overflow:hidden;max-height:520px;overflow-y:auto}
.b3-diffch{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--accent);z-index:1}
.b3-dl{font-size:13px;line-height:1.95;padding:3px 10px;border-bottom:1px dashed var(--line);
  word-break:break-word}
.b3-dl:last-child{border-bottom:none}
.b3-dl.same{color:var(--txt)}
.b3-dl.gap{color:var(--line);text-align:center}
.b3-dl.add{background:var(--green-soft)}
.b3-dl.del{background:var(--red-soft)}
.b3-dl.chg{background:#fffdf3}
.b3-ins{background:#c8f0d4;color:#14532d;text-decoration:none;border-radius:3px;padding:0 1px}
.b3-del{background:#fbd9d3;color:#7f1d1d;text-decoration:line-through;border-radius:3px;padding:0 1px}
.b3-diffnote{margin-top:8px;background:var(--blue-soft);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-size:12px;color:var(--txt)}

/* 提示条 */
.b3-flash{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:rgba(31,41,55,.9);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;
  opacity:0;transition:opacity .3s;z-index:400;pointer-events:none}

@media(max-width:820px){
  .b3-diffcols{grid-template-columns:1fr}
  .b3-views,.b3-mgrid{grid-template-columns:1fr}
  .b3-frow{flex-direction:column}
  .b3-in{min-width:0}
}

/* ===== 第四批：智能组卷 + 文字自检 ===== */
.b4-wrap{max-width:1080px;margin:0 auto;padding:4px 0 40px}
.b4-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
.b4-h{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--txt);
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg)}
.b4-bd{padding:14px}
.b4-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.b4-in{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--txt);font-size:13px}

/* 卷面表 */
.b4-tb{width:100%;border-collapse:collapse;font-size:13px}

.b4-tb td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--txt);vertical-align:top}
.b4-src{white-space:nowrap;color:var(--sub)}
.b4-stem{color:var(--sub);line-height:1.6}
.b4-tag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:10px;
        font-size:12px;color:var(--sub);background:var(--bg);margin:0 4px 4px 0;white-space:nowrap}
.b4-tag.sug{border-color:var(--accent);color:var(--accent)}
.b4-saved{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.b4-saved:last-child{border-bottom:none}
.b4-qcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.b4-qstem{color:var(--txt);line-height:1.8;margin:6px 0 8px;font-size:14px}
.b4-exambar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
            background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 14px;
            box-shadow:0 2px 10px rgba(0,0,0,.06)}
#b4clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt);letter-spacing:1px}
#b4clock.b4-urgent{color:var(--red)}
.b4-done{color:var(--green);font-size:12px;background:var(--green-soft);padding:1px 8px;border-radius:10px;margin-left:6px}

/* 自检 */
.b4-ta{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:8px;
       background:var(--panel);color:var(--txt);font-size:15px;line-height:1.9;resize:vertical;
       font-family:inherit;box-sizing:border-box}
.b4-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.b4-pill{padding:3px 10px;border-radius:12px;font-size:12px;border:1px solid var(--line);color:var(--sub);background:var(--bg)}
.b4-pill.bad{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.b4-pill.mid{background:var(--hl);color:#7a5b00;border-color:#e0c46a}
.b4-pill.ok{opacity:.55}
.b4-sect{font-weight:700;color:var(--txt);margin:16px 0 8px;padding-left:8px;border-left:3px solid var(--accent)}
.b4-doc{border:1px solid var(--line);border-radius:8px;padding:14px;line-height:2.1;font-size:15px;
        color:var(--txt);background:var(--bg);max-height:420px;overflow:auto}
.b4-mk{padding:1px 2px;border-radius:3px;cursor:help}
.b4-mk.err{background:var(--red-soft);border-bottom:2px solid var(--red);color:var(--red)}
.b4-mk.warn{background:var(--hl);border-bottom:2px dotted #c79b1d;color:inherit}
.b4-grp{margin:0 0 12px}
.b4-grph{font-size:13px;color:var(--sub);margin:0 0 6px}
.b4-issue{padding:5px 10px;border-left:3px solid var(--line);margin:0 0 5px;font-size:13px;line-height:1.7;background:var(--bg);border-radius:0 5px 5px 0}
.b4-issue.err{border-left-color:var(--red)}
.b4-issue.warn{border-left-color:#e0c46a}
.b4-bad{color:var(--red);font-weight:600;background:var(--red-soft);padding:0 4px;border-radius:3px}
.b4-good{color:var(--green);font-weight:600;background:var(--green-soft);padding:0 4px;border-radius:3px}
.b4-msg{color:var(--sub);margin-left:8px}
.b4-nd{padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.8}
.b4-nd.ok{background:var(--green-soft);color:var(--green)}
.b4-nd.mid{background:var(--hl);color:#7a5b00}
.b4-nd.bad{background:var(--red-soft);color:var(--red)}
.b4-nd b{font-size:15px}
.b4-tags{margin:8px 0 0;line-height:2}

@media (max-width:760px){
  .b4-modes{flex-direction:column}
  .b4-row>label{min-width:auto;width:100%}
  .b4-tb .b4-stem{display:none}
}

<style>/* === _b5.css === */
/* ============ 第五批：学习激励与坚持系统 样式 (_b5.css) ============
   配色一律复用站点 CSS 变量（--bg/--panel/--line/--txt/--sub/--red/--green/--blue/--accent…），
   适配深浅色主题；类名统一 b5- 前缀，避免与既有样式冲突。
   板块：① 考试倒计时 ② 全年贡献热力图 ③ 每周目标进度环 ④ 成就勋章 */

.b5-wrap{line-height:1.7;color:var(--txt)}
.b5-h2{color:var(--accent);font-size:18px;margin:0 0 14px}
.b5-note{color:var(--sub);font-size:12.5px;line-height:1.85;margin:0 0 14px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}

.b5-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.b5-title{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:10px}
.b5-dim{color:var(--sub);font-size:12px;font-weight:400}

/* 概览数字块 */
.b5-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.b5-stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.b5-stat b{display:block;font-size:26px;line-height:1.25;color:var(--txt);font-variant-numeric:tabular-nums}
.b5-stat b.b5-hot{color:var(--red)}
.b5-stat b.b5-ok{color:var(--green)}
.b5-stat span{display:block;font-size:12px;color:var(--sub);margin-top:2px}

/* 操作条与按钮（与 b2 一致） */
.b5-actbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.b5-btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;
  padding:7px 15px;font-size:13px;cursor:pointer;font-family:inherit}
.b5-btn:hover{background:var(--red-soft);color:var(--accent)}
.b5-btn.b5-primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.b5-btn.b5-primary:hover{opacity:.9;color:#fff}

/* 空状态提示 */
.b5-empty{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:16px;
  color:var(--sub);font-size:13px;line-height:1.85;margin-bottom:14px}
.b5-empty2{color:var(--sub);font-size:13px;line-height:1.85;margin-bottom:10px}

/* ============ ① 考试倒计时 ============ */
.b5-cdrow{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.b5-count{display:flex;flex-direction:column}
.b5-cbig{font-size:40px;font-weight:800;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.b5-cbig.b5-hot{color:var(--red)}           /* 距考 ≤30 天提示色（迫切） */
.b5-cbig.b5-past{color:var(--sub);font-size:24px;font-weight:700}
.b5-cunit{font-size:12px;color:var(--sub);margin-top:4px}
.b5-cweeks{display:flex;gap:14px}
.b5-cw{display:flex;flex-direction:column;align-items:center;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:8px 16px;min-width:64px}
.b5-cw b{font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.b5-cw span{font-size:11px;color:var(--sub);margin-top:2px}

/* ============ ② 全年贡献热力图 ============ */
.b5-heatscroll{overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.b5-heatinner{display:inline-block;min-width:max-content}
.b5-months{display:grid;grid-template-columns:repeat(53,12px);gap:3px;margin-bottom:4px}
.b5-mo{white-space:nowrap;font-size:10px;color:var(--sub);line-height:1}
/* 7 行（周一～周日）× 53 列（周），按列填充以匹配 DOM 周优先顺序 */
.b5-heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.b5-cell{width:12px;height:12px;border-radius:3px;display:block}
.b5-cell:hover{outline:1px solid var(--hl)}
.b5-future{background:transparent;border:1px dashed var(--line)}
.b5-h0{background:var(--bg);border:1px solid var(--line)}
.b5-h1{background:var(--green-soft)}
.b5-h2{background:var(--green)}
.b5-h3{background:var(--accent)}
.b5-heatfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:8px}
.b5-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
.b5-legend .b5-cell{width:12px;height:12px}
.b5-htotal{font-size:12px;color:var(--sub)}
.b5-htotal b{color:var(--accent);font-size:14px}

/* ============ ③ 每周目标进度环 ============ */
.b5-rings{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-around}
.b5-ring{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:104px}
.b5-ringsvg{display:block}
.b5-rtrack{stroke:var(--line)}
.b5-rbar{transition:stroke-dashoffset .4s ease;stroke:var(--sub)}
.b5-rbar.low{stroke:var(--red)}    /* <60% 进度不足 */
.b5-rbar.mid{stroke:var(--blue)}   /* 60%~99% */
.b5-rbar.done{stroke:var(--green)} /* 达标 */
.b5-rpct{font-size:18px;font-weight:700;fill:var(--sub);font-variant-numeric:tabular-nums}
.b5-rpct.low{fill:var(--red)}
.b5-rpct.mid{fill:var(--blue)}
.b5-rpct.done{fill:var(--green)}
.b5-rlabel{font-size:13px;color:var(--txt);font-weight:600}
.b5-rcount{font-size:12px;color:var(--sub)}
.b5-rcount b{color:var(--accent);font-size:14px}

/* ============ ④ 成就勋章 ============ */
.b5-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.b5-badge{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 10px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px}
.b5-badge.b5-on{border-color:var(--accent);background:var(--hl)}
.b5-badge.b5-off{opacity:.65}
.b5-bcircle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;background:var(--accent);color:#fff}
.b5-badge.b5-off .b5-bcircle{background:var(--line);color:var(--sub)}
.b5-bname{font-weight:700;font-size:14px;color:var(--txt)}
.b5-bcond{font-size:11px;color:var(--sub);line-height:1.5}
.b5-bnow{font-size:11.5px;color:var(--accent);font-weight:600}

/* ============ 响应式 ============ */
@media(max-width:720px){
  .b5-stats{grid-template-columns:repeat(2,1fr)}
  .b5-cdrow{gap:14px}
  .b5-cbig{font-size:32px}
  .b5-rings{gap:12px}
  .b5-badges{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}

</style>
<style>/* === _b6.css === */
/* ============================================================
   第六批：内容深度模块样式 —— 热点专题库 + 五大题型框架卡 (_b6.css)

.b6-note{background:var(--blue-soft);border:1px solid var(--line);border-left:4px solid var(--blue);
  color:#334;font-size:13px;line-height:1.7;padding:10px 14px;border-radius:8px;margin-bottom:14px}
.b6-note b{color:var(--accent)}

/* ---------- 工具栏 / 搜索 / 标签筛选 ---------- */

<style>/* === _b7.css === */
/* =====================================================================
   第七批：AI 三视角教练 样式  (_b7.css)
   复用主站 :root 变量（--bg/--panel/--line/--txt/--sub/--red/--red-soft/
   --accent/--hl/--blue/--blue-soft/--green/--green-soft）
   全部类名以 b7- 前缀，避免与主站 / 其他模块冲突
   配色惯例：得分率 高=红(--red) / 低=绿(--green)
   ===================================================================== */

.b7-wrap{max-width:960px}
.b7-h1{font-size:20px;color:var(--accent);margin:4px 0 10px;font-weight:800}
.b7-note{background:var(--blue-soft);border:1px solid var(--line);border-left:4px solid var(--blue);
  border-radius:8px;padding:10px 14px;font-size:13px;color:var(--txt);line-height:1.8;margin-bottom:14px}
.b7-note code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px;color:var(--accent)}
.b7-note .b7-nocfg{color:var(--red);font-weight:700}

/* ---------------- 卡片 ---------------- */
.b7-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.b7-cardh{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px;
  padding-left:10px;border-left:4px solid var(--red)}
.b7-cardh .b7-sub{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:3px;padding-left:0}
.b7-subh{font-size:13px;font-weight:700;color:var(--txt);margin:14px 0 8px}

/* ---------------- 表单 ---------------- */
.b7-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.b7-fl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.b7-in,.b7-sel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;
  background:#fff;color:var(--txt);font-family:inherit;outline:none}
.b7-in{flex:1;min-width:220px}
.b7-in:focus,.b7-sel:focus{border-color:var(--blue)}
.b7-selwide{flex:1;min-width:280px}

/* ---------------- 按钮 ---------------- */
.b7-btn{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;
  padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.b7-btn:hover{background:var(--red-soft);border-color:var(--red)}
.b7-btn:disabled{opacity:.55;cursor:not-allowed}
.b7-btn.b7-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.b7-btn.b7-primary:hover{background:var(--red)}
.b7-btn.b7-danger{color:var(--red);border-color:#f0c9c3}
.b7-btn.b7-danger:hover{background:var(--red-soft)}
.b7-btn.b7-mini{padding:4px 10px;font-size:12px}
.b7-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------------- 状态框 ---------------- */
.b7-box{margin-top:6px}
.b7-hint{color:var(--sub);font-size:13px;padding:14px;background:var(--bg);border-radius:8px;text-align:center}
.b7-loading{color:var(--blue);font-size:14px;padding:20px;text-align:center;background:var(--blue-soft);border-radius:8px}
.b7-setup{background:var(--hl);border:1px dashed #e0b64a;border-radius:8px;padding:14px;font-size:13px;color:#7a5b00}
.b7-setup .b7-btn{margin:0 8px}
.b7-err{background:var(--red-soft);border:1px solid #f0c9c3;border-radius:8px;padding:14px;color:var(--red);font-size:13px;line-height:1.8}
.b7-errhint{color:var(--sub);font-size:12px;margin-top:6px;line-height:1.8}
.b7-warn{background:var(--hl);border-radius:8px;padding:12px;font-size:13px;color:#7a5b00}

/* ---------------- 生成题卡 / 讲解 ---------------- */
.b7-qcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg)}
.b7-qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.b7-qlab{font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 4px}
.b7-qstem{font-size:14px;line-height:1.9;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.b7-points{margin:0;padding-left:24px}
.b7-points li{font-size:13px;line-height:1.9;color:var(--txt);margin:2px 0}
.b7-answer{font-size:13px;line-height:1.9;color:var(--txt);background:var(--green-soft);border:1px solid #bfe6cf;
  border-radius:8px;padding:10px 12px;margin-top:6px}
.b7-body{font-size:14px;line-height:1.95;color:var(--txt)}
.b7-explhead,.b7-planhead{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b7-explhead{padding-bottom:8px;border-bottom:1px solid var(--line)}
.b7-planhead .b7-sub{font-weight:400;font-size:12px;color:var(--sub)}

.b7-det{margin-top:8px}
.b7-det>summary{cursor:pointer;font-size:12px;color:var(--blue);font-weight:600;user-select:none;padding:4px 0}

/* ---------------- 配置弹窗 ---------------- */
.b7-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.b7-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.15);overflow:hidden}
.b7-modalh{font-size:16px;font-weight:700;color:#fff;background:var(--accent);padding:14px 18px}
.b7-modalbody{padding:18px;display:flex;flex-direction:column;gap:10px}
.b7-modal-lbl{font-size:13px;color:var(--sub);font-weight:600;margin-top:4px}
.b7-cfghint{font-size:12px;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:10px 12px;line-height:1.7}
.b7-modalft{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 18px}

/* ---------------- 我的 AI 题库清单 ---------------- */
.b7-list{display:flex;flex-direction:column;gap:8px}
.b7-item{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.b7-item>summary{cursor:pointer;padding:10px 12px;font-size:13px;user-select:none;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.b7-item>summary:hover{background:var(--red-soft)}
.b7-itsum{color:var(--txt);flex:1;min-width:120px}
.b7-itts{color:var(--sub);font-size:11px}
.b7-itbody{padding:0 12px 12px;border-top:1px solid var(--line)}

/* ---------------- 标签 ---------------- */
.b7-tag{font-size:11px;padding:1px 8px;border-radius:10px;white-space:nowrap;
  background:var(--red-soft);color:var(--accent)}
.b7-tag.ty{background:var(--blue-soft);color:var(--blue)}
.b7-tag.th{background:var(--green-soft);color:var(--green)}

/* ---------------- 学情派单 ---------------- */
.b7-weak{font-size:13px;color:var(--txt);line-height:2;margin-bottom:8px}
.b7-wtag{display:inline-flex;align-items:baseline;gap:4px;padding:3px 10px;border-radius:12px;
  margin:0 6px 4px 0;font-size:12px;background:var(--bg);border:1px solid var(--line)}
.b7-wtag b{font-size:14px}
.b7-wtag i{font-style:normal;color:var(--sub);font-size:11px}
.b7-wtag.up{background:var(--red-soft);border-color:#f0c9c3}
.b7-wtag.up b{color:var(--red)}
.b7-wtag.down{background:var(--green-soft);border-color:#bfe6cf}
.b7-wtag.down b{color:var(--green)}
.b7-wmore{color:var(--sub);font-size:11px}
.b7-wreasons{font-size:12px;color:var(--sub);margin-bottom:6px}
.b7-rtag{display:inline-block;background:var(--hl);color:#7a5b00;border-radius:10px;padding:1px 8px;margin:0 5px 4px 0}

.b7-plan{display:flex;flex-direction:column;gap:8px}
.b7-day{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:pointer;font-size:13px;line-height:1.7}
.b7-day:hover{background:var(--blue-soft)}
.b7-day input{margin-top:3px;flex-shrink:0}
.b7-day.done{background:var(--green-soft);border-color:#bfe6cf}
.b7-day.done .b7-dtitle{text-decoration:line-through;color:var(--sub)}
.b7-dtitle{font-weight:600;color:var(--txt)}
.b7-ddetail{color:var(--sub);display:block;font-size:12px;margin-top:2px}

/* ---------------- toast ---------------- */
.b7-flash{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:9999;
  background:rgba(31,41,55,.94);color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;
  opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}

@media (max-width:640px){
  .b7-form{flex-direction:column;align-items:stretch}
  .b7-in,.b7-sel,.b7-selwide{min-width:0;width:100%}
}

</style>
<style>/* === _b8.css === */
/* =====================================================================
   第八批样式：答案对照 + 增强评分  (_b8.css)
   复用主站 :root 变量；全部类名以 b8- 前缀，避免与其它模块冲突。
   颜色约定：得分向上=红、向下=绿；对照页中 命中=绿、部分=黄、遗漏=红。
   ===================================================================== */
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e5e7eb; --txt:#1f2937; --sub:#6b7280;
  --red:#c0392b; --red-soft:#fdf0ee; --accent:#8e2f22; --hl:#ffe9a8;
  --blue:#1d4ed8; --blue-soft:#eef2ff; --green:#15803d; --green-soft:#ecfdf5;
  --amber:#b45309; --amber-soft:#fff7e6;
}

.b8-wrap{ max-width:1080px; margin:0 auto; padding:4px 2px 40px; color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.b8-h2{ font-size:22px; margin:8px 0 12px; color:var(--accent); }
.b8-note{ background:var(--blue-soft); border:1px solid var(--line); border-left:4px solid var(--blue);
  border-radius:8px; padding:10px 14px; font-size:13px; line-height:1.7; color:var(--txt); margin-bottom:14px; }
.b8-note b{ color:var(--accent); }
.b8-warn{ color:var(--red); }

/* 卡片 */
.b8-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px;
  margin-bottom:14px; overflow:hidden; }
.b8-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:10px 14px; font-weight:600; font-size:15px; background:#fafbfc; border-bottom:1px solid var(--line); }
.b8-bd{ padding:14px; }
.b8-acts{ display:inline-flex; gap:8px; flex-wrap:wrap; }

/* 选择器 */
.b8-selrow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.b8-selrow label{ font-size:13px; color:var(--sub); }
.b8-sel{ padding:6px 10px; border:1px solid var(--line); border-radius:7px; background:#fff;
  font-size:13px; color:var(--txt); max-width:100%; }
.b8-stem{ margin-top:12px; padding:10px 12px; background:var(--bg); border-radius:8px;
  font-size:13px; line-height:1.7; color:var(--txt); }

/* 汇总条 */
.b8-sum{ display:flex; flex-wrap:wrap; gap:10px; }
.b8-sumi{ flex:1 1 110px; min-width:96px; background:var(--bg); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
.b8-sumi b{ font-size:20px; color:var(--accent); line-height:1.1; }
.b8-sumi i{ font-size:12px; color:var(--sub); font-style:normal; }

.b8-pills{ margin-top:12px; font-size:13px; color:var(--sub); }
.b8-pill{ display:inline-block; margin:2px 4px; padding:2px 10px; border-radius:999px;
  font-size:12px; border:1px solid var(--line); background:#fff; }
.b8-pill.mid{ background:var(--amber-soft); border-color:#f0d9ab; color:var(--amber); }

.b8-tip{ margin-top:10px; font-size:12px; color:var(--sub); line-height:1.6; }
.b8-mini{ font-size:12px; color:var(--sub); font-weight:400; }
.b8-muted{ color:var(--sub); font-size:13px; }
.b8-empty{ padding:24px; text-align:center; color:var(--sub); font-size:14px; }

/* 双栏对照 */
.b8-cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.b8-col{ border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
.b8-colh{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 12px; font-weight:600; font-size:13px; background:#fafbfc; border-bottom:1px solid var(--line); }
.b8-ans{ padding:12px; font-size:13px; line-height:1.85; white-space:pre-wrap; word-break:break-word;
  min-height:80px; max-height:460px; overflow:auto; }
.b8-model{ white-space:normal; }
.b8-mgroup{ margin-bottom:12px; }
.b8-mgroup:last-child{ margin-bottom:0; }
.b8-mgname{ font-weight:600; color:var(--blue); font-size:13px; margin-bottom:4px;
  padding-bottom:3px; border-bottom:1px dashed var(--line); }
.b8-mline{ padding:2px 0; }

/* 采分点对照 */
.b8-legend{ font-weight:400; font-size:12px; display:inline-flex; gap:8px; flex-wrap:wrap; }
.b8-legend .lg{ padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
.b8-legend .lg.hit{ background:var(--green-soft); color:var(--green); }
.b8-legend .lg.soft{ background:var(--amber-soft); color:var(--amber); }
.b8-legend .lg.miss{ background:var(--red-soft); color:var(--red); }

.b8-chk{ display:flex; flex-direction:column; gap:8px; }
.b8-ck{ padding:9px 12px; border-radius:8px; border:1px solid var(--line);
  font-size:13px; line-height:1.6; }
.b8-ck.hit{ background:var(--green-soft); border-left:4px solid var(--green); }
.b8-ck.soft{ background:var(--amber-soft); border-left:4px solid var(--amber); }
.b8-ck.miss{ background:var(--red-soft); border-left:4px solid var(--red); }
.b8-icon{ display:inline-block; font-weight:600; margin-right:8px; white-space:nowrap; }
.b8-ck.hit .b8-icon{ color:var(--green); }
.b8-ck.soft .b8-icon{ color:var(--amber); }
.b8-ck.miss .b8-icon{ color:var(--red); }
.b8-cktext{ color:var(--txt); }
.b8-sugg{ margin-top:5px; font-size:12px; color:var(--sub); }

/* 句子覆盖分析 */
.b8-align{ display:flex; flex-direction:column; gap:6px; }
.b8-al{ display:flex; align-items:baseline; gap:10px; padding:7px 10px; border-radius:7px;
  font-size:13px; line-height:1.6; border:1px solid var(--line); }
.b8-al.cov{ background:var(--green-soft); border-left:4px solid var(--green); }
.b8-al.no{ background:var(--red-soft); border-left:4px solid var(--red); }
.b8-alt{ flex:0 0 auto; font-size:12px; font-weight:600; }
.b8-al.cov .b8-alt{ color:var(--green); }
.b8-al.no .b8-alt{ color:var(--red); }
.b8-als{ flex:1 1 auto; color:var(--txt); word-break:break-word; }
.b8-alr{ flex:0 0 auto; font-size:12px; color:var(--sub); white-space:nowrap; }
.b8-sect{ margin:14px 0 6px; font-weight:600; font-size:13px; color:var(--accent); }
.b8-ul{ margin:0; padding-left:20px; font-size:13px; line-height:1.8; color:var(--txt); }
.b8-ul li{ margin:2px 0; }

/* 按钮 */
.b8-btn{ padding:6px 12px; border:1px solid var(--line); border-radius:7px; background:#fff;
  color:var(--txt); font-size:13px; cursor:pointer; transition:background .15s,border-color .15s; }
.b8-btn:hover{ background:var(--bg); border-color:#d1d5db; }
.b8-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.b8-btn.primary:hover{ background:#7a281d; }
.b8-btn.mini{ padding:2px 8px; font-size:12px; }

/* 提示浮条 */
.b8-flash{ position:fixed; left:50%; bottom:32px; transform:translateX(-50%);
  background:rgba(31,41,55,.94); color:#fff; padding:8px 18px; border-radius:999px;
  font-size:13px; z-index:9999; opacity:0; transition:opacity .25s; pointer-events:none; }

/* 主站作答报告里的「增强评分建议」块（由 _b8.scoreEnhance 注入） */
.rep-enh{background:var(--blue-soft);border:1px solid #e0e7ff;border-left:4px solid var(--blue);
  border-radius:8px;padding:10px 14px;margin:10px 0;font-size:13px;line-height:1.7}
.rep-enh b{color:var(--accent)}
.rep-enh ul{margin:6px 0 0;padding-left:20px}
.rep-enh li.enh{font-size:12.5px;line-height:1.75;color:var(--txt)}

/* 窄屏堆叠 */
@media (max-width:760px){
  .b8-cols{ grid-template-columns:1fr; }
  .b8-sumi{ flex-basis:calc(50% - 6px); }
  .b8-h{ font-size:14px; }
}

</style>
<style>/* === _b9.css === */
/* ============================================================
   第九批：专用搜题页样式 (_b9.css)
   仅使用主站 :root 变量，全部类名以 b9- 前缀，避免与其它模块冲突
   ============================================================ */

.b9-sub{font-size:12.5px;font-weight:500;color:var(--sub)}
.b9-toolbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

</style>
<style>/* === _b10.css === */
/* ============ _b10 过程教练 样式 ============ */
/* 复用主站 :root 变量；全部 b10- 前缀隔离，不污染主站 */
.b10-wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
.b10-wrap h2{font-size:20px;margin:0 0 14px}
.b10-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.b10-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.b10-h2{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px}
.b10-tip{margin-top:10px;background:var(--red-soft);border-left:4px solid var(--red);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.7}
.b10-exam{background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:10px}

/* 过程难点频次条 */
.b10-bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.b10-name{width:96px;flex:none;color:var(--txt)}
.b10-track{flex:1;height:12px;background:#f0f1f3;border-radius:6px;overflow:hidden}
.b10-fill{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--accent));border-radius:6px}
.b10-cnt{width:46px;flex:none;text-align:right;color:var(--sub)}

/* 教练话术卡 */
.b10-coach{font-size:13px;line-height:1.8}
.b10-coach-h{font-size:14px;margin-bottom:8px}
.b10-sec{margin:6px 0}
.b10-fix{margin:4px 0 4px 18px;padding:0}
