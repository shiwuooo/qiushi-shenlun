<script>/* === _b8.js === */
/* =====================================================================
   第八批：增强离线评分引擎 + 答案对照（我的作答 vs 名师答案）  (_b8.js)
   依赖：全局 DATA / state / render() / esc() / hi()（由主站提供）
   存储：只读引用 shenlun_answers_v2（现有作答，绝不写入）
   特性：纯前端、离线可用、无任何联网上报
   导出：window.scoreEnhance(answer,q)  —— 增强版离线评分（兼容主站 scoreAnswer 返回形状）
         window.renderCompare()         —— 答案对照视图（供导航路由调用）
   ===================================================================== */
(function(){
"use strict";

/* ---------------- 常量 ---------------- */
const ANS_KEY = "shenlun_answers_v2";   /* 只读，绝不写入 */

/* 停用词：与主站 STOP 对齐（用于 2~4gram 关键词抽取时过滤空泛词） */
const B8STOP = new Set(["可以","应该","我们","他们","这个","那个","以及","通过","由于","对于",
  "进行","问题","方面","需要","必须","一个","没有","这样","就是","因此","所以","但是","并且",
  "而且","如果","因为","为了","能够","实现","提供","建立","加强","完善","提高","在于","成为",
  "工作","开展","推动","促进","发挥","作用","重要","不断","进一步","切实","有效","结合","给定"]);

/* 同义词组（申论高频规范动词/表述近义组，用于软匹配与规范表述建议）
   同组内任意两词互为同义词；共 42 组，覆盖约 160 个规范词。 */
const SYN_GROUPS = [
  ["加强","强化","夯实","巩固","增强"],
  ["完善","健全","优化","改进"],
  ["提升","提高","增进","提振"],
  ["推进","推动","促进","助推"],
  ["落实","落地","贯彻","执行","兑现"],
  ["建立","构建","建设","搭建","组建"],
  ["保障","支撑","护航","保驾护航"],
  ["治理","管理","整治","整顿"],
  ["优化","改善","升级","改良"],
  ["引导","引领","带动","示范"],
  ["创新","革新","变革","更新"],
  ["培育","培养","孵化","造就"],
  ["激发","激活","释放","调动"],
  ["统筹","协调","兼顾","整合"],
  ["规范","标准化","制度化","定型"],
  ["挖掘","发掘","盘活","开发"],
  ["宣传","普及","弘扬","传播"],
  ["监督","监管","督查","问责"],
  ["服务","供给","支持","供应"],
  ["破解","解决","化解","攻克"],
  ["探索","尝试","试点","先行"],
  ["凝聚","汇聚","聚合","团结"],
  ["深化","拓展","延伸","拓宽"],
  ["补齐","弥补","填补","补足"],
  ["打造","塑造","培植","树立"],
  ["保护","守护","维护","呵护"],
  ["增收","致富","富民","增效"],
  ["转型","转变","转化","跃升"],
  ["聚焦","立足","着眼","围绕"],
  ["助力","赋能","加持","支撑"],
  ["精准","精确","精细","精细化"],
  ["高效","优质","提质","高质量"],
  ["协同","联动","配合","衔接"],
  ["引进","引入","吸纳","招引"],
  ["示范","标杆","样板","典型"],
  ["覆盖","普惠","惠及","辐射"],
  ["优先","倾斜","侧重","重点"],
  ["底线","红线","边界","门槛"],
  ["长效","常态","持续","长远"],
  ["短板","弱项","不足","缺口"],
  ["机制","制度","体系","体制"],
  ["责任","担当","职责","使命"]
];
/* 展开为 词 -> [同义词...] 映射 */
const SYN_MAP = (function(){
  const m = {};
  SYN_GROUPS.forEach(function(g){
    g.forEach(function(w){
      const others = g.filter(function(x){ return x !== w; });
      m[w] = (m[w] || []).concat(others);
    });
  });
  Object.keys(m).forEach(function(k){ m[k] = Array.from(new Set(m[k])); });
  return m;
})();

/* ---------------- 存储层（只读、失败降级） ---------------- */
function loadAnswers(){
  try{ const o = JSON.parse(localStorage.getItem(ANS_KEY)); return (o && typeof o === "object") ? o : {}; }
  catch(e){ return {}; }
}
function rk(pid, qno){ return pid + "#" + qno; }

/* ---------------- 通用工具 ---------------- */
function E(s){
  const v = (s===null||s===undefined) ? "" : String(s);
  if(typeof esc === "function") return esc(v);
  return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function EA(s){ return E(s).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function cn(s){ return String(s||"").replace(/\s/g,"").length; }
function cleanLine(l){ return String(l||"").replace(/^[-•>＞\s]+/,"").trim(); }

/* 中文分句：按 。！？；!?; 及换行切分 */
function splitSent(t){
  const s = String(t||"").replace(/\r/g,"");
  const out = [];
  let cur = "";
  for(let i=0;i<s.length;i++){
    const ch = s[i];
    if(ch === "\n"){ if(cur.trim()) out.push(cur.trim()); cur = ""; continue; }
    cur += ch;
    if("。！？；!?;".indexOf(ch) >= 0){ if(cur.trim()) out.push(cur.trim()); cur = ""; }
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}

/* 2~4gram 关键词抽取（与主站 extractKeywords 同构，过滤停用词） */
function extractKeywords(text){
  const clean = String(text||"").replace(/[^\u4e00-\u9fa5]/g,"");
  const set = new Set();
  for(let i=0;i<clean.length;i++){
    for(let L=2; L<=4 && i+L<=clean.length; L++){
      const w = clean.substr(i,L);
      if(!B8STOP.has(w)) set.add(w);
    }
  }
  return Array.from(set);
}

/* 中文字符集合（去除标点/字母/数字） */
function charSet(s){
  const set = new Set();
  const clean = String(s||"").replace(/[^\u4e00-\u9fa5]/g,"");
  for(let i=0;i<clean.length;i++) set.add(clean[i]);
  return set;
}
/* a 被 b 覆盖的字符重叠率：|set(a)∩set(b)| / |set(a)| */
function overlapRatio(a, b){
  const sa = charSet(a);
  if(!sa.size) return 0;
  const sb = charSet(b);
  let inter = 0;
  sa.forEach(function(c){ if(sb.has(c)) inter++; });
  return inter / sa.size;
}

/* 同义词命中：采分点里出现某同义组关键词，且作答里出现该组另一同义词 */
function synMatch(ptText, answer){
  for(const key in SYN_MAP){
    if(ptText.indexOf(key) >= 0){
      const syns = SYN_MAP[key];
      for(let i=0;i<syns.length;i++){
        if(answer.indexOf(syns[i]) >= 0) return true;
      }
    }
  }
  return false;
}
/* 为遗漏采分点给出规范表述建议 */
function suggestSyn(ptText){
  for(const key in SYN_MAP){
    if(ptText.indexOf(key) >= 0){
      const syns = SYN_MAP[key];
      if(syns.length) return key + "→" + syns.slice(0,3).join("/");
    }
  }
  return "健全 / 完善 / 统筹 / 落实 等规范动词";
}

/* =====================================================================
   核心（1）：增强离线评分  window.scoreEnhance(answer, q)
   兼容主站 scoreAnswer(answer,q) 返回形状，另附 softHits / suggestions
   ===================================================================== */
function scoreEnhance(answer, q){
  try{
    q = q || {};
    const ans = String(answer||"");
    const pts = (q.points||[]).filter(function(p){ return p && p.text; });
    const hits = [], missed = [], softHits = [];
    const ansSents = splitSent(ans);

    pts.forEach(function(pt){
      const text = String(pt.text||"");
      /* ① 关键词硬命中：pt 的任意 2~4gram 出现在作答中 → 1.0 */
      const kws = extractKeywords(text);
      let hard = false;
      for(let i=0;i<kws.length;i++){ if(ans.indexOf(kws[i]) >= 0){ hard = true; break; } }
      /* ② 同义词命中 → 1.0 */
      if(!hard && synMatch(text, ans)) hard = true;
      if(hard){ hits.push(pt); return; }
      /* ③ 句子字符重叠：任一 pt 句与任一作答句重叠率 ≥ 0.5 → 0.5 */
      const ptSents = splitSent(text);
      let best = 0;
      for(let i=0;i<ptSents.length;i++){
        for(let j=0;j<ansSents.length;j++){
          const r = overlapRatio(ptSents[i], ansSents[j]);
          if(r > best) best = r;
        }
      }
      if(best >= 0.5){ softHits.push(pt); return; }
      /* ④ 未命中 */
      missed.push(pt);
    });

    const total = pts.length;
    const denom = total || 1;
    const eff = hits.length + softHits.length * 0.5;   /* 有效命中数 */
    const rate = eff / denom;
    const reasons = inferReasons(missed, q, ans, pts);
    const suggestions = missed.map(function(pt){
      return "遗漏采分点：" + String(pt.text||"") + "　建议补充规范表述如 " + suggestSyn(String(pt.text||""));
    });

    return {
      hits: hits,           /* 满命中(1.0) 采分点 */
      missed: missed,       /* 未命中(0) 采分点 */
      softHits: softHits,   /* 部分命中(0.5) 采分点 */
      rate: rate,
      score: Math.round(rate * 100),
      total: total,
      hitCount: hits.length,
      reasons: reasons,     /* 数组 */
      suggestions: suggestions
    };
  }catch(e){
    /* 任何异常都不抛出，返回空结果 */
    return { hits:[], missed:[], softHits:[], rate:0, score:0, total:0, hitCount:0, reasons:[], suggestions:[] };
  }
}

/* 失分归因（沿用主站 inferReasons 精神，返回数组而非 Set） */
function inferReasons(missed, q, answer, pts){
  const r = [];
  const add = function(x){ if(r.indexOf(x) < 0) r.push(x); };
  try{
    pts = pts || (q && q.points) || [];
    const qtype = (q && q.qtype) || "";
    const ans = String(answer||"");
    if(!missed || !missed.length) return r;
    const n = pts.length || 1;
    if(missed.length >= Math.max(1, Math.ceil(n * 0.6))) add("找点不全");
    if(ans.length > 600 && missed.length > 0) add("归纳整合弱");
    if(/概括|归纳/.test(qtype) && missed.length) add("归纳整合弱");
    if(/作文|议论|策论|文章/.test(qtype)){ add("分论点弱"); add("论证无力"); }
    if(/公文|应用文|贯彻|信|通知|报告|请示|函|稿|简报|倡议/.test(qtype)) add("规范格式弱");
    if(missed.some(function(p){ return /规范|术语|表述|准确/.test(p.text||""); })) add("规范词缺乏");
    if(missed.length >= 2) add("规范词缺乏");
    const stem = ((q && q.stem) || []).join("");
    if(/审题|对象|范围|针对/.test(stem) && missed.length >= n) add("审题偏题");
    if(missed.length >= 3) add("素材积累少");
  }catch(e){}
  return r;
}

/* =====================================================================
   核心（2）：答案对照视图  window.renderCompare()
   ===================================================================== */
let sel = { pid:"", qno:null };                 /* 当前选择 */
let cur = { p:null, q:null, modelText:"" };     /* 供复制/打开作答等动作引用 */

function papersList(){ return (typeof DATA !== "undefined" && DATA.papers) ? DATA.papers : []; }
function provLabel(p){ const v = (p && p.province) || ""; return (!v || v === "国考") ? "国考" : (v + "省考"); }
function paperLabel(p){ if(!p) return ""; return p.year + " " + provLabel(p) + " · " + (p.paper || ""); }

/* 组装名师答案分组：机构答案 + AI综合答案 */
function buildModel(q){
  const groups = [];
  ((q && q.orgs) || []).forEach(function(o){
    const lines = (o.lines || []).map(cleanLine).filter(Boolean);
    if(lines.length) groups.push({ name: o.name || "机构答案", lines: lines });
  });
  const ai = ((q && q.ai) || []).map(cleanLine).filter(Boolean);
  if(ai.length) groups.push({ name: "AI综合答案", lines: ai });
  return groups;
}
function modelHtml(groups){
  if(!groups.length) return '<div class="b8-muted">（本题暂无机构/AI参考答案）</div>';
  return groups.map(function(g){
    return '<div class="b8-mgroup"><div class="b8-mgname">' + E(g.name) + '</div>' +
      g.lines.map(function(l){ return '<div class="b8-mline">' + E(l) + '</div>'; }).join("") +
      '</div>';
  }).join("");
}
function modelText(groups){
  const arr = [];
  groups.forEach(function(g){ g.lines.forEach(function(l){ arr.push(l); }); });
  return arr.join("\n");
}

function ptStatus(pt, res){
  if(res.hits.indexOf(pt) >= 0) return "hit";
  if(res.softHits.indexOf(pt) >= 0) return "soft";
  return "miss";
}

function renderCompare(){
  const box = document.getElementById("content");
  if(!box) return;
  const papers = papersList();

  sideNav("答案对照", [
    {id:"b8Top",   label:"🔍 选择题目"},
    {id:"b8Cmp",   label:"📑 我的作答 · 名师答案"},
    {id:"b8Chk",   label:"✅ 采分点对照"},
    {id:"b8Align", label:"🧭 句子覆盖分析"}
  ]);

  let h = '<div class="b8-wrap">';
  h += '<h2 class="b8-h2" id="b8Top">🔍 答案对照与增强评分</h2>';
  h += '<div class="b8-note">左侧为你的作答、右侧为名师/AI参考答案，中间给出<b>采分点命中</b>与<b>句子覆盖</b>对照。' +
       '<b class="b8-warn">增强评分为离线语义近似版</b>（关键词＋同义词＋句子字符重叠三重匹配），仅供自查方向；' +
       '深度批改需配置 LLM。全部数据仅读取本机 localStorage（shenlun_answers_v2），不改写、不上传。</div>';

  if(!papers.length){
    h += '<div class="b8-card"><div class="b8-bd"><div class="b8-empty">题库为空（DATA.papers 无数据）。</div></div></div></div>';
    box.innerHTML = h;
    setStats("答案对照 · 题库为空");
    return;
  }

  /* 默认选择 */
  if(!sel.pid || !papers.some(function(x){ return x.id === sel.pid; })) sel.pid = papers[0].id;
  const p = papers.filter(function(x){ return x.id === sel.pid; })[0] || papers[0];
  const qs = (p.questions || []);
  if(sel.qno === null || !qs.some(function(x){ return Number(x.no) === Number(sel.qno); }))
    sel.qno = qs.length ? qs[0].no : null;
  const q = qs.filter(function(x){ return Number(x.no) === Number(sel.qno); })[0] || null;

  /* ---- 选择器 ---- */
  h += '<div class="b8-card"><div class="b8-h">选择套卷与题目</div><div class="b8-bd">';
  h += '<div class="b8-selrow"><label>套卷</label><select class="b8-sel" onchange="b8PickPaper(this.value)">';
  papers.forEach(function(x){
    h += '<option value="' + EA(x.id) + '"' + (x.id === sel.pid ? " selected" : "") + '>' + E(paperLabel(x)) + '</option>';
  });
  h += '</select>';
  h += '<label>题目</label><select class="b8-sel" onchange="b8PickQuestion(this.value)">';
  qs.forEach(function(x){
    const lbl = "题" + x.no + " · " + (x.qtype || "") + (x.score ? (" · " + x.score) : "");
    h += '<option value="' + E(String(x.no)) + '"' + (Number(x.no) === Number(sel.qno) ? " selected" : "") + '>' + E(lbl) + '</option>';
  });
  h += '</select></div>';
  if(q){
    h += '<div class="b8-stem">' + (q.stem || []).map(E).join("<br>") + '</div>';
  }
  h += '</div></div>';

  if(!q){
    h += '<div class="b8-card"><div class="b8-bd"><div class="b8-empty">该套卷暂无题目。</div></div></div></div>';
    box.innerHTML = h;
    setStats("答案对照 · " + paperLabel(p));
    return;
  }

  /* ---- 取数据 + 评分 ---- */
  const rec = loadAnswers()[rk(p.id, q.no)] || null;
  const myText = (rec && rec.text) ? String(rec.text) : "";
  const groups = buildModel(q);
  const mText = modelText(groups);
  cur = { p:p, q:q, modelText:mText };

  const res = scoreEnhance(myText, q);

  /* 句子覆盖分析：我的每句 vs 名师句 */
  const mySents = splitSent(myText);
  const modelSents = splitSent(mText);
  const align = mySents.map(function(s){
    let best = 0;
    for(let j=0;j<modelSents.length;j++){ const r = overlapRatio(s, modelSents[j]); if(r > best) best = r; }
    return { s:s, cov: best >= 0.5, r:best };
  });
  const covered = align.filter(function(a){ return a.cov; }).length;
  const uncovered = align.filter(function(a){ return !a.cov; }).map(function(a){ return a.s; });

  /* ---- 汇总条 ---- */
  h += '<div class="b8-card"><div class="b8-h">评分概览' +
       '<span class="b8-acts"><button class="b8-btn primary" onclick="b8OpenAnswer()">✍️ 打开本题作答</button>' +
       '<button class="b8-btn" onclick="b8CopyModel()">📋 复制名师答案</button></span></div><div class="b8-bd">';
  h += '<div class="b8-sum">' +
       '<span class="b8-sumi"><b>' + res.score + '%</b><i>我的命中率</i></span>' +
       '<span class="b8-sumi"><b>' + res.hitCount + '</b><i>满命中采分点</i></span>' +
       '<span class="b8-sumi"><b>' + res.softHits.length + '</b><i>部分命中</i></span>' +
       '<span class="b8-sumi"><b>' + res.missed.length + '</b><i>遗漏采分点</i></span>' +
       '<span class="b8-sumi"><b>' + res.total + '</b><i>采分点总数</i></span>' +
       '<span class="b8-sumi"><b>' + cn(mText) + '</b><i>名师答案字数</i></span>' +
       '<span class="b8-sumi"><b>' + covered + '/' + mySents.length + '</b><i>我的覆盖句</i></span>' +
       '</div>';
  if(res.reasons.length){
    h += '<div class="b8-pills">失分归因：' +
         res.reasons.map(function(x){ return '<span class="b8-pill mid">' + E(x) + '</span>'; }).join("") + '</div>';
  }
  h += '<div class="b8-tip">提示：「打开本题作答」会调用主站作答弹窗（若已加载）；此处无需跳转即可对照复习。</div>';
  h += '</div></div>';

  /* ---- 双栏：我的作答 / 名师答案 ---- */
  h += '<div class="b8-card" id="b8Cmp"><div class="b8-h">我的作答 · 名师答案对照</div><div class="b8-bd">';
  h += '<div class="b8-cols">';
  h += '<div class="b8-col"><div class="b8-colh">🙋 我的作答' +
       (myText ? ' <span class="b8-mini">' + cn(myText) + ' 字' +
         (rec && typeof rec.score === "number" ? ' · 原评分 ' + rec.score + '%' : '') + '</span>' +
         ' <button class="b8-btn mini" onclick="b8CopyEl(\'b8myAns\')">复制</button>' : '') +
       '</div>';
  h += '<div class="b8-ans" id="b8myAns">' + (myText ? E(myText) : '<span class="b8-muted">（本题还未作答）</span>') + '</div></div>';
  h += '<div class="b8-col"><div class="b8-colh">🎓 名师答案 <span class="b8-mini">' + cn(mText) + ' 字</span></div>';
  h += '<div class="b8-ans b8-model" id="b8modelAns">' + modelHtml(groups) + '</div></div>';
  h += '</div></div></div>';

  /* ---- 采分点对照 ---- */
  h += '<div class="b8-card" id="b8Chk"><div class="b8-h">采分点对照' +
       '<span class="b8-legend"><span class="lg hit">✅ 命中（绿）</span>' +
       '<span class="lg soft">🟡 部分（黄）</span>' +
       '<span class="lg miss">❌ 遗漏（红）</span></span></div><div class="b8-bd">';
  const pts = (q.points || []);
  if(!pts.length){
    h += '<div class="b8-muted">本题未录入采分点，无法逐点对照（可参考右侧名师答案自评）。</div>';
  }else{
    h += '<div class="b8-chk">';
    pts.forEach(function(pt, i){
      const st = ptStatus(pt, res);
      const icon = st === "hit" ? "✅ 命中" : (st === "soft" ? "🟡 部分" : "❌ 遗漏");
      h += '<div class="b8-ck ' + st + '"><span class="b8-icon">' + icon + '</span>' +
           '<span class="b8-cktext">' + E(pt.text || "") + '</span>';
      if(st === "miss"){
        h += '<div class="b8-sugg">建议补充规范表述：' + E(suggestSyn(String(pt.text || ""))) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div></div>';

  /* ---- 句子覆盖分析 ---- */
  h += '<div class="b8-card" id="b8Align"><div class="b8-h">句子覆盖分析 <span class="b8-mini">（我的每句与名师答案的字符重叠 ≥ 50% 视为「已覆盖」）</span></div><div class="b8-bd">';
  if(!myText){
    h += '<div class="b8-muted">本题还未作答，可先对照右上「名师答案」与上方「采分点」清单进行学习。</div>';
  }else if(!mySents.length){
    h += '<div class="b8-muted">未能从作答中切分出句子。</div>';
  }else{
    h += '<div class="b8-align">';
    align.forEach(function(a){
      h += '<div class="b8-al ' + (a.cov ? "cov" : "no") + '">' +
           '<span class="b8-alt">' + (a.cov ? "已覆盖" : "未覆盖") + '</span>' +
           '<span class="b8-als">' + E(a.s) + '</span>' +
           '<span class="b8-alr">重叠 ' + Math.round(a.r * 100) + '%</span></div>';
    });
    h += '</div>';
    if(uncovered.length){
      h += '<div class="b8-sect">我的未覆盖要点（名师答案未见强对应，请核对是否偏题或需补充）：</div>';
      h += '<ul class="b8-ul">' + uncovered.slice(0, 20).map(function(s){ return '<li>' + E(s) + '</li>'; }).join("") + '</ul>';
    }else{
      h += '<div class="b8-tip">你的每一句都能在名师答案中找到强对应，方向把握良好。</div>';
    }
  }
  h += '</div></div>';

  h += '</div>';
  box.innerHTML = h;
  setStats("答案对照 · " + paperLabel(p) + " 题" + q.no + " · 命中率 " + res.score + "% · 采分点 " + res.total + " 个");
}

/* ---------------- 视图动作 ---------------- */
function b8PickPaper(v){ sel.pid = v; sel.qno = null; renderCompare(); }
function b8PickQuestion(v){ sel.qno = v; renderCompare(); }
function b8CopyModel(){
  if(!cur.modelText){ b8Flash("本题暂无名师答案可复制"); return; }
  b8Copy(cur.modelText);
}
function b8OpenAnswer(){
  if(cur.p && cur.q && typeof window.openAnswerModal === "function"){
    window.openAnswerModal(cur.p.id, cur.q.no);
  }else{
    b8Flash("主站作答弹窗未加载，请到真题库/省考库对应题目作答");
  }
}
function b8CopyEl(id){
  const el = document.getElementById(id);
  if(!el){ b8Flash("内容不存在"); return; }
  b8Copy(el.innerText || el.textContent || "");
}

/* ---------------- 通用小工具（按契约自带 setStats / sideNav） ---------------- */
function setStats(t){ var el = document.getElementById("stats"); if(el) el.textContent = t; }
function sideNav(title, items){
  var nav = document.getElementById("nav");
  if(!nav) return;
  var h = "<h3>" + E(title) + "</h3>";
  (items || []).forEach(function(it){
    h += '<div class="tlink" onclick="var e=document.getElementById(\'' + it.id + '\');if(e)e.scrollIntoView({behavior:\'smooth\'})"><span>' + E(it.label) + '</span></div>';
  });
  nav.innerHTML = h;
}
function b8Flash(msg){
  var t = document.getElementById("b8Flash");
  if(!t){ t = document.createElement("div"); t.id = "b8Flash"; t.className = "b8-flash"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.style.opacity = "0"; }, 1500);
}
function b8Copy(text){
  const t = String(text||"");
  if(!t){ b8Flash("没有可复制的内容"); return; }
  let ok = false;
  try{
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly","");
    ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    ok = document.execCommand("copy");
    document.body.removeChild(ta);
  }catch(e){ ok = false; }
  if(ok){ b8Flash("已复制到剪贴板"); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ b8Flash("已复制到剪贴板"); },
                                          function(){ b8Flash("复制失败，请手动选中复制"); });
    return;
  }
  b8Flash("复制失败，请手动选中复制");
}

/* =====================================================================
   暴露入口（供导航路由 / onclick 调用）
   ===================================================================== */
window.scoreEnhance  = scoreEnhance;
window.renderCompare = renderCompare;
window.b8OpenCompare  = function(pid, qno){
  try{
    if(typeof state !== "undefined" && state && state.scope !== undefined) state.scope = "答案对照";
    sel.pid = pid; sel.qno = Number(qno);
    if(typeof render === "function") render();
  }catch(e){ console.warn("打开答案对照失败", e); }
};
window.b8PickPaper    = b8PickPaper;
window.b8PickQuestion = b8PickQuestion;
window.b8CopyModel    = b8CopyModel;
window.b8OpenAnswer   = b8OpenAnswer;
window.b8CopyEl       = b8CopyEl;
window.b8Copy         = b8Copy;

})();

</script>
<script>/* === _b9.js === */
/* =====================================================================
   第九批：专用搜题页（跨国考/省考全库聚合 + 题型/年份/机构筛选 + 一键作答/对照）  (_b9.js)
   依赖：全局 DATA / state / render() / esc() / hi()（由主站提供）
   特性：纯前端、离线可用、只读查询、不写任何 localStorage
   说明：
     - 主站 qBlob 不在全局契约内，本模块自带 b9Blob(q) 做全文拼接
     - openAnswerModal / addToWrongBook / b8OpenCompare 为主站暴露的全局函数，可直接调用
     - 本地筛选状态 ss 独立于主站 state.q，避免与顶部全局检索框冲突
   ===================================================================== */
(function(){
  "use strict";

  // 本地筛选状态（不污染主站 state）
  const ss = { q:"", qtype:"全部", year:"全部", org:"全部", prov:"全部" };
  let _deb = null;

  // 安全取主站全局函数
  function G(fn){ return (typeof window!=="undefined" && typeof window[fn]==="function") ? window[fn] : null; }
  function esc2(s){ const f=G("esc"); return f ? f(s) : String(s==null?"":s); }
  function hi2(t,terms){ const f=G("hi"); return f ? f(t,terms) : esc2(t); }
  function provLabel(p){ return (!p || p==="国考") ? (p||"") : (p + "省考"); }

  // 把一道题拼成可检索文本（题型/题干/材料/各机构答案/采分点/复盘/AI）
  function b9Blob(q){
    try{
      return [
        q.qtype||"",
        (q.stem||[]).join(" "),
        (q.material||[]).join(" "),
        (q.orgs||[]).map(o=>(o.name||"")+" "+(o.lines||[]).join(" ")).join(" "),
        (q.points||[]).map(p=>p.text||"").join(" "),
        (q.review||[]).join(" "),
        (q.ai||[]).join(" ")
      ].join(" ").toLowerCase();
    }catch(e){ return ""; }
  }

  function uniq(a){ return Array.from(new Set(a)).filter(Boolean); }

  // 跨库聚合：国考 + 省考 全部题目
  function allQuestions(){
    const out=[];
    const DATA = (typeof window!=="undefined") ? window.DATA : null;
    (DATA && DATA.papers || []).forEach(p=>{
      (p.questions||[]).forEach(q=>{ out.push({p,q}); });
    });
    return out;
  }

  function runFilter(){
    const terms = ss.q ? ss.q.toLowerCase().split(/\s+/).filter(Boolean) : [];
    return allQuestions().filter(({p,q})=>{
      if(ss.prov!=="全部" && p.province!==ss.prov) return false;
      if(ss.year!=="全部" && String(p.year)!==ss.year) return false;
      if(ss.qtype!=="全部" && (q.qtype||"")!==ss.qtype) return false;
      if(ss.org!=="全部"){
        const hit = (q.orgs||[]).some(o=>(o.name||"")===ss.org);
        if(!hit) return false;
      }
      if(terms.length){
        const blob=b9Blob(q);
        if(!terms.every(t=>blob.indexOf(t)>=0)) return false;
      }
      return true;
    });
  }

  function chip(field,label,vals,cur){
    let h='<div class="b9-chips"><span class="b9-clabel">'+esc2(label)+'</span>';
    h+='<span class="b9-chip '+(cur==="全部"?"on":"")+'" onclick="b9Filter(\''+field+'\',\'全部\')">全部</span>';
    vals.forEach(v=>{
      h+='<span class="b9-chip '+(cur===v?"on":"")+'" onclick="b9Filter(\''+field+'\',\''+esc2(v)+'\')">'+esc2(v)+'</span>';
    });
    h+='</div>';
    return h;
  }

  function select(field,label,vals,cur){
    let h='<label class="b9-sel"><span>'+esc2(label)+'</span><select onchange="b9Filter(\''+field+'\',this.value)">';
    vals.forEach(v=>{ h+='<option value="'+esc2(v)+'"'+(cur===v?" selected":"")+'>'+esc2(v)+'</option>'; });
    h+='</select></label>';
    return h;
  }

  function buildResults(items,terms){
    if(!items.length){
      return '<div class="empty">没有匹配的题，换个关键词或放宽筛选</div>';
    }
    let h='<div class="b9-list">';
    items.forEach(({p,q})=>{
      const stem=(q.stem||[]).join(" ");
      const ex = stem.length>140 ? stem.slice(0,140)+"…" : stem;
      h+='<div class="b9-card">';
      h+='<div class="b9-ch">'+esc2(p.year)+' '+esc2(provLabel(p.province))+' · '+esc2(p.paper||"")+' · 题'+(q.no||"?")+' ';
      if(q.qtype) h+='<span class="b9-tag">'+esc2(q.qtype)+'</span>';
      if(q.score)  h+='<span class="b9-tag">'+esc2(q.score)+'</span>';
      if(q.words)  h+='<span class="b9-tag">'+esc2(q.words)+'</span>';
      h+='</div>';
      h+='<div class="b9-stem">'+hi2(ex,terms)+'</div>';
      const orgs=(q.orgs||[]).map(o=>o.name).filter(Boolean);
      if(orgs.length){
        h+='<div class="b9-orgs">'+orgs.map(o=>'<span class="b9-otag">'+esc2(o)+'</span>').join("")+'</div>';
      }
      const pid=esc2(p.id), no=(q.no||0);
      h+='<div class="b9-acts">';
      h+='<button class="ans-btn" onclick="openAnswerModal(\''+pid+'\','+no+')">✍️ 作答</button>';
      h+='<button class="ans-btn" onclick="if(window.b8OpenCompare)b8OpenCompare(\''+pid+'\','+no+')">🔍 答案对照</button>';
      h+='<button class="ans-btn" onclick="if(window.addToWrongBook)addToWrongBook(\''+pid+'\','+no+')">➕ 错题本</button>';
      h+='</div>';
      h+='</div>';
    });
    h+='</div>';
    return h;
  }

  function renderSearch(){
    if(!DATA || !DATA.papers){
      const c=document.getElementById('content');
      if(c) c.innerHTML='<div class="empty">题库数据未加载</div>';
      return;
    }
    const all=allQuestions();
    const qtSet = uniq(all.map(({q})=>q.qtype)).sort();
    const yrSet = uniq(DATA.papers.map(p=>String(p.year))).sort().reverse();
    const orgSet= uniq(all.flatMap(({q})=>(q.orgs||[]).map(o=>o.name))).sort();
    const provSet=uniq(DATA.papers.map(p=>p.province));

    const terms = ss.q ? ss.q.toLowerCase().split(/\s+/).filter(Boolean) : [];
    const total = runFilter().length;
    const shown = runFilter().slice(0,200);

    let h='<div class="b9-wrap">';
    h+='<div class="b9-h2">🔎 搜题 <span class="b9-sub">跨库聚合 · 按题型 / 年份 / 机构筛选 · 一键作答与对照</span></div>';
    h+='<div class="b9-toolbar">';
    h+='<input id="b9q" class="b9-search" type="search" placeholder="搜题干 / 材料 / 答案 / 采分点…（空格分词=同时包含）" value="'+esc2(ss.q)+'" oninput="b9SetQ(this.value)">';
    h+='<div class="b9-row">';
    h+=select("year","年份",["全部"].concat(yrSet),ss.year);
    h+=chip("prov","题库",provSet,ss.prov);
    h+=chip("org","机构",orgSet,ss.org);
    h+='</div>';
    h+=chip("qtype","题型",qtSet,ss.qtype);
    h+='</div>';
    h+='<div class="b9-stat">命中 <b>'+total+'</b> 道题'+(total>200?'（仅显示前 200）':'')+'</div>';
    h+=buildResults(shown,terms);
    h+='</div>';

    const c=document.getElementById('content');
    if(c) c.innerHTML=h;
    const s=document.getElementById('stats');
    if(s) s.textContent='搜题 · 命中 '+total+' 道题';
  }

  // 全局处理器（供 innerHTML 内 onclick 调用）
  window.b9SetQ=function(v){
    ss.q=v;
    clearTimeout(_deb);
    _deb=setTimeout(function(){
      renderSearch();
      const inp=document.getElementById('b9q');
      if(inp){ inp.focus(); const n=inp.value.length; try{ inp.setSelectionRange(n,n); }catch(_){} }
    },200);
  };
  window.b9Filter=function(field,v){ ss[field]=v; renderSearch(); };
  window.renderSearch=renderSearch;

})();

</script>
<script>/* === _b10.js === */
(function(){
  "use strict";
  // ============================================================
  //  _b10 过程教练：把"你答题时卡在哪"数据化，
  //  生成一人专属的薄弱项画像 + 人性化提升方案。
  //  与主站隔离：只读 shenlun_answers_v2，暴露 window.renderCoach。
  // ============================================================

  // 答题过程难点标签（作答弹窗里勾选用，主站 openAnswerModal 会读取 window.PROC_TAGS）
  window.PROC_TAGS = ["找不到材料","不会归纳概括","原词还是提炼","不知格式规范","不知写什么","看不懂题干","时间不够"];

  // 作答弹窗里切换难点标签（on 态会被 submitAnswer 读取）
  window.b10Toggle = function(el){
    if(!el) return;
    el.classList.toggle("on");
  };

  function loadAnswers(){
    try{ return JSON.parse(localStorage.getItem("shenlun_answers_v2")||"{}"); }
    catch(e){ return {}; }
  }
  function esc(s){
    s = s==null ? "" : String(s);
    return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; });
  }

  // 每个难点标签 → 一人专属教练话术（现象 / 为什么 / 怎么破 / 去练）
  var COACH = {
    "找不到材料": {
      cap:"材料定位力",
      why:"申论 80% 的要点就藏在材料里。找不到，往往不是你不会写，而是没把材料“读进去”——只看了字面，没画出逻辑线。",
      fix:[
        "读题先圈三要素：主体 / 问题 / 要求，带着问题回材料找",
        "材料分层：用铅笔在边上标 问题—原因—做法—成效 的逻辑线",
        "优先抄“动词+名词”原词，再归纳，绝不凭空编"
      ],
      go:[["框架卡·审题","window.renderFrames&&window.renderFrames()"],["热点专题","window.renderTopics&&window.renderTopics()"]]
    },
    "不会归纳概括": {

      fix:[
        "同义合并：意思一样的点坚决并成一条",

      ],
      go:[["框架卡·概括","window.renderFrames&&window.renderFrames()"],["背诵卡","window.renderRecite&&window.renderRecite()"]]
    },
    "原词还是提炼": {

      fix:[
        "名次、数据、政策表述 → 原词照抄，不要改",
        "口语、事例、现象 → 提炼为规范词（用 _b6 框架卡里的规范词库）",
        "看分值定字数：1 分≈1 个要点≈15-20 字，分少就别展开"
      ],
      go:[["框架卡·转化","window.renderFrames&&window.renderFrames()"],["规范词库","if(window.b2Go)window.b2Go('规范词库');else if(state){(state.scope='规范词库');render();}"]]
    },
    "不知格式规范": {
      cap:"格式规范力",
      why:"公文题丢分常常不是内容错，而是格式（标题/称谓/落款/分段）不对，评委一眼就扣分。",
      fix:[
        "公文先背格式模板：标题 / 称谓 / 正文 / 落款，缺一不可",
        "对策题用“总括句+分条”，每条“主体+动作+对象+结果”",
        "看题干关键词定格式：提纲/汇报/短评/讲话稿各有套路"
      ],
      go:[["框架卡·公文","window.renderFrames&&window.renderFrames()"],["大作文","window.renderEssay&&window.renderEssay()"]]
    },
    "不知写什么": {
      cap:"要点完整度",
      why:"你不是不会写，是不敢写满。申论“宁多勿漏”，要点覆盖度直接决定基础分。",
      fix:[
        "对照采分点反推：每少一点就补一个角度",

      ],
      go:[["答案对照","window.b8OpenCompare&&window.b8OpenCompare()"],["智能组卷","window.renderGenPaper&&window.renderGenPaper()"]]
    },
    "看不懂题干": {
      cap:"审题力",

      fix:[
        "拆题干五要素：作答对象 / 范围 / 题型 / 字数 / 特殊要求",
        "用框架卡里的“审题口诀”逐条过",

      fix:[
        "单题限时：概括15' / 对策20' / 分析25' / 作文留60'",
        "先骨架后填充：每题先写要点关键词，再扩写",

  // 聚合所有作答里的过程难点标签
  function aggregateTags(){
    var data = loadAnswers();
    var count = {};       // tag -> 次数
    var notes = [];       // 带自由反思的记录
    var total = 0, withProc = 0;
    Object.keys(data).forEach(function(k){
      var rec = data[k];
      if(!rec || typeof rec!=="object") return;
      total++;
      var p = rec.process;
      if(p && ((p.tags&&p.tags.length) || p.note)){
        withProc++;
        (p.tags||[]).forEach(function(t){ count[t]=(count[t]||0)+1; });
        if(p.note){
          notes.push({ key:k, tags:(p.tags||[]), note:p.note, score:rec.score, qtype:rec.qtype });
        }
      }
    });
    var sorted = Object.keys(count).map(function(t){ return [t, count[t]]; })
                    .sort(function(a,b){ return b[1]-a[1]; });
    return { total:total, withProc:withProc, sorted:sorted, count:count, notes:notes };
  }

  function tagBar(t, c, max){
    var pct = max? Math.round(c/max*100):0;
    return '<div class="b10-bar"><span class="b10-name">'+esc(t)+'</span>'+
           '<span class="b10-track"><span class="b10-fill" style="width:'+pct+'%"></span></span>'+
           '<span class="b10-cnt">'+c+' 次</span></div>';

  function coachCard(tag){

      return '<button class="b10-go" onclick="('+g[1]+')">➡️ '+esc(g[0])+'</button>';

    return '<div class="b10-coach">'+
      '<div class="b10-coach-h">🎯 你的最大薄弱项：<b>'+esc(c.cap)+'</b>（'+esc(tag)+'）</div>'+
      '<div class="b10-sec"><b>现象</b>：你多次在作答时卡在「'+esc(tag)+'」。</div>'+
      '<div class="b10-sec"><b>为什么</b>：'+esc(c.why)+'</div>'+
      '<div class="b10-sec"><b>怎么破（3 步）</b><ul class="b10-fix">'+fixHtml+'</ul></div>'+
      '<div class="b10-sec b10-goblock">'+goHtml+'</div>'+
      '</div>';
  }

  // 主入口：渲染"过程教练"页
  window.renderCoach = function(){
    var box = document.getElementById("content");
    if(!box) return;
    var ag = aggregateTags();

    if(ag.total===0){
      box.innerHTML = '<div class="b10-wrap"><h2>🧭 过程教练</h2>'+
        '<p class="muted">还没有作答记录。去「真题库 / 省考库」点「✍️ 作答」，<b>提交时勾选你卡在哪、写下当时怎么想</b>，这里就会生成你一人专属的薄弱项画像与提升方案。</p></div>';
      return;
    }
    if(ag.withProc===0){
      box.innerHTML = '<div class="b10-wrap"><h2>🧭 过程教练</h2>'+
        '<p class="muted">你已经作答 '+ag.total+' 次，但<b>还没记录过"答题过程笔记"</b>。下次作答提交时，勾选难点标签 + 写一句反思，我才能精准定位你"卡在哪一环"，而不只是告诉你"漏了哪几点"。</p></div>';
      return;
    }

    var max = ag.sorted.length? ag.sorted[0][1] : 1;
    var barsHtml = ag.sorted.map(function(r){ return tagBar(r[0], r[1], max); }).join("");
    var topTag = ag.sorted.length? ag.sorted[0][0] : null;
    var recent = ag.notes.slice(-6).reverse();
    var notesHtml = recent.length? recent.map(function(n){
      var tags = (n.tags||[]).map(function(t){ return '<span class="b10-chip on">'+esc(t)+'</span>'; }).join("");
      return '<div class="b10-note-item"><div class="b10-note-tags">'+tags+'</div>'+
             '<div class="b10-note-text">'+esc(n.note)+'</div>'+
             '<div class="b10-note-meta muted">'+esc(n.qtype||"")+(n.score!=null?" · 当次 "+n.score+"%":"")+'</div></div>';
    }).join("") : '<div class="muted">你勾选了难点标签，但还没写自由反思。下次补一句"当时怎么想的"，诊断会更准。</div>';

    box.innerHTML = '<div class="b10-wrap">'+
      '<h2>🧭 过程教练 <span class="muted">（基于 '+ag.withProc+' 次带过程笔记的作答）</span></h2>'+
      '<div class="b10-grid">'+
        '<div class="b10-card"><div class="b10-h2">📊 你卡在哪一环（过程难点频次）</div>'+barsHtml+
          (topTag?'<div class="b10-tip">你最常卡在 <b>'+esc(topTag)+'</b>。这往往才是你失分的真正根因，而非"不会写"。</div>':'')+
        '</div>'+
        (topTag? '<div class="b10-card">'+coachCard(topTag)+'</div>' : '')+
      '</div>'+
      '<div class="b10-card"><div class="b10-h2">📝 你的答题过程反思（最新）</div><div class="b10-notes">'+notesHtml+'</div></div>'+
      '<div class="b10-card b10-plan"><div class="b10-h2">🚀 为你定制的本周微计划</div>'+weeklyPlan(ag)+'</div>'+
      '</div>';
  };

  // 基于过程画像生成一人专属微计划（结合考试倒计时由 _b5 提供，缺失则给通用版）
  var PLAN_KEY = "shenlun_planlog_v1";
  function planLog(){ try{ return JSON.parse(localStorage.getItem(PLAN_KEY)||"[]")||[]; }catch(e){ return []; } }
  function isTodayTs(ts){ try{ var d=new Date(ts), t=new Date(); return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate(); }catch(e){ return false; } }
  window.b10PlanDone = function(idx){
    try{
      var log = planLog();
      log.push({ts: Date.now(), idx: idx});
      localStorage.setItem(PLAN_KEY, JSON.stringify(log));
      if(typeof window.renderCoach==="function") window.renderCoach();
      if(typeof flash==="function") flash("已打卡，学习激励热力图已点亮 ✅");
    }catch(e){ console.warn("计划打卡失败", e); }
  };
  function weeklyPlan(ag){
    if(!ag.sorted.length) return '<div class="muted">先记录过程笔记，我再为你排计划。</div>';
    var todayDone = {};
    try{ planLog().forEach(function(e){ if(e && e.idx!=null && isTodayTs(e.ts)) todayDone[e.idx]=1; }); }catch(e){}
    var items = [];
    ag.sorted.slice(0,3).forEach(function(r, i){
      var c = COACH[r[0]];
      if(!c) return;
      var btn = todayDone[i] ? '<span class="b10-plan-ok">✅ 今日已打卡</span>'
                              : '<button type="button" class="b10-plan-done" onclick="b10PlanDone('+i+')">✅ 完成打卡</button>';
      items.push('<div class="b10-plan-row"><span class="b10-plan-no">'+(i+1)+'</span>'+
        '<div class="b10-plan-body"><b>主攻 '+esc(c.cap)+'</b>（你卡了 '+r[1]+' 次）<br><span class="muted">'+esc((c.fix||[]).slice(0,2).join("；"))+'</span></div>'+ btn +'</div>');
    });
    // 倒计时信息（若 _b5 已记录）
    var examTip = "";
    try{
      var m = JSON.parse(localStorage.getItem("shenlun_motiv_v1")||"{}");
      if(m && m.examDate){
        var d = Math.max(0, Math.ceil((new Date(m.examDate)-new Date())/86400000));
        examTip = '<div class="b10-exam">⏰ 距你设定的考试还有 <b>'+d+'</b> 天，建议每天只攻 1 个薄弱项，小步快跑。完成打卡的每天都会在学习激励热力图点亮。</div>';
      }
    }catch(e){}
    return examTip + (items.join("")||'<div class="muted">—</div>');
  }

  // ============ 多模态提交辅助（图片预览 / 文本·Word 载入） ============
  // 数据暂存：ansImg=手写答案照片, noteImg=思路照片
  window.__b10 = window.__b10 || {ansImg:null,noteImg:null};
  window.b10ImgPreview = function(input, prevId, kind){
    var prev=document.getElementById(prevId); if(!prev) return;
    var f=input.files&&input.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ alert("请选择图片文件"); input.value=""; return; }
    var r=new FileReader();
    r.onload=function(){
      var url=r.result;
      if(kind==="ans") window.__b10.ansImg=url; else window.__b10.noteImg=url;
      prev.innerHTML='<div class="ans-thumb"><img src="'+url+'" alt="preview">'+
        '<button type="button" class="ans-thumbx" onclick="b10RemoveImg(\''+kind+'\',\''+prevId+'\',\''+input.id+'\')">✕</button></div>';
    };
    r.readAsDataURL(f);
  };
  window.b10RemoveImg = function(kind, prevId, inputId){
    if(kind==="ans") window.__b10.ansImg=null; else window.__b10.noteImg=null;
    var prev=document.getElementById(prevId); if(prev) prev.innerHTML="";
    var inp=document.getElementById(inputId); if(inp) inp.value="";
  };
  window.b10FileLoad = function(input){
    var f=input.files&&input.files[0]; if(!f) return;
    var ta=document.getElementById("ansText");
    var name=(f.name||"").toLowerCase();
    if(name.endsWith(".txt")||name.endsWith(".md")||f.type==="text/plain"){
      var r=new FileReader();
      r.onload=function(){ if(ta){ ta.value=r.result; ta.dispatchEvent(new Event("input")); } if(typeof flash==="function") flash("已载入文本，可直接修改后提交"); };
      r.readAsText(f,"utf-8");
    } else if(name.endsWith(".docx")){
      alert("离线版暂不支持直接解析 Word(.docx)。两个办法：\n① 在 Word 里 Ctrl+A 全选 → Ctrl+C 复制 → 此处 Ctrl+V 粘贴；\n② 另存为 .txt 后再上传。");
      input.value="";
    } else {
      alert("仅支持 .txt / .md / .docx，或用 Ctrl+V 粘贴 Word 内容");
      input.value="";
    }
  };

})();

</script>
<script>/* === _b11.js === */
(function(){
  "use strict";
  /* ==================================================================
     _b11 采分点自标校准（Self-Calibration Drill）
     训练"评分者视角"：先不看成案，自己列出"我猜有哪几个采分点"，
     再与 q.points 对照，输出 命中 / 漏标 / 偏标，并沉淀校准记录。
     与主站隔离：只读 DATA、findQ（不可用时自带兜底），
     只写 localStorage["shenlun_selfcal_v1"]，暴露 window.renderSelfCal。
     所有类名 b11- 前缀，样式复用主站 :root 变量。
     ================================================================== */

  var LS_KEY   = "shenlun_selfcal_v1";
  var MIN_ROWS = 3;      // 至少 3 行自标
  var MAX_ROWS = 20;
  var HIT      = 0.5;    // 字符重叠率 ≥ 0.5 判命中
  var TAG_CN   = { core:"核心", flex:"弹性", fmt:"格式" };

  /* 自带 HTML 转义，不依赖主站 */
  var ESC = window.esc || function(s){
    s = (s == null) ? "" : String(s);
    return s.replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  };

  /* 模块内状态（不碰主站 state） */
  var S = { pid:"", qno:"", rows:["","",""], result:null, showMat:false };

  /* ---------- 样式自挂载（主站未 link _b11.css 时兜底，不改任何文件） ---------- */
  function ensureCss(){
    try{
      var ls = document.getElementsByTagName("link"), i;
      for(i=0;i<ls.length;i++){
        if(String(ls[i].getAttribute("href")||"").indexOf("_b11.css") >= 0) return;
      }
      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b11.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  /* ---------- 数据安全访问 ---------- */
  function papers(){
    try{
      var D = (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null);
      return (D && Object.prototype.toString.call(D.papers) === "[object Array]") ? D.papers : [];
    }catch(e){ return []; }
  }
  function localFind(pid, qno){
    var ps = papers(), i, j, qs;
    for(i=0;i<ps.length;i++){
      if(String(ps[i] && ps[i].id) !== String(pid)) continue;
      qs = (ps[i].questions || []);
      for(j=0;j<qs.length;j++){
        if(String(qs[j] && qs[j].no) === String(qno)) return { p:ps[i], q:qs[j] };
      }
    }
    return null;
  }
  /* 优先用主站 findQ（其 no 为数字，做双形态尝试），失败回落本地实现 */
  function getQ(pid, qno){
    if(!pid || qno === "" || qno == null) return null;
    try{
      if(typeof findQ === "function"){
        var f = findQ(pid, qno);
        if(!f && String(Number(qno)) === String(qno)) f = findQ(pid, Number(qno));
        if(f && f.q) return f;
      }
    }catch(e){}
    try{ return localFind(pid, qno); }catch(e){ return null; }
  }
  function paperById(pid){
    var ps = papers(), i;
    for(i=0;i<ps.length;i++) if(String(ps[i].id) === String(pid)) return ps[i];
    return null;
  }

  /* ---------- 文本相似：2-4gram 重叠率 ---------- */
  function norm(s){
    return String(s == null ? "" : s).toLowerCase()
      .replace(/[\s\u3000]/g, "")
      .replace(/[，。、；：？！“”‘’（）《》〈〉【】—…·,.;:?!"'()<>\[\]{}\/\\|`~@#$%^&*_+=\-]/g, "");
  }
  function grams(s, n){
    var out = {}, i;
    if(!s) return out;
    if(s.length <= n){ out[s] = 1; return out; }
    for(i=0;i+n<=s.length;i++) out[s.substr(i, n)] = 1;
    return out;
  }
  function overlap(ga, gb){
    var ka = Object.keys(ga), kb = Object.keys(gb), hit = 0, i;
    if(!ka.length || !kb.length) return 0;
    for(i=0;i<ka.length;i++) if(gb[ka[i]]) hit++;
    return hit / Math.min(ka.length, kb.length);
  }
  function sim(a, b){
    var A = norm(a), B = norm(b);
    if(!A || !B) return 0;
    if(A.length >= 3 && B.indexOf(A) >= 0) return 1;   // 包含即命中
    if(B.length >= 3 && A.indexOf(B) >= 0) return 1;
    var s2 = overlap(grams(A,2), grams(B,2));
    var s3 = overlap(grams(A,3), grams(B,3));
    var s4 = overlap(grams(A,4), grams(B,4));
    return Math.min(1, Math.max(s2, s3 * 1.2, s4 * 1.4)); // 长 gram 命中更可信，给权重
  }

  /* ---------- 校准：贪心一对一匹配 ---------- */
  function calibrate(mine, points){
    var pairs = [], missed = [], extra = [], used = {}, i, j, best, bestS, s;
    for(i=0;i<points.length;i++){
      best = -1; bestS = 0;
      for(j=0;j<mine.length;j++){
        if(used[j]) continue;
        s = sim(mine[j].text, (points[i] && points[i].text) || "");
        if(s > bestS){ bestS = s; best = j; }
      }
      if(best >= 0 && bestS >= HIT){
        used[best] = 1;
        pairs.push({ pt:points[i], mine:mine[best], s:bestS });
      }else{
        missed.push(points[i]);
      }
    }
    for(j=0;j<mine.length;j++) if(!used[j]) extra.push(mine[j]);
    return { pairs:pairs, missed:missed, extra:extra, total:points.length, hit:pairs.length };
  }

  /* ---------- 训练价值文案 ---------- */
  var BUCKETS = [
    { k:"对策", re:/(要|应|须|应当|加强|完善|建立|健全|推进|落实|强化|优化|加大|构建|推动|开展|规范|加快|坚持|扶持|引导|培育|整治|完善机制)/,
      tip:"你常漏「对策类」要点——下次先扫材料里的“要 / 应 / 须 / 加强 / 完善 / 建立”，凡是动词打头的句子，基本都是采分点。" },
    { k:"问题", re:/(不足|缺乏|缺失|不够|难以|滞后|薄弱|问题|矛盾|困难|不到位|欠缺|失衡|短板|流失|下降|不高|不强|无人|闲置)/,
      tip:"你常漏「问题类」要点——材料里的否定词（不、缺、难、少、弱）就是采分点的路标，读的时候把它们直接圈出来。" },
    { k:"原因", re:/(原因|由于|因为|导致|源于|根源|造成|受限于|以致)/,
      tip:"你常漏「原因类」要点——看到“由于 / 导致 / 之所以”就要停一下，问题背后的成因往往单独占分。" },
    { k:"影响", re:/(有利于|促进|带动|提升|提高|增强|意义|作用|影响|效果|成效|实现|保障了|激发)/,
      tip:"你常漏「意义/影响类」要点——做法写完别停，材料后半段的“促进了 / 带动了 / 有利于”通常是另一个独立得分点。" },
    { k:"主体", re:/(政府|部门|企业|村民|群众|社会|社区|高校|媒体|市场|干部|农民|居民|志愿者|协会|合作社)/,
      tip:"你常漏「主体类」要点——同一件事换个主体（政府/企业/群众/社会组织）就是新的一条，按主体扫一遍材料能补回不少分。" }
  ];
  function bucketOf(text){
    var t = String(text || ""), i;
    for(i=0;i<BUCKETS.length;i++) if(BUCKETS[i].re.test(t)) return i;
    return -1;
  }
  function advise(res, q, guessN){
    var tips = [], i, k, cnt = {}, top = -1, coreMiss = 0, rate;
    if(!res.total) return ["这道题库里暂时没有标准采分点，先自己列点，再回材料逐句核对。"];
    rate = res.hit / res.total;

    for(i=0;i<res.missed.length;i++){
      k = bucketOf(res.missed[i] && res.missed[i].text);
      if(k < 0) continue;
      cnt[k] = (cnt[k] || 0) + 1;
      if(top < 0 || cnt[k] > cnt[top]) top = k;
    }
    if(top >= 0) tips.push(BUCKETS[top].tip);

    for(i=0;i<res.missed.length;i++) if((res.missed[i] && res.missed[i].tag) === "core") coreMiss++;
    if(coreMiss >= 2){
      tips.push("漏掉的点里有 " + coreMiss + " 个是「核心点」。核心点通常藏在段首句、领导/专家讲话句、带数据的结论句——读材料时先给这三类句子画线。");
    }
    if(res.extra.length > Math.max(1, Math.round(res.total * 0.5))){
      tips.push("你多标了 " + res.extra.length + " 条，这是典型的“凭印象编点”。阅卷只认材料里有出处的点，宁可少写一条，也别写想当然的话。");
    }
    if(guessN > res.total + 2){
      tips.push("你猜了 " + guessN + " 个点，实际只有 " + res.total + " 个：你的问题不是找不到，而是<b>没合并同类项</b>，答案会被拆得又碎又长。");
    }else if(guessN > 0 && guessN < res.total - 1){
      tips.push("你只列了 " + guessN + " 个点，实际有 " + res.total + " 个：先按“材料段数 ≈ 要点数”做个下限估计，别提前收手。");
    }
    if(rate >= 0.8){
      tips.push("命中率 " + Math.round(rate * 100) + "%，你的“评分者视角”已经建立起来了——接下来练的是把点写全、写短、写规范。");
    }else if(rate < 0.4){
      tips.push("命中率低不是坏事：它说明你写出来的答案和阅卷人心里的答案是两套东西。连做 5 道自标校准，比多写 5 篇答案有用。");
    }
    if(!tips.length) tips.push("继续练，让你脑子里的“采分点清单”一点点和标准答案重合。");
    return tips;
  }

  /* ---------- 历史记录 ---------- */
  function loadHis(){
    try{
      var a = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
      return (Object.prototype.toString.call(a) === "[object Array]") ? a : [];
    }catch(e){ return []; }
  }
  function saveHis(a){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(a.slice(0, 200))); }catch(e){}
  }
  function pushHis(rec){
    var a = loadHis(); a.unshift(rec); saveHis(a);
  }
  function fmtTime(t){
    try{
      var d = new Date(t);
      function z(n){ return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()) + " " + z(d.getHours()) + ":" + z(d.getMinutes());
    }catch(e){ return ""; }
  }

  /* ---------- 片段渲染 ---------- */
  function pickerHtml(){
    var ps = papers(), i, h = "", p, qs, j;
    if(!ps.length) return '<div class="b11-empty">没有读到题库数据（DATA.papers）。请确认已在主站页面内运行本模块。</div>';
    h += '<div class="b11-pick">';
    h += '<label class="b11-lb">套卷</label><select class="b11-sel" data-act="pid"><option value="">— 请选择套卷 —</option>';
    for(i=0;i<ps.length;i++){
      p = ps[i];
      h += '<option value="' + ESC(p.id) + '"' + (String(p.id) === String(S.pid) ? " selected" : "") + '>'
         + ESC(String(p.year || "") + " " + String(p.paper || "")) + (p.province ? "（" + ESC(p.province) + "）" : "") + "</option>";
    }
    h += "</select>";
    h += '<label class="b11-lb">题目</label><select class="b11-sel" data-act="qno">';
    p = paperById(S.pid);
    qs = p ? (p.questions || []) : [];
    if(!p){ h += '<option value="">— 先选套卷 —</option>'; }
    else{
      h += '<option value="">— 请选择题目 —</option>';
      for(j=0;j<qs.length;j++){
        h += '<option value="' + ESC(qs[j].no) + '"' + (String(qs[j].no) === String(S.qno) ? " selected" : "") + '>'
           + ESC("题" + qs[j].no + " " + (qs[j].qtype || "")) + "</option>";
      }
    }
    h += "</select>";
    h += "</div>";
    return h;
  }

  function drillHtml(f){
    var q = f.q, p = f.p, h = "", i, stem, mat;
    stem = (q.stem || []).map(function(s){ return "<div>" + ESC(s) + "</div>"; }).join("");
    h += '<div class="b11-card">';
    h += '<div class="b11-h3">② 审题（标准答案已隐藏）</div>';
    h += '<div class="b11-qmeta">' + ESC(String(p.year || "") + " " + String(p.paper || "")) + ' · 题' + ESC(q.no) + ' · <b>' + ESC(q.qtype || "") + "</b></div>";
    h += '<div class="b11-stem">' + (stem || '<div class="b11-sub">（该题无题干文本）</div>') + "</div>";
    if((q.material || []).length){
      h += '<button class="b11-btn ghost" data-act="mat">' + (S.showMat ? "收起给定资料" : "展开给定资料（" + q.material.length + " 段）") + "</button>";
      if(S.showMat){
        mat = q.material.map(function(s){ return "<div>" + ESC(s) + "</div>"; }).join("");
        h += '<div class="b11-mat">' + mat + "</div>";
      }
    }
    h += "</div>";

    h += '<div class="b11-card">';
    h += '<div class="b11-h3">③ 自标：你猜这道题有几个采分点，分别是什么</div>';
    h += '<div class="b11-warn">先别翻答案。凭材料和直觉一条一条列出来——列错不丢人，列不出来才是真问题。</div>';
    h += '<div class="b11-rows">';
    for(i=0;i<S.rows.length;i++){
      h += '<div class="b11-row"><span class="b11-no">' + (i + 1) + "</span>"
         + '<textarea class="b11-ta" data-i="' + i + '" rows="2" placeholder="我认为的第 ' + (i + 1) + ' 个采分点…">' + ESC(S.rows[i]) + "</textarea>"
         + '<button class="b11-x" data-act="del" data-i="' + i + '" title="删除这行">×</button></div>';
    }
    h += "</div>";
    h += '<div class="b11-acts">';
    h += '<button class="b11-btn ghost" data-act="add">＋ 再加一行</button>';
    h += '<button class="b11-btn primary" data-act="check">对照标准 →</button>';
    h += '<button class="b11-btn ghost" data-act="reset">清空重来</button>';
    h += '<span class="b11-sub">已列 ' + S.rows.filter(function(t){ return String(t).trim(); }).length + " 条</span>";
    h += "</div></div>";
    return h;
  }

  function resultHtml(f){
    var r = S.result, h = "", i, tips, rate, pct;
    if(!r) return "";
    rate = r.total ? r.hit / r.total : 0;
    pct  = Math.round(rate * 100);
    tips = advise(r, f.q, r.guessN);

    h += '<div class="b11-card b11-res">';
    h += '<div class="b11-h3">④ 校准结果</div>';
    h += '<div class="b11-score"><b class="' + (pct >= 70 ? "ok" : (pct >= 40 ? "mid" : "bad")) + '">' + r.hit + " / " + r.total + "</b>"
       + '<span class="b11-sub">你标中 ' + r.hit + " 个，共 " + r.total + " 个采分点 · 命中率 " + pct + "%"
       + "（你猜有 " + r.guessN + " 个）</span></div>";
    h += '<div class="b11-track"><i style="width:' + pct + '%"></i></div>';

    h += '<div class="b11-cols">';
    /* 命中 */
    h += '<div class="b11-col ok"><div class="b11-colh">✅ 你标中的（' + r.pairs.length + "）</div>";
    if(!r.pairs.length) h += '<div class="b11-sub">一个都没对上——别慌，这正是这道训练存在的意义。</div>';
    for(i=0;i<r.pairs.length;i++){
      h += '<div class="b11-item"><div class="b11-std"><span class="b11-tag ' + ESC(r.pairs[i].pt.tag || "") + '">'
         + ESC(TAG_CN[r.pairs[i].pt.tag] || r.pairs[i].pt.tag || "点") + "</span>" + ESC(r.pairs[i].pt.text || "") + "</div>"
         + '<div class="b11-mine">你写的：' + ESC(r.pairs[i].mine.text) + ' <span class="b11-sub">（重叠 ' + Math.round(r.pairs[i].s * 100) + "%）</span></div></div>";
    }
    h += "</div>";
    /* 漏标 */
    h += '<div class="b11-col bad"><div class="b11-colh">❌ 你漏标的点（' + r.missed.length + "）</div>";
    if(!r.missed.length) h += '<div class="b11-sub">全部覆盖，采分点雷达很准。</div>';
    for(i=0;i<r.missed.length;i++){
      h += '<div class="b11-item"><div class="b11-std"><span class="b11-tag ' + ESC(r.missed[i].tag || "") + '">'
         + ESC(TAG_CN[r.missed[i].tag] || r.missed[i].tag || "点") + "</span>" + ESC(r.missed[i].text || "") + "</div></div>";
    }
    h += "</div>";
    /* 偏标 */
    h += '<div class="b11-col warn"><div class="b11-colh">⚠️ 你偏标 / 多标的（' + r.extra.length + "）</div>";
    if(!r.extra.length) h += '<div class="b11-sub">没有多余动作，很干净。</div>';
    for(i=0;i<r.extra.length;i++){
      h += '<div class="b11-item"><div class="b11-mine">' + ESC(r.extra[i].text) + "</div></div>";
    }
    h += "</div>";
    h += "</div>";

    h += '<div class="b11-tip"><b>训练价值</b>';
    for(i=0;i<tips.length;i++) h += "<div>· " + tips[i] + "</div>";
    h += "</div>";
    h += '<div class="b11-acts"><button class="b11-btn ghost" data-act="reset">再练一遍这道题</button></div>';
    h += "</div>";
    return h;
  }

  function historyHtml(){
    var a = loadHis(), h = "", i, rec, pct, sum = 0, n = 0;
    h += '<div class="b11-card">';
    h += '<div class="b11-h3">⑤ 历史校准记录 <span class="b11-sub">（本机 localStorage，离线保存）</span></div>';
    if(!a.length){
      h += '<div class="b11-sub">还没有记录。做完第一次对照就会自动存在这里。</div></div>';
      return h;
    }
    for(i=0;i<a.length;i++){
      if(a[i] && a[i].total){ sum += (a[i].hit / a[i].total); n++; }
    }
    h += '<div class="b11-stat">累计 <b>' + a.length + "</b> 次校准 · 平均命中率 <b>" + (n ? Math.round(sum / n * 100) : 0) + "%</b>"
       + ' <button class="b11-btn ghost sm" data-act="clearhis">清空记录</button></div>';
    h += '<div class="b11-his">';
    for(i=0;i<a.length && i<40;i++){
      rec = a[i] || {};
      pct = rec.total ? Math.round((rec.hit || 0) / rec.total * 100) : 0;
      h += '<div class="b11-hi"><div class="b11-hih">'
         + '<b class="' + (pct >= 70 ? "ok" : (pct >= 40 ? "mid" : "bad")) + '">' + (rec.hit || 0) + "/" + (rec.total || 0) + "</b> "
         + ESC(String(rec.title || rec.pid || "")) + " · 题" + ESC(rec.qno) + " " + ESC(rec.qtype || "")
         + '<span class="b11-sub">' + ESC(fmtTime(rec.time)) + "</span>"
         + '<button class="b11-x sm" data-act="delhis" data-i="' + i + '" title="删除">×</button></div>';
      if((rec.mine || []).length){
        h += '<div class="b11-hib">自标：' + ESC(rec.mine.join(" ｜ ")) + "</div>";
      }
      h += "</div>";
    }
    h += "</div></div>";
    return h;
  }

  /* ---------- 主渲染 ---------- */
  function draw(){
    var box, h, f;
    box = document.getElementById("content");
    if(!box) return;
    ensureCss();

    h  = '<div class="b11-wrap">';
    h += '<div class="b11-head"><h2>🎯 采分点自标校准</h2>'
       + '<p class="b11-lead">不看成案，先自己列出“我认为这道题有哪几个采分点”，再一键对照标准。练的不是写作，是<b>评分者视角</b>——申论提分中最被低估的元认知训练。</p></div>';
    h += '<div class="b11-card"><div class="b11-h3">① 选题</div>' + pickerHtml() + "</div>";

    f = getQ(S.pid, S.qno);
    if(S.pid && S.qno && !f){
      h += '<div class="b11-card"><div class="b11-empty">未找到该题（findQ 校验失败），请重新选择。</div></div>';
    }else if(f){
      h += drillHtml(f);
      h += resultHtml(f);
    }
    h += historyHtml();
    h += "</div>";

    box.innerHTML = h;
    bind(box);

    try{
      var st = document.getElementById("stats");
      if(st) st.textContent = "采分点自标校准 · 训练评分者视角";
    }catch(e){}
  }

  /* ---------- 事件 ---------- */
  function syncRows(root){
    try{
      var tas = root.querySelectorAll(".b11-ta"), i, idx;
      for(i=0;i<tas.length;i++){
        idx = parseInt(tas[i].getAttribute("data-i"), 10);
        if(!isNaN(idx)) S.rows[idx] = tas[i].value;
      }
    }catch(e){}
  }
  function doCheck(root){
    var f = getQ(S.pid, S.qno), mine = [], i, t, pts, res, p;
    if(!f){ draw(); return; }
    syncRows(root);
    for(i=0;i<S.rows.length;i++){
      t = String(S.rows[i] || "").trim();
      if(t) mine.push({ i:i, text:t });
    }
    if(!mine.length){
      try{ alert("先至少列出 1 条你自己认为的采分点，再来对照。"); }catch(e){}
      return;
    }
    pts = (f.q.points || []).filter(function(x){ return x && x.text; });
    res = calibrate(mine, pts);
    res.guessN = mine.length;
    S.result = res;

    p = f.p;
    pushHis({
      time : Date.now(),
      pid  : S.pid,
      qno  : S.qno,
      title: String(p.year || "") + " " + String(p.paper || ""),
      qtype: f.q.qtype || "",
      mine : mine.map(function(m){ return m.text; }),
      hit  : res.hit,
      total: res.total,
      missed: res.missed.map(function(x){ return x.text; })
    });
    draw();
  }
  function bind(box){
    var root = box.querySelector(".b11-wrap");
    if(!root) return;

    root.addEventListener("input", function(ev){
      var el = ev.target;
      if(el && el.className && String(el.className).indexOf("b11-ta") >= 0){
        var idx = parseInt(el.getAttribute("data-i"), 10);
        if(!isNaN(idx)) S.rows[idx] = el.value;
      }
    });

    root.addEventListener("change", function(ev){
      var el = ev.target, act = el && el.getAttribute && el.getAttribute("data-act");
      if(act === "pid"){
        S.pid = el.value; S.qno = ""; S.rows = ["", "", ""]; S.result = null; S.showMat = false; draw();
      }else if(act === "qno"){
        S.qno = el.value; S.rows = ["", "", ""]; S.result = null; S.showMat = false; draw();
      }
    });

    root.addEventListener("click", function(ev){
      var el = ev.target, act, idx, a;
      while(el && el !== root && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
      if(!el || el === root) return;
      act = el.getAttribute("data-act");
      idx = parseInt(el.getAttribute("data-i"), 10);

      if(act === "add"){
        syncRows(root);
        if(S.rows.length < MAX_ROWS) S.rows.push("");
        draw();
      }else if(act === "del"){
        syncRows(root);
        if(S.rows.length > MIN_ROWS && !isNaN(idx)) S.rows.splice(idx, 1);
        else if(!isNaN(idx)) S.rows[idx] = "";
        draw();
      }else if(act === "check"){
        doCheck(root);
      }else if(act === "reset"){
        S.rows = ["", "", ""]; S.result = null; draw();
      }else if(act === "mat"){
        syncRows(root); S.showMat = !S.showMat; draw();
      }else if(act === "delhis"){
        a = loadHis();
        if(!isNaN(idx) && idx >= 0 && idx < a.length){ a.splice(idx, 1); saveHis(a); draw(); }
      }else if(act === "clearhis"){
        try{ if(!confirm("确定清空全部校准记录？")) return; }catch(e){}
        saveHis([]); draw();
      }
    });
  }

  /* ---------- 路由入口 ---------- */
  window.renderSelfCal = function(){
    try{
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = '<div class="b11-empty">采分点自标校准模块运行出错：' + ESC(String((err && err.message) || err)) + "</div>";
      }catch(e){}
      try{ console.error("[_b11]", err); }catch(e){}
    }
  };

})();

</script>
<script>/* === _b12.js === */
(function(){
  "use strict";
  /* ==================================================================
     _b12 材料阅读训练器（Material Reading Trainer）
     申论 80% 的分藏在材料里。本模块专训"材料 → 要点"的转化：
       模式A 标层次：给每段材料打 问题/原因/做法/成效/其他 标签，
                     再按"采分点来源段是否被标对"给反馈；
       模式B 摘原词：从材料里摘可直接入答案的原词原句，
                     与 q.points 做 2-4gram 重叠匹配，报告覆盖率。
     与主站隔离：只读 DATA / findQ（不可用时自带兜底遍历），
     只写 localStorage["shenlun_mattrain_v1"]，暴露 window.renderMatTrain。
     所有类名 b12- 前缀，样式复用主站 :root 变量。
     ================================================================== */

  var LS_KEY = "shenlun_mattrain_v1";
  var HIT    = 0.45;   /* 摘词命中阈值：与采分点重叠率 ≥ 0.45 视为覆盖 */
  var SRC    = 0.30;   /* 溯源阈值：采分点与某段材料重叠率 ≥ 0.30 视为出自该段 */
  var TAG_CN = { core:"核心", flex:"弹性", fmt:"格式" };

  /* 层次标签体系 */
  var LEVELS = [
    { k:"problem", cn:"问题", cls:"pb" },
    { k:"cause",   cn:"原因", cls:"cs" },
    { k:"action",  cn:"做法", cls:"ac" },
    { k:"effect",  cn:"成效", cls:"ef" },
    { k:"other",   cn:"其他", cls:"ot" }
  ];
  function levelCn(k){
    for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].k === k) return LEVELS[i].cn;
    return "未标";
  }
  function levelCls(k){
    for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].k === k) return LEVELS[i].cls;
    return "";
  }

  /* 自带 HTML 转义，不依赖主站 */
  function esc(s){
    s = (s == null) ? "" : String(s);
    return s.replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  /* 模块内状态（不碰主站 state） */
  var S = {
    pid:"", qno:"", mode:"A",
    tags:{},        /* 段索引 -> level key */
    pick:"",        /* 模式B 的摘词框内容 */
    resA:null, resB:null,
    showStd:false
  };

  /* ---------- 样式自挂载（主站未 link _b12.css 时兜底，不改任何文件） ---------- */
  function ensureCss(){
    try{
      var ls = document.getElementsByTagName("link"), i;
      for(i=0;i<ls.length;i++){
        if(String(ls[i].getAttribute("href") || "").indexOf("_b12.css") >= 0) return;
      }
      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b12.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  /* ---------- 数据安全访问 ---------- */
  function papers(){
    try{
      var D = (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null);
      return (D && Object.prototype.toString.call(D.papers) === "[object Array]") ? D.papers : [];
    }catch(e){ return []; }
  }
  function localFind(pid, qno){
    var ps = papers(), i, j, qs;
    for(i=0;i<ps.length;i++){
      if(String(ps[i] && ps[i].id) !== String(pid)) continue;
      qs = (ps[i].questions || []);
      for(j=0;j<qs.length;j++){
        if(String(qs[j] && qs[j].no) === String(qno)) return { p:ps[i], q:qs[j] };
      }
    }
    return null;
  }
  /* 优先用主站 findQ（其 no 为数字，做双形态尝试），失败回落本地遍历 */
  function getQ(pid, qno){
    if(!pid || qno === "" || qno == null) return null;
    try{
      if(typeof findQ === "function"){
        var f = findQ(pid, qno);
        if(!f && String(Number(qno)) === String(qno)) f = findQ(pid, Number(qno));
        if(f && f.q) return f;
      }
    }catch(e){}
    try{ return localFind(pid, qno); }catch(e){ return null; }
  }
  function paperById(pid){
    var ps = papers(), i;
    for(i=0;i<ps.length;i++) if(String(ps[i].id) === String(pid)) return ps[i];
    return null;
  }
  function matOf(q){
    try{
      var m = q && q.material;
      if(Object.prototype.toString.call(m) !== "[object Array]") return [];
      return m.filter(function(x){ return String(x == null ? "" : x).trim(); })
              .map(function(x){ return String(x); });
    }catch(e){ return []; }
  }
  function ptsOf(q){
    try{
      var a = q && q.points;
      if(Object.prototype.toString.call(a) !== "[object Array]") return [];
      return a.filter(function(x){ return x && x.text; });
    }catch(e){ return []; }
  }

  /* ---------- 文本相似：2-4gram 重叠 ---------- */
  function norm(s){
    return String(s == null ? "" : s).toLowerCase()
      .replace(/[\s\u3000]/g, "")
      .replace(/[，。、；：？！“”‘’（）《》〈〉【】—…·,.;:?!"'()<>\[\]{}\/\\|`~@#$%^&*_+=\-]/g, "");
  }
  function grams(s, n){
    var out = {}, i;
    if(!s) return out;
    if(s.length <= n){ out[s] = 1; return out; }
    for(i=0;i+n<=s.length;i++) out[s.substr(i, n)] = 1;
    return out;
  }
  /* 以 a 为基准，看 a 的 gram 有多少落在 b 里（覆盖率，方向敏感） */
  function cover(a, b, n){
    var ga = grams(a, n), gb = grams(b, n), ka = Object.keys(ga), hit = 0, i;
    if(!ka.length || !Object.keys(gb).length) return 0;
    for(i=0;i<ka.length;i++) if(gb[ka[i]]) hit++;
    return hit / ka.length;
  }
  /* 用户摘的词 vs 采分点：短句被长句包含也算命中 */
  function sim(mine, pt){
    var A = norm(mine), B = norm(pt);
    if(!A || !B) return 0;
    if(A.length >= 4 && B.indexOf(A) >= 0) return 1;
    if(B.length >= 4 && A.indexOf(B) >= 0) return 1;
    var base = A.length <= B.length ? A : B;
    var other = A.length <= B.length ? B : A;
    var s2 = cover(base, other, 2);
    var s3 = cover(base, other, 3);
    var s4 = cover(base, other, 4);
    return Math.min(1, Math.max(s2 * 0.85, s3, s4 * 1.15));
  }
  /* 采分点溯源：该点最像哪一段材料 */
  function traceSource(ptText, mats){
    var best = -1, bestS = 0, i, s;
    for(i=0;i<mats.length;i++){
      s = Math.max(cover(norm(ptText), norm(mats[i]), 3), cover(norm(ptText), norm(mats[i]), 2) * 0.8);
      if(s > bestS){ bestS = s; best = i; }
    }
    return { idx: bestS >= SRC ? best : -1, score: bestS };
  }

  /* ---------- 规则：材料段落的"应然层次"推断（用于标准拆解 + 模式A 判分） ---------- */
  var RULES = [
    { k:"effect",  re:/(成效|效果|成果|取得|实现了|带动了|促进了|提升了|提高了|增加了|增长|增收|下降了|荣获|获评|示范|典型|变成了|如今|截至目前|累计|同比|亩产|收入达|突破)/ },
    { k:"action",  re:/(要|应当|应该|必须|加强|完善|建立|健全|推进|推动|落实|强化|优化|加大|构建|开展|实施|探索|出台|制定|引入|引导|培育|整治|扶持|组织|设立|打造|推行|试点|统筹|规范|加快|坚持|通过.{0,8}(方式|办法|机制))/ },
    { k:"cause",   re:/(原因|由于|因为|之所以|导致|源于|根源|造成|受制于|受限于|以致|归因|究其)/ },
    { k:"problem", re:/(不足|缺乏|缺失|缺少|不够|难以|滞后|薄弱|问题|矛盾|困难|不到位|欠缺|失衡|短板|流失|闲置|下降|不高|不强|无人|空心化|老龄化|抱怨|投诉|反映强烈|亟待|亟需|尚未|没有)/ }
  ];
  function inferLevel(text){
    var t = String(text || ""), i;
    /* 优先级：成效 > 做法 > 原因 > 问题，先命中先返回；均不命中为其他 */
    for(i=0;i<RULES.length;i++) if(RULES[i].re.test(t)) return RULES[i].k;
    return "other";
  }

  /* ---------- 记录 ---------- */
  function loadHis(){
    try{
      var a = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
      return (Object.prototype.toString.call(a) === "[object Array]") ? a : [];
    }catch(e){ return []; }
  }
  function saveHis(a){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(a.slice(0, 200))); }catch(e){}
  }
  function pushHis(rec){ var a = loadHis(); a.unshift(rec); saveHis(a); }
  function fmtTime(t){
    try{
      var d = new Date(t);
      function z(n){ return (n < 10 ? "0" : "") + n; }
      return d.getFullYear() + "-" + z(d.getMonth()+1) + "-" + z(d.getDate()) + " " + z(d.getHours()) + ":" + z(d.getMinutes());
    }catch(e){ return ""; }
  }

  /* ================= 判分：模式A 标层次 ================= */
  /*
     规则（可解释、不玄学）：
     1) 先把每个采分点溯源到最像的那一段材料（traceSource）。
     2) 该点属于"做法/成效"类（由采分点文本推断），
        且其来源段被用户标成了 做法 或 成效 → 记为"逻辑线覆盖成功"。
     3) 其余采分点，只要来源段的用户标签 == 该点的推断层次，也算对。
     4) 溯源失败（材料里找不到出处）的点单列，不计入对错，只作提示。
  */
  function gradeA(q, mats){
    var pts = ptsOf(q), i, tr, want, got, ok = [], bad = [], lost = [], usedSeg = {};
    for(i=0;i<pts.length;i++){
      tr = traceSource(pts[i].text, mats);
      if(tr.idx < 0){ lost.push({ pt:pts[i] }); continue; }
      usedSeg[tr.idx] = 1;
      want = inferLevel(pts[i].text);
      got  = S.tags[tr.idx] || "";
      /* 做法/成效 互认：申论里"做法"与其"成效"常同段，标中任一即算读懂了这条逻辑线 */
      var pass = (got === want) ||
                 ((want === "action" || want === "effect") && (got === "action" || got === "effect"));
      (pass ? ok : bad).push({ pt:pts[i], seg:tr.idx, want:want, got:got, s:tr.score });
    }
    /* 统计用户标签分布 */
    var dist = {}, k;
    for(k in S.tags){ if(S.tags.hasOwnProperty(k) && S.tags[k]) dist[S.tags[k]] = (dist[S.tags[k]] || 0) + 1; }
    /* 空标段（有采分点出处但用户没打标签）*/
    var blank = [];
    for(i=0;i<mats.length;i++) if(usedSeg[i] && !S.tags[i]) blank.push(i);
    return {
      ok:ok, bad:bad, lost:lost, dist:dist, blank:blank,
      total: ok.length + bad.length, hit: ok.length,
      tagged: Object.keys(S.tags).filter(function(x){ return S.tags[x]; }).length,
      segs: mats.length
    };
  }

  /* ================= 判分：模式B 摘原词 ================= */
  function splitPicks(txt){
    return String(txt || "")
      .split(/[\n\r；;｜|]+/)
      .map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length >= 2; });
  }
  function gradeB(q, mats){
    var pts = ptsOf(q), mine = splitPicks(S.pick), i, j, best, bestS, s;
    var covered = [], missed = [], extra = [], used = {};
    for(i=0;i<pts.length;i++){
      best = -1; bestS = 0;
      for(j=0;j<mine.length;j++){
        s = sim(mine[j], pts[i].text);
        if(s > bestS){ bestS = s; best = j; }
      }
      if(best >= 0 && bestS >= HIT){
        used[best] = 1;
        covered.push({ pt:pts[i], mine:mine[best], s:bestS });
      }else{
        missed.push({ pt:pts[i], s:bestS });
      }
    }
    for(j=0;j<mine.length;j++) if(!used[j]) extra.push(mine[j]);

    /* 原词率：摘出来的句子里，有多少确实来自材料原文（3gram 覆盖 ≥ 0.6） */
    var raw = 0, matAll = norm(mats.join(""));
    for(j=0;j<mine.length;j++){
      if(cover(norm(mine[j]), matAll, 3) >= 0.6) raw++;
    }
    return {
      covered:covered, missed:missed, extra:extra,
      total:pts.length, hit:covered.length,
      pickN:mine.length, rawN:raw
    };
  }

  /* ================= 反馈文案 ================= */
  function adviseA(r){
    var t = [], d = r.dist || {};
    if(!r.total){
      t.push("这道题库里的采分点无法与材料段落对上（可能是概括类改写题）。此时更该练模式B：先把材料原词摘出来，再压缩。");
      return t;
    }
    if(r.tagged < Math.ceil(r.segs * 0.6)){
      t.push("你只标了 " + r.tagged + "/" + r.segs + " 段。读材料不能挑着读——<b>每段都必须落一个层次</b>，标成「其他」也比空着强，空着说明你根本没读。");
    }
    if(!d.action){
      t.push("你一个「做法」都没标。申论 60% 以上的分在对策/做法上，读材料时看到「要、加强、建立、推行」就该立刻标做法。");
    }
    if(!d.problem && !d.cause){
      t.push("你没标出任何「问题/原因」。问题句是对策的镜像——找不到问题，你写的对策就是悬空的套话。");
    }
    if((d.other || 0) > r.segs * 0.5){
      t.push("超过一半的段被你标成「其他」，这通常不是材料没用，而是<b>你没读出它在讲什么</b>。回去逐段问自己：这段是在说「坏事、为什么坏、怎么做、做完怎么样」里的哪一种。");
    }
    var i;
    for(i=0;i<r.bad.length && i<3;i++){
      t.push("第 " + (r.bad[i].seg + 1) + " 段其实是「" + levelCn(r.bad[i].want) + "」段（采分点「" +
             esc(String(r.bad[i].pt.text).slice(0, 18)) + "…」就出自这里），你标成了「" +
             (r.bad[i].got ? levelCn(r.bad[i].got) : "未标") + "」。");
    }
    if(r.lost.length){
      t.push("有 " + r.lost.length + " 个采分点在材料里找不到明显出处——这类点靠<b>归纳</b>而非摘抄，是拉开档次的地方。");
    }
    var rate = r.total ? r.hit / r.total : 0;
    if(rate >= 0.8) t.push("层次判断准确率 " + Math.round(rate * 100) + "%，你的材料分层能力已经过关，下一步练摘原词的精度。");
    else if(rate < 0.4) t.push("准确率偏低说明你在「平读」材料：从头读到尾但不分层。改掉它的唯一办法是强制每段落标签，连做 5 道。");
    return t;
  }
  function adviseB(r){
    var t = [];
    if(!r.total){ t.push("这道题暂无标准采分点，先把你认为能入答案的原词摘出来，回头对照机构答案。"); return t; }
    var rate = r.hit / r.total;
    if(!r.pickN){ t.push("你什么都没摘。摘原词不是抄材料，是<b>把阅卷人想看到的那几个词先固定下来</b>。"); return t; }
    if(r.rawN < r.pickN * 0.6){
      t.push("你摘的 " + r.pickN + " 条里只有 " + r.rawN + " 条真正来自材料原文，其余是你自己造的话。申论阅卷认材料词，<b>自造词=零分风险</b>，先摘后改。");
    }
    if(r.extra.length > Math.max(2, r.total * 0.6)){
      t.push("有 " + r.extra.length + " 条没对上任何采分点：摘得太散。判断标准很简单——这句话去掉后答案会不会丢分，不会就别摘。");
    }
    if(r.missed.length){
      var near = r.missed.filter(function(x){ return x.s >= 0.2; }).length;
      if(near) t.push("有 " + near + " 个点你其实「擦边」摘到了但不够准：说明你抓的是句子的<b>修饰部分</b>而不是核心动宾结构。摘的时候只留「动词+对象」。");
    }
    if(rate >= 0.8) t.push("原词覆盖 " + Math.round(rate * 100) + "%，材料转化这一关你已经打通，接下来练「合并同类项+分条书写」。");
    else if(rate < 0.4) t.push("覆盖率低于 40%：你的问题不在写作，在<b>读</b>。先别急着写答案，把这道题的材料逐段摘一遍再提交。");
    return t;
  }

  /* ================= 渲染：选题 ================= */
  function pickerHtml(){
    var ps = papers(), i, h = "", p, qs, j;
    if(!ps.length) return '<div class="b12-empty">没有读到题库数据（DATA.papers）。请确认本模块运行在主站页面内。</div>';
    h += '<div class="b12-pick">';
    h += '<label class="b12-lb">套卷</label><select class="b12-sel" data-act="pid"><option value="">— 请选择套卷 —</option>';
    for(i=0;i<ps.length;i++){
      p = ps[i];
      h += '<option value="' + esc(p.id) + '"' + (String(p.id) === String(S.pid) ? " selected" : "") + ">"
         + esc(String(p.year || "") + " " + String(p.paper || "")) + (p.province ? "（" + esc(p.province) + "）" : "") + "</option>";
    }
    h += "</select>";
    h += '<label class="b12-lb">题目</label><select class="b12-sel" data-act="qno">';
    p = paperById(S.pid);
    qs = p ? (p.questions || []) : [];
    if(!p){ h += '<option value="">— 先选套卷 —</option>'; }
    else{
      h += '<option value="">— 请选择题目 —</option>';
      for(j=0;j<qs.length;j++){
        h += '<option value="' + esc(qs[j].no) + '"' + (String(qs[j].no) === String(S.qno) ? " selected" : "") + ">"
           + esc("题" + qs[j].no + " " + (qs[j].qtype || "")) + "（材料 " + matOf(qs[j]).length + " 段 / 采分点 " + ptsOf(qs[j]).length + "）</option>";
      }
    }
    h += "</select></div>";
    return h;
  }

  function tabsHtml(){
    var h = '<div class="b12-tabs">';
    h += '<button class="b12-tab' + (S.mode === "A" ? " on" : "") + '" data-act="mode" data-m="A">Ⓐ 标层次</button>';

  /* ================= 渲染：模式A 段落打标 ================= */

    h += '<div class="b12-warn">摘的标准只有一条：<b>这句话删掉，答案会不会丢分</b>。会，就摘；不会，跳过。保留材料原词，别急着换成自己的话。</div>';
    h += '<div class="b12-segs">';
