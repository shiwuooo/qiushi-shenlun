let REVC = [];          /* 当前页缓存：[{key,pid,qno,list,p,q}] */
let revOnlyMulti = false;

/* 供其他模块调用：追加一个版本 */
function saveRevision(pid, qno, text, score, note){
  const t = String(text||"").trim();
  if(!pid || qno === null || qno === undefined || !t) return null;
  const all = loadRevs();
  const k = rk(pid, qno);
  const arr = Array.isArray(all[k]) ? all[k] : [];
  const last = arr.length ? arr[arr.length-1] : null;
  if(last && last.text === t){
    /* 内容与上一版完全相同：只更新分数，不新增版本 */
    if(score !== null && score !== undefined) last.score = Number(score);
    all[k] = arr; saveRevs(all);
    return last;
  }
  const rec = {
    ver: arr.length + 1,
    text: t,
    score: (score === null || score === undefined || score === "") ? null : Number(score),
    ts: Date.now(),
    note: String(note||"")
  };
  arr.push(rec);
  all[k] = arr;
  saveRevs(all);
  return rec;
}

function findQB3(pid, qno){
  const p = (typeof DATA !== "undefined" ? (DATA.papers||[]) : []).filter(function(x){ return x.id === pid; })[0];
  if(!p) return {p:null, q:null};
  const q = (p.questions||[]).filter(function(x){ return Number(x.no) === Number(qno); })[0] || null;
  return {p:p, q:q};
}
function revEntries(){
  const all = loadRevs();
  const out = [];
  Object.keys(all).forEach(function(k){
    const list = Array.isArray(all[k]) ? all[k] : [];
    if(!list.length) return;
    const idx = k.lastIndexOf("#");
    const pid = idx > 0 ? k.slice(0, idx) : k;
    const qno = idx > 0 ? k.slice(idx+1) : "";
    const f = findQB3(pid, qno);
    out.push({key:k, pid:pid, qno:qno, list:list, p:f.p, q:f.q});
  });
  out.sort(function(a, b){
    if(b.list.length !== a.list.length) return b.list.length - a.list.length;
    const ta = a.list[a.list.length-1].ts || 0, tb = b.list[b.list.length-1].ts || 0;
    return tb - ta;
  });
  return out;
}
function sparkline(list){
  const vals = list.map(function(r){ return (r.score === null || r.score === undefined) ? null : Number(r.score); });
  const known = vals.filter(function(v){ return v !== null && !isNaN(v); });
  if(known.length < 2) return "";
  const W = 220, H = 40, pad = 5;
  const mn = Math.min.apply(null, known), mx = Math.max.apply(null, known);
  const span = (mx - mn) || 1;
  const n = vals.length;
  const pts = [];
  vals.forEach(function(v, i){
    if(v === null || isNaN(v)) return;
    const x = pad + (W - 2*pad) * (n === 1 ? 0.5 : i/(n-1));
    const y = H - pad - (H - 2*pad) * ((v - mn) / span);
    pts.push(x.toFixed(1) + "," + y.toFixed(1));
  });
  const up = known[known.length-1] >= known[0];
  const color = up ? "var(--red)" : "var(--green)";
  return '<svg class="b3-spark" viewBox="0 0 220 40" width="220" height="40" aria-hidden="true">' +
    '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round"/>' +
    pts.map(function(p){
      const c = p.split(",");
      return '<circle cx="' + c[0] + '" cy="' + c[1] + '" r="2.6" fill="' + color + '"/>';
    }).join("") + "</svg>";
}
function trendHtml(list){
  const parts = [];
  list.forEach(function(r, i){
    const s = (r.score === null || r.score === undefined) ? null : Number(r.score);
    const txt = "v" + (i+1) + " " + (s === null ? "—" : s + "%");
    if(i === 0){ parts.push('<span class="b3-vchip">' + E(txt) + "</span>"); return; }
    const prev = list[i-1].score;
    let cls = "flat", arrow = "→";
    if(s !== null && prev !== null && prev !== undefined){
      const d = s - Number(prev);
      if(d > 0){ cls = "up"; arrow = "▲" + d; }
      else if(d < 0){ cls = "down"; arrow = "▼" + (-d); }
      else { cls = "flat"; arrow = "＝"; }
    }
    parts.push('<span class="b3-arrow ' + cls + '">' + E(arrow) + "</span>");
    parts.push('<span class="b3-vchip ' + cls + '">' + E(txt) + "</span>");
  });
  return parts.join("");
}

  REVC.forEach(function(it, i){
    const label = it.p ? (paperLabel(it.p) + " 题" + it.qno) : (it.pid + " 题" + it.qno);
    const qtype = it.q ? (it.q.qtype || "") : "";
    h += '<div class="b3-card" id="b3r' + i + '">';
    h += '<div class="b3-cardh"><b>' + E(label) + "</b>" +
         (qtype ? '<span class="b3-tag ty">' + E(qtype) + "</span>" : "") +
         '<span class="b3-tag no">' + it.list.length + " 版</span></div>";
    h += '<div class="b3-trend">' + trendHtml(it.list) + sparkline(it.list) + "</div>";

    h += '<div class="b3-vers">';
    it.list.forEach(function(r, k){
      h += '<details class="b3-vrow"><summary>' +
        '<span class="b3-vno">v' + (k+1) + "</span>" +
        '<span class="b3-muted">' + E(fmtTs(r.ts)) + "</span>" +
        '<span class="b3-tag sc">' + ((r.score === null || r.score === undefined) ? "未评分" : r.score + "%") + "</span>" +
        '<span class="b3-tag wd">' + cn(r.text) + " 字</span>" +
        '<span class="b3-vnote">' + (r.note ? E(r.note) : '<i class="b3-muted">（无修订说明）</i>') + "</span>" +
        "</summary>";
      h += '<div class="b3-vtext" id="b3rt' + i + "_" + k + '">' + E(r.text||"") + "</div>";
      h += '<div class="b3-acts">' +
        '<button class="b3-btn mini" onclick="b3CopyEl(\'b3rt' + i + "_" + k + '\')">复制本版</button>' +
        '<button class="b3-btn mini" onclick="b3RevNote(' + i + "," + k + ')">✎ 修订说明</button>' +
        '<button class="b3-btn mini" onclick="b3RevScore(' + i + "," + k + ')">✎ 分数</button>' +
        '<button class="b3-btn mini danger" onclick="b3DelRev(' + i + "," + k + ')">删除本版</button>' +
        "</div></details>";
    });
    h += "</div>";

    const opts = it.list.map(function(r, k){
      return '<option value="' + k + '">v' + (k+1) + "（" +
        ((r.score === null || r.score === undefined) ? "未评分" : r.score + "%") + " · " + E(fmtTs(r.ts)) + "）</option>";
    }).join("");
    const defA = 0, defB = it.list.length - 1;
    h += '<div class="b3-diffbar">对比：' +
      '<select class="b3-sel" id="b3da' + i + '">' + opts.replace('value="' + defA + '"', 'value="' + defA + '" selected') + "</select>" +
      '<span class="b3-vs">↔</span>' +
      '<select class="b3-sel" id="b3db' + i + '">' + opts.replace('value="' + defB + '"', 'value="' + defB + '" selected') + "</select>" +
      '<button class="b3-btn primary" onclick="b3Diff(' + i + ')">🔍 并排 diff</button>' +
      '<button class="b3-btn" onclick="b3AddRev(' + i + ')">➕ 手动追加一版</button>' +
      "</div>";
    h += '<div class="b3-diffbox" id="b3diff' + i + '"></div>';
    h += "</div>";
  });
  h += "</div>";
  box.innerHTML = h;
}

/* ---------------- 修订史动作 ---------------- */
function b3ToggleMulti(){ revOnlyMulti = !revOnlyMulti; renderRevisions(); }

function b3ImportRevs(){
  const ans = loadAnswers();
  const all = loadRevs();
  let n = 0;
  Object.keys(ans).forEach(function(k){
    const r = ans[k];
    if(!r || !r.text || !String(r.text).trim()) return;
    const key = (r.pid !== undefined && r.qno !== undefined) ? rk(r.pid, r.qno) : k;
    const cur = Array.isArray(all[key]) ? all[key] : [];
    if(cur.some(function(x){ return String(x.text).trim() === String(r.text).trim(); })) return;
    cur.push({
      ver: cur.length + 1,
      text: String(r.text).trim(),
      score: (r.score === null || r.score === undefined) ? null : Number(r.score),
      ts: r.ts || Date.now(),
      note: cur.length ? "由现有作答记录导入" : "基线版本（由现有作答记录导入）"
    });
    all[key] = cur;
    n++;
  });
  if(!n){ b3Flash("没有可导入的新作答（或已全部导入）"); return; }
  saveRevs(all);
  b3Flash("已导入 " + n + " 条作答为修订版本");
  renderRevisions();
}
function b3RevNote(i, k){
  const it = REVC[i]; if(!it || !it.list[k]) return;
  const cur = it.list[k].note || "";
  const v = prompt("本次修订说明（如：补了2个采分点 / 换了分论点角度 / 压缩了30字）：", cur);
  if(v === null) return;
  const all = loadRevs();
  if(!Array.isArray(all[it.key]) || !all[it.key][k]) return;
  all[it.key][k].note = v.trim();
  saveRevs(all);
  b3Flash("已保存修订说明");
  renderRevisions();
}
function b3RevScore(i, k){
  const it = REVC[i]; if(!it || !it.list[k]) return;
  const cur = it.list[k].score;
  const v = prompt("本版分数（0-100，留空表示未评分）：", (cur === null || cur === undefined) ? "" : String(cur));
  if(v === null) return;
  const s = v.trim() === "" ? null : Math.max(0, Math.min(100, parseInt(v, 10) || 0));
  const all = loadRevs();
  if(!Array.isArray(all[it.key]) || !all[it.key][k]) return;
  all[it.key][k].score = s;
  saveRevs(all);
  renderRevisions();
}
function b3DelRev(i, k){
  const it = REVC[i]; if(!it || !it.list[k]) return;
  if(!confirm("确定删除 v" + (k+1) + " 这一版作答？删除后其余版本会重新编号。")) return;
  const all = loadRevs();
  const arr = Array.isArray(all[it.key]) ? all[it.key] : [];
  arr.splice(k, 1);
  arr.forEach(function(r, idx){ r.ver = idx + 1; });
  if(arr.length) all[it.key] = arr; else delete all[it.key];
  saveRevs(all);
  b3Flash("已删除该版本");
  renderRevisions();
}
function b3AddRev(i){
  const it = REVC[i]; if(!it) return;
  const t = prompt("粘贴本次新版作答全文：", "");
  if(t === null) return;
  if(!t.trim()){ b3Flash("内容为空，未追加"); return; }
  const sv = prompt("本版分数（0-100，可留空）：", "");
  if(sv === null) return;
  const score = sv.trim() === "" ? null : Math.max(0, Math.min(100, parseInt(sv, 10) || 0));
  const note = prompt("本次修订说明（可留空）：", "");
  saveRevision(it.pid, it.qno, t, score, note === null ? "" : note);
  b3Flash("已追加新版本");
  renderRevisions();
}

/* ---------------- 并排 diff ---------------- */
function b3Diff(i){
  const it = REVC[i]; if(!it) return;
  const ka = parseInt(val("b3da" + i) || "0", 10);
  const kb = parseInt(val("b3db" + i) || "0", 10);
  const box = document.getElementById("b3diff" + i);
  if(!box) return;
  if(ka === kb){ box.innerHTML = '<div class="b3-muted">请选择两个不同的版本进行对比。</div>'; return; }
  const A = it.list[ka], B = it.list[kb];
  if(!A || !B){ box.innerHTML = '<div class="b3-muted">版本不存在。</div>'; return; }
  const res = buildDiff(A.text, B.text);
  const sa = (A.score === null || A.score === undefined) ? null : Number(A.score);
  const sb = (B.score === null || B.score === undefined) ? null : Number(B.score);
  let scoreTip = "";
  if(sa !== null && sb !== null){
    const d = sb - sa;
    const cls = d > 0 ? "up" : (d < 0 ? "down" : "flat");
    scoreTip = '分数 <b>' + sa + "% → " + sb + '%</b> <span class="b3-arrow ' + cls + '">' +
      (d > 0 ? "▲" + d : (d < 0 ? "▼" + (-d) : "＝")) + "</span>";
  }
  let h = '<div class="b3-diffhead">v' + (ka+1) + " ↔ v" + (kb+1) + " ｜ " +
    '字数 ' + cn(A.text) + " → " + cn(B.text) +
    ' ｜ <span class="b3-up">新增 ' + res.add + " 字</span> · " +
    '<span class="b3-down">删除 ' + res.del + " 字</span>" +
    (scoreTip ? " ｜ " + scoreTip : "") + "</div>";
  h += '<div class="b3-difflegend"><span class="b3-lg ins">绿底＝新版新增</span><span class="b3-lg del">红色删除线＝旧版删去</span><span class="b3-lg same">白底＝未改动</span></div>';
  h += '<div class="b3-diffcols"><div class="b3-diffcol"><div class="b3-diffch">旧版 v' + (ka+1) + "（" + E(fmtTs(A.ts)) + "）</div>" + res.L + "</div>" +
       '<div class="b3-diffcol"><div class="b3-diffch">新版 v' + (kb+1) + "（" + E(fmtTs(B.ts)) + "）</div>" + res.R + "</div></div>";
  if(B.note) h += '<div class="b3-diffnote">📝 本次修订说明：' + E(B.note) + "</div>";
  box.innerHTML = h;
}
function buildDiff(oldText, newText){
  const A = splitSent(oldText), B = splitSent(newText);
  const ops = diffSeq(A, B);
  let L = "", R = "", add = 0, del = 0, i = 0;
  while(i < ops.length){
    if(ops[i].t === "="){
      const v = E(ops[i].v);
      L += '<div class="b3-dl same">' + v + "</div>";
      R += '<div class="b3-dl same">' + v + "</div>";
      i++;
      continue;
    }
    const dels = [], inss = [];
    while(i < ops.length && ops[i].t !== "="){
      if(ops[i].t === "-") dels.push(ops[i].v); else inss.push(ops[i].v);
      i++;
    }
    const n = Math.max(dels.length, inss.length);
    for(let k=0;k<n;k++){
      const a = (k < dels.length) ? dels[k] : null;
      const b = (k < inss.length) ? inss[k] : null;
      if(a !== null && b !== null){
        const cd = charDiff(a, b);
        L += '<div class="b3-dl chg">' + cd.left + "</div>";
        R += '<div class="b3-dl chg">' + cd.right + "</div>";
        add += cd.add; del += cd.del;
      }else if(a !== null){
        L += '<div class="b3-dl del"><del class="b3-del">' + E(a) + "</del></div>";
        R += '<div class="b3-dl gap">—</div>';
        del += a.length;
      }else{
        L += '<div class="b3-dl gap">—</div>';
        R += '<div class="b3-dl add"><ins class="b3-ins">' + E(b) + "</ins></div>";
        add += b.length;
      }
    }
  }
  if(!L && !R){ L = '<div class="b3-muted">（空）</div>'; R = '<div class="b3-muted">（空）</div>'; }
  return {L:L, R:R, add:add, del:del};
}

/* =====================================================================
   暴露入口（供 onclick / 主程序路由调用）

window.renderEssay          = renderEssay;

})();

</script>
<script>
/* === _b4.js === */
/* =====================================================================
   第四批：智能组卷 + 错别字/语病自检  (_b4.js)
   依赖：全局 DATA / state / render() / esc()
   存储：localStorage（离线、隐私、断网可用）
   ===================================================================== */
(function(){
"use strict";

const PAPER_KEY = "shenlun_papers_v1";
const PROOF_KEY = "shenlun_proof_v1";
const ANS_KEY   = "shenlun_answers_v2";

/* ---------------- 存储 ---------------- */
function loadPapers(){ try{ return JSON.parse(localStorage.getItem(PAPER_KEY))||[]; }catch(e){ return []; } }
function savePapers(a){ try{ localStorage.setItem(PAPER_KEY, JSON.stringify(a)); }catch(e){} }
function loadAns(){ try{ return JSON.parse(localStorage.getItem(ANS_KEY))||{}; }catch(e){ return {}; } }
function loadProof(){ try{ return JSON.parse(localStorage.getItem(PROOF_KEY))||{}; }catch(e){ return {}; } }
function saveProof(o){ try{ localStorage.setItem(PROOF_KEY, JSON.stringify(o)); }catch(e){} }

/* ---------------- 题型归类 ---------------- */
const TYPES = ["概括归纳","综合分析","提出对策","贯彻执行","文章写作"];
function typeOf(qt){
  qt = qt || "";
  if(/概括|归纳/.test(qt)) return "概括归纳";
  if(/分析/.test(qt)) return "综合分析";
  if(/对策|建议|措施|做法/.test(qt)) return "提出对策";
  if(/公文|应用文|贯彻|信|通知|报告|请示|函|稿|简报|倡议|方案|讲话/.test(qt)) return "贯彻执行";
  if(/作文|议论|策论|文章/.test(qt)) return "文章写作";
  return "其他";
}
function scoreNum(s){ const m=String(s||"").match(/(\d+)/); return m?parseInt(m[1],10):0; }
function wordNum(w){ const m=String(w||"").match(/(\d{3,4})/g); return m?parseInt(m[m.length-1],10):0; }

/* 全部题目扁平化 */
function allQuestions(){
  const out=[];
  (DATA.papers||[]).forEach(p=>{
    (p.questions||[]).forEach(q=>{
      out.push({
        pid:p.id, year:p.year, paper:p.paper, province:p.province,
        themes:p.themes||[], subject:p.subject||"",
        no:q.no, qtype:q.qtype||"", type:typeOf(q.qtype),
        score:scoreNum(q.score), scoreRaw:q.score||"", words:q.words||"",
        wnum:wordNum(q.words),
        stem:(q.stem||[]).join(" "),
        pts:(q.points||[]).length
      });
    });
  });
  return out;
}

/* 作答记录 → 每题得分率 */
function answeredMap(){
  const a=loadAns(); const m={};
  Object.values(a).forEach(r=>{ if(r&&r.pid!=null&&r.qno!=null) m[r.pid+"#"+r.qno]=r; });
  return m;
}
function rateOf(rec, q){
  if(!rec||typeof rec.score!=="number") return null;
  const full = q.score||20;
  return Math.max(0, Math.min(1, rec.score/ (full||20)));
}

/* 题型得分率统计 → 找弱项 */
function weakTypes(){
  const am=answeredMap(); const agg={};
  allQuestions().forEach(q=>{
    const rec=am[q.pid+"#"+q.no]; const r=rateOf(rec,q);
    if(r==null) return;
    (agg[q.type]=agg[q.type]||{sum:0,n:0}).sum+=r; agg[q.type].n++;
  });
  const arr=Object.keys(agg).map(k=>({type:k, rate:agg[k].sum/agg[k].n, n:agg[k].n}));
  arr.sort((a,b)=>a.rate-b.rate);
  return arr;
}

/* ---------------- 筛选状态 ---------------- */
const G = {
  mode:"standard",
  y1:2010, y2:2026,
  provs:{}, themes:"", onlyWeak:false, excludeDone:false,
  custom:{"概括归纳":1,"综合分析":1,"提出对策":1,"贯彻执行":1,"文章写作":1},
  weakCount:5,
  result:null,      // {items:[], total, minutes}
  locked:{}         // idx -> true
};

function provList(){
  const s=new Set(); (DATA.papers||[]).forEach(p=>{ s.add(p.paper||p.province); });
  return Array.from(s);
}

function poolFilter(){
  const am=answeredMap();
  const th=(G.themes||"").trim();
  return allQuestions().filter(q=>{
    if(q.year<G.y1||q.year>G.y2) return false;
    const pk=q.paper||q.province;
    const anyProv=Object.keys(G.provs).some(k=>G.provs[k]);
    if(anyProv && !G.provs[pk]) return false;
    if(th){
      const hay=(q.themes.join(" ")+" "+q.subject+" "+q.stem);
      if(hay.indexOf(th)<0) return false;
    }
    const rec=am[q.pid+"#"+q.no];
    if(G.excludeDone && rec) return false;
    if(G.onlyWeak){
      const r=rateOf(rec,q);
      if(r==null || r>=0.6) return false;
    }
    return true;
  });
}

function pickRandom(pool, n, used){
  const cand=pool.filter(q=>!used.has(q.pid+"#"+q.no));
  const out=[];
  for(let i=0;i<n && cand.length;i++){
    const k=Math.floor(Math.random()*cand.length);
    const q=cand.splice(k,1)[0];
    used.add(q.pid+"#"+q.no); out.push(q);
  }
  return out;
}

function genPaper(){
  const pool=poolFilter();
  const used=new Set();
  const keep=[];
  // 保留锁定题
  if(G.result){
    G.result.items.forEach((it,i)=>{
      if(G.locked[i]){ keep.push(it); used.add(it.pid+"#"+it.no); }
    });
  }
  let items=[];
  if(G.mode==="standard"){
    const plan=[["概括归纳",1],["综合分析",1],["提出对策",1],["贯彻执行",1],["文章写作",1]];
    plan.forEach(([t,n])=>{
      const already=keep.filter(k=>k.type===t).length;
      const need=Math.max(0,n-already);
      if(!need) return;
      let got=pickRandom(pool.filter(q=>q.type===t), need, used);
      if(got.length<need){ // 降级替补：从任意题型补
        got=got.concat(pickRandom(pool, need-got.length, used));
      }
      items=items.concat(got);
    });
  }else if(G.mode==="weak"){
    const wk=weakTypes().slice(0,2).map(x=>x.type);
    const target = wk.length? pool.filter(q=>wk.indexOf(q.type)>=0) : pool;
    let got=pickRandom(target, Math.max(0,G.weakCount-keep.length), used);
    if(got.length < G.weakCount-keep.length){
      got=got.concat(pickRandom(pool, G.weakCount-keep.length-got.length, used));
    }
    items=got;
  }else{
    TYPES.forEach(t=>{
      const n=parseInt(G.custom[t]||0,10);
      const already=keep.filter(k=>k.type===t).length;
      const need=Math.max(0,n-already);
      if(need>0) items=items.concat(pickRandom(pool.filter(q=>q.type===t), need, used));
    });
  }
  const all=keep.concat(items);
  // 按题型标准顺序排
  const order={"概括归纳":1,"综合分析":2,"提出对策":3,"贯彻执行":4,"文章写作":5,"其他":6};
  all.sort((a,b)=>(order[a.type]||9)-(order[b.type]||9));
  const total=all.reduce((s,q)=>s+q.score,0);
  const minutes=all.reduce((s,q)=>s+Math.max(10, Math.round((q.wnum||300)/18)+ (q.type==="文章写作"?30:5)),0);
  G.result={items:all, total, minutes};
  G.locked={};
  renderGenPaper();
}

/* ---------------- 渲染：智能组卷 ---------------- */
function renderGenPaper(){
  const box=document.getElementById("content");
  const st=document.getElementById("stats");
  const pool=poolFilter();
  const wk=weakTypes();
  if(st) st.textContent="智能组卷 · 题库 "+allQuestions().length+" 题 · 当前筛选命中 "+pool.length+" 题";

  const provs=provList();
  let h='<div class="b4-wrap">';

  /* 筛选区 */
  h+='<div class="b4-card"><div class="b4-h">① 筛选范围</div><div class="b4-bd">';
  h+='<div class="b4-row"><label>年份</label>';
  h+='<input class="b4-in b4-num" type="number" value="'+G.y1+'" onchange="b4Set(\'y1\',this.value)"> — ';
  h+='<input class="b4-in b4-num" type="number" value="'+G.y2+'" onchange="b4Set(\'y2\',this.value)"></div>';
  h+='<div class="b4-row"><label>卷别</label><span>';
  provs.forEach(p=>{
    h+='<label class="b4-chk"><input type="checkbox" '+(G.provs[p]?"checked":"")+' onchange="b4Prov(\''+esc(p).replace(/'/g,"")+'\',this.checked)"> '+esc(p)+'</label>';
  });
  h+='<i class="b4-tip">（不勾=全部）</i></span></div>';
  h+='<div class="b4-row"><label>主题关键词</label><input class="b4-in" style="width:220px" value="'+esc(G.themes)+'" placeholder="如 基层治理 / 乡村 / 数字" onchange="b4Set(\'themes\',this.value)"></div>';
  h+='<div class="b4-row"><label>附加</label><span>';
  h+='<label class="b4-chk"><input type="checkbox" '+(G.onlyWeak?"checked":"")+' onchange="b4Set(\'onlyWeak\',this.checked)"> 只抽我做错/得分低的题（<60%）</label>';
  h+='<label class="b4-chk"><input type="checkbox" '+(G.excludeDone?"checked":"")+' onchange="b4Set(\'excludeDone\',this.checked)"> 排除已做过的题</label>';
  h+='</span></div></div></div>';

  /* 模式区 */
  h+='<div class="b4-card"><div class="b4-h">② 组卷模式</div><div class="b4-bd">';
  h+='<div class="b4-modes">';
  h+=modeBtn("standard","标准模考卷","1概括+1分析+1对策+1公文+1大作文，接近真实卷面");
  h+=modeBtn("weak","弱项强化卷","自动锁定你得分率最低的 2 个题型集中练");
  h+=modeBtn("custom","自定义卷","各题型题量自己定");
  h+='</div>';
  if(G.mode==="weak"){
    h+='<div class="b4-row" style="margin-top:10px"><label>题量</label><input class="b4-in b4-num" type="number" value="'+G.weakCount+'" onchange="b4Set(\'weakCount\',this.value)"></div>';

/* 开考：自组卷是跨卷组合，现有 startMock(pid) 只认单套真题卷，
   故这里自建考场视图（顶部倒计时 + 逐题作答，复用已有评分弹窗）。 */
let examTimer=null, examEnd=0, examPaper=null;

function startGenPaper(paperObj){
  if(!paperObj||!paperObj.items||!paperObj.items.length){ alert("卷子是空的"); return; }
  examPaper=paperObj;
  const mins=parseInt(prompt("设定考试时长（分钟）：", String(paperObj.minutes||120)),10);
  if(!mins||mins<=0){ examPaper=null; return; }
  examEnd=Date.now()+mins*60000;
  renderExam();
  if(examTimer) clearInterval(examTimer);
  examTimer=setInterval(tickExam,1000);
}
function renderExam(){
  const p=examPaper; if(!p) return;
  const am=answeredMap();
  let h='<div class="b4-wrap"><div class="b4-exambar" id="b4bar"><span id="b4clock">--:--</span>'+
        '<span class="b4-tip">共 '+p.items.length+' 题 · 总分 '+p.total+'</span>'+
        '<span class="b4-acts"><button class="b4-btn" onclick="b4EndExam()">结束考试</button></span></div>';
  h+='<div class="b4-card"><div class="b4-bd">'+
     '<div class="b4-tip" style="margin-bottom:10px">逐题点「作答」写答案并即时评分；答完的题会显示得分。</div>';
  p.items.forEach((q,i)=>{
    const rec=am[q.pid+"#"+q.no];
    h+='<div class="b4-qcard"><div><b>第'+(i+1)+'题</b> <span class="b4-tag">'+esc(q.type)+'</span> '+
       '<span class="b4-tip">'+q.year+' '+esc(q.paper||q.province)+' 题'+q.no+' · '+(q.scoreRaw||q.score)+' · '+esc(q.words||"")+'</span>'+
       (rec&&typeof rec.score==="number"? ' <span class="b4-done">已答 '+rec.score+' 分</span>':'')+'</div>'+
       '<div class="b4-qstem">'+esc(q.stem)+'</div>'+
       '<button class="b4-btn b4-primary" onclick="b4Answer(\''+q.pid+'\','+q.no+')">✍️ 作答</button></div>';
  });
  h+='</div></div></div>';
  document.getElementById("content").innerHTML=h;
  tickExam();
}
function tickExam(){
  const el=document.getElementById("b4clock");
  if(!el){ if(examTimer){clearInterval(examTimer);examTimer=null;} return; }
  let s=Math.max(0, Math.floor((examEnd-Date.now())/1000));
  const hh=Math.floor(s/3600), mm=Math.floor(s%3600/60), ss=s%60;
  el.textContent=(hh?pad(hh)+":":"")+pad(mm)+":"+pad(ss);
  el.className = s<=300? "b4-urgent" : "";
  if(s<=0){ clearInterval(examTimer); examTimer=null; alert("考试时间到！可继续查看，也可点「结束考试」返回。"); }
}
function pad(n){ return n<10? "0"+n : ""+n; }
function b4EndExam(){
  if(examTimer){ clearInterval(examTimer); examTimer=null; }
  examPaper=null;
  renderGenPaper();
}
function b4Answer(pid,qno){
  if(typeof window.openAnswerModal==="function") window.openAnswerModal(pid,qno);
  else alert("作答模块未加载");
}

const ORAL = [

  ["挺好","较好"],["特别多","数量众多"],["很多很多","大量"],["老百姓说","群众反映"],

  ["走过场","流于形式"],["踢皮球","推诿扯皮"],["磨洋工","消极怠工"],
  ["天天","日常"],["赶紧","尽快"],["肯定会","必将"],["特别是说","尤其是"]
];

/* 3) 关联词配对 */
const PAIRS = [
  ["虽然","但是|但|however|然而|却"],["不仅","而且|还|也|并且"],
  ["因为","所以|因此|故"],["只有","才"],["无论","都|均|也"],
  ["既然","就|那么"],["尽管","仍|还是|但"],["不但","而且|反而|还"],
  ["一方面","另一方面|一方面"],["首先","其次|然后|最后"]
];

function checkText(txt){
  const issues=[];
  const add=(type,pos,len,bad,good,msg,level)=>issues.push({type,pos,len,bad,good,msg,level:level||"err"});

  /* 错别字 */
  TYPO.forEach(row=>{
    const bad=row[0], good=row[1], msg=row[2], flag=row[3];
    if(!bad||!good) return;
    if(flag==="rev"||flag==="warn"){
      // rev: 表中第1列其实是正确写法，需检测的是第2列
      const wrong = (flag==="rev")? good : null;
      if(wrong){
        let i=txt.indexOf(wrong);
        while(i>=0){ add("错别字",i,wrong.length,wrong,bad,msg); i=txt.indexOf(wrong,i+1); }
      }else{
        // warn: 易混词，出现即提示辨析（不判错）
        let i=txt.indexOf(bad);
        if(i>=0) add("易混词",i,bad.length,bad,good,msg,"warn");
      }
      return;
    }
    let i=txt.indexOf(bad);
    while(i>=0){ add("错别字",i,bad.length,bad,good,msg); i=txt.indexOf(bad,i+1); }
  });

  /* 口语化 */
  ORAL.forEach(([bad,good])=>{
    let i=txt.indexOf(bad);
    while(i>=0){ add("口语化",i,bad.length,bad,good,"申论应使用书面规范表达","warn"); i=txt.indexOf(bad,i+1); }
  });

  /* 长句 */
  const sents=txt.split(/(?<=[。！？；])/);
  let off=0;
  sents.forEach(s=>{
    const core=s.replace(/\s/g,"");
    if(core.length>80 && !/[，、：]/.test(core.slice(0,60))){
      add("长句",off,Math.min(s.length,40),core.slice(0,20)+"…",null,"该句约 "+core.length+" 字且缺少停顿，建议拆分或补充标点","warn");
    }
    off+=s.length;
  });

  /* 重复用词 */
  const paras=txt.split(/\n+/);
  let poff=0;
  paras.forEach(p=>{
    const words={};
    const m=p.match(/[\u4e00-\u9fa5]{2,4}/g)||[];
    const STOPW=new Set(["我们","可以","应该","进行","问题","这个","那个","以及","通过","对于","没有","就是","因此","所以","但是","并且","而且","如果","因为","为了","能够","实现","提供","建立","加强","完善","提高","工作","发展","不断","更加","有效"]);
    m.forEach(w=>{ if(!STOPW.has(w)) words[w]=(words[w]||0)+1; });
    Object.keys(words).forEach(w=>{
      if(words[w]>=4){
        const i=p.indexOf(w);
        add("重复用词",poff+i,w.length,w,null,"该段「"+w+"」出现 "+words[w]+" 次，建议换用近义规范词","warn");
      }
    });
    poff+=p.length+1;
  });

  /* 关联词缺失 */
  PAIRS.forEach(([a,bre])=>{
    const i=txt.indexOf(a);
    if(i<0) return;
    const tail=txt.slice(i, i+120);
    if(!(new RegExp(bre)).test(tail)){
      add("关联词",i,a.length,a,null,"「"+a+"」缺少呼应的后半句（应有 "+bre.replace(/\|/g,"/")+"）","warn");
    }
  });

  /* 标点 */
  let m2;
  const reEn=/[,;?!](?![0-9])/g;
  while((m2=reEn.exec(txt))!==null){
    add("标点",m2.index,1,m2[0],{",":"，",";":"；","?":"？","!":"！"}[m2[0]],"中文行文中混用了英文标点");
  }
  const reDup=/([，。；！？])\1+/g;
  while((m2=reDup.exec(txt))!==null){ add("标点",m2.index,m2[0].length,m2[0],m2[1],"标点重复"); }
  const lastCh=txt.trim().slice(-1);
  if(txt.trim() && !/[。！？」）]/.test(lastCh)) add("标点",txt.trim().length-1,1,lastCh,null,"结尾缺少句末标点","warn");

  /* 数字混用 */
  const reNum=/[一二三四五六七八九十]{1,3}[个位名条项年月日]|[0-9]{1,4}[个位名条项]/g;
  const cn=(txt.match(/[一二三四五六七八九十]{1,3}[个位名条项]/g)||[]).length;
  const ar=(txt.match(/[0-9]{1,4}[个位名条项]/g)||[]).length;
  if(cn>0&&ar>0) add("数字",0,0,null,null,"汉字数字与阿拉伯数字混用（汉字"+cn+"处 / 阿拉伯"+ar+"处），建议统一","warn");

  return issues;
}

/* 规范词密度 */
function normDensity(txt){
  const terms=[];
  (DATA.entries||[]).forEach(e=>{
    if(e.lib!=="规范词库") return;
    (e.lines||[]).forEach(l=>{
      const m=l.match(/[\u4e00-\u9fa5]{4,12}/g)||[];
      m.forEach(w=>{ if(w.length>=4&&w.length<=10) terms.push(w); });
    });
  });
  const uniq=Array.from(new Set(terms));
  const hit=uniq.filter(w=>txt.indexOf(w)>=0);
  const per=txt.length? hit.length/(txt.length/100) : 0;
  const suggest=[];
  for(let i=0;i<uniq.length && suggest.length<12;i++){
    const w=uniq[Math.floor(Math.random()*uniq.length)];
    if(txt.indexOf(w)<0 && suggest.indexOf(w)<0) suggest.push(w);
  }
  return {hit, per, suggest, total:uniq.length};
}

/* ---------------- 渲染：文字自检 ---------------- */
let P = { text:"", issues:null, nd:null };

function renderProof(){
  const box=document.getElementById("content");
  const st=document.getElementById("stats");
  if(st) st.textContent="文字自检 · 离线规则检查（错别字 / 口语化 / 语病 / 标点 / 规范词密度）";

  const recs=Object.values(loadAns()).filter(r=>r&&r.text);
  let h='<div class="b4-wrap">';
  h+='<div class="b4-card"><div class="b4-h">① 待检文本'+
     '<span class="b4-acts">'+
     (recs.length? '<select class="b4-in" onchange="b4LoadAns(this.value)"><option value="">— 从我的作答载入 —</option>'+
        recs.map((r,i)=>'<option value="'+i+'">'+esc(String(r.pid))+' 题'+r.qno+'（'+(r.text||"").length+'字）</option>').join("")+'</select>' : '')+
     '<button class="b4-btn" onclick="b4Clear()">清空</button>'+
     '<button class="b4-btn b4-primary" onclick="b4Check()">🔍 开始检查</button></span></div>';
  h+='<div class="b4-bd"><textarea id="b4ta" class="b4-ta" placeholder="粘贴或输入你的作答内容…">'+esc(P.text)+'</textarea>'+
     '<div class="b4-tip" id="b4len">'+P.text.length+' 字</div></div></div>';

  if(P.issues){
    const g={};
    P.issues.forEach(x=>{ (g[x.type]=g[x.type]||[]).push(x); });
    const errN=P.issues.filter(x=>x.level==="err").length;
    const warnN=P.issues.length-errN;

    h+='<div class="b4-card"><div class="b4-h">② 检查结果 · 共 '+P.issues.length+' 处（硬伤 '+errN+' · 提醒 '+warnN+'）'+
       '<span class="b4-acts"><button class="b4-btn" onclick="b4CopyFix()">📋 复制修改清单</button></span></div><div class="b4-bd">';
    h+='<div class="b4-sum">';
    ["错别字","易混词","口语化","长句","重复用词","关联词","标点","数字"].forEach(t=>{
      const n=(g[t]||[]).length;
      h+='<span class="b4-pill'+(n?(t==="错别字"?" bad":" mid"):" ok")+'">'+t+' '+n+'</span>';
    });
    h+='</div>';

    /* 原文高亮 */
    h+='<div class="b4-sect">原文标注</div><div class="b4-doc">'+markup(P.text,P.issues)+'</div>';

    /* 分类清单 */
    h+='<div class="b4-sect">问题清单</div>';
    Object.keys(g).forEach(t=>{
      h+='<div class="b4-grp"><div class="b4-grph">'+t+'（'+g[t].length+'）</div>';
      g[t].slice(0,60).forEach(x=>{
        h+='<div class="b4-issue '+(x.level==="err"?"err":"warn")+'">';
        if(x.bad) h+='<code class="b4-bad">'+esc(x.bad)+'</code>';
        if(x.good) h+=' → <code class="b4-good">'+esc(x.good)+'</code>';
        h+='<span class="b4-msg">'+esc(x.msg||"")+'</span></div>';
      });
      h+='</div>';
    });

    /* 规范词密度 */
    if(P.nd){
      const nd=P.nd;
      const lvl = nd.per>=3? "ok" : (nd.per>=1.5? "mid":"bad");
      h+='<div class="b4-sect">规范词密度</div>';
      h+='<div class="b4-nd '+lvl+'">命中规范词 <b>'+nd.hit.length+'</b> 个 · 密度 <b>'+nd.per.toFixed(1)+'</b> 个/百字 · '+
         (lvl==="ok"?"表达规范度良好":(lvl==="mid"?"密度偏低，可再嵌入规范表述":"密度过低，阅卷易判为口语化表达"))+'</div>';
      if(nd.hit.length) h+='<div class="b4-tags">已用：'+nd.hit.slice(0,20).map(w=>'<span class="b4-tag">'+esc(w)+'</span>').join("")+'</div>';
      if(nd.suggest.length) h+='<div class="b4-tags">可补：'+nd.suggest.map(w=>'<span class="b4-tag sug">'+esc(w)+'</span>').join("")+'</div>';
    }
    h+='</div></div>';
  }
  h+='</div>';
  box.innerHTML=h;
  const ta=document.getElementById("b4ta");
  if(ta){
    ta.addEventListener("input",function(){
      P.text=ta.value;
      const el=document.getElementById("b4len"); if(el) el.textContent=ta.value.length+" 字";
    });
  }
}

/* 原文高亮：按位置插标记 */
function markup(txt, issues){
  const marks=issues.filter(x=>x.len>0 && x.pos>=0).slice().sort((a,b)=>a.pos-b.pos);
  let out="", cur=0;
  marks.forEach(x=>{
    if(x.pos<cur) return;
    out+=esc(txt.slice(cur,x.pos));
    const seg=txt.substr(x.pos,x.len);
    const tip=(x.type+"：" + (x.msg||"") + (x.good?("　建议→"+x.good):""));
    out+='<mark class="b4-mk '+(x.level==="err"?"err":"warn")+'" title="'+esc(tip)+'">'+esc(seg)+'</mark>';
    cur=x.pos+x.len;
  });
  out+=esc(txt.slice(cur));
  return out.replace(/\n/g,"<br>");
}

function b4Check(){
  const ta=document.getElementById("b4ta");
  P.text = ta? ta.value : P.text;
  if(!P.text.trim()){ alert("请先输入或载入待检文本"); return; }
  P.issues = checkText(P.text);
  P.nd = normDensity(P.text);
  renderProof();
}
function b4Clear(){ P={text:"",issues:null,nd:null}; renderProof(); }
function b4LoadAns(i){
  if(i==="") return;
  const recs=Object.values(loadAns()).filter(r=>r&&r.text);
  const r=recs[parseInt(i,10)];
  if(!r) return;
  P.text=r.text; P.issues=null; P.nd=null; renderProof();
}
function b4CopyFix(){
  if(!P.issues) return;
  const lines=["【文字自检修改清单】共 "+P.issues.length+" 处",""];
  const g={}; P.issues.forEach(x=>{ (g[x.type]=g[x.type]||[]).push(x); });
  Object.keys(g).forEach(t=>{
    lines.push("— "+t+"（"+g[t].length+"）");
    g[t].forEach(x=>{
      lines.push("  · "+(x.bad?x.bad:"")+(x.good?(" → "+x.good):"")+"　"+(x.msg||""));
    });
    lines.push("");
  });
  if(P.nd) lines.push("规范词密度："+P.nd.per.toFixed(1)+" 个/百字，命中 "+P.nd.hit.length+" 个");
  const s=lines.join("\n");
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(()=>alert("已复制修改清单"),()=>fallbackCopy(s));
  else fallbackCopy(s);
}
function fallbackCopy(s){
  const ta=document.createElement("textarea");
  ta.value=s; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("已复制修改清单"); }catch(e){ alert("复制失败，请手动选择"); }
  document.body.removeChild(ta);
}

/* ---------------- 暴露 ---------------- */
window.renderGenPaper = renderGenPaper;
window.renderProof    = renderProof;
window.startGenPaper  = startGenPaper;
window.b4Set=b4Set; window.b4Prov=b4Prov; window.b4Custom=b4Custom; window.b4Mode=b4Mode;
window.b4Lock=b4Lock; window.b4Gen=b4Gen; window.b4Save=b4Save; window.b4Load=b4Load;
window.b4Del=b4Del; window.b4Start=b4Start; window.b4Answer=b4Answer; window.b4EndExam=b4EndExam;
window.b4Check=b4Check; window.b4Clear=b4Clear; window.b4LoadAns=b4LoadAns; window.b4CopyFix=b4CopyFix;

})();

<script>/* === _b5.js === */
/* =====================================================================
   第五批：学习激励与坚持系统  (_b5.js)
   依赖：全局 DATA / state / render() / esc() / hi()（由主站提供）
   存储：localStorage —— shenlun_motiv_v1（考试日期 + 周目标，本模块可写）
         只读引用（绝不写入）：
           shenlun_morning_v1    晨读打卡
           shenlun_answers_v2    作答记录
           shenlun_revisions_v1  作答修订史
           shenlun_recite_v1     背诵卡
   全程离线、纯前端、数据不出本机
   四大板块：① 考试倒计时 ② 全年贡献热力图 ③ 每周目标进度环 ④ 成就勋章
   ===================================================================== */
var PLAN_KEY = "shenlun_planlog_v1";  /* 全局：学习激励与过程画像共用的「本周微计划打卡」存储键（_b5/_b10 共用） */
(function(){
"use strict";

/* ---------------- 存储键 ---------------- */
var MOTIV_KEY   = "shenlun_motiv_v1";     /* 本模块可写：{examDate, goals} */
var MORNING_KEY = "shenlun_morning_v1";   /* 只读 */
var ANS_KEY     = "shenlun_answers_v2";   /* 只读 */
var REV_KEY     = "shenlun_revisions_v1"; /* 只读 */
var RECITE_KEY  = "shenlun_recite_v1";    /* 只读 */

var MASTER_LVL  = 5;                       /* 背诵卡等级≥5 视为已掌握 */
var DEFAULT_EXAM = "2026-11-29";          /* 常见国考笔试参考日期（仅作提示默认值） */
var GOAL_DEFAULT = {recite:20, morning:7, answer:5, mock:1, plan:3};

/* ---------------- 存储层（读写失败一律降级，永不抛出） ---------------- */
function jload(k, d){
  try{ var v = JSON.parse(localStorage.getItem(k)); return (v===null||v===undefined)?d:v; }
  catch(e){ return d; }
}
function jsave(k, o){
  try{ localStorage.setItem(k, JSON.stringify(o)); return true; }
  catch(e){ console.warn("存储失败", e); return false; }
}
function loadMotiv(){ var o = jload(MOTIV_KEY, {}); return (o && typeof o==="object" && !Array.isArray(o)) ? o : {}; }
function saveMotiv(o){ return jsave(MOTIV_KEY, o); }

/* ---------------- HTML 转义（优先复用站点 esc） ---------------- */
function E(s){
  var v = (s===null||s===undefined) ? "" : String(s);
  if(typeof esc === "function") return esc(v);
  return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function EA(s){ return E(s).replace(/"/g,"&quot;"); }

/* ---------------- 公共小工具：状态行 / 侧栏（本模块自备） ---------------- */
function setStats(t){ var el = document.getElementById("stats"); if(el) el.textContent = t; }
function sideNav(title, items){
  var nav = document.getElementById("nav");
  if(!nav) return;
  var h = "<h3>" + E(title) + "</h3>";
  (items || []).forEach(function(it){
    h += '<div class="tlink" onclick="var e=document.getElementById(\'' + it.id +
         '\');if(e)e.scrollIntoView({behavior:\'smooth\'})"><span>' + E(it.label) + '</span></div>';
  });
  nav.innerHTML = h;
}

/* ---------------- 日期工具（一律使用本地日期） ---------------- */
function pad2(n){ return String(n).length < 2 ? "0" + n : String(n); }
function dkey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function todayDate(){ var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function parseISO(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
  if(!m) return null;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}
function tsDay(ts){ var d = new Date(ts); return isNaN(d.getTime()) ? null : dkey(d); }
function dayGap(a, b){
  var x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  var y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((y - x) / 86400000);
}
/* 本周窗口（周一为起点 ~ 周日） */
function weekRange(){
  var t = todayDate();
  var dow = t.getDay();                    /* 0=周日 … 6=周六 */
  var diff = (dow === 0) ? -6 : (1 - dow); /* 回退到本周一 */
  var mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() + diff);
  var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
  return {start: mon, end: sun};
}
var _WK = weekRange();
function inWeekDate(d){
  if(!d) return false;
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return x >= _WK.start && x <= _WK.end;
}
function inWeekTs(ts){
  if(ts===null||ts===undefined) return false;
  var d = new Date(ts);
  return isNaN(d.getTime()) ? false : inWeekDate(d);
}

/* ---------------- 参数与默认值 ---------------- */
function goalsOf(m){
  var g = (m && m.goals && typeof m.goals === "object") ? m.goals : {};
  return {
    recite:  toInt(g.recite,  GOAL_DEFAULT.recite),
    morning: toInt(g.morning, GOAL_DEFAULT.morning),
    answer:  toInt(g.answer,  GOAL_DEFAULT.answer),
    mock:    toInt(g.mock,    GOAL_DEFAULT.mock),
    plan:    toInt(g.plan,    GOAL_DEFAULT.plan)
  };
}
function toInt(v, d){ var n = parseInt(v, 10); return (isNaN(n) || n < 0) ? d : n; }

/* =====================================================================
   一、活动聚合：date(YYYY-MM-DD) → 活跃度计数
   晨读 +1 / 作答 +2 / 修订 +1 / 背诵日志 +1
   ===================================================================== */
function activityMap(){
  var map = {};
  function add(day, n){ if(!day) return; map[day] = (map[day] || 0) + n; }

  var mor = jload(MORNING_KEY, {});
  (Array.isArray(mor.days) ? mor.days : []).forEach(function(s){
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) add(s, 1);
  });

  var ans = jload(ANS_KEY, {});
  Object.keys(ans).forEach(function(k){
    var r = ans[k];
    if(r && r.ts) add(tsDay(r.ts), 2);
  });

  var rev = jload(REV_KEY, {});
  Object.keys(rev).forEach(function(k){
    var arr = rev[k];
    if(Array.isArray(arr)) arr.forEach(function(e){ if(e && e.ts) add(tsDay(e.ts), 1); });
  });

  var rec = jload(RECITE_KEY, {});
  (Array.isArray(rec.log) ? rec.log : []).forEach(function(e){
    if(e && e.ts) add(tsDay(e.ts), 1);
  });

  /* 微计划打卡（过程教练写入，本课只读聚合进热力图） */
  var plan = jload(PLAN_KEY, []);
  (Array.isArray(plan) ? plan : []).forEach(function(e){
    if(e && e.ts) add(tsDay(e.ts), 1);
  });

  return map;
}

/* =====================================================================
   二、各 store 统计（只读）
   ===================================================================== */
function calcStreak(days){
  if(!days.length) return 0;
  var set = {}; days.forEach(function(s){ set[s] = 1; });
  var t = new Date(), cur = null;
  if(set[dkey(t)]) cur = t;
  else { var y = new Date(t); y.setDate(y.getDate() - 1); if(set[dkey(y)]) cur = y; }
  if(!cur) return 0;
  var n = 0, c = new Date(cur);
  while(set[dkey(c)]){ n++; c.setDate(c.getDate() - 1); }
  return n;
}
function morningStat(){
  var raw = jload(MORNING_KEY, {});
  var days = (Array.isArray(raw.days) ? raw.days : []).filter(function(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s); });
  var uniq = [];
  var seen = {};
  days.forEach(function(s){ if(!seen[s]){ seen[s] = 1; uniq.push(s); } });
  uniq.sort();
  var wk = 0;
  uniq.forEach(function(s){ if(inWeekDate(parseISO(s))) wk++; });
  return {days: uniq, total: uniq.length, streak: calcStreak(uniq), week: wk};
}
function answersStat(){
  var a = jload(ANS_KEY, {});
  var count = 0, week = 0;
  Object.keys(a).forEach(function(k){
    var r = a[k];
    if(!r) return;
    count++;
    if(r.ts && inWeekTs(r.ts)) week++;
  });
  return {count: count, week: week};
}
function reciteStat(){
  var raw = jload(RECITE_KEY, {});
  var cards = (raw.cards && typeof raw.cards === "object") ? raw.cards : {};
  var keys = Object.keys(cards);
  var mastered = 0;
  keys.forEach(function(k){ if((cards[k].lvl || 0) >= MASTER_LVL) mastered++; });
  var week = 0;
  (Array.isArray(raw.log) ? raw.log : []).forEach(function(e){
    if(e && inWeekTs(e.ts)) week += (e.n || 0);
  });
  return {total: keys.length, mastered: mastered, week: week};
}
function revisionStat(){
  var o = jload(REV_KEY, {});
  var versions = 0;
  Object.keys(o).forEach(function(k){
    var arr = o[k];
    if(Array.isArray(arr)) versions += arr.length;
  });
  return {versions: versions};
}
/* 模考完成识别：某套真题全部小题均已作答，视为完成一套模考 */
function paperStats(){
  var a = jload(ANS_KEY, {});
  var byPaper = {};
  Object.keys(a).forEach(function(k){
    var r = a[k];
    if(!r) return;
    var idx = k.lastIndexOf("#");
    var pid = (r.pid !== undefined && r.pid !== null) ? r.pid : (idx > 0 ? k.slice(0, idx) : k);
    var qno = (r.qno !== undefined && r.qno !== null) ? r.qno : (idx > 0 ? k.slice(idx + 1) : "");
    var bp = byPaper[pid] || (byPaper[pid] = {ans: {}, lastTs: 0});
    bp.ans[qno] = 1;
    if((r.ts || 0) > bp.lastTs) bp.lastTs = r.ts || 0;
  });
  var papers = (typeof DATA !== "undefined" ? (DATA.papers || []) : []);
  var done = 0, completed = [];
  papers.forEach(function(p){
    var total = (p.questions || []).length;
    if(!total) return;
    var bp = byPaper[p.id];
    if(!bp) return;
    var answered = (p.questions || []).filter(function(q){ return bp.ans[q.no] !== undefined; }).length;
    if(answered >= total){ done++; completed.push({pid: p.id, lastTs: bp.lastTs}); }
  });
  return {done: done, completed: completed};
}
function mockWeek(ps){
  var n = 0;
  ps.completed.forEach(function(c){ if(inWeekTs(c.lastTs)) n++; });
  return n;
}
function planWeek(){
  var a = jload(PLAN_KEY, []);
  var n = 0;
  (Array.isArray(a) ? a : []).forEach(function(e){ if(e && e.ts && inWeekTs(e.ts)) n++; });
  return n;
}

/* =====================================================================
   三、考试倒计时
   ===================================================================== */
function countdown(m){
  var d = parseISO(m.examDate);
  if(!d) return null;
  return dayGap(todayDate(), d);   /* >0 未到 / 0 今天 / <0 已过 */
}
function countdownCard(m){
  var cd = countdown(m);
  var h = '<div class="b5-card" id="b5-countdown"><div class="b5-title">🎯 考试倒计时</div>';
  if(cd === null){
    h += '<div class="b5-empty2">尚未设置考试日期。设置后可查看距考天数与周数，并解锁「距考百日」冲刺勋章。</div>';
    h += '<div class="b5-actbar"><button class="b5-btn b5-primary" onclick="b5SetExam()">📅 设置考试日期</button>' +
         '<span class="b5-dim">参考：国考笔试通常在 11 月下旬（如 ' + E(DEFAULT_EXAM) + '），以官方公告为准。</span></div>';
    return h + '</div>';
  }
  var dateStr = E(m.examDate);
  if(cd < 0){
    h += '<div class="b5-cdrow"><div class="b5-count"><b class="b5-cbig b5-past">考试已结束</b>' +
         '<span class="b5-cunit">目标日期 ' + dateStr + '，已过去 ' + (-cd) + ' 天</span></div></div>';
  }else{
    var weeks = cd / 7;
    var fullW = Math.floor(cd / 7), remD = cd % 7;
    var big = cd === 0 ? "就是今天" : (cd + " 天");
    var sub = cd === 0
      ? ("目标日期 " + dateStr + " · 沉着应考，祝旗开得胜")
      : ("目标日期 " + dateStr + " · 约 " + weeks.toFixed(1) + " 周（" + fullW + " 周 " + remD + " 天）");
    h += '<div class="b5-cdrow"><div class="b5-count"><b class="b5-cbig' + (cd <= 30 ? " b5-hot" : "") + '">' + E(big) + '</b>' +
         '<span class="b5-cunit">' + E(sub) + '</span></div>';
    h += '<div class="b5-cweeks"><div class="b5-cw"><b>' + Math.max(0, fullW) + '</b><span>整周</span></div>' +
         '<div class="b5-cw"><b>' + weeks.toFixed(1) + '</b><span>周（约）</span></div></div></div>';
  }
  h += '<div class="b5-actbar"><button class="b5-btn" onclick="b5SetExam()">✎ 修改考试日期</button>' +
       '<span class="b5-dim">距考天数按本地日期计算；日期仅存本机。</span></div>';
  return h + '</div>';
}

/* =====================================================================
   四、全年贡献热力图（GitHub 风格，53 周 × 7 天）
   ===================================================================== */
function heatLevel(c){
  if(!c) return 0;
  if(c <= 2) return 1;
  if(c <= 4) return 2;
  return 3;
}
function heatmapCard(map){
  var t = todayDate();
  var dow = t.getDay();
  var diff = (dow === 0) ? -6 : (1 - dow);
  var thisMon = new Date(t.getFullYear(), t.getMonth(), t.getDate() + diff);
  var startMon = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - 52 * 7); /* 共 53 列 */

  var cells = "";
  var monthMark = "";
  var lastMonth = -1;
  for(var w = 0; w < 53; w++){
    var colFirst = new Date(startMon.getFullYear(), startMon.getMonth(), startMon.getDate() + w * 7);
    var mo = colFirst.getMonth();
    if(mo !== lastMonth && colFirst.getDate() <= 7){
      monthMark += '<span class="b5-mo" style="grid-column:' + (w + 1) + '">' + (mo + 1) + '月</span>';
      lastMonth = mo;
    }
    for(var d = 0; d < 7; d++){
      var cur = new Date(startMon.getFullYear(), startMon.getMonth(), startMon.getDate() + w * 7 + d);
      if(dayGap(cur, t) < 0){                       /* 未来日期：占位空格 */
        cells += '<span class="b5-cell b5-future"></span>';
        continue;
      }
      var key = dkey(cur);
      var c = map[key] || 0;
      var lv = heatLevel(c);
      var tip = key + "（周" + "日一二三四五六".charAt(cur.getDay()) + "）· 活跃度 " + c;
      cells += '<span class="b5-cell b5-h' + lv + '" title="' + EA(tip) + '"></span>';
    }
  }

  var yr = new Date().getFullYear();
  var totalDays = Object.keys(map).filter(function(k){ return k.indexOf(yr + "-") === 0 && map[k] > 0; }).length;
  var totalActs = 0;
  Object.keys(map).forEach(function(k){ if(k.indexOf(yr + "-") === 0) totalActs += map[k]; });

  var h = '<div class="b5-card" id="b5-heat"><div class="b5-title">🌱 全年贡献热力图 <span class="b5-dim">（近 53 周 · 越深表示当天学习越多）</span></div>';
  if(!totalDays){
    h += '<div class="b5-empty2">本年还没有学习记录。晨读打卡、提交作答、背诵与修订都会在这里点亮方格。</div>';
  }
  h += '<div class="b5-heatscroll"><div class="b5-heatinner">' +
       '<div class="b5-months">' + monthMark + '</div>' +
       '<div class="b5-heat">' + cells + '</div></div></div>';
  h += '<div class="b5-heatfoot">' +
       '<div class="b5-legend"><span>少</span>' +
       '<span class="b5-cell b5-h0"></span><span class="b5-cell b5-h1"></span>' +
       '<span class="b5-cell b5-h2"></span><span class="b5-cell b5-h3"></span>' +
       '<span>多</span></div>' +
       '<div class="b5-htotal">本年累计学习 <b>' + totalDays + '</b> 天 · 活跃度合计 <b>' + totalActs + '</b></div>' +
       '</div>';
  return h + '</div>';
}

/* =====================================================================
   五、每周目标进度环
   ===================================================================== */
function ringSVG(actual, target){
  var pct = target > 0 ? Math.min(100, Math.round(actual / target * 100)) : 0;
  var cls = pct >= 100 ? "done" : (pct < 60 ? "low" : "mid");
  var R = 42, C = 2 * Math.PI * R;
  var off = C * (1 - pct / 100);
  return '<svg class="b5-ringsvg" viewBox="0 0 100 100" width="104" height="104" aria-hidden="true">' +
    '<circle class="b5-rtrack" cx="50" cy="50" r="' + R + '" fill="none" stroke-width="10"></circle>' +
    '<circle class="b5-rbar ' + cls + '" cx="50" cy="50" r="' + R + '" fill="none" stroke-width="10" ' +
    'stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) +
    '" transform="rotate(-90 50 50)"></circle>' +
    '<text class="b5-rpct ' + cls + '" x="50" y="52" text-anchor="middle" dominant-baseline="middle">' + pct + '%</text>' +
    '</svg>';
}
function ringItem(icon, label, actual, target, unit){
  return '<div class="b5-ring">' + ringSVG(actual, target) +
    '<div class="b5-rlabel">' + E(icon) + ' ' + E(label) + '</div>' +
    '<div class="b5-rcount">' + E(unit) + ' <b>' + actual + '</b>/' + target + '</div></div>';
}
function goalsCard(goals, week){
  var h = '<div class="b5-card" id="b5-goals"><div class="b5-title">🎯 每周目标进度环 ' +
          '<span class="b5-dim">（' + E(dkey(_WK.start)) + ' ~ ' + E(dkey(_WK.end)) + ' · 周一至周日）</span></div>';
  h += '<div class="b5-rings">';
  h += ringItem("🧠", "背诵卡", week.recite,  goals.recite,  "已背");
  h += ringItem("🌅", "晨读打卡", week.morning, goals.morning, "已打卡");
  h += ringItem("✍️", "真题作答", week.answer,  goals.answer,  "已作答");
  h += ringItem("📝", "整套模考", week.mock,    goals.mock,    "已模考");
  h += ringItem("📌", "微计划",   week.plan,    goals.plan,    "已打卡");
  h += '</div>';
  h += '<div class="b5-actbar"><button class="b5-btn" onclick="b5EditGoals()">✎ 编辑周目标</button>' +
       '<span class="b5-dim">红色＝进度不足 60%，达标 100% 转为绿色；每周一自动归零重新计。</span></div>';
  return h + '</div>';
}

/* =====================================================================
   六、成就勋章
   ===================================================================== */
function computeBadges(s){
  var cd = s.cd;
  return [
    {ab:"晨读", name:"晨读新手",  cond:"连续晨读打卡 ≥ 3 天",   ok: s.mor.streak   >= 3,   now: s.mor.streak + " 天"},
    {ab:"达人", name:"晨读达人",  cond:"累计晨读打卡 ≥ 30 天",  ok: s.mor.total    >= 30,  now: s.mor.total + " 天"},
    {ab:"百日", name:"百日打卡",  cond:"累计晨读打卡 ≥ 100 天", ok: s.mor.total    >= 100, now: s.mor.total + " 天"},
    {ab:"首战", name:"首战作答",  cond:"完成作答 ≥ 1 题",       ok: s.ans.count    >= 1,   now: s.ans.count + " 题"},
    {ab:"题海", name:"题海遨游",  cond:"完成作答 ≥ 50 题",      ok: s.ans.count    >= 50,  now: s.ans.count + " 题"},
    {ab:"千锤", name:"千锤百炼",  cond:"完成作答 ≥ 200 题",     ok: s.ans.count    >= 200, now: s.ans.count + " 题"},
    {ab:"背诵", name:"背诵入门",  cond:"背诵卡 ≥ 10 张",        ok: s.rec.total    >= 10,  now: s.rec.total + " 张"},
    {ab:"成诵", name:"过目成诵",  cond:"已掌握背诵卡 ≥ 100 张",  ok: s.rec.mastered >= 100, now: s.rec.mastered + " 张"},
    {ab:"修订", name:"修订狂人",  cond:"作答修订史 ≥ 10 版",    ok: s.revs.versions>= 10,  now: s.revs.versions + " 版"},
    {ab:"模考", name:"模考战士",  cond:"完成整套模考 ≥ 1 套",   ok: s.papers.done  >= 1,   now: s.papers.done + " 套"},
    {ab:"冲刺", name:"距考百日",  cond:"考试倒计时 ≤ 100 天",   ok: cd !== null && cd >= 0 && cd <= 100,
       now: cd === null ? "未设日期" : (cd < 0 ? "已结束" : cd + " 天")}
  ];
}
function badgesCard(badges){
  var unlocked = badges.filter(function(b){ return b.ok; }).length;
  var h = '<div class="b5-card" id="b5-badges"><div class="b5-title">🏅 成就勋章 ' +
          '<span class="b5-dim">（已解锁 ' + unlocked + ' / ' + badges.length + '）</span></div>';
  h += '<div class="b5-badges">';
  badges.forEach(function(b){
    var cls = b.ok ? "b5-on" : "b5-off";
    h += '<div class="b5-badge ' + cls + '" title="' + EA(b.name + "：" + b.cond) + '">' +

         '<span class="b5-bcond">' + (b.ok ? "已解锁 · " : "未解锁 · ") + E(b.cond) + '</span>' +
         '<span class="b5-bnow">当前：' + E(b.now) + '</span>' +
         '</div>';

  h += '</div></div>';
  return h;
}

/* =====================================================================

   ===================================================================== */

  }

  h += '<div class="b5-card"><div class="b5-stats">' +
    '<div class="b5-stat"><b class="' + (cd !== null && cd >= 0 && cd <= 30 ? "b5-hot" : "") + '">' +
      (cd === null ? "—" : (cd >= 0 ? cd : "已过")) + '</b><span>距考天数</span></div>' +
    '<div class="b5-stat"><b>' + totalDays + '</b><span>本年学习（天）</span></div>' +
    '<div class="b5-stat"><b class="b5-hot">' + mor.streak + '</b><span>连续晨读（天）</span></div>' +
    '<div class="b5-stat"><b class="b5-ok">' + unlocked + '</b><span>已解锁勋章（个）</span></div>' +
    '</div></div>';

  h += countdownCard(m);
  h += heatmapCard(map);

function b5SetExam(){
  var m = loadMotiv();
  var cur = m.examDate || DEFAULT_EXAM;
  var v = prompt("请输入考试日期（格式 YYYY-MM-DD，例如国考笔试 " + DEFAULT_EXAM + "）：", cur);
  if(v === null) return;
  v = v.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ alert("日期格式不正确，请使用 YYYY-MM-DD，例如 2026-11-29。"); return; }
  if(!parseISO(v)){ alert("这不是一个有效的日期，请重新输入。"); return; }
  m.examDate = v;
  if(!saveMotiv(m)) alert("保存失败：浏览器存储空间可能已满。");
  renderMotivation();
}
function b5EditGoals(){
  var m = loadMotiv();
  var g = goalsOf(m);
  var r1 = prompt("每周【背诵卡】目标（张）：", String(g.recite));
  if(r1 === null) return;
  var r2 = prompt("每周【晨读打卡】目标（天，建议 ≤ 7）：", String(g.morning));
  if(r2 === null) return;
  var r3 = prompt("每周【真题作答】目标（题）：", String(g.answer));
  if(r3 === null) return;
  var r4 = prompt("每周【整套模考】目标（套）：", String(g.mock));
  if(r4 === null) return;
  m.goals = {
    recite:  toInt(r1, g.recite),
    morning: toInt(r2, g.morning),
    answer:  toInt(r3, g.answer),
    mock:    toInt(r4, g.mock)
  };
  if(!saveMotiv(m)) alert("保存失败：浏览器存储空间可能已满。");
  renderMotivation();
}

   ===================================================================== */
window.renderMotivation = renderMotivation;
window.b5SetExam        = b5SetExam;
window.b5EditGoals      = b5EditGoals;

})();

function topicMatch(t){
  if(topicState.theme !== "全部" && t.theme !== topicState.theme) return false;
  var q = (topicState.q || "").trim();
  if(!q) return true;
  var blob = [t.name, t.theme, (t.tags||[]).join(" "), t.bg,
              (t.points||[]).join(" "), (t.quotes||[]).join(" "),
              (t.cases||[]).join(" ")].join(" ");
  return blob.indexOf(q) >= 0;
}

function topicCardHTML(t, idx){

    return '<li class="b6-li">'+esc(p)+'</li>';

    return '<div class="b6-case">'+esc(c)+'</div>';
  }).join("");
  var linkTip = t.link
    ? '<span class="b6-link" title="可在素材库检索该母题">🔗 关联素材：'+esc(t.link)+'</span>' : "";

function b6Tab(i){ frameTab = i; renderFrames(); }

/* =====================================================================

window.renderTopics = renderTopics;

window.b6Filter     = b6Filter;

window.b6AddQuote   = b6AddQuote;
window.b6Tab        = b6Tab;

})();

/* 统一调用：直连厂商 /chat/completions，返回文本；失败抛出可读错误 */
async function callLLM(sys, user, maxTokens){
  const cfg = cfgValid();
  if(!cfg) throw new Error("NO_CFG");
  const resp = await fetch(cfg.base + "/chat/completions", {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key },
    body: JSON.stringify({
      model: cfg.model,
      messages: [{role:"system",content:sys},{role:"user",content:user}],
      temperature: 0.3,
      max_tokens: maxTokens || 1600
    })
  });
  if(!resp.ok) throw new Error("HTTP "+resp.status+" "+resp.statusText);
  const data = await resp.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "（模型未返回内容）";
}

/* 从模型输出里稳健地抽 JSON（容忍 ```json 围栏与前后废话） */
function extractJSON(txt){
  if(!txt) return null;
  let s = String(txt).replace(/```json/gi, "```");
  const fence = s.match(/```([\s\S]*?)```/);
  if(fence) s = fence[1];
  const i = s.indexOf("{"), j = s.lastIndexOf("}");
  if(i>=0 && j>i){ try{ return JSON.parse(s.slice(i, j+1)); }catch(e){} }
  const k = s.indexOf("["), l = s.lastIndexOf("]");
  if(k>=0 && l>k){ try{ return JSON.parse(s.slice(k, l+1)); }catch(e){} }
  return null;
}

/* =====================================================================
   视图三：学情派单（弱项自算 + 7 天派单）
   ===================================================================== */
function ratePct(r){
  if(typeof r.rate === "number") return r.rate<=1 ? Math.round(r.rate*100) : Math.round(r.rate);
  if(typeof r.score === "number" && typeof r.total === "number" && r.total>0) return Math.round(r.score/r.total*100);
  return null;
}
function computeWeak(){
  const ans = loadAns();
  const agg = {}, reasonFreq = {};
  let answered = 0;
  Object.keys(ans).forEach(function(k){
    const r = ans[k];
    if(!r) return;
    const pct = ratePct(r);
    if(pct===null) return;
    const t = typeOf(r.qtype||"");
    answered++;
    const a = agg[t] || (agg[t] = {sum:0, n:0, reasons:{}});
    a.sum += pct; a.n++;
    (r.reasons||[]).forEach(function(rs){
      rs = String(rs||"").trim(); if(!rs) return;
      a.reasons[rs] = (a.reasons[rs]||0)+1;
      reasonFreq[rs] = (reasonFreq[rs]||0)+1;
    });
  });
  const types = Object.keys(agg).map(function(t){
    return { type:t, rate:Math.round(agg[t].sum/agg[t].n), n:agg[t].n, reasons:agg[t].reasons };
  }).sort(function(x,y){ return x.rate - y.rate; });
  const topReasons = Object.keys(reasonFreq)
    .sort(function(a,b){ return reasonFreq[b]-reasonFreq[a]; })
    .slice(0,5).map(function(k){ return {reason:k, n:reasonFreq[k]}; });
  return { types:types, weak:types.slice(0,3), topReasons:topReasons, answered:answered, hasData:answered>0 };
}
/* 弱项摘要文本（既用于页面展示，也作为派单 prompt 输入） */
function weakSummaryText(w){
  if(!w.hasData) return "考生暂无历史作答记录，请按零基础/入门定位，给出通用的 7 天申论入门派单。";
  const parts = w.weak.map(function(t){ return t.type+" "+t.rate+"%（"+t.n+"题）"; });
  const rs = w.topReasons.map(function(x){ return x.reason+"×"+x.n; });
  return "考生弱项题型："+parts.join("、")+"。高频失分根因："+(rs.length?rs.join("、"):"暂无记录")+"。请据此制定针对性 7 天练习派单。";
}
function dispatchSectionHtml(hasCfg){
  const w = computeWeak();
  let sum;
  if(!w.hasData){
    sum = '<div class="b7-weak b7-warn">还没有作答记录，无法识别弱项 —— 将为你生成通用入门派单。先去「真题库」做几道题，学情会更准。</div>';
  }else{
    let chips = w.weak.map(function(t){
      const cls = t.rate>=70 ? "up" : "down";  /* 得分率：高=红(强)、低=绿(弱)，遵循本站升红降绿惯例 */
      return '<span class="b7-wtag '+cls+'">'+E(t.type)+' <b>'+t.rate+'%</b><i>'+t.n+'题</i></span>';
    }).join("");
    let rs = w.topReasons.length
      ? '<div class="b7-wreasons">高频失分根因：'+w.topReasons.map(function(x){ return '<span class="b7-rtag">'+E(x.reason)+' ×'+x.n+'</span>'; }).join("")+'</div>'
      : '';
    sum = '<div class="b7-weak">你的弱项：'+chips+'<span class="b7-wmore">（已作答 '+w.answered+' 题 · 得分率高=红 / 低=绿）</span></div>'+rs;
  }
  let h = '<div class="b7-card" id="b7Dispatch">';
  h += '<div class="b7-cardh">③ 学情派单 <span class="b7-sub">按你的作答自动算弱项，AI 派出可勾选的 7 天练习清单</span></div>';
  h += sum;

}
function normalizePlan(obj, txt){
  let days = [];
  if(obj && Array.isArray(obj.days) && obj.days.length){
    days = obj.days.map(function(d){
      const title = [ (d.day||""), (d.type||""), (d.count?("×"+d.count+"道"):"") ].filter(Boolean).join(" · ");

function planBoxHtml(store){

async function b7Dispatch(){
