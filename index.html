        '<div class="b16-bar">' +
          '<input id="b16q" class="b16-search" type="search" placeholder="搜题型 / 关键词 / 难点标签 / 年份…（空格分词=同时包含）" value="' + esc(S.q) + '">' +
          '<button class="b16-mini" data-b16="clear">✖ 清空</button>' +
          '<button class="b16-mini" id="b16-order" data-b16="order">' + (S.desc ? "⏫ 改为旧→新" : "⏬ 改为新→旧") + '</button>' +
        '</div>' +
        '<div class="b16-cnt" id="b16-cnt"></div>' +
        '<div id="b16-list"></div>' +
        '<div id="b16-more" class="b16-morebox"></div>' +
      '</div>';

    bind(box);
    paintList();
  }

  /* ---------------- 事件（委托，不用内联 onclick） ---------------- */
  function pick(i){
    var n = parseInt(i, 10);
    return (!isNaN(n) && ITEMS[n]) ? ITEMS[n] : null;
  }

  function setQ(v){
    S.q = String(v == null ? "" : v);
    S.limit = PAGE;
    paintList();
  }

  function bind(root){
    if(root.__b16bound) return;
    root.__b16bound = true;

    root.addEventListener("input", function(ev){
      var el = ev.target;
      if(el && el.id === "b16q") setQ(el.value);
    });

    root.addEventListener("click", function(ev){
      var el = ev.target, act = null, it, j;
      while(el && el !== root){
        act = el.getAttribute && el.getAttribute("data-b16");
        if(act) break;
        el = el.parentNode;
      }
      if(!act) return;

      if(act === "redo"){
        it = pick(el.getAttribute("data-i"));
        if(!it) return;
        try{
          if(window.openAnswerModal) window.openAnswerModal(it.pid, it.qno);
          else alert("作答弹窗未加载");
        }catch(err){ try{ console.error("[_b16]", err); }catch(e){} }
        return;
      }
      if(act === "cmp"){
        it = pick(el.getAttribute("data-i"));
        if(!it) return;
        try{
          if(window.b8OpenCompare) window.b8OpenCompare(it.pid, it.qno);
          else alert("答案对照模块未加载");
        }catch(err){ try{ console.error("[_b16]", err); }catch(e){} }
        return;
      }
      if(act === "tag"){
        it = pick(el.getAttribute("data-i"));
        j = parseInt(el.getAttribute("data-j"), 10);
        if(!it || isNaN(j) || !it.tags[j]) return;
        var inp = document.getElementById("b16q");
        if(inp) inp.value = it.tags[j];
        setQ(it.tags[j]);
        return;
      }
      if(act === "top"){
        j = parseInt(el.getAttribute("data-i"), 10);
        if(isNaN(j) || !TOP[j]) return;
        var inp2 = document.getElementById("b16q");
        if(inp2) inp2.value = TOP[j].t;
        setQ(TOP[j].t);
        return;
      }
      if(act === "clear"){
        var inp3 = document.getElementById("b16q");
        if(inp3) inp3.value = "";
        setQ("");
        return;
      }
      if(act === "order"){
        S.desc = !S.desc;
        S.limit = PAGE;
        var ob = document.getElementById("b16-order");
        if(ob) ob.textContent = S.desc ? "⏫ 改为旧→新" : "⏬ 改为新→旧";
        paintList();
        return;
      }
      if(act === "more"){
        S.limit += PAGE;
        paintList();
        return;
      }
    });
  }

  /* ================= 路由入口 ================= */
  window.renderGrowth = function(){
    try{
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = '<div class="b16-card b16-empty">申论成长史运行出错：' +
          esc(String((err && err.message) || err)) + '</div>';
      }catch(e){}
      try{ console.error("[_b16]", err); }catch(e){}
    }
  };

})();

</script>
<script>/* === _b17.js === */
(function(){
  "use strict";
  /* ==================================================================
     _b17 单题限时模考 + 考场节奏复盘（Timed Drill）
     A. 选套卷 → 选题 → 设倒计时 → 限时作答 → 交卷算命中率
     B. 读全部限时记录，复盘时间分配（超时/提前、最常超时题型、教练提示）
     纯前端离线、零依赖；只写 localStorage("shenlun_timed_v1")。
     暴露 window.renderTimedDrill，全部类名 b17- 前缀。
     ================================================================== */

  var STORE = "shenlun_timed_v1";
  var MAXREC = 300;

  var TIMER = null;

    return String(s == null ? "" : s)

  };

  /* 模块内状态（不碰主站 state） */

    tab: "drill",        /* drill | review */
    pid: "", qno: null,
    mins: 20,            /* 设定分钟 */
    custom: false,       /* 是否手动改过时长 */
    running: false,
    startAt: 0,          /* 开考时间戳 */
    limitSec: 0,         /* 本次设定秒数 */
    sugSec: 0,           /* 本题型建议秒数 */
    text: "",            /* 作答草稿（重绘时回填） */
    result: null,        /* 上一次交卷结果 */
    flash: ""
  };

  /* ---------- 通用小工具 ---------- */
  function isArr(x){ return Object.prototype.toString.call(x) === "[object Array]"; }
  function num(x, d){ var n = parseInt(x, 10); return isNaN(n) ? d : n; }
  function pad2(n){ n = Math.floor(Math.abs(n)); return (n < 10 ? "0" : "") + n; }

  function fmtClock(sec){
    sec = Math.floor(Math.abs(num(sec, 0)));
    return pad2(Math.floor(sec / 60)) + ":" + pad2(sec % 60);
  }
  function fmtCn(sec){
    sec = Math.floor(Math.abs(num(sec, 0)));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m > 0 ? (m + " 分 ") : "") + s + " 秒";
  }
  function fmtDay(ts){
    try{
      var d = new Date(num(ts, 0));
      if(!ts || isNaN(d.getTime())) return "—";
      return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }catch(e){ return "—"; }
  }

  /* ---------- 样式自挂载（主站未 link _b17.css 时兜底，不改任何文件） ---------- */
  function ensureCss(){
    try{
      var ls = document.getElementsByTagName("link"), i;
      for(i = 0; i < ls.length; i++){
        if(String(ls[i].getAttribute("href") || "").indexOf("_b17.css") >= 0) return;
      }
      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b17.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  /* ---------- 数据安全访问 ---------- */
  function D(){
    try{ return (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null); }
    catch(e){ return null; }
  }
  function papers(){
    try{ var d = D(); return (d && isArr(d.papers)) ? d.papers : []; }catch(e){ return []; }
  }
  function paperOf(pid){
    var ps = papers(), i;
    for(i = 0; i < ps.length; i++){ if(ps[i] && ps[i].id === pid) return ps[i]; }
    return null;
  }
  function qsOf(p){
    try{ return (p && isArr(p.questions)) ? p.questions : []; }catch(e){ return []; }
  }
  /* findQ 优先用主站的，拿不到就自己找 */
  function findQ2(pid, qno){
    var r = null;
    try{ if(typeof findQ === "function") r = findQ(pid, qno); }catch(e){ r = null; }
    if(!r){ try{ if(typeof window.findQ === "function") r = window.findQ(pid, qno); }catch(e){ r = null; } }
    if(r && r.q) return r;
    var p = paperOf(pid), qs = qsOf(p), i;
    for(i = 0; i < qs.length; i++){
      if(qs[i] && String(qs[i].no) === String(qno)) return { p: p, q: qs[i] };
    }
    return null;
  }
  function paperName(p){
    if(!p) return "—";
    var pv = String(p.province || "");
    return String(p.year || "") + " " + (pv && pv !== "国考" ? pv + "·" : "") + String(p.paper || "");
  }

  /* ---------- 题型 → 维度 / 建议时长 ---------- */
  function dimOf(qtype){
    var t = String(qtype || "");
    if(/作文|文章写作/.test(t)) return "大作文";
    if(/公文|贯彻执行|应用文|简报|短评|提纲|宣传/.test(t)) return "公文题";
    if(/对策|建议|措施/.test(t)) return "对策题";
    if(/分析/.test(t)) return "分析题";
    if(/概括|归纳/.test(t)) return "概括题";
    return "其他题";
  }
  function sugMin(qtype){
    var d = dimOf(qtype);
    if(d === "大作文") return 60;
    if(d === "公文题") return 25;
    return 20;                     /* 概括 / 分析 / 对策 / 其他 */
  }

  /* ---------- 评分：优先主站 scoreAnswer，其次 _b8 scoreEnhance，最后本地兜底 ---------- */
  var STOP = {};
  (function(){
    var w = ["可以","应该","我们","他们","这个","那个","以及","通过","由于","对于","进行","问题",
             "方面","需要","必须","一个","没有","这样","就是","因此","所以","但是","并且","而且",
             "如果","因为","为了","能够","实现","提供","建立","加强","完善","提高","在于","成为",
             "工作","开展","推动","促进","发挥","作用","重要","不断","切实","有效"], i;
    for(i = 0; i < w.length; i++) STOP[w[i]] = 1;
  })();

  function localScore(text, q){
    var a = String(text || ""), pts = (q && isArr(q.points)) ? q.points : [];
    var hits = [], missed = [], i, j, L, t, w, ok;
    for(i = 0; i < pts.length; i++){
      t = String((pts[i] && pts[i].text) || "").replace(/[^\u4e00-\u9fa5]/g, "");
      ok = false;
      for(j = 0; j < t.length && !ok; j++){
        for(L = 2; L <= 4 && j + L <= t.length; L++){
          w = t.substr(j, L);
          if(STOP[w]) continue;
          if(a.indexOf(w) >= 0){ ok = true; break; }
        }
      }
      (ok ? hits : missed).push(pts[i]);
    }
    var total = pts.length, rate = total ? hits.length / total : 0;
    return { hits: hits, missed: missed, rate: rate, score: Math.round(rate * 100),
             total: total, hitCount: hits.length };
  }
  function doScore(text, q){
    var r = null;
    try{ if(typeof scoreAnswer === "function") r = scoreAnswer(text, q); }catch(e){ r = null; }
    if(!r){ try{ if(typeof window.scoreAnswer === "function") r = window.scoreAnswer(text, q); }catch(e){ r = null; } }
    if(!r){ try{ if(typeof window.scoreEnhance === "function") r = window.scoreEnhance(text, q); }catch(e){ r = null; } }
    if(!r || typeof r.rate !== "number"){ r = localScore(text, q); }
    return r;
  }

  /* ---------- 限时记录存储 ---------- */
  function loadRecs(){
    try{
      var s = localStorage.getItem(STORE);
      var a = s ? JSON.parse(s) : [];
      return isArr(a) ? a : [];
    }catch(e){ return []; }
  }
  function saveRecs(a){
    try{
      localStorage.setItem(STORE, JSON.stringify((isArr(a) ? a : []).slice(0, MAXREC)));
      return true;
    }catch(e){ return false; }
  }

  /* ---------- 计时器（全模块唯一，任何入口先清） ---------- */
  function stopTimer(){

    TIMER = null;
  }
  function elapsed(){
    if(!S.startAt) return 0;
    var v = Math.floor((Date.now() - S.startAt) / 1000);
    return v < 0 ? 0 : v;
  }
  function tick(){
    var el, bar, tip, used, left;
    try{
      el = document.getElementById("b17-clock");
      /* 页面被主站重绘 / 用户离开本模块 → 计时器自杀，防止叠加空跑 */
      if(!el || !document.body || !document.body.contains(el)){ stopTimer(); return; }
      used = elapsed();
      left = S.limitSec - used;
      el.textContent = (left < 0 ? "-" : "") + fmtClock(left);
      el.className = "b17-clock" + (left <= 0 ? " over" : (left <= 60 ? " warn" : ""));
      bar = document.getElementById("b17-barfill");
      if(bar){
        var pct = S.limitSec > 0 ? (left > 0 ? left / S.limitSec : 0) * 100 : 0;
        bar.style.width = pct.toFixed(2) + "%";
        bar.className = left <= 0 ? "over" : (left <= 60 ? "warn" : "");
      }
      tip = document.getElementById("b17-tip");
      if(tip){
        tip.textContent = left > 0
          ? ("设定 " + Math.round(S.limitSec / 60) + " 分钟 · 建议 " + Math.round(S.sugSec / 60) + " 分钟，写完就交，别拖")
          : ("⏰ 时间到，请提交！已超时 " + fmtCn(-left));

      }
    }catch(e){ stopTimer(); }
  }
  function startTimer(){
    stopTimer();
    try{ TIMER = setInterval(tick, 1000); }catch(e){ TIMER = null; }
    tick();
  }

  /* ---------- 选择项校正 ---------- */
  function normalize(){
    var ps = papers(), i, p, qs;
    if(!ps.length){ S.pid = ""; S.qno = null; return; }
    p = paperOf(S.pid);
    if(!p){
      for(i = 0; i < ps.length; i++){ if(qsOf(ps[i]).length){ p = ps[i]; break; } }
      p = p || ps[0];
      S.pid = p.id; S.qno = null; S.custom = false;
    }
    qs = qsOf(p);
    if(!qs.length){ S.qno = null; return; }

    for(i = 0; i < qs.length; i++){
      if(String(qs[i].no) === String(S.qno)){ S.qno = qs[i].no; hit = true; break; }  /* 回写成 DATA 里的原始类型，供主站 findQ 严格比较 */
    }
    if(!hit){ S.qno = qs[0].no; S.custom = false; }
    if(!S.custom){
      var f = findQ2(S.pid, S.qno);
      S.mins = sugMin(f && f.q ? f.q.qtype : "");
    }
  }

  /* ================= 渲染：头部 ================= */
  function headHtml(){
    return '' +
      '<div class="b17-head">' +

          '<button class="b17-tab' + (S.tab === "review" ? " on" : "") + '" data-b17="tab" data-v="review">② 考场节奏复盘</button>' +
        '</div>' +

  }
  function flashHtml(){

  /* ================= A. 单题限时模考 ================= */
  function drillHtml(){

    }

  function setupHtml(){

    for(k = 0; k < chips.length; k++){

    return '' +
    '<div class="b17-card">' +
      '<div class="b17-h3"><span class="b17-num">1</span>选题 &amp; 设时</div>' +
      '<div class="b17-row">' +
        '<label class="b17-lbl2">套卷</label>' +
        '<select class="b17-sel" data-b17="pid">' + o.join("") + '</select>' +
      '</div>' +
      '<div class="b17-row">' +
        '<label class="b17-lbl2">题目</label>' +
        '<select class="b17-sel" data-b17="qno">' + (qo.length ? qo.join("") : '<option>该卷暂无题目</option>') + '</select>' +
      '</div>' +
      '<div class="b17-qmeta">' + meta + '</div>' +
      '<div class="b17-row wrap">' +
        '<label class="b17-lbl2">时长</label>' +
        '<div class="b17-chips">' + c.join("") + '</div>' +
        '<span class="b17-custom">自定义 <input type="number" class="b17-numin" data-b17="custom" min="1" max="180" value="' +
          esc(S.mins) + '"> 分钟</span>' +
      '</div>' +
      '<div class="b17-ops">' +
        '<button class="b17-btn"' + (q ? '' : ' disabled') + ' data-b17="start">▶ 开始计时</button>' +
        '<span class="b17-tip">开始后题干与作答区展开，倒计时归零会变红提示交卷（不会强制打断）。</span>' +
        flashHtml() +
      '</div>' +
    '</div>';
  }

  function runHtml(){
    var f = findQ2(S.pid, S.qno);
    if(!f){ return '<div class="b17-card"><div class="b17-empty">题目丢失，请返回重新选择。</div></div>'; }
    var p = f.p, q = f.q, i, st = [];
    var stem = isArr(q.stem) ? q.stem : (q.stem ? [q.stem] : []);
    for(i = 0; i < stem.length; i++) st.push('<div>' + esc(stem[i]) + '</div>');

    return '' +
    '<div class="b17-card b17-run">' +
      '<div class="b17-runhead">' +
        '<div class="b17-rtitle">' + esc(paperName(p)) + ' · 题' + esc(q.no) +
          '<span class="b17-tag">' + esc(q.qtype || dimOf(q.qtype)) + '</span></div>' +
        '<div class="b17-clock" id="b17-clock">' + fmtClock(S.limitSec) + '</div>' +
      '</div>' +
      '<div class="b17-bar"><i id="b17-barfill" style="width:100%"></i></div>' +
      '<div class="b17-label">题干</div>' +
      '<div class="b17-stem">' + (st.length ? st.join("") : '<div class="b17-empty">该题暂无题干文本</div>') + '</div>' +
      '<div class="b17-label">我的作答（限时）</div>' +
      '<textarea id="b17-text" class="b17-text" placeholder="开考了，直接写要点，别回头改字…">' + esc(S.text) + '</textarea>' +
      '<div class="b17-cnt" id="b17-cnt"></div>' +
      '<div class="b17-ops">' +
        '<button class="b17-btn" data-b17="submit">📤 交卷并评分</button>' +
        '<button class="b17-mini del" data-b17="abort">放弃本次</button>' +
        '<span class="b17-tip" id="b17-tip"></span>' +
      '</div>' +
    '</div>';
  }

  function ptsHtml(res){
    var out = [], i, arr;
    arr = isArr(res.hits) ? res.hits : [];
    for(i = 0; i < arr.length && i < 12; i++){
      out.push('<li class="hit">✅ ' + esc((arr[i] && arr[i].text) || arr[i]) + '</li>');
    }
    arr = isArr(res.missed) ? res.missed : [];
    for(i = 0; i < arr.length && i < 12; i++){
      out.push('<li class="miss">❌ ' + esc((arr[i] && arr[i].text) || arr[i]) + '</li>');
    }
    return out.length ? '<ul class="b17-pts">' + out.join("") + '</ul>' : '';
  }

  function resultHtml(){
    var r = S.result, dev = r.used - r.sug;
    var devTxt = dev === 0 ? "与建议时长持平"
      : (dev > 0 ? '<b class="b17-over">🔺 比建议多 ' + Math.abs(dev) + ' 秒</b>'
                 : '<b class="b17-under">🔻 比建议少 ' + Math.abs(dev) + ' 秒</b>');
    var devLimit = r.used - r.limit;
    return '' +
    '<div class="b17-card b17-res">' +
      '<div class="b17-h3"><span class="b17-num">2</span>本次成绩</div>' +
      '<div class="b17-resline">' +
        '<span class="b17-big">' + Math.round(r.rate * 100) + '%</span>' +
        '<span class="b17-kv">命中 ' + r.hit + '/' + r.total + ' 个采分点</span>' +
        '<span class="b17-kv">用时 ' + fmtCn(r.used) + '</span>' +
        '<span class="b17-kv">设定 ' + fmtCn(r.limit) + (devLimit > 0 ? '（超时 ' + devLimit + ' 秒交卷）' : '') + '</span>' +
        '<span class="b17-kv">' + devTxt + '</span>' +
      '</div>' +
      '<div class="b17-note">' + esc(r.tip) + '</div>' +
      ptsHtml(r.res) +
      '<div class="b17-ops">' +
        '<button class="b17-mini" data-b17="goans">✍️ 去完整作答（存记录）</button>' +
        '<button class="b17-mini" data-b17="gocmp">📑 去答案对照</button>' +
        '<button class="b17-mini" data-b17="again">🔁 再练一题</button>' +
        '<button class="b17-mini" data-b17="tab" data-v="review">📊 看节奏复盘</button>' +
        flashHtml() +
      '</div>' +
    '</div>';
  }

  /* ================= B. 考场节奏复盘 ================= */
  var COACH = {
    "公文题": "你常在公文题超时，下次先花 2 分钟列格式提纲（标题—称谓—开头—主体—结尾），再动笔填内容，控制在 25 分钟内。",
    "大作文": "你常在大作文超时，先用 5 分钟定总论点＋3 个分论点，再按段写，别边写边想立意，60 分钟必须收尾。",
    "概括题": "你常在概括题超时，多半是反复读材料。改成一遍勾画、直接归并同类项，20 分钟内出条理化答案。",
    "分析题": "你常在分析题超时，套死「亮观点—拆维度—落对策」三步，写够即止，别展开成小作文。",
    "对策题": "你常在对策题超时，对策直接从问题反推，主体＋动作＋抓手一句一条，不做过度解释。",
    "其他题": "你有稳定超时倾向，做题前先给自己划死时间线：审题 2 分、找点 8 分、成文 10 分。"
  };

  function reviewHtml(){
    var recs = loadRecs();
    if(!recs.length){
      return '<div class="b17-card"><div class="b17-empty">还没有限时记录。先去 <b>① 单题限时模考</b> 掐表做一题，' +
             '交卷后这里会自动生成你的时间分配复盘。</div>' +
             '<div class="b17-ops"><button class="b17-btn" data-b17="tab" data-v="drill">▶ 去做单题限时模考</button></div></div>';
    }
    var i, r, sumUsed = 0, sumSug = 0, sumRate = 0, over = {}, overN = 0;
    for(i = 0; i < recs.length; i++){
      r = recs[i] || {};
      sumUsed += num(r.used, 0);
      sumSug  += num(r.sug, 0);
      sumRate += (typeof r.rate === "number" ? r.rate : 0);
      if(num(r.used, 0) > num(r.sug, 0)){
        var d = r.dim || dimOf(r.qtype);
        over[d] = (over[d] || 0) + 1; overN++;
      }
    }
    var n = recs.length;
    var avgUsed = Math.round(sumUsed / n), avgSug = Math.round(sumSug / n);
    var avgRate = Math.round(sumRate / n * 100), diff = avgUsed - avgSug;
    var topDim = "", topN = 0, k;
    for(k in over){ if(Object.prototype.hasOwnProperty.call(over, k) && over[k] > topN){ topN = over[k]; topDim = k; } }

    var ovHtml = '' +
      '<div class="b17-ov">' +
        '<div class="b17-ovi"><span class="b17-ovn">' + n + '</span><span class="b17-ovl">限时练习次数</span></div>' +
        '<div class="b17-ovi"><span class="b17-ovn">' + fmtCn(avgUsed) + '</span><span class="b17-ovl">平均用时</span></div>' +
        '<div class="b17-ovi"><span class="b17-ovn">' + fmtCn(avgSug) + '</span><span class="b17-ovl">平均建议时长</span></div>' +
        '<div class="b17-ovi"><span class="b17-ovn ' + (diff > 0 ? "b17-over" : (diff < 0 ? "b17-under" : "")) + '">' +
          (diff > 0 ? "🔺 +" : (diff < 0 ? "🔻 -" : "±")) + Math.abs(diff) + ' 秒</span>' +
          '<span class="b17-ovl">平均偏差</span></div>' +
        '<div class="b17-ovi"><span class="b17-ovn">' + avgRate + '%</span><span class="b17-ovl">平均命中率</span></div>' +
        '<div class="b17-ovi"><span class="b17-ovn">' + (topDim ? esc(topDim) + '（' + topN + ' 次）' : "无") + '</span>' +
          '<span class="b17-ovl">最常超时题型</span></div>' +
      '</div>';

    var rows = [], rec, dv, oc;
    for(i = 0; i < recs.length; i++){
      rec = recs[i] || {};
      dv = num(rec.used, 0) - num(rec.sug, 0);
      oc = dv > 0;
      rows.push('<tr class="' + (oc ? "b17-tr-over" : "") + '">' +
        '<td>' + esc(fmtDay(rec.ts)) + '</td>' +
        '<td>' + esc(rec.title || (String(rec.pid || "") + " 题" + String(rec.qno || ""))) + '</td>' +
        '<td>' + esc(rec.dim || dimOf(rec.qtype)) + '</td>' +
        '<td>' + fmtCn(rec.sug) + '</td>' +
        '<td>' + fmtCn(rec.used) + '</td>' +
        '<td class="' + (oc ? "b17-over" : (dv < 0 ? "b17-under" : "")) + '">' +
          (dv > 0 ? "🔺 +" : (dv < 0 ? "🔻 -" : "±")) + Math.abs(dv) + ' 秒</td>' +
        '<td>' + Math.round((typeof rec.rate === "number" ? rec.rate : 0) * 100) + '%</td>' +
      '</tr>');
    }

    var coach;
    if(!overN) coach = "节奏很稳：目前每一次都在建议时长内完成，接着把命中率往上提，别放松手速。";
    else if(overN >= Math.ceil(n * 0.6)) coach = (COACH[topDim] || COACH["其他题"]) + " 你有 " + overN + "/" + n + " 次超时，先练「写得完」，再练「写得好」。";
    else coach = (COACH[topDim] || COACH["其他题"]);
    if(avgRate < 50) coach += " 另外平均命中率仅 " + avgRate + "%，超时往往是找点慢：先练一遍勾画定要点。";

    return '' +
    '<div class="b17-card">' +
      '<div class="b17-h3"><span class="b17-num">1</span>节奏概览' +
        '<span class="b17-sub">🔺 红＝比建议慢　🔻 绿＝比建议快</span></div>' +
      ovHtml +
      '<div class="b17-coach">🎯 教练提示：' + esc(coach) + '</div>' +
    '</div>' +
    '<div class="b17-card">' +
      '<div class="b17-h3"><span class="b17-num">2</span>逐题时间账<span class="b17-sub">共 ' + n + ' 条（新→旧）</span></div>' +
      '<div class="b17-tbwrap"><table class="b17-tb">' +
        '<thead><tr><th>时间</th><th>题目</th><th>题型</th><th>建议</th><th>实际</th><th>偏差</th><th>命中率</th></tr></thead>' +
        '<tbody>' + rows.join("") + '</tbody>' +
      '</table></div>' +
      '<div class="b17-ops">' +
        '<button class="b17-btn" data-b17="tab" data-v="drill">▶ 再练一题</button>' +
        '<button class="b17-mini del" data-b17="clear">🗑 清空全部限时记录</button>' +
        flashHtml() +
      '</div>' +
    '</div>';
  }

  /* ================= 渲染主流程 ================= */
  function syncCount(){
    try{
      var ta = document.getElementById("b17-text"), cnt = document.getElementById("b17-cnt");
      if(!ta || !cnt) return;
      var f = findQ2(S.pid, S.qno), need = (f && f.q && f.q.words) ? ("　·　要求 " + String(f.q.words)) : "";
      cnt.textContent = "已写 " + String(ta.value || "").length + " 字" + need;
    }catch(e){}
  }

  function draw(){
    var box = null;
    try{ box = document.getElementById("content"); }catch(e){ box = null; }
    if(!box) return;
    ensureCss();
    normalize();
    if(!S.running) stopTimer();          /* 非计时态一律先清，杜绝叠加 */
    box.innerHTML = '<div class="b17-wrap">' + headHtml() +
                    (S.tab === "review" ? reviewHtml() : drillHtml()) + '</div>';
    bind(box);
    if(S.running) startTimer();          /* 计时态重绘后重新挂钟 */
    syncCount();
  }

  /* ================= 事件（委托到 #content，不用内联 onclick） ================= */
  function bind(root){
    if(!root || root.__b17bound) return;
    root.__b17bound = true;

    root.addEventListener("change", function(ev){
      var el = ev.target, a = el && el.getAttribute && el.getAttribute("data-b17");
      if(!a) return;
      if(a === "pid"){ S.pid = el.value; S.qno = null; S.custom = false; S.flash = ""; draw(); return; }
      if(a === "qno"){ S.qno = el.value; S.custom = false; S.flash = ""; draw(); return; }
    });

    root.addEventListener("input", function(ev){
      var el = ev.target;
      if(!el) return;
      if(el.id === "b17-text"){ S.text = String(el.value || ""); syncCount(); return; }
      var a = el.getAttribute && el.getAttribute("data-b17");
      if(a === "custom"){
        var v = num(el.value, 0);
        if(v >= 1 && v <= 180){ S.mins = v; S.custom = true; markChips(); }
      }
    });

    root.addEventListener("click", function(ev){
      var el = ev.target, a = null;
      while(el && el !== root){
        a = el.getAttribute && el.getAttribute("data-b17");
        if(a && el.tagName !== "SELECT" && el.tagName !== "INPUT") break;
        a = null; el = el.parentNode;
      }
      if(!a) return;
      ev.preventDefault();
      try{ act(a, el); }catch(err){ try{ console.error("[_b17]", err); }catch(e){} }
    });
  }

  /* 只刷新时长 chip 的高亮，避免输入框失焦 */
  function markChips(){
    try{
      var cs = document.querySelectorAll('#content [data-b17="mins"]'), i, v;
      for(i = 0; i < cs.length; i++){
        v = num(cs[i].getAttribute("data-v"), -1);
        cs[i].className = "b17-chip" + (/建议/.test(cs[i].textContent || "") ? " sug" : "") + (v === S.mins ? " on" : "");
      }
    }catch(e){}
  }

  /* ================= 动作 ================= */
  function act(a, el){
    var f, v;

    if(a === "tab"){
      v = (el && el.getAttribute("data-v")) || "drill";
      S.tab = (v === "review") ? "review" : "drill";
      S.flash = "";
      draw(); return;
    }

    if(a === "mins"){
      v = num(el && el.getAttribute("data-v"), 0);
      if(v >= 1){ S.mins = v; S.custom = true; }
      var inp = document.querySelector('#content [data-b17="custom"]');
      if(inp) inp.value = S.mins;
      markChips(); return;
    }

    if(a === "start"){
      f = findQ2(S.pid, S.qno);
      if(!f || !f.q){ S.flash = "没选到题目，换一套卷试试"; draw(); return; }
      if(!(S.mins >= 1)) S.mins = sugMin(f.q.qtype);
      S.limitSec = S.mins * 60;
      S.sugSec   = sugMin(f.q.qtype) * 60;
      S.startAt  = Date.now();
      S.text     = "";
      S.result   = null;
      S.running  = true;
      S.flash    = "";
      draw();
      try{ var ta = document.getElementById("b17-text"); if(ta) ta.focus(); }catch(e){}
      return;
    }

    if(a === "abort"){
      stopTimer();
      S.running = false; S.text = ""; S.startAt = 0;
      S.flash = "已放弃本次限时，未记录";
      draw(); return;
    }

    if(a === "submit"){
      f = findQ2(S.pid, S.qno);
      if(!f || !f.q){ stopTimer(); S.running = false; S.flash = "题目丢失，本次未记录"; draw(); return; }
      try{
        var ta0 = document.getElementById("b17-text");
        if(ta0) S.text = String(ta0.value || "");
      }catch(e){}
      if(!S.text.replace(/\s/g, "").length){
        S.flash = "还没写内容，写几句再交卷（不想练就点「放弃本次」）";
        var tipEl = document.getElementById("b17-tip");
        if(tipEl) tipEl.textContent = S.flash;
        return;
      }
      var used = elapsed();
      stopTimer();
      S.running = false;

      var res = doScore(S.text, f.q);
      var rate = (typeof res.rate === "number") ? res.rate : 0;
      var hit  = num(res.hitCount, (isArr(res.hits) ? res.hits.length : 0));
      var tot  = num(res.total, (isArr(f.q.points) ? f.q.points.length : 0));
      var dev  = used - S.sugSec;
      var tip  = "本次命中率 " + Math.round(rate * 100) + "%　用时 " + fmtCn(used) + "　" +
                 (dev > 0 ? ("比建议多 " + dev + " 秒，下次压缩找点时间")
                          : (dev < 0 ? ("比建议少 " + Math.abs(dev) + " 秒，节奏不错，注意别为了快漏点")
                                     : "与建议时长持平，节奏稳定"));

      S.result = {
        rate: rate, hit: hit, total: tot, used: used,
        limit: S.limitSec, sug: S.sugSec, res: res, tip: tip
      };

      var recs = loadRecs();
      recs.unshift({
        ts: Date.now(), pid: S.pid, qno: S.qno,
        title: paperName(f.p) + " 题" + String(f.q.no),
        qtype: f.q.qtype || "", dim: dimOf(f.q.qtype),
        limit: S.limitSec, sug: S.sugSec, used: used,
        rate: rate, hit: hit, total: tot, chars: S.text.length
      });
      S.flash = saveRecs(recs) ? "已记入限时档案（本机）" : "浏览器拒绝写入本地存储，本次未存档";
      S.startAt = 0;
      draw(); return;
    }

    if(a === "again"){
      S.result = null; S.text = ""; S.flash = "";
      draw(); return;
    }

    if(a === "goans"){
      f = findQ2(S.pid, S.qno);
      if(!f) return;
      stopTimer();
      try{
        if(typeof openAnswerModal === "function") openAnswerModal(S.pid, S.qno);
        else if(typeof window.openAnswerModal === "function") window.openAnswerModal(S.pid, S.qno);
        else { S.flash = "主站作答弹窗未加载"; draw(); }
      }catch(e){ S.flash = "打开作答弹窗失败"; draw(); }
      return;
    }

    if(a === "gocmp"){
      stopTimer();
      try{
        if(typeof window.b8OpenCompare === "function") window.b8OpenCompare(S.pid, S.qno);
        else if(typeof window.renderCompare === "function") window.renderCompare();
        else { S.flash = "答案对照模块未加载"; draw(); }
      }catch(e){ S.flash = "打开答案对照失败"; draw(); }
      return;
    }

    if(a === "clear"){
      var ok = true;
      try{ ok = window.confirm("确定清空全部限时记录？该操作不可恢复。"); }catch(e){ ok = true; }
      if(!ok) return;
      S.flash = saveRecs([]) ? "已清空全部限时记录" : "清空失败，浏览器拒绝写入本地存储";
      draw(); return;
    }
  }

  /* ================= 路由入口 ================= */
  window.renderTimedDrill = function(){
    stopTimer();                 /* 重进先清计时器，避免多个 setInterval 叠加 */
    S.running = false;
    S.startAt = 0;
    try{
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = '<div class="b17-empty">单题限时模考运行出错：' +
          esc(String((err && err.message) || err)) + '</div>';
      }catch(e){}
      try{ console.error("[_b17]", err); }catch(e){}
    }
  };
  window.b17StopTimer = stopTimer;   /* 供主站/其它模块离开本页时手动清理 */

})();

</script>
<script>/* === _b18.js === */
(function(){
  "use strict";
  /* ==================================================================
     _b18 错词 → 规范词 实时标红（ErrMark）
     A. 内置 40+ 组申论口语词 → 规范词，支持用户自定义补充
     B. 独立页：粘贴文本 → 实时高亮 + 逐条替换 + 一键全部替换
     C. 作答弹窗钩子：b18MountTextarea / b18OnInput（挂载由集成进程负责）
     纯前端离线、零依赖；只写 localStorage:
       shenlun_errlog_v1   自检记录
       shenlun_errwords_v1 我的常用替换
     暴露 window.renderErrMark，全部类名 b18- 前缀。
     ================================================================== */

  var LOG_KEY  = 'shenlun_errlog_v1';
  var WORD_KEY = 'shenlun_errwords_v1';
  var MAXLOG   = 60;

  /* 自带 HTML 转义（优先复用主站 esc） */
  var esc = window.esc || function(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };

  /* ---------- 内置错词表：口语 / 随意表达 → 申论规范词 ---------- */
  var BAD_TO_GOOD = [
    ['搞',       '推进/开展/落实'],
    ['弄',       '推进/完善/规范'],

  /* ---------- 模块内状态（不碰主站 state） ---------- */
  var S = {
    text: '',
    flash: '',
    nb: '',   /* 新增错词输入缓存 */
    ng: ''    /* 新增规范词输入缓存 */
  };

  /* 作答弹窗挂载点引用 */
  var BAR = null;
  var BAR_TA = null;

  /* ---------- 小工具 ---------- */
  function isArr(x){ return Object.prototype.toString.call(x) === '[object Array]'; }
  function pad2(n){ n = Math.floor(Math.abs(n)); return (n < 10 ? '0' : '') + n; }
  function fmtDay(ts){
    try{
      var d = new Date(ts || 0);
      if(!ts || isNaN(d.getTime())) return '—';
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }catch(e){ return '—'; }
  }
  function $(id){ try{ return document.getElementById(id); }catch(e){ return null; } }

  /* ---------- 样式自挂载（主站未 link _b18.css 时兜底，不改任何文件） ---------- */
  function ensureCss(){
    try{
      var ls = document.getElementsByTagName('link'), i;
      for(i = 0; i < ls.length; i++){
        if(String(ls[i].getAttribute('href') || '').indexOf('_b18.css') >= 0) return;
      }
      var el = document.createElement('link');
      el.rel = 'stylesheet'; el.href = '_b18.css';
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  /* ---------- localStorage 安全读写 ---------- */
  function lsGet(key, dft){
    try{
      if(typeof localStorage === 'undefined' || !localStorage) return dft;
      var raw = localStorage.getItem(key);
      if(!raw) return dft;
      var v = JSON.parse(raw);
      return (v == null) ? dft : v;
    }catch(e){ return dft; }
  }
  function lsSet(key, val){
    try{
      if(typeof localStorage === 'undefined' || !localStorage) return false;
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    }catch(e){ return false; }
  }

  /* ---------- 我的常用替换 ---------- */
  function myPairs(){
    var raw = lsGet(WORD_KEY, []);
    if(!isArr(raw)) return [];
    var out = [], i, it, b, g;
    for(i = 0; i < raw.length; i++){
      it = raw[i];
      if(isArr(it)){ b = it[0]; g = it[1]; }
      else if(it && typeof it === 'object'){ b = it.bad; g = it.good; }
      else continue;
      b = String(b == null ? '' : b).trim();
      g = String(g == null ? '' : g).trim();
      if(b && g) out.push([b, g]);
    }
    return out;
  }
  function saveMy(list){ return lsSet(WORD_KEY, list); }

  /* 全表 = 自定义（优先）+ 内置，按 bad 去重 */
  function allPairs(){
    var seen = {}, out = [], i, p, k;
    var mine = myPairs();
    for(i = 0; i < mine.length; i++){
      k = mine[i][0];
      if(seen[k]) continue;
      seen[k] = 1; out.push([k, mine[i][1], 1]);
    }
    for(i = 0; i < BAD_TO_GOOD.length; i++){
      p = BAD_TO_GOOD[i]; k = p[0];
      if(seen[k]) continue;
      seen[k] = 1; out.push([k, p[1], 0]);
    }
    return out;
  }

  /* ---------- 规范词库「正字」对照（来自主站 DATA） ---------- */
  function libTitles(){
    try{
      var d = (typeof DATA !== 'undefined' && DATA) ? DATA : (window.DATA || null);
      if(!d || !isArr(d.entries)) return [];
      var out = [], i, e;
      for(i = 0; i < d.entries.length; i++){
        e = d.entries[i];
        if(!e || e.lib !== '规范词库') continue;
        var t = String(e.title == null ? '' : e.title).trim();
        if(t) out.push(t);
      }
      return out;
    }catch(e){ return []; }
  }
  function inLib(word){
    try{
      var ts = libTitles(), i, w = String(word || '').trim();
      if(!w) return false;
      for(i = 0; i < ts.length; i++){
        if(ts[i] === w || ts[i].indexOf(w) >= 0 || w.indexOf(ts[i]) >= 0) return true;
      }
      return false;
    }catch(e){ return false; }
  }

  /* ---------- 核心：扫描 ---------- */
  function opts(good){
    var arr = String(good == null ? '' : good).split('/'), out = [], i, s;
    for(i = 0; i < arr.length; i++){
      s = arr[i].replace(/^\s+|\s+$/g, '');
      if(s) out.push(s);
    }
    return out.length ? out : ['—'];
  }

  function scan(text){
    var out = [];
    try{
      text = String(text == null ? '' : text);
      if(!text) return out;
      var pairs = allPairs().slice().sort(function(a, b){ return b[0].length - a[0].length; });
      var used = [], i, j, k, from, idx, bad, free;
      for(i = 0; i < text.length; i++) used.push(0);
      for(i = 0; i < pairs.length; i++){
        bad = pairs[i][0];
        if(!bad) continue;
        from = 0;
        while(from <= text.length - bad.length){
          idx = text.indexOf(bad, from);
          if(idx < 0) break;
          free = true;
          for(j = idx; j < idx + bad.length; j++){ if(used[j]){ free = false; break; } }
          if(free){
            for(k = idx; k < idx + bad.length; k++) used[k] = 1;
            out.push({
              idx: idx, len: bad.length, bad: bad,
              good: pairs[i][1], mine: pairs[i][2] ? 1 : 0,
              opts: opts(pairs[i][1])
            });
          }
          from = idx + 1;
        }
      }
      out.sort(function(a, b){ return a.idx - b.idx; });
    }catch(e){ return out; }
    return out;
  }

  /* 用第 n 个建议替换第 i 处 */
  function applyOne(text, finds, i, word){
    try{
      var f = finds[i];
      if(!f) return text;
      var w = String(word || f.opts[0] || '');
      if(!w || w === '—') return text;
      return text.slice(0, f.idx) + w + text.slice(f.idx + f.len);
    }catch(e){ return text; }
  }
  /* 全部替换（从后往前，避免位移） */
  function applyAll(text, finds){
    try{
      var i, f, w, t = String(text == null ? '' : text);
      for(i = finds.length - 1; i >= 0; i--){
        f = finds[i];
        w = f.opts[0];
        if(!w || w === '—') continue;
        t = t.slice(0, f.idx) + w + t.slice(f.idx + f.len);
      }
      return t;
    }catch(e){ return text; }
  }

  /* ---------- 高亮预览 HTML ---------- */
  function markHtml(text, finds){
    try{
      text = String(text == null ? '' : text);
      if(!text) return '<span class="b18-dim">（此处实时显示标红预览）</span>';
      var html = '', cur = 0, i, f;
      for(i = 0; i < finds.length; i++){
        f = finds[i];
        if(f.idx < cur) continue;
        html += esc(text.slice(cur, f.idx));
        html += '<span class="b18-bad" title="建议：' + esc(f.good) + '">' + esc(f.bad) + '</span>';
        html += '<span class="b18-good">→' + esc(f.opts[0]) + '</span>';
        cur = f.idx + f.len;
      }
      html += esc(text.slice(cur));
      return html.replace(/\n/g, '<br>');
    }catch(e){ return '<span class="b18-dim">预览生成失败</span>'; }
  }

  /* ---------- 自检记录 ---------- */
  function logs(){ var v = lsGet(LOG_KEY, []); return isArr(v) ? v : []; }
  function pushLog(text, finds){
    try{
      var arr = logs(), i, brief = [];
      for(i = 0; i < finds.length && i < 20; i++){
        brief.push({ i: finds[i].idx, bad: finds[i].bad, good: finds[i].opts[0] });
      }
      arr.unshift({
        ts: (new Date()).getTime(),
        len: String(text || '').length,
        text: String(text || '').slice(0, 300),
        n: finds.length,
        finds: brief
      });
      while(arr.length > MAXLOG) arr.pop();
      return lsSet(LOG_KEY, arr);
    }catch(e){ return false; }
  }

  /* ================= 独立页渲染 ================= */
  function host(){

    if(box) return box;

      box = $('b18-root');

      box = document.createElement('div');
      box.id = 'b18-root';
      (document.body || document.documentElement).appendChild(box);
      return box;
    }catch(e){ return null; }

  function listHtml(finds){
    if(!finds.length){
      return '<div class="b18-empty">暂未发现口语化表达。若刚粘贴文本，请在左侧输入后自动检测。</div>';
    }
    var h = '', i, j, f, o;
    for(i = 0; i < finds.length; i++){
      f = finds[i];
      h += '<div class="b18-item">' +
             '<div class="b18-item-h">' +
               '<span class="b18-pos">第 ' + (f.idx + 1) + ' 字</span>' +
               '<span class="b18-bad">' + esc(f.bad) + '</span>' +
               (f.mine ? '<span class="b18-tag b18-tag-blue">我的</span>' : '') +
               (inLib(f.opts[0]) ? '<span class="b18-tag b18-tag-green">规范词库</span>' : '') +
               '<button class="b18-btn b18-btn-sm b18-btn-red" data-act="fix" data-i="' + i + '">替换</button>' +
             '</div>' +
             '<div class="b18-opts">';
      o = f.opts;
      for(j = 0; j < o.length; j++){
        h += '<button class="b18-chip" data-act="pick" data-i="' + i + '" data-w="' + esc(o[j]) + '">' +
               esc(o[j]) + '</button>';
      }
      h += '</div></div>';
    }
    return h;
  }

  function mineHtml(){
    var m = myPairs();
    if(!m.length) return '<div class="b18-empty">还没有自定义替换。加一条你老写错的口头禅吧。</div>';
    var h = '', i;
    for(i = 0; i < m.length; i++){
      h += '<div class="b18-mine-row">' +
             '<span class="b18-bad">' + esc(m[i][0]) + '</span>' +
             '<span class="b18-arrow">→</span>' +

             '<button class="b18-btn b18-btn-sm" data-act="delmine" data-i="' + i + '">删除</button>' +
           '</div>';
    }
    return h;
  }

  function logHtml(){
    var L = logs();
    if(!L.length) return '<div class="b18-empty">暂无自检记录。点「保存本次记录」可留档。</div>';
    var h = '', i, r;
    for(i = 0; i < L.length && i < 12; i++){
      r = L[i] || {};
      h += '<div class="b18-log-row">' +
             '<span class="b18-log-t">' + esc(fmtDay(r.ts)) + '</span>' +
             '<span class="b18-log-n">' + esc(String(r.n || 0)) + ' 处</span>' +
             '<span class="b18-log-x">' + esc(String(r.len || 0)) + ' 字</span>' +
             '<span class="b18-log-p">' + esc(String(r.text || '').slice(0, 40)) + '</span>' +
           '</div>';
    }
    return h;
  }

  /* 输入时只刷新预览/建议/计数，不整页重绘（避免光标跳走） */
  function refreshLive(){
    try{
      var finds = scan(S.text);
      var box = host();
      if(!box) return;
      var prev = box.getElementsByClassName('b18-prev')[0];
      if(prev) prev.innerHTML = markHtml(S.text, finds);
      var list = box.getElementsByClassName('b18-list')[0];
      if(list) list.innerHTML = listHtml(finds);
      var stat = box.getElementsByClassName('b18-stat')[0];
      if(stat){
        stat.innerHTML = '共 <b>' + String(S.text.length) + '</b> 字 · 口语词 <b class="b18-hot">' +
          String(finds.length) + '</b> 处';
      }
    }catch(e){}
  }

  /* ---------- 独立页事件 ---------- */
  function onClick(ev){
    try{
      var t = (ev && (ev.target || ev.srcElement)) || null;
      var act = '';
      while(t && t !== document){
        act = t.getAttribute ? (t.getAttribute('data-act') || '') : '';
        if(act) break;
        t = t.parentNode;
      }
      if(!act) return;

      var i = parseInt((t.getAttribute('data-i') || '-1'), 10);
      var finds = scan(S.text);

      if(act === 'fix' || act === 'pick'){
        if(i < 0 || !finds[i]) return;
        var w = (act === 'pick') ? (t.getAttribute('data-w') || '') : finds[i].opts[0];
        S.text = applyOne(S.text, finds, i, w);
        var ta = $('b18-input');
        if(ta) ta.value = S.text;
        refreshLive();
        return;
      }

      if(act === 'fixall'){
        if(!finds.length){ S.flash = '没有可替换的口语词。'; draw(); return; }
        var ok = true;
        try{ ok = window.confirm('将把 ' + finds.length + ' 处口语词替换为第一个规范词，并覆盖当前文本。确定继续？'); }catch(e){ ok = true; }
        if(!ok) return;
        pushLog(S.text, finds);
        S.text = applyAll(S.text, finds);
        S.flash = '已替换 ' + finds.length + ' 处，并留档一条自检记录。';
        draw(); return;
      }

      if(act === 'save'){
        S.flash = pushLog(S.text, finds) ? ('已保存记录：' + finds.length + ' 处口语词。') : '保存失败，浏览器拒绝写入本地存储。';
        draw(); return;
      }

      if(act === 'pull'){
        var src = $('ansText');
        if(!src){ S.flash = '当前页面没有作答框（#ansText），请直接粘贴文本。'; draw(); return; }
        S.text = String(src.value || '');
        S.flash = '已读入作答框文本。';
        draw(); return;
      }

      if(act === 'clear'){
        S.text = ''; S.flash = '已清空文本。'; draw(); return;
      }

      if(act === 'addmine'){
        var b = String(S.nb || '').replace(/^\s+|\s+$/g, '');
        var g = String(S.ng || '').replace(/^\s+|\s+$/g, '');
        if(!b || !g){ S.flash = '错词与规范词都要填写。'; draw(); return; }
        var m = myPairs(), k;
        for(k = 0; k < m.length; k++){ if(m[k][0] === b){ m.splice(k, 1); break; } }
        m.unshift([b, g]);
        S.flash = saveMy(m) ? ('已添加：' + b + ' → ' + g) : '添加失败，浏览器拒绝写入本地存储。';
        S.nb = ''; S.ng = '';
        draw(); return;
      }

      if(act === 'delmine'){
        var mm = myPairs();
        if(i < 0 || !mm[i]) return;
        var dn = mm[i][0];
        mm.splice(i, 1);
        S.flash = saveMy(mm) ? ('已删除自定义替换：' + dn) : '删除失败。';
        draw(); return;
      }

      if(act === 'clearlog'){
        var ok2 = true;
        try{ ok2 = window.confirm('确定清空全部自检记录？'); }catch(e){ ok2 = true; }
        if(!ok2) return;
        S.flash = lsSet(LOG_KEY, []) ? '已清空自检记录。' : '清空失败。';
        draw(); return;
      }
    }catch(err){
      try{ console.error('[_b18]', err); }catch(e){}
    }
  }

  /* ================= 作答弹窗钩子（挂载由集成进程调用） ================= */
  function fireInput(el){
    try{
      var ev;
      if(typeof Event === 'function'){ ev = new Event('input', { bubbles: true }); }
      else { ev = document.createEvent('HTMLEvents'); ev.initEvent('input', true, false); }
      el.dispatchEvent(ev);
    }catch(e){}
  }

  function barHtml(finds){
    if(!finds.length){
      return '<span class="b18-bar-ok">✓ 未发现口语化表达</span>';
    }
    var h = '<span class="b18-bar-t">口语词 <b class="b18-hot">' + finds.length + '</b> 处</span>';
    var i, n = finds.length > 8 ? 8 : finds.length;
    for(i = 0; i < n; i++){
      h += '<button class="b18-chip b18-chip-bad" data-b18fix="' + i + '">' +
             esc(finds[i].bad) + '<span class="b18-arrow">→</span>' +
             '<span class="b18-good">' + esc(finds[i].opts[0]) + '</span></button>';
    }
    if(finds.length > n) h += '<span class="b18-dim">…另有 ' + (finds.length - n) + ' 处</span>';
    h += '<button class="b18-btn b18-btn-sm b18-btn-red" data-b18fix="all">全部替换</button>';
    return h;
  }

  function paintBar(finds){
    try{
      if(!BAR) return;
      BAR.innerHTML = barHtml(finds);
    }catch(e){}
  }

  function barFix(which){
    try{
      var ta = BAR_TA || $('ansText');
      if(!ta) return;
      var text = String(ta.value || '');
      var finds = scan(text);
      if(!finds.length) return;

      if(which === 'all'){
        var ok = true;
        try{ ok = window.confirm('将把 ' + finds.length + ' 处口语词替换为规范词，并覆盖作答内容。确定继续？'); }catch(e){ ok = true; }
        if(!ok) return;
        pushLog(text, finds);
        ta.value = applyAll(text, finds);
      }else{
        /* 优先处理当前选区命中的错词，否则处理点击的那一处 */
        var i = parseInt(which, 10);
        var sel = -1, k;
        try{
          if(typeof ta.selectionStart === 'number' && ta.selectionStart !== ta.selectionEnd){
            for(k = 0; k < finds.length; k++){
              if(finds[k].idx >= ta.selectionStart && (finds[k].idx + finds[k].len) <= ta.selectionEnd){ sel = k; break; }
            }
          }
        }catch(e){}
        if(sel >= 0) i = sel;
        if(i < 0 || !finds[i]) return;
        ta.value = applyOne(text, finds, i, finds[i].opts[0]);
      }
      fireInput(ta);
      paintBar(scan(String(ta.value || '')));
    }catch(e){}
  }

  /* 在 #ansText 下方挂一条实时提示条；集成进程负责在弹窗打开时调用 */
  window.b18MountTextarea = function(pid, qno){
    try{
      ensureCss();
      var ta = $('ansText');
      if(!ta) { BAR = null; BAR_TA = null; return false; }
      BAR_TA = ta;
      var old = $('b18-bar');
      if(old && old.parentNode) old.parentNode.removeChild(old);
      var bar = document.createElement('div');
      bar.id = 'b18-bar';
      bar.className = 'b18-bar';
      bar.setAttribute('data-pid', String(pid == null ? '' : pid));
      bar.setAttribute('data-qno', String(qno == null ? '' : qno));
      if(ta.parentNode){
        if(ta.nextSibling) ta.parentNode.insertBefore(bar, ta.nextSibling);
        else ta.parentNode.appendChild(bar);
      }else{ return false; }
      BAR = bar;
      bar.onclick = function(ev){
        try{
          var t = (ev && (ev.target || ev.srcElement)) || null, v = '';
          while(t && t !== document){
            v = t.getAttribute ? (t.getAttribute('data-b18fix') || '') : '';
            if(v) break;
            t = t.parentNode;
          }
          if(v) barFix(v);
        }catch(e){}
      };
      paintBar(scan(String(ta.value || '')));
      return true;
    }catch(e){ return false; }
  };

  /* 输入回调：集成进程在 #ansText 的 input 里调用，传入当前文本 */
  window.b18OnInput = function(text){
    var finds = [];
    try{
      if(text == null){
        var ta = BAR_TA || $('ansText');
        text = ta ? String(ta.value || '') : '';
      }
      finds = scan(String(text || ''));
      paintBar(finds);
    }catch(e){}
    return finds;
  };

  /* 供其它模块复用的纯函数 */
  window.b18Scan = function(text){ return scan(text); };
  window.b18Unmount = function(){
    try{
      var old = $('b18-bar');
      if(old && old.parentNode) old.parentNode.removeChild(old);
    }catch(e){}
    BAR = null; BAR_TA = null;
  };

  /* ================= 路由入口 ================= */
  window.renderErrMark = function(){
    try{
      if(!S.text){
        var src = $('ansText');
        if(src && src.value) S.text = String(src.value || '');
      }
      draw();
    }catch(err){
      try{
        var box = $('content');
        if(box) box.innerHTML = '<div class="b18-empty">错词标红模块运行出错：' +
          esc(String((err && err.message) || err)) + '</div>';
      }catch(e){}
      try{ console.error('[_b18]', err); }catch(e){}
    }
  };

})();

<script>/* === _b19.js === */
/* =====================================================================
   第十九批：申论成长史 → Obsidian 双推（_b19.js）
   把 localStorage 里的历次作答（含过程笔记 / 难点标签 / 命中率）
   汇成一份 Obsidian 友好的 Markdown：概览 + ASCII 趋势图 + 时间线。
   浏览器沙箱无法直接写用户磁盘，所以落地路径是：
     生成 Markdown → 一键复制 → 到 Vault 指定目录新建同名文件粘贴
   （另备「下载为 .md」与 Advanced URI 跳转，均为可选辅助）
   只读 localStorage("shenlun_answers_v2")；配置写 localStorage("shenlun_obsd_cfg_v1")。
   纯前端离线、零外部依赖；类名统一 b19- 前缀。
   入口：window.renderGrowthPush() / window.b19MdText() / window.b19CopyToClipboard()
   ===================================================================== */
(function(){
  "use strict";

  var ANS_KEY = "shenlun_answers_v2";
  var CFG_KEY = "shenlun_obsd_cfg_v1";
  var WIN     = 5;    /* 趋势对比窗口：近 5 次 vs 此前 5 次 */
  var TOPN    = 3;    /* 常卡难点 Top N */
  var SUMLEN  = 200;  /* 答案摘要字数 */
  var CHARTN  = 40;   /* ASCII 图最多画多少个点 */

  var esc = window.esc || function(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  };

  var DEF = {
    subdir: "国考申论/成长史",
    tpl:    "成长史-{YYYY}-{MM}-{DD}",
    scope:  "all",            /* all | d7 | d30 | dn */
    days:   14,               /* scope = dn 时生效 */
    vault:  "ObsidianVault",
    adv:    false
  };

  /* 模块内状态（不碰主站 state） */
  var S     = { cfg:null, md:"", flash:"", bad:false, span:"" };
  var ITEMS = [];   /* 全部作答记录，时间升序 */

  /* ---------------- 基础工具 ---------------- */
  function isArr(x){ return Object.prototype.toString.call(x) === "[object Array]"; }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function num(x, d){ var n = parseInt(x, 10); return isNaN(n) ? d : n; }

  function ensureCss(){
    try{
      var ls = document.getElementsByTagName("link"), i;
      for(i=0;i<ls.length;i++){
        if(String(ls[i].getAttribute("href") || "").indexOf("_b19.css") >= 0) return;
      }
      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b19.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  function dateOf(ts){
    if(typeof ts !== "number" || !isFinite(ts) || ts <= 0) return null;
    try{ var d = new Date(ts); return isNaN(d.getTime()) ? null : d; }catch(e){ return null; }
  }
  function fmtD(d){
    if(!d) return "时间未记录";
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function fmtDT(d){
    if(!d) return "时间未记录";
    return fmtD(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function avg(a){
    if(!a || !a.length) return null;
    var s = 0, i;
    for(i=0;i<a.length;i++) s += a[i];
    return Math.round(s / a.length);
  }
  function oneLine(s){
    return String(s==null?"":s).replace(/\r/g,"").replace(/\n+/g,"　").replace(/\s+/g," ").trim();
  }
  /* Obsidian 标签不允许空格，做一次安全化 */
  function tagSafe(s){
    var t = String(s==null?"":s).trim();
    t = t.replace(/^#+/,"").replace(/[\s#\[\]\|\\\/]+/g,"-");
    return t;
  }
  /* 双链内容不允许 [] | 等，做一次安全化 */
  function linkSafe(s){
    var t = String(s==null?"":s).trim();
    return t.replace(/[\[\]\|#\^]/g,"").replace(/\s+/g," ");
  }

  /* ---------------- 配置读写 ---------------- */
  function loadCfg(){
    var c = { subdir:DEF.subdir, tpl:DEF.tpl, scope:DEF.scope, days:DEF.days, vault:DEF.vault, adv:DEF.adv };
    try{
      if(typeof localStorage === "undefined" || !localStorage) return c;
      var raw = localStorage.getItem(CFG_KEY);
      if(!raw) return c;
      var o = JSON.parse(raw);
      if(!o || typeof o !== "object") return c;
      if(typeof o.subdir === "string" && o.subdir.trim()) c.subdir = o.subdir.trim();
      if(typeof o.tpl === "string" && o.tpl.trim())       c.tpl    = o.tpl.trim();
      if(o.scope === "all" || o.scope === "d7" || o.scope === "d30" || o.scope === "dn") c.scope = o.scope;
      c.days  = Math.max(1, num(o.days, DEF.days));
      if(typeof o.vault === "string" && o.vault.trim())   c.vault  = o.vault.trim();
      c.adv = !!o.adv;
    }catch(e){}
    return c;
  }
  function saveCfg(){
    try{
      if(typeof localStorage === "undefined" || !localStorage) return false;
      localStorage.setItem(CFG_KEY, JSON.stringify(S.cfg));
      return true;
    }catch(e){ return false; }
  }

  /* ---------------- 数据安全访问 ---------------- */
  function papers(){
    try{
      var D = (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null);
      return (D && isArr(D.papers)) ? D.papers : [];
    }catch(e){ return []; }
  }
  function localFind(pid, qno){
    var ps = papers(), i, j, qs;
    for(i=0;i<ps.length;i++){
      if(!ps[i] || String(ps[i].id) !== String(pid)) continue;
      qs = isArr(ps[i].questions) ? ps[i].questions : [];
      for(j=0;j<qs.length;j++){
        if(qs[j] && String(qs[j].no) === String(qno)) return { p:ps[i], q:qs[j] };
      }
      return { p:ps[i], q:null };
    }
    return null;
  }
  function getPair(pid, qno){
    try{
      if(typeof findQ === "function"){
        var f = findQ(pid, qno);
        if(!f && String(Number(qno)) === String(qno)) f = findQ(pid, Number(qno));
        if(f && f.p) return f;
      }
    }catch(e){}
    try{
      if(typeof window.findQ === "function"){
        var g = window.findQ(pid, qno);
        if(g && g.p) return g;
      }
    }catch(e){}
    try{ return localFind(pid, qno); }catch(e){ return null; }
  }
  function paperName(p, pid){
    if(!p) return String(pid || "未登记套卷");
    var pv = String(p.province || "");
    var s  = String(p.year || "") + (pv && pv !== "国考" ? pv : (pv ? "国考" : "")) + String(p.paper || "");
    s = s.trim();
    return s || String(pid || "未登记套卷");
  }
  function scoreOf(rec){
    var s = null;
    try{ s = rec.score; }catch(e){ return null; }
    if(typeof s !== "number" || isNaN(s)){
      if(rec && typeof rec.rate === "number" && !isNaN(rec.rate)) s = rec.rate * 100;
      else return null;
    }
    s = Math.round(s);
    if(s < 0) s = 0;
    if(s > 100) s = 100;
    return s;
  }

  /* ---------------- 汇集记录 ---------------- */
  function buildItems(){
    ITEMS = [];
    var map = null;
    try{
      if(typeof localStorage === "undefined" || !localStorage) return;
      var raw = localStorage.getItem(ANS_KEY);
      if(!raw) return;
      map = JSON.parse(raw);
      if(!map || typeof map !== "object") return;
    }catch(e){ return; }

    var keys;
    try{ keys = Object.keys(map); }catch(e){ return; }

    for(var i=0;i<keys.length;i++){
      var k = String(keys[i]), rec = null;
      try{ rec = map[keys[i]]; }catch(e){ rec = null; }
      if(!rec || typeof rec !== "object") continue;

      var cut = k.lastIndexOf("#");
      var pid = cut > 0 ? k.slice(0, cut) : k;
      var qno = cut > 0 ? k.slice(cut + 1) : "";

      var pair = getPair(pid, qno);
      var p = (pair && pair.p) ? pair.p : null;
      var q = (pair && pair.q) ? pair.q : null;

      var pr = (rec.process && typeof rec.process === "object") ? rec.process : null;
      var tags = [];
      if(pr && isArr(pr.tags)){
        for(var t=0;t<pr.tags.length;t++){
          var tv = tagSafe(pr.tags[t]);
          if(tv) tags.push(tv);
        }
      }
      var d = dateOf(rec.ts);
      ITEMS.push({
        idx:   i,
        pid:   pid,
        qno:   qno,
        d:     d,
        ts:    (d ? d.getTime() : null),
        paper: paperName(p, pid),
        qtype: String(rec.qtype || (q && q.qtype) || "").trim(),
        score: scoreOf(rec),
        hit:   (typeof rec.hitCount === "number" && !isNaN(rec.hitCount)) ? rec.hitCount : null,
        total: (typeof rec.total === "number" && !isNaN(rec.total)) ? rec.total : null,
        tags:  tags,
        note:  (pr && typeof pr.note === "string") ? pr.note.trim() : "",
        text:  (typeof rec.text === "string") ? rec.text : ""
      });
    }

    ITEMS.sort(function(a, b){
      if(a.ts == null && b.ts == null) return a.idx - b.idx;
      if(a.ts == null) return -1;
      if(b.ts == null) return 1;
      if(a.ts !== b.ts) return a.ts - b.ts;
      return a.idx - b.idx;
    });
  }

  /* 范围过滤：scopeDays 为 null / 非数字＝全部；数字＝近 N 天（无时间戳的老记录一并保留在全部里） */
  function pickScope(scopeDays){
    var n = (scopeDays == null) ? null : num(scopeDays, null);
    if(n == null || isNaN(n) || n <= 0) return ITEMS.slice(0);
    var cut = Date.now() - n * 86400000, out = [], i;
    for(i=0;i<ITEMS.length;i++){
      if(ITEMS[i].ts != null && ITEMS[i].ts >= cut) out.push(ITEMS[i]);
    }
    return out;
  }
  function scopeDaysOfCfg(){
    var c = S.cfg || DEF;
    if(c.scope === "d7")  return 7;
    if(c.scope === "d30") return 30;
    if(c.scope === "dn")  return Math.max(1, num(c.days, DEF.days));
    return null;
  }
  function scopeLabel(){
    var c = S.cfg || DEF;
    if(c.scope === "d7")  return "近 7 天";
    if(c.scope === "d30") return "近 30 天";
    if(c.scope === "dn")  return "近 " + Math.max(1, num(c.days, DEF.days)) + " 天";
    return "全部记录";
  }

  /* ---------------- ASCII 折线图 ---------------- */
  var BLOCKS = ["▁","▂","▃","▄","▅","▆","▇","█"];

  function rep(s, n){
    var o = "", i;
    for(i=0;i<n;i++) o += s;
    return o;
  }

  function chartText(list){
    var pts = [], labs = [], i, j;
    for(i=0;i<list.length;i++){
      if(list[i].score != null){ pts.push(list[i].score); labs.push(list[i].d); }
    }
    if(!pts.length) return "（本范围内还没有算出命中率的记录：先在作答里对一次采分点，这里就会长出折线）";
    if(pts.length > CHARTN){
      pts  = pts.slice(pts.length - CHARTN);
      labs = labs.slice(labs.length - CHARTN);
    }

    var rows = [100, 80, 60, 40, 20, 0];
    var out = [], line, ri, k, at;

    for(ri=0; ri<rows.length; ri++){
      line = ("  " + rows[ri]).slice(-3) + "% |";
      for(k=0; k<pts.length; k++){
        at = Math.round((100 - pts[k]) / 20);
        line += (at === ri ? "# " : "  ");
      }
      out.push(line);
    }
    out.push("     +" + rep("-", pts.length * 2));

    var spark = "";
    for(k=0; k<pts.length; k++){
      var bi = Math.floor(pts[k] / 12.5);
      if(bi > 7) bi = 7;
      if(bi < 0) bi = 0;
      spark += BLOCKS[bi];
    }
    out.push("");
    out.push("折线速览：" + spark);
    var lb0 = labs[0] ? fmtD(labs[0]) : "更早";
    var lb1 = labs[labs.length - 1] ? fmtD(labs[labs.length - 1]) : "更早";
    out.push("样本 " + pts.length + " 次（由早到近）　" + lb0 + " → " + lb1 +
             "　最低 " + Math.min.apply(null, pts) + "%　最高 " + Math.max.apply(null, pts) + "%");
    return out.join("\n");
  }

  /* ---------------- Top 难点 ---------------- */
  function topTags(list, n){
    var cnt = {}, i, j, out = [];
    for(i=0;i<list.length;i++){
      for(j=0;j<list[i].tags.length;j++){
        cnt[list[i].tags[j]] = (cnt[list[i].tags[j]] || 0) + 1;
      }
    }
    try{
      out = Object.keys(cnt).map(function(k){ return { t:k, c:cnt[k] }; });
    }catch(e){ out = []; }
    out.sort(function(a, b){ return (b.c - a.c) || (a.t < b.t ? -1 : 1); });
    return out.slice(0, n);
  }

  /* ---------------- 生成 Markdown ---------------- */
  function mdText(scopeDays){
    try{
      if(!ITEMS.length) buildItems();
      var list = pickScope(scopeDays);
      var now  = new Date();
      var lab  = (scopeDays == null || isNaN(num(scopeDays, NaN)) || num(scopeDays, 0) <= 0)
                   ? "全部记录" : ("近 " + num(scopeDays, 0) + " 天");

      if(!list.length){
        return "# 申论成长史\n\n> 生成于 " + fmtDT(now) + " · 范围：" + lab +
               "\n\n本范围内没有作答记录。换成「全部记录」再生成一次，或者先去真题库做两题。\n";
      }

      var first = null, last = null, i, j;
      for(i=0;i<list.length;i++){ if(list[i].d){ first = list[i].d; break; } }
      for(i=list.length-1;i>=0;i--){ if(list[i].d){ last = list[i].d; break; } }
      S.span = fmtD(first) + " → " + fmtD(last);

      var sc = [];
      for(i=0;i<list.length;i++) if(list[i].score != null) sc.push(list[i].score);
      var mean = avg(sc);

      /* 趋势对比 */
      var trend;
      if(sc.length < 2){
        trend = "样本还不够（只有 " + sc.length + " 次带命中率的记录），再做几题就能算趋势";
      }else{
        var rec = sc.slice(Math.max(0, sc.length - WIN));
        var pre = sc.slice(Math.max(0, sc.length - rec.length - WIN), sc.length - rec.length);
        var ra  = avg(rec);
        if(!pre.length){
          trend = "近 " + rec.length + " 次平均 " + ra + "%（暂无更早的对照样本）";
        }else{
          var ba = avg(pre), dv = ra - ba;
          var mk = dv > 0 ? ("🔺 +" + dv) : (dv < 0 ? ("🔻 " + dv) : "➖ 0");
          trend = "近 " + rec.length + " 次平均 " + ra + "% · 此前 " + pre.length + " 次平均 " + ba + "% · " +
                  mk + " 个百分点";
        }
      }

      /* 常卡难点 */
      var tops = topTags(list, TOPN), topStr = "";
      if(tops.length){
        var ts = [];
        for(i=0;i<tops.length;i++) ts.push("#" + tops[i].t + " (" + tops[i].c + "次)");
        topStr = ts.join(" · ");
      }else{
        topStr = "还没勾过难点标签（作答提交时勾一勾「卡在哪」，这里会长出薄弱画像）";
      }

      var L = [];
      L.push("---");
      L.push("tags: [申论, 成长史]");
      L.push("created: " + fmtDT(now));
      L.push("scope: " + lab);
      L.push("---");
      L.push("");
      L.push("# 申论成长史 · " + S.span);
      L.push("");
      L.push("> 由「求是申论素材库 · 成长史双推」生成于 " + fmtDT(now) + " · 范围：" + lab +
             " · 共 " + list.length + " 条");
      L.push("");
      L.push("## 概览");
      L.push("");
      L.push("- 总作答：" + list.length + " 次 · 平均命中率：" + (mean == null ? "—" : (mean + "%")) +
             " · 最早 " + fmtD(first) + " · 最近 " + fmtD(last));
      L.push("- 近 " + WIN + " 次 vs 前 " + WIN + " 次：" + trend);
      L.push("- 常卡难点 Top" + TOPN + "：" + topStr);
      L.push("");
      L.push("## 趋势图");
      L.push("");
      L.push("```");
      L.push(chartText(list));
      L.push("```");
      L.push("");
      L.push("## 时间线");
      L.push("");

      for(i=0;i<list.length;i++){
        var it = list[i];
        var head = fmtD(it.d) + " · " + linkSafe(it.paper) + " · 第" + linkSafe(it.qno) + "题";
        if(it.qtype) head += " · " + linkSafe(it.qtype);
        head += " · 命中率 " + (it.score == null ? "未评" : (it.score + "%"));
        L.push("### " + head);
        L.push("");
        L.push("- 套卷：[[" + linkSafe(it.paper) + "]]");
        L.push("- 题型：" + (it.qtype ? ("[[" + linkSafe(it.qtype) + "]]") : "未登记"));
        if(it.hit != null && it.total != null){
          L.push("- 采分点：命中 " + it.hit + " / " + it.total);
        }
        if(it.tags.length){
          var tg = [];
          for(j=0;j<it.tags.length;j++) tg.push("#" + it.tags[j]);
          L.push("- 难点标签：" + tg.join(" "));
        }
        if(it.note) L.push("- 反思：" + oneLine(it.note));
        if(it.text){
          var body = oneLine(it.text);
          var cutd = body.length > SUMLEN;
          L.push("- 答案摘要（首 " + SUMLEN + " 字）：" + body.slice(0, SUMLEN) + (cutd ? "……" : ""));
        }
        L.push("");
      }

      L.push("---");
      L.push("");
      L.push("（本文件由离线网页生成，可安全放进 Vault；重复生成会得到同名文件，注意按日期区分）");
      L.push("");
      return L.join("\n");
    }catch(err){
      try{ console.error("[_b19] mdText", err); }catch(e){}
      return "# 申论成长史\n\n生成时出错：" + String((err && err.message) || err) + "\n";
    }
  }

  /* ---------------- 文件名 ---------------- */
  function fileName(){
    var c = S.cfg || DEF, d = new Date();
    var s = String(c.tpl || DEF.tpl)
      .replace(/\{YYYY\}/g, String(d.getFullYear()))
      .replace(/\{MM\}/g,   pad(d.getMonth() + 1))
      .replace(/\{DD\}/g,   pad(d.getDate()))
      .replace(/\{HH\}/g,   pad(d.getHours()))
      .replace(/\{mm\}/g,   pad(d.getMinutes()));
    s = s.replace(/[\\\/:\*\?<>\|]+/g, "-").replace(/\.md$/i, "").trim();
    return s || "成长史";
  }
  function subDir(){
    var c = S.cfg || DEF;
    return String(c.subdir || DEF.subdir).replace(/^\/+|\/+$/g, "").replace(/\\/g, "/");
  }

  /* ---------------- 复制 / 下载 ---------------- */
  function fallbackCopy(text){
    try{
      if(typeof document === "undefined" || !document.body) return false;
      var ta = document.createElement("textarea");
      ta.value = String(text == null ? "" : text);
      ta.setAttribute("readonly", "readonly");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      document.body.appendChild(ta);
      ta.select();
      try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
      try{ document.body.removeChild(ta); }catch(e){}
      return !!ok;
    }catch(e){ return false; }
  }

  /* 共用复制：优先 navigator.clipboard，失败降级 textarea + execCommand
     cb 可选：cb(ok)。同步返回值仅在走降级路径时可靠。 */
  function copyText(text, cb){
    var s = String(text == null ? "" : text);
    var done = function(ok){ if(typeof cb === "function"){ try{ cb(!!ok); }catch(e){} } };
    try{
      if(navigator && navigator.clipboard && typeof navigator.clipboard.writeText === "function"){
        navigator.clipboard.writeText(s).then(function(){ done(true); }, function(){
          done(fallbackCopy(s));
        });
        return true;
      }
    }catch(e){}
    var ok2 = fallbackCopy(s);
    done(ok2);
    return ok2;
  }

  function downloadMd(text, name){
    try{
      if(typeof Blob === "undefined" || typeof URL === "undefined" || !URL.createObjectURL) return false;
      var blob = new Blob(["\ufeff" + String(text == null ? "" : text)],
                          { type: "text/markdown;charset=utf-8" });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement("a");
      a.href = url;
      a.download = String(name || "成长史") + ".md";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        try{ document.body.removeChild(a); }catch(e){}
        try{ URL.revokeObjectURL(url); }catch(e){}
      }, 400);
      return true;
    }catch(e){ return false; }
  }

  function advUri(){
    var c = S.cfg || DEF;
    var path = subDir() + "/" + fileName() + ".md";
    var q = "vault=" + encodeURIComponent(c.vault || DEF.vault) +
            "&filepath=" + encodeURIComponent(path) +
            "&clipboard=true&mode=new";
    return "obsidian://advanced-uri?" + q;
  }

  /* ---------------- 顶部飞一行提示 ---------------- */
  var FT = null;
  function flash(msg, bad){
    S.flash = String(msg == null ? "" : msg);
    S.bad   = !!bad;
    try{
      var el = document.getElementById("b19-flash");
      if(!el) return;
      el.className = "b19-flash on" + (bad ? " bad" : "");
      el.innerHTML = (bad ? "⚠️ " : "✅ ") + esc(S.flash);
      if(FT){ try{ clearTimeout(FT); }catch(e){} FT = null; }
      FT = setTimeout(function(){
        try{
          var e2 = document.getElementById("b19-flash");
          if(e2){ e2.className = "b19-flash"; e2.innerHTML = ""; }
        }catch(e){}
        S.flash = ""; FT = null;
      }, 2600);
    }catch(e){}
  }

  /* ---------------- 片段 ---------------- */
  function cfgHtml(){
    var c = S.cfg;
    function radio(v, txt){
      return '<label class="b19-radio' + (c.scope === v ? " on" : "") + '">' +
               '<input type="radio" name="b19scope" value="' + v + '"' +
               (c.scope === v ? " checked" : "") + '>' + esc(txt) + '</label>';
    }
    return '<div class="b19-card">' +
        '<div class="b19-h3"><span class="b19-num">1</span>配置：写到哪个 Vault 目录</div>' +
        '<div class="b19-grid">' +
          '<label class="b19-field"><span>Vault 子目录</span>' +
            '<input id="b19-subdir" class="b19-inp" type="text" value="' + esc(c.subdir) +
              '" placeholder="国考申论/成长史"></label>' +
          '<label class="b19-field"><span>文件名模板</span>' +
            '<input id="b19-tpl" class="b19-inp" type="text" value="' + esc(c.tpl) +
              '" placeholder="成长史-{YYYY}-{MM}-{DD}"></label>' +
        '</div>' +
        '<div class="b19-hint">模板可用占位符：{YYYY} {MM} {DD} {HH} {mm}　当前会生成 ' +
          '<b>' + esc(subDir()) + "/" + esc(fileName()) + '.md</b></div>' +
        '<div class="b19-scope">' +
          '<span class="b19-lb">推送范围</span>' +
          radio("all", "全部记录") + radio("d7", "近 7 天") + radio("d30", "近 30 天") +
          radio("dn", "近 N 天") +
          '<input id="b19-days" class="b19-inp b19-days" type="number" min="1" max="3650" value="' +
            esc(String(c.days)) + '"' + (c.scope === "dn" ? "" : " disabled") + '>' +
          '<span class="b19-lb2">天</span>' +
        '</div>' +
        '<div class="b19-advline">' +
          '<label class="b19-check"><input type="checkbox" id="b19-adv"' + (c.adv ? " checked" : "") +
            '>我装了 Advanced URI 插件（可选，显示一键跳转链接）</label>' +
          '<label class="b19-field b19-vault' + (c.adv ? "" : " off") + '"><span>Vault 名称</span>' +
            '<input id="b19-vault" class="b19-inp" type="text" value="' + esc(c.vault) +
              '" placeholder="ObsidianVault"></label>' +
        '</div>' +
        '<div class="b19-actions">' +
          '<button class="b19-btn primary" data-b19="gen">🧾 生成 Markdown</button>' +
          '<button class="b19-btn" data-b19="reset">↺ 恢复默认配置</button>' +
          '<span class="b19-cnt">本机共 ' + ITEMS.length + ' 条作答记录</span>' +
        '</div>' +
      '</div>';
  }

  function guideHtml(){
    var path = subDir(), fn = fileName() + ".md";
    var adv  = (S.cfg && S.cfg.adv) ?
      ('<div class="b19-uri">锦上添花：先点复制，再点这条链接，Advanced URI 会直接新建文件并粘贴 → ' +
         '<a class="b19-link" href="' + esc(advUri()) + '">obsidian://advanced-uri（新建 ' + esc(fn) + '）</a>' +
       '</div>') : "";
    return '<div class="b19-card b19-guide">' +
        '<div class="b19-h3"><span class="b19-num">3</span>落地：粘到 Obsidian 里</div>' +
        '<ol class="b19-ol">' +
          '<li>打开 Obsidian，切到你的 Vault（长期记忆库根目录：<code>D:/workbuddy/ObsidianVault/</code>）。</li>' +
          '<li>进入子目录 <code>' + esc(path) + '</code>（没有就先新建这个文件夹，Obsidian 里右键左侧目录 → 新建文件夹）。</li>' +
          '<li>在该目录下新建笔记，文件名填 <code>' + esc(fn) + '</code>。</li>' +
          '<li>光标放进正文，Ctrl+V 粘贴，Ctrl+S 保存。双链 <code>[[套卷名]]</code> 会自动生成关系图。</li>' +
        '</ol>' +
        '<div class="b19-warn">说明：浏览器有沙箱限制，网页不能直接往你磁盘写文件，' +
          '所以这里只负责把内容准备好；真正落盘的一步由你粘贴完成，最安全也最可控。</div>' +
        adv +
      '</div>';
  }

  function previewHtml(){
    if(!S.md){
      return '<div class="b19-card">' +
          '<div class="b19-h3"><span class="b19-num">2</span>预览与推送</div>' +
          '<div class="b19-empty">还没生成。选好范围后点上面的「生成 Markdown」。</div>' +
        '</div>';
    }
    var lines = S.md.split("\n").length;
    return '<div class="b19-card">' +
        '<div class="b19-h3"><span class="b19-num">2</span>预览与推送' +
          '<span class="b19-sub">' + esc(scopeLabel()) + " · " + S.md.length + " 字 · " +
            lines + ' 行</span></div>' +
        '<div class="b19-actions">' +
          '<button class="b19-btn primary" data-b19="copy">📋 复制全文</button>' +
          '<button class="b19-btn" data-b19="dl">💾 下载为 .md</button>' +
          '<button class="b19-btn" data-b19="sel">🔎 全选文本框</button>' +
        '</div>' +
        '<textarea id="b19-md" class="b19-md" readonly spellcheck="false">' + esc(S.md) + '</textarea>' +
      '</div>';
  }

  /* ---------------- 渲染 ---------------- */
  function draw(){
    ensureCss();
    var box = null;
    try{ box = document.getElementById("content"); }catch(e){ box = null; }
    if(!box) return;

    if(FT){ try{ clearTimeout(FT); }catch(e){} FT = null; }
    if(!S.cfg) S.cfg = loadCfg();
    buildItems();

    try{
      var st = document.getElementById("stats");
      if(st) st.textContent = "成长史双推 · 本机 " + ITEMS.length + " 条作答记录 · 目标 " + subDir();
    }catch(e){}

    box.innerHTML = '<div class="b19-wrap">' +
        '<div class="b19-head">' +
          '<h2>🔁 申论成长史 → Obsidian 双推</h2>' +
          '<p class="b19-lead">怎么用：' +
            '<b>①</b> 配置 Vault 子目录和文件名　' +
            '<b>②</b> 选推送范围（全部 / 近 7 天 / 近 30 天 / 近 N 天）　' +
            '<b>③</b> 点「生成 Markdown」　' +
            '<b>④</b> 点「复制全文」　' +
            '<b>⑤</b> 打开 Vault 里的目标目录，新建同名文件粘贴保存。</p>' +
        '</div>' +
        '<div id="b19-flash" class="b19-flash"></div>' +
        cfgHtml() +
        previewHtml() +
        guideHtml() +
      '</div>';

    bind(box);
  }

  /* 只重画配置卡里的路径提示，避免打字时整页重绘 */
  function refreshHint(){
    try{
      var box = document.getElementById("content");
      if(!box) return;
      var hs = box.getElementsByClassName("b19-hint");
      if(hs && hs.length){
        hs[0].innerHTML = "模板可用占位符：{YYYY} {MM} {DD} {HH} {mm}　当前会生成 <b>" +
          esc(subDir()) + "/" + esc(fileName()) + ".md</b>";
      }
    }catch(e){}
  }

  /* ---------------- 事件（委托，不用内联 onclick） ---------------- */
  function syncInputs(){
    try{
      var v;
      v = document.getElementById("b19-subdir");
      if(v && String(v.value).trim()) S.cfg.subdir = String(v.value).trim();
      v = document.getElementById("b19-tpl");
      if(v && String(v.value).trim()) S.cfg.tpl = String(v.value).trim();
      v = document.getElementById("b19-days");
      if(v) S.cfg.days = Math.max(1, num(v.value, DEF.days));
      v = document.getElementById("b19-vault");
      if(v && String(v.value).trim()) S.cfg.vault = String(v.value).trim();
      v = document.getElementById("b19-adv");
      if(v) S.cfg.adv = !!v.checked;
    }catch(e){}
  }

  function bind(root){
    if(root.__b19bound) return;
    root.__b19bound = true;

    root.addEventListener("input", function(ev){
      var el = ev.target;
      if(!el || !el.id) return;
      if(el.id === "b19-subdir" || el.id === "b19-tpl" || el.id === "b19-days" || el.id === "b19-vault"){
        syncInputs(); saveCfg(); refreshHint();
      }
    });

    root.addEventListener("change", function(ev){
      var el = ev.target;
      if(!el) return;
      if(el.name === "b19scope"){
        S.cfg.scope = String(el.value || "all");
        syncInputs(); saveCfg(); draw(); return;
      }
      if(el.id === "b19-adv"){
        syncInputs(); saveCfg(); draw(); return;
      }
    });

    root.addEventListener("click", function(ev){
      var el = ev.target, act = null;
      while(el && el !== root){
        act = el.getAttribute && el.getAttribute("data-b19");
        if(act) break;
        el = el.parentNode;
      }
      if(!act) return;

      if(act === "gen"){
        syncInputs(); saveCfg();
        S.md = mdText(scopeDaysOfCfg());
        draw();
        flash("已生成 " + scopeLabel() + " 的 Markdown，接着点「复制全文」", false);
        return;
      }

      if(act === "reset"){
        S.cfg = { subdir:DEF.subdir, tpl:DEF.tpl, scope:DEF.scope, days:DEF.days, vault:DEF.vault, adv:DEF.adv };
        saveCfg(); draw();
        flash("已恢复默认配置", false);
        return;
      }

      if(act === "copy"){
        if(!S.md){ flash("还没生成内容", true); return; }
        copyText(S.md, function(ok){
          if(ok) flash("已复制到剪贴板", false);
          else   flash("浏览器拒绝了复制：请在下方文本框里手动全选（Ctrl+A）再复制（Ctrl+C）", true);
        });
        return;
      }

      if(act === "dl"){
        if(!S.md){ flash("还没生成内容", true); return; }
        if(downloadMd(S.md, fileName())) flash("已触发下载：" + fileName() + ".md（记得移到 Vault 目录里）", false);
        else flash("当前环境不支持下载，请改用「复制全文」", true);
        return;
      }

      if(act === "sel"){
        try{
          var ta = document.getElementById("b19-md");
          if(ta){ ta.focus(); ta.select(); flash("已全选，按 Ctrl+C 复制", false); }
        }catch(e){}
        return;
      }
    });
  }

  /* ---------------- 对外入口 ---------------- */
  window.renderGrowthPush = function(){
    try{
      if(!S.cfg) S.cfg = loadCfg();
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = '<div class="b19-empty">成长史双推运行出错：' +
          esc(String((err && err.message) || err)) + '</div>';
      }catch(e){}
      try{ console.error("[_b19]", err); }catch(e){}
    }
  };

  /* 供其它模块 / 自测调用：scopeDays 为 null＝全部，数字＝近 N 天 */
  window.b19MdText = function(scopeDays){
    try{
      if(!S.cfg) S.cfg = loadCfg();
      buildItems();
      return mdText(scopeDays == null ? null : scopeDays);
    }catch(e){ return ""; }
  };

  /* 共用复制函数：b19CopyToClipboard(text[, cb]) */
  window.b19CopyToClipboard = function(text, cb){ return copyText(text, cb); };

})();

</script>
<script>/* === _b20.js === */
(function(){

  /* 模块内状态（不碰主站 state） */

    flash: ""        /* 顶部一次性提示 */

  /* ---------------- 弱点标签归一（库里真实标签 → 规范键） ---------------- */
  var TAG_ALIAS = {
    "不会归纳概括": "不会归纳",

    "原词还是提炼": "原词vs提炼",

  };
  function normTag(t){

  /* ---------------- B. 弱点 → 题型映射表 ---------------- */
  var TAG_TO_QTYPE = {
