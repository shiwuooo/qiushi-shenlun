    return h;
  }

  /* ================= 渲染：结果A ================= */
  function resAHtml(){
    var r = S.resA, h = "", i, pct, tips;
    if(!r) return "";
    pct = r.total ? Math.round(r.hit / r.total * 100) : 0;
    tips = adviseA(r);
    h += '<div class="b12-card b12-res">';
    h += '<div class="b12-h3">④ 逻辑线反馈</div>';
    h += '<div class="b12-score"><b class="' + (pct >= 70 ? "ok" : (pct >= 40 ? "mid" : "bad")) + '">' + r.hit + " / " + r.total + "</b>"
       + '<span class="b12-sub">采分点的来源段中，你标对层次的有 ' + r.hit + " 个 · 准确率 " + pct + "%</span></div>";
    h += '<div class="b12-track"><i style="width:' + pct + '%"></i></div>';

    h += '<div class="b12-cols">';
    h += '<div class="b12-col ok"><div class="b12-colh">✅ 标对的逻辑线（' + r.ok.length + "）</div>";
    if(!r.ok.length) h += '<div class="b12-sub">暂时一条都没对上——这正是这个模块存在的理由。</div>';
    for(i=0;i<r.ok.length;i++){
      h += '<div class="b12-item"><div class="b12-std"><span class="b12-tag ' + esc(r.ok[i].pt.tag || "") + '">'
         + esc(TAG_CN[r.ok[i].pt.tag] || r.ok[i].pt.tag || "点") + "</span>" + esc(r.ok[i].pt.text || "") + "</div>"
         + '<div class="b12-from">出自第 ' + (r.ok[i].seg + 1) + " 段 · 你标「" + levelCn(r.ok[i].got) + "」</div></div>";
    }
    h += "</div>";

    h += '<div class="b12-col bad"><div class="b12-colh">❌ 标错层次的（' + r.bad.length + "）</div>";
    if(!r.bad.length) h += '<div class="b12-sub">全部命中，材料结构你读懂了。</div>';
    for(i=0;i<r.bad.length;i++){
      h += '<div class="b12-item"><div class="b12-std"><span class="b12-tag ' + esc(r.bad[i].pt.tag || "") + '">'
         + esc(TAG_CN[r.bad[i].pt.tag] || r.bad[i].pt.tag || "点") + "</span>" + esc(r.bad[i].pt.text || "") + "</div>"
         + '<div class="b12-from">出自第 ' + (r.bad[i].seg + 1) + " 段 · 应为「" + levelCn(r.bad[i].want) + "」，你标「"
         + (r.bad[i].got ? levelCn(r.bad[i].got) : "未标") + "」</div></div>";
    }
    h += "</div>";

    h += '<div class="b12-col warn"><div class="b12-colh">🔎 材料里没有直接出处的点（' + r.lost.length + "）</div>";
    if(!r.lost.length) h += '<div class="b12-sub">所有采分点都能在材料里溯源，属于典型摘抄型题。</div>';
    for(i=0;i<r.lost.length;i++){
      h += '<div class="b12-item"><div class="b12-std">' + esc(r.lost[i].pt.text || "") + "</div>"
         + '<div class="b12-from">需要跨段归纳，摘抄拿不到</div></div>';
    }
    h += "</div></div>";

    h += '<div class="b12-tip"><b>下一步怎么练</b>';
    for(i=0;i<tips.length;i++) h += "<div>· " + tips[i] + "</div>";
    h += "</div></div>";
    return h;
  }

  /* ================= 渲染：结果B ================= */
  function resBHtml(){
    var r = S.resB, h = "", i, pct, tips;
    if(!r) return "";
    pct = r.total ? Math.round(r.hit / r.total * 100) : 0;
    tips = adviseB(r);
    h += '<div class="b12-card b12-res">';
    h += '<div class="b12-h3">④ 原词覆盖反馈</div>';
    h += '<div class="b12-score"><b class="' + (pct >= 70 ? "ok" : (pct >= 40 ? "mid" : "bad")) + '">' + r.hit + " / " + r.total + "</b>"
       + '<span class="b12-sub">你摘的原词覆盖了 ' + r.hit + " 个采分点（共 " + r.total + " 个）· 覆盖率 " + pct + "%"
       + " · 摘了 " + r.pickN + " 条，其中 " + r.rawN + " 条确为材料原文</span></div>";
    h += '<div class="b12-track"><i style="width:' + pct + '%"></i></div>';

    h += '<div class="b12-cols">';
    h += '<div class="b12-col ok"><div class="b12-colh">✅ 已覆盖（' + r.covered.length + "）</div>";
    if(!r.covered.length) h += '<div class="b12-sub">一个都没覆盖到——先回材料，把带动词的句子整句摘下来再删。</div>';
    for(i=0;i<r.covered.length;i++){
      h += '<div class="b12-item"><div class="b12-std"><span class="b12-tag ' + esc(r.covered[i].pt.tag || "") + '">'
         + esc(TAG_CN[r.covered[i].pt.tag] || r.covered[i].pt.tag || "点") + "</span>" + esc(r.covered[i].pt.text || "") + "</div>"
         + '<div class="b12-mine">你摘的：' + esc(r.covered[i].mine) + ' <span class="b12-sub">（重叠 ' + Math.round(r.covered[i].s * 100) + "%）</span></div></div>";
    }
    h += "</div>";

    h += '<div class="b12-col bad"><div class="b12-colh">❌ 没摘到的采分点（' + r.missed.length + "）</div>";
    if(!r.missed.length) h += '<div class="b12-sub">全覆盖，材料转化满分。</div>';
    for(i=0;i<r.missed.length;i++){
      h += '<div class="b12-item"><div class="b12-std"><span class="b12-tag ' + esc(r.missed[i].pt.tag || "") + '">'
         + esc(TAG_CN[r.missed[i].pt.tag] || r.missed[i].pt.tag || "点") + "</span>" + esc(r.missed[i].pt.text || "") + "</div>"
         + (r.missed[i].s >= 0.2 ? '<div class="b12-from">你擦边了（' + Math.round(r.missed[i].s * 100) + "%），差在没抓住核心动宾</div>" : "")
         + "</div>";
    }
    h += "</div>";

    h += '<div class="b12-col warn"><div class="b12-colh">⚠️ 摘了但没用上（' + r.extra.length + "）</div>";
    if(!r.extra.length) h += '<div class="b12-sub">没有多余动作，摘得很干净。</div>';
    for(i=0;i<r.extra.length;i++){
      h += '<div class="b12-item"><div class="b12-mine">' + esc(r.extra[i]) + "</div></div>";
    }
    h += "</div></div>";

    h += '<div class="b12-tip"><b>下一步怎么练</b>';
    for(i=0;i<tips.length;i++) h += "<div>· " + tips[i] + "</div>";
    h += "</div></div>";
    return h;
  }

  /* ================= 渲染：标准拆解 ================= */
  function stdHtml(f, mats){
    var h = "", i, j, pts = ptsOf(f.q), lv, groups = {}, tr, list, order;
    h += '<div class="b12-card">';
    h += '<div class="b12-h3">⑤ 标准拆解 '
       + '<button class="b12-btn sm" data-act="std">' + (S.showStd ? "收起" : "展开对照") + "</button></div>";
    if(!S.showStd){
      h += '<div class="b12-sub">练完再看。提前看会毁掉这道题的训练价值。</div></div>';
      return h;
    }
    h += '<div class="b12-h4">材料逻辑线（系统按关键词推断，供校准用，不是唯一解）</div>';
    h += '<div class="b12-line">';
    for(i=0;i<mats.length;i++){
      lv = inferLevel(mats[i]);
      h += '<div class="b12-lineitem"><span class="b12-lv ' + levelCls(lv) + ' on">' + levelCn(lv) + "</span>"
         + '<span class="b12-linetx">第' + (i + 1) + "段：" + esc(String(mats[i]).slice(0, 46)) + (String(mats[i]).length > 46 ? "…" : "") + "</span>"
         + (S.tags[i] && S.tags[i] !== lv ? '<span class="b12-diff">你标：' + levelCn(S.tags[i]) + "</span>" : "")
         + "</div>";
    }
    h += "</div>";
    h += '<div class="b12-h4" style="margin-top:12px">各采分点来自哪类段落</div>';
    if(!pts.length){
      h += '<div class="b12-sub">该题暂无标准采分点数据。</div>';
    }else{
      for(i=0;i<pts.length;i++){
        tr = traceSource(pts[i].text, mats);
        lv = tr.idx >= 0 ? inferLevel(mats[tr.idx]) : "none";
        if(!groups[lv]) groups[lv] = [];
        groups[lv].push({ pt:pts[i], seg:tr.idx, s:tr.score });
      }
      order = ["problem", "cause", "action", "effect", "other", "none"];
      for(j=0;j<order.length;j++){
        list = groups[order[j]];
        if(!list || !list.length) continue;
        h += '<div class="b12-grp"><div class="b12-grph"><span class="b12-lv ' + levelCls(order[j]) + ' on">'
           + (order[j] === "none" ? "无出处" : levelCn(order[j])) + "</span> 段落贡献了 " + list.length + " 个采分点</div>";
        for(i=0;i<list.length;i++){
          h += '<div class="b12-item"><div class="b12-std"><span class="b12-tag ' + esc(list[i].pt.tag || "") + '">'
             + esc(TAG_CN[list[i].pt.tag] || list[i].pt.tag || "点") + "</span>" + esc(list[i].pt.text || "") + "</div>"
             + '<div class="b12-from">' + (list[i].seg >= 0
                 ? "← 第 " + (list[i].seg + 1) + " 段（原文重叠 " + Math.round(list[i].s * 100) + "%）"
                 : "← 材料中无直接原句，需跨段归纳") + "</div></div>";
        }
        h += "</div>";
      }
    }
    h += '<div class="b12-tip"><b>怎么用这张拆解表</b>'
       + "<div>· 先看逻辑线：问题段和做法段是不是成对出现？申论材料几乎都是「摆问题 → 找原因 → 给做法 → 报成效」的循环。</div>"
       + "<div>· 再看来源分布：如果采分点集中在「做法」段，说明这是典型对策题，读材料时应把 70% 注意力压在动词句上。</div>"
       + "<div>· 最后看无出处的点：这些是命题人要你<b>归纳</b>的，也是区分 35 分和 42 分的地方。</div>"
       + "</div>";
    h += "</div>";
    return h;
  }

  /* ================= 渲染：历史记录 ================= */
  function historyHtml(){
    var a = loadHis(), h = "", i, rec, pct, sumA = 0, nA = 0, sumB = 0, nB = 0;
    h += '<div class="b12-card">';
    h += '<div class="b12-h3">⑥ 训练记录 <span class="b12-sub">（本机 localStorage，离线保存）</span></div>';
    if(!a.length){
      h += '<div class="b12-sub">还没有记录。提交一次训练就会自动存在这里。</div></div>';
      return h;
    }
    for(i=0;i<a.length;i++){
      if(!a[i] || !a[i].total) continue;
      if(a[i].mode === "A"){ sumA += a[i].hit / a[i].total; nA++; }
      else { sumB += a[i].hit / a[i].total; nB++; }
    }
    h += '<div class="b12-stat">累计 <b>' + a.length + "</b> 次"
       + " · 标层次平均 <b>" + (nA ? Math.round(sumA / nA * 100) : 0) + "%</b>（" + nA + " 次）"
       + " · 摘原词平均 <b>" + (nB ? Math.round(sumB / nB * 100) : 0) + "%</b>（" + nB + " 次）"
       + ' <button class="b12-btn ghost sm" data-act="clearhis">清空记录</button></div>';
    h += '<div class="b12-his">';
    for(i=0;i<a.length && i<40;i++){
      rec = a[i] || {};
      pct = rec.total ? Math.round((rec.hit || 0) / rec.total * 100) : 0;
      h += '<div class="b12-hi"><div class="b12-hih">'
         + '<span class="b12-mtag ' + (rec.mode === "A" ? "ma" : "mb") + '">' + (rec.mode === "A" ? "标层次" : "摘原词") + "</span>"
         + '<b class="' + (pct >= 70 ? "ok" : (pct >= 40 ? "mid" : "bad")) + '">' + (rec.hit || 0) + "/" + (rec.total || 0) + "</b> "
         + esc(String(rec.title || rec.pid || "")) + " · 题" + esc(rec.qno) + " " + esc(rec.qtype || "")
         + '<span class="b12-sub">' + esc(fmtTime(rec.time)) + "</span>"
         + '<button class="b12-x sm" data-act="delhis" data-i="' + i + '" title="删除">×</button></div>';
      if(rec.note) h += '<div class="b12-hib">' + esc(rec.note) + "</div>";
      h += "</div>";
    }
    h += "</div></div>";
    return h;
  }

  /* ================= 渲染：底部训练价值说明 ================= */
  function footHtml(){
    var h = "";
    h += '<div class="b12-card b12-foot">';
    h += '<div class="b12-h3">为什么要单独练「材料 → 要点」</div>';
    h += "<p>申论不是作文考试，是<b>阅读理解 + 信息加工</b>考试。80% 的分写在材料里，命题人只是把它们打散、埋进案例和访谈里。绝大多数人失分不是因为不会写，而是因为<b>没看见</b>。</p>";
    h += '<div class="b12-steps">';
    h += '<div class="b12-step"><span class="b12-stepno">1</span><div><b>先分层</b>：读一段判一段——问题 / 原因 / 做法 / 成效。分层解决的是「材料太长记不住」，把上千字压成一条结构线。<i>对应模式Ⓐ。</i></div></div>';
    h += '<div class="b12-step"><span class="b12-stepno">2</span><div><b>再摘原词</b>：在已分层的段里，只挑能直接进答案的动宾短语。摘原词解决的是「意思对但不给分」——阅卷按关键词踩分，你换了说法就丢分。<i>对应模式Ⓑ。</i></div></div>';
    h += '<div class="b12-step"><span class="b12-stepno">3</span><div><b>最后归纳</b>：把同层次的原词合并同类项，加上「主体 + 动词 + 对象」的规范表述，才是成稿。<b>顺序不能倒</b>——先归纳后读材料，写出来的一定是套话。</div></div>';
    h += "</div>";
    h += '<p class="b12-sub">练法建议：同一道题先做Ⓐ再做Ⓑ，最后展开⑤标准拆解校准。连续 10 道之后，你读材料时会自动出现分层意识，这个能力一旦形成不会退化。</p>';
    h += "</div>";
    return h;
  }

  /* ================= 主渲染 ================= */
  function draw(){
    var box = document.getElementById("content"), h, f, mats;
    if(!box) return;
    ensureCss();

    h  = '<div class="b12-wrap">';
    h += '<div class="b12-head"><h2>📖 材料阅读训练器</h2>'
       + '<p class="b12-lead">申论 80% 的分藏在材料里，但几乎没人专门练「材料 → 要点」这一步。'
       + '这里把它拆成两个可反复训练的动作：<b>标层次</b>（读懂结构）和 <b>摘原词</b>（抓住踩分词）。</p></div>';
    h += '<div class="b12-card"><div class="b12-h3">① 选题</div>' + pickerHtml() + "</div>";

    f = getQ(S.pid, S.qno);
    if(S.pid && S.qno && !f){
      h += '<div class="b12-card"><div class="b12-empty">未找到该题（findQ 校验失败），请重新选择。</div></div>';
    }else if(f){
      mats = matOf(f.q);
      h += '<div class="b12-card"><div class="b12-h3">② 题面</div>' + stemHtml(f) + tabsHtml() + "</div>";
      if(!mats.length){
        h += '<div class="b12-card"><div class="b12-empty">这道题没有材料段落数据（q.material 为空），换一道有材料的题再练。</div></div>';
      }else{
        h += (S.mode === "A" ? modeAHtml(mats) : modeBHtml(mats));
        h += (S.mode === "A" ? resAHtml() : resBHtml());
        h += stdHtml(f, mats);
      }
    }else{
      h += '<div class="b12-card"><div class="b12-empty">先在上方选一套卷和一道题，材料会逐段展开在这里。</div></div>';
    }
    h += historyHtml();
    h += footHtml();
    h += "</div>";

    box.innerHTML = h;
    bind(box);

    try{
      var st = document.getElementById("stats");
      if(st) st.textContent = "材料阅读训练器 · 专训「材料 → 要点」的转化能力";
    }catch(e){}
  }

  /* ================= 事件 ================= */
  function syncPick(root){
    try{
      var ta = root.querySelector('.b12-ta[data-act="pick"]');
      if(ta) S.pick = ta.value;
    }catch(e){}
  }
  function resetQ(){
    S.tags = {}; S.pick = ""; S.resA = null; S.resB = null; S.showStd = false;
  }
  function submitA(f, mats){
    var r, p = f.p;
    if(!Object.keys(S.tags).filter(function(k){ return S.tags[k]; }).length){
      try{ alert("先给至少一段材料打上层次标签，再提交。"); }catch(e){}
      return;
    }
    r = gradeA(f.q, mats);
    S.resA = r;
    pushHis({
      time:Date.now(), mode:"A", pid:S.pid, qno:S.qno,
      title:String(p.year || "") + " " + String(p.paper || ""),
      qtype:f.q.qtype || "",
      hit:r.hit, total:r.total,
      note:"已标 " + r.tagged + "/" + r.segs + " 段；标错 " + r.bad.length + " 处，无出处点 " + r.lost.length + " 个"
    });
    draw();
  }
  function submitB(f, mats){
    var r, p = f.p;
    if(!splitPicks(S.pick).length){
      try{ alert("先摘几条原词到下方文本框，再提交。"); }catch(e){}
      return;
    }
    r = gradeB(f.q, mats);
    S.resB = r;
    pushHis({
      time:Date.now(), mode:"B", pid:S.pid, qno:S.qno,
      title:String(p.year || "") + " " + String(p.paper || ""),
      qtype:f.q.qtype || "",
      hit:r.hit, total:r.total,
      note:"摘 " + r.pickN + " 条（原文 " + r.rawN + " 条），未用上 " + r.extra.length + " 条"
    });
    draw();
  }

  function bind(box){
    var root = box.querySelector(".b12-wrap");
    if(!root) return;

    root.addEventListener("input", function(ev){
      var el = ev.target;
      if(el && el.getAttribute && el.getAttribute("data-act") === "pick") S.pick = el.value;
    });

    root.addEventListener("change", function(ev){
      var el = ev.target, act = el && el.getAttribute && el.getAttribute("data-act");
      if(act === "pid"){ S.pid = el.value; S.qno = ""; resetQ(); draw(); }
      else if(act === "qno"){ S.qno = el.value; resetQ(); draw(); }
    });

    root.addEventListener("click", function(ev){
      var el = ev.target, act, idx, f, mats, a;
      while(el && el !== root && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
      if(!el || el === root) return;
      act = el.getAttribute("data-act");
      idx = parseInt(el.getAttribute("data-i"), 10);
      f = getQ(S.pid, S.qno);
      mats = f ? matOf(f.q) : [];

      if(act === "mode"){
        syncPick(root);
        S.mode = el.getAttribute("data-m") === "B" ? "B" : "A";
        draw();
      }else if(act === "tag"){
        if(!isNaN(idx)){
          var k = el.getAttribute("data-k");
          S.tags[idx] = (S.tags[idx] === k) ? "" : k;   /* 再点一次取消 */
          draw();
        }
      }else if(act === "clearA"){
        S.tags = {}; S.resA = null; draw();
      }else if(act === "subA"){
        if(f && mats.length) submitA(f, mats);
      }else if(act === "copy"){
        if(!isNaN(idx) && mats[idx] != null){
          syncPick(root);
          S.pick = (S.pick ? S.pick.replace(/\s*$/, "") + "\n" : "") + String(mats[idx]);
          draw();
          try{
            var ta = box.querySelector('.b12-ta[data-act="pick"]');
            if(ta){ ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; ta.scrollTop = ta.scrollHeight; }
          }catch(e){}
        }
      }else if(act === "clearB"){
        S.pick = ""; S.resB = null; draw();
      }else if(act === "subB"){
        syncPick(root);
        if(f && mats.length) submitB(f, mats);
      }else if(act === "std"){
        syncPick(root); S.showStd = !S.showStd; draw();
      }else if(act === "delhis"){
        a = loadHis();
        if(!isNaN(idx) && idx >= 0 && idx < a.length){ a.splice(idx, 1); saveHis(a); draw(); }
      }else if(act === "clearhis"){
        try{ if(!confirm("确定清空全部材料训练记录？")) return; }catch(e){}
        saveHis([]); draw();
      }
    });
  }

  /* ================= 路由入口 ================= */
  window.renderMatTrain = function(){
    try{
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = '<div class="b12-empty">材料阅读训练器运行出错：' + esc(String((err && err.message) || err)) + "</div>";
      }catch(e){}
      try{ console.error("[_b12]", err); }catch(e){}
    }
  };

})();

</script>
<script>/* === _b13.js === */
(function(){
  "use strict";
  /* ==================================================================
     _b13 题型专项突破包（Type Drill Pack）
     把全部真题按 qtype 聚合成"题型包"，用 getRec 的命中率算出每类
     题型的平均水平，指出最薄弱的一类，并生成"今日专攻"清单，
     点「✍️ 作答」直接调主站 openAnswerModal 进入答题。
     与主站隔离：只读 DATA / findQ / getRec / openAnswerModal，
     不写任何 localStorage，暴露 window.renderDrill。
     所有类名 b13- 前缀，样式复用主站 :root 变量。
     ================================================================== */

  var WEAK      = 60;   /* 命中率低于此值判为"薄弱" */
  var GOOD      = 80;   /* 命中率不低于此值判为"稳" */
  var TODAY_MAX = 8;    /* 今日专攻最多列几题 */
  var STORE_KEY = "shenlun_answers_v2";

  /* 模块内状态（不碰主站 state） */
  var S = { open: null, today: true };
  var IDX = [];   /* 当前这次渲染的全部有效题目，行按钮用下标引用 */

  /* ---------- 自带 HTML 转义 ---------- */
  function esc(s){
    s = (s == null) ? "" : String(s);
    return s.replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  /* ---------- 样式自挂载（主站未 link _b13.css 时兜底，不改任何文件） ---------- */
  function ensureCss(){
    try{
      var ls = document.getElementsByTagName("link"), i;
      for(i=0;i<ls.length;i++){
        if(String(ls[i].getAttribute("href") || "").indexOf("_b13.css") >= 0) return;
      }
      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b13.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  /* ---------- 数据安全访问 ---------- */
  function isArr(x){ return Object.prototype.toString.call(x) === "[object Array]"; }

  function papers(){
    try{
      var D = (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null);
      return (D && isArr(D.papers)) ? D.papers : [];
    }catch(e){ return []; }
  }

  function localFind(pid, qno){
    var ps = papers(), i, j, qs;
    for(i=0;i<ps.length;i++){
      if(!ps[i] || String(ps[i].id) !== String(pid)) continue;
      qs = isArr(ps[i].questions) ? ps[i].questions : [];
      for(j=0;j<qs.length;j++){
        if(qs[j] && String(qs[j].no) === String(qno)) return { p:ps[i], q:qs[j] };
      }
    }
    return null;
  }

  /* 优先用主站 findQ 校验，失败回落本地遍历 */
  function getQ(pid, qno){
    if(pid == null || qno == null || qno === "") return null;
    try{
      if(typeof findQ === "function"){
        var f = findQ(pid, qno);
        if(!f && String(Number(qno)) === String(qno)) f = findQ(pid, Number(qno));
        if(f && f.q) return f;
      }
    }catch(e){}
    try{ return localFind(pid, qno); }catch(e){ return null; }
  }

  /* 一次性读作答记录快照；读不到就逐题回落 getRec */
  function recLookup(){
    var map = null;
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var o = JSON.parse(raw);
        if(o && typeof o === "object") map = o;
      }
    }catch(e){ map = null; }
    return function(pid, qno){
      if(map) return map[pid + "#" + qno] || null;
      try{ if(typeof getRec === "function") return getRec(pid, qno) || null; }catch(e){}
      return null;
    };
  }

  function scoreOf(rec){
    if(!rec || typeof rec !== "object") return null;
    var s = rec.score;
    if(typeof s !== "number" || isNaN(s)){
      if(typeof rec.rate === "number" && !isNaN(rec.rate)) s = rec.rate * 100;
      else return null;
    }
    s = Math.round(s);
    if(s < 0) s = 0;
    if(s > 100) s = 100;
    return s;
  }

  function lvl(sc){
    if(sc == null) return "na";
    if(sc < WEAK)  return "lo";
    if(sc < GOOD)  return "mid";
    return "hi";
  }

  /* ---------- 聚合：按 qtype 分组 ---------- */
  function build(){
    var ps = papers(), look = recLookup();
    var order = [], map = {}, i, j;
    IDX = [];

    for(i=0;i<ps.length;i++){
      var p = ps[i];
      if(!p || typeof p !== "object" || !isArr(p.questions)) continue;
      for(j=0;j<p.questions.length;j++){
        var q = p.questions[j];
        if(!q || typeof q !== "object") continue;
        if(!getQ(p.id, q.no)) continue;              /* 用 findQ 校验 pid/qno */

        var qt = String(q.qtype == null ? "" : q.qtype).trim() || "未标题型";
        var sc = scoreOf(look(p.id, q.no));
        var it = {
          i: IDX.length,
          pid: p.id, qno: q.no, qtype: qt, score: sc,
          year: (p.year == null ? "" : p.year),
          paper: (p.paper == null ? "" : p.paper),
          province: (p.province == null ? "" : p.province),
          pts: isArr(q.points) ? q.points.length : 0
        };
        IDX.push(it);

        var k = "t:" + qt;
        if(!Object.prototype.hasOwnProperty.call(map, k)){
          map[k] = { qtype:qt, items:[], answered:0, sum:0, weak:0 };
          order.push(k);
        }
        var g = map[k];
        g.items.push(it);
        if(sc != null){ g.answered++; g.sum += sc; if(sc < WEAK) g.weak++; }
      }
    }

    var gs = [];
    for(i=0;i<order.length;i++){
      var it2 = map[order[i]];
      it2.avg = it2.answered ? Math.round(it2.sum / it2.answered) : null;
      gs.push(it2);
    }
    /* 答过的排前面、平均命中率低的优先；没答过的按题量降序垫后 */
    gs.sort(function(a, b){
      if((a.avg == null) !== (b.avg == null)) return a.avg == null ? 1 : -1;
      if(a.avg != null && a.avg !== b.avg) return a.avg - b.avg;
      return b.items.length - a.items.length;
    });
    return gs;
  }

  /* 专攻排序：命中率低的在前，未作答的垫后，同分按年份新→旧 */
  function drillSort(a, b){
    var as = (a.score == null) ? 1e6 : a.score;
    var bs = (b.score == null) ? 1e6 : b.score;
    if(as !== bs) return as - bs;
    var ay = Number(a.year) || 0, by = Number(b.year) || 0;
    if(ay !== by) return by - ay;
    return (Number(a.qno) || 0) - (Number(b.qno) || 0);
  }

  function groupByType(gs, qtype){
    for(var i=0;i<gs.length;i++) if(gs[i].qtype === qtype) return gs[i];
    return null;
  }

  /* ---------- 片段 ---------- */
  function scoreTag(it){
    if(it.score == null) return '<span class="b13-sc na">未作答</span>';
    return '<span class="b13-sc ' + lvl(it.score) + '">命中率 ' + it.score + '%</span>';
  }

  function rowHtml(it, withType){
    var weak = (it.score != null && it.score < WEAK);
    return '' +
      '<div class="b13-row' + (weak ? " wk" : "") + '">' +
        '<div class="b13-rl">' +
          '<span class="b13-yr">' + esc(it.year) + ' ' + esc(it.paper) + '</span>' +
          (it.province ? '<span class="b13-pv">' + esc(it.province) + '</span>' : "") +
          '<span class="b13-qn">题 ' + esc(it.qno) + '</span>' +
          (withType ? '<span class="b13-tt">' + esc(it.qtype) + '</span>' : "") +
          (it.pts ? '<span class="b13-pt">' + it.pts + ' 采分点</span>' : "") +
        '</div>' +
        '<div class="b13-rr">' +
          scoreTag(it) +
          (weak ? '<span class="b13-wk">薄弱</span>' : "") +
          '<button class="b13-btn" data-b13="ans" data-i="' + it.i + '">✍️ 作答</button>' +
        '</div>' +
      '</div>';
  }

  function cardHtml(g, isWeakest){
    var avgTxt = (g.avg == null) ? "—" : (g.avg + "%");
    var cls = "b13-card b13-tcard " + lvl(g.avg) +
              (S.open === g.qtype ? " on" : "") + (isWeakest ? " first" : "");
    return '' +
      '<div class="' + cls + '" data-b13="type" data-t="' + esc(g.qtype) + '">' +
        '<div class="b13-ct">' +
          '<b>' + esc(g.qtype) + '</b>' +
          (isWeakest ? '<span class="b13-flag">最该攻</span>' : "") +
        '</div>' +
        '<div class="b13-cn">共 <b>' + g.items.length + '</b> 题 · 你已答 <b>' + g.answered + '</b> 题' +
          (g.weak ? ' · <i>' + g.weak + ' 题薄弱</i>' : "") + '</div>' +
        '<div class="b13-bar"><i style="width:' + (g.avg == null ? 0 : g.avg) + '%"></i></div>' +
        '<div class="b13-avg">平均命中率 <b>' + avgTxt + '</b></div>' +
      '</div>';
  }

  function todayHtml(gs){
    if(!S.today) return "";
    var g = null, i;
    for(i=0;i<gs.length;i++){ if(gs[i].answered > 0){ g = gs[i]; break; } }
    var body, head;
    if(!g){
      head = '今日专攻';
      body = '<div class="b13-empty">还没有任何作答记录。先随便点开一类题型，做完 2～3 题，' +
             '这里就会自动锁定你最薄弱的题型并排出专攻清单。</div>';
    }else{
      var list = g.items.slice(0).sort(drillSort).slice(0, TODAY_MAX);
      head = '今日专攻 · <span class="b13-sub">锁定最弱题型「<b>' + esc(g.qtype) +
             '</b>」（平均 ' + g.avg + '%），按命中率从低到高排</span>';
      body = list.map(function(x){ return rowHtml(x, false); }).join("") ||
             '<div class="b13-empty">该题型下暂无可作答的题目。</div>';
    }
    return '<div class="b13-card b13-today">' +
             '<div class="b13-h3">🔥 ' + head +
               '<button class="b13-mini" data-b13="hide">收起</button>' +
             '</div>' + body +
           '</div>';
  }

  function listHtml(gs){
    if(!S.open) return "";
    var g = groupByType(gs, S.open);
    if(!g) return "";
    var rows = g.items.slice(0).sort(drillSort)
                 .map(function(x){ return rowHtml(x, false); }).join("");
    return '<div class="b13-card b13-list">' +
             '<div class="b13-h3">📂 ' + esc(g.qtype) + ' · 全部 ' + g.items.length + ' 题 ' +
               '<span class="b13-sub">已答 ' + g.answered + ' 题 · 平均 ' +
               (g.avg == null ? "—" : g.avg + "%") + ' · 命中率低的排在前面</span>' +
               '<button class="b13-mini" data-b13="close">收起</button>' +
             '</div>' +
             (rows || '<div class="b13-empty">这一类暂时没有题目。</div>') +
           '</div>';
  }

  /* ---------- 渲染 ---------- */
  function draw(){
    ensureCss();
    var box = document.getElementById("content");
    if(!box) return;

    var gs = build();

    try{
      var st = document.getElementById("stats");
      if(st) st.textContent = "题型专项突破包 · " + gs.length + " 类题型 · 共 " + IDX.length + " 题";
    }catch(e){}

    if(!gs.length){
      box.innerHTML = '<div class="b13-wrap"><div class="b13-card">' +
        '<div class="b13-empty">没有读到可用的真题数据（DATA.papers 为空或题目缺少题号）。</div>' +
        '</div></div>';
      return;
    }

    var weakest = (gs[0] && gs[0].avg != null) ? gs[0] : null;
    var lead = weakest
      ? '按题型把全部真题打成"专攻包"。<b>建议先攻平均命中率最低的那类题型</b>——' +
        '当前最弱是「<b>' + esc(weakest.qtype) + '</b>」，平均命中率仅 <b>' + weakest.avg + '%</b>，' +
        '同类题练透一类，提分最快。'
      : '按题型把全部真题打成"专攻包"。<b>建议先攻平均命中率最低的那类题型</b>——' +
        '你还没有作答记录，先各题型试做几题，系统才能算出你的薄弱项。';

    var cards = gs.map(function(g){ return cardHtml(g, weakest === g); }).join("");

    box.innerHTML = '' +
      '<div class="b13-wrap">' +
        '<div class="b13-head">' +
          '<h2>🎯 题型专项突破包</h2>' +
          '<p class="b13-lead">' + lead + '</p>' +
          '<div class="b13-ops">' +
            '<button class="b13-mini" data-b13="refresh">🔄 刷新统计</button>' +
            (S.today ? "" : '<button class="b13-mini" data-b13="show">🔥 显示今日专攻</button>') +
            '<span class="b13-tip">命中率 &lt; ' + WEAK + '% 记为薄弱，≥ ' + GOOD + '% 记为已稳</span>' +
          '</div>' +
        '</div>' +
        todayHtml(gs) +
        '<div class="b13-grid">' + cards + '</div>' +
        listHtml(gs) +
      '</div>';

    bind(box);
  }

  /* ---------- 事件（委托，不用内联 onclick） ---------- */
  function bind(root){
    if(root.__b13bound) return;
    root.__b13bound = true;
    root.addEventListener("click", function(ev){
      var el = ev.target, act = null, i;
      while(el && el !== root){
        act = el.getAttribute && el.getAttribute("data-b13");
        if(act) break;
        el = el.parentNode;
      }
      if(!act) return;

      if(act === "ans"){
        ev.stopPropagation();
        i = parseInt(el.getAttribute("data-i"), 10);
        var it = (!isNaN(i) && IDX[i]) ? IDX[i] : null;
        if(!it) return;
        try{
          if(typeof openAnswerModal === "function") openAnswerModal(it.pid, it.qno);
          else if(typeof window.openAnswerModal === "function") window.openAnswerModal(it.pid, it.qno);
          else alert("作答弹窗未加载");
        }catch(err){ try{ console.error("[_b13]", err); }catch(e){} }
        return;
      }
      if(act === "type"){
        var t = el.getAttribute("data-t");
        S.open = (S.open === t) ? null : t;
        draw();
        return;
      }
      if(act === "close"){ S.open  = null;  draw(); return; }
      if(act === "hide"){  S.today = false; draw(); return; }
      if(act === "show"){  S.today = true;  draw(); return; }
      if(act === "refresh"){ draw(); return; }
    });
  }

  /* ================= 路由入口 ================= */
  window.renderDrill = function(){
    try{
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = '<div class="b13-empty">题型专项突破包运行出错：' +
          esc(String((err && err.message) || err)) + '</div>';
      }catch(e){}
      try{ console.error("[_b13]", err); }catch(e){}
    }
  };

})();

</script>
<script>/* === _b14.js === */

  /* 常见"动词枢纽"，用来把主题句切成 A（手段/主体）+ B（目标/价值） */

               "凝聚","汇聚","锻造","守护","赋能","引领","开创","成就","推动","促进",
               "实现","建设","培育","涵养","点亮","撑起","护航","注入","唱响","扛起",
               "助力","服务","支撑","提升","激发","塑造","走好","开辟"];

  /* 分论点角度模式 */
  var MODES = [
    { k:"wwh", n:"是什么—为什么—怎么办",
      angles:["内涵界定：讲清概念与要义","价值判断：讲透意义与紧迫性","实践路径：讲实办法与保障"] },
    { k:"pnc", n:"问题—原因—对策",
      angles:["摆问题：现象、表现、危害","挖根源：思想、机制、能力","提对策：主体、抓手、保障"] },
    { k:"idea", n:"理念—制度—行动",
      angles:["理念先导：思想认识是总开关","制度托底：把好做法固化为规矩","行动见效：一分部署九分落实"] },
    { k:"level", n:"个人—社会—国家",

  /* ---------- 自带 HTML 转义 ---------- */

  /* ---------- 样式自挂载（主站未 link _b14.css 时兜底，不改任何文件） ---------- */
  function ensureCss(){

      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b14.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  /* ---------- 数据安全访问 ---------- */
  function isArr(x){ return Object.prototype.toString.call(x) === "[object Array]"; }
  function D(){
    try{ return (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null); }
    catch(e){ return null; }
  }
  function arrOf(key){
    try{ var d = D(); return (d && isArr(d[key])) ? d[key] : []; }catch(e){ return []; }
  }
  function papers(){ return arrOf("papers"); }
  function entries(){ return arrOf("entries"); }
  function articles(){ return arrOf("articles"); }
  function hotspots(){ return arrOf("hotspots"); }

  /* ---------- 主题词拆解：A（手段/主体）+ B（目标/价值） ---------- */
  function coreWords(topic){
    var t = String(topic || "").trim()
              .replace(/[《》“”"'?？!！。，,、；;：:\s]+/g, " ").trim();
    if(!t) return { a:"", b:"" };
    var s = t.replace(/^[以让用把为凭靠向]/, "").trim(), i, p, a, b;
    for(i=0;i<HINGE.length;i++){
      p = s.indexOf(HINGE[i]);
      if(p > 1 && p < s.length - 1){
        a = s.slice(0, p); b = s.slice(p + HINGE[i].length);
        break;
      }
    }
    if(!a){
      p = s.search(/[与和及]/);
      if(p > 1 && p < s.length - 2){ a = s.slice(0, p); b = s.slice(p + 1); }
    }
    if(!a && s.length > 7){
      p = s.lastIndexOf("的");
      if(p > 1 && p < s.length - 2){ a = s.slice(p + 1); b = s.slice(0, p); }
    }
    if(!a){ a = s; b = ""; }
    a = String(a).replace(/^[以让用把为的]/, "").replace(/[的之]$/, "").trim();
    for(i=0;i<HINGE.length;i++){          /* 去掉打头的动词，如"推动乡村振兴"→"乡村振兴" */
      if(a.indexOf(HINGE[i]) === 0 && a.length > HINGE[i].length + 1){
        a = a.slice(HINGE[i].length); break;
      }
    }
    b = String(b || "").replace(/^[的之]/, "").trim();
    if(a.length > 12) a = a.slice(0, 12);
    if(b.length > 12) b = b.slice(0, 12);
    return { a:a, b:b };
  }

  /* ---------- 标题候选（对仗式公式） ---------- */
  function titleCands(topic){
    var c = coreWords(topic), a = c.a, b = c.b;
    if(!a) return ["【填：请先输入主题】"];
    if(b){
      return [
        "以" + a + "筑牢" + b + "根基",
        "让" + a + "成为" + b + "的最强底色",
        "在" + a + "中书写" + b + "新答卷",
        a + "为笔　" + b + "为卷",
        "涵养" + a + "之力　绘就" + b + "之景"
      ];
    }
    return [
      "以" + a + "之笔　绘就【填：目标图景】",
      a + "：新时代的必答题",

  /* ---------- 生成骨架 ---------- */
  function buildSk(topic, mode){
    var c = coreWords(topic), a = c.a || "【填：核心词】", b = c.b;
    var cands = titleCands(topic), title = cands[0];
    return {
      topic: topic,
      mode : mode,
      cands: cands,
      title: title,
      intro: introOf(topic, a, b),
      pts  : ptsOf(mode, topic, a, b),
      concl: conclOf(topic, a, b, title),
      ts   : Date.now()
    };
  }

  function modeName(k){
    for(var i=0;i<MODES.length;i++){ if(MODES[i].k === k) return MODES[i].n; }
    return MODES[0].n;
  }
  function modeAngles(k){
    for(var i=0;i<MODES.length;i++){ if(MODES[i].k === k) return MODES[i].angles; }
    return MODES[0].angles;
  }

  /* ---------- 关键词（用于素材/范文匹配） ---------- */
  function keywords(topic){
    var c = coreWords(topic), ks = [], seen = {}, i, w;
    var raw = [c.a, c.b, String(topic || "").replace(/[以让用把为的]/g, "")];
    for(i=0;i<raw.length;i++){
      w = String(raw[i] || "").trim();
      if(w.length >= 2 && !seen[w]){ seen[w] = 1; ks.push(w); }
      if(w.length >= 6){                     /* 长词再切前后两半，提高召回 */
        var h1 = w.slice(0, 3), h2 = w.slice(-3);
        if(!seen[h1]){ seen[h1] = 1; ks.push(h1); }
        if(!seen[h2]){ seen[h2] = 1; ks.push(h2); }
      }
    }
    return ks.slice(0, 6);
  }
  function hitAny(text, ks){
    var s = String(text || "").toLowerCase(), i;
    for(i=0;i<ks.length;i++){ if(ks[i] && s.indexOf(String(ks[i]).toLowerCase()) >= 0) return true; }
    return false;
  }

  /* ---------- 从素材库抽一条可用素材 ---------- */
  function matLines(topic){
    var ks = keywords(topic), es = entries(), out = [], i, j, ls, e;
    if(!ks.length) return out;
    for(i=0;i<es.length && out.length < 60;i++){
      e = es[i]; if(!e || !isArr(e.lines)) continue;
      if(["金句库","规范词库","案例库","框架库"].indexOf(e.lib) < 0) continue;
      ls = e.lines;
      for(j=0;j<ls.length;j++){
        if(hitAny(ls[j], ks) || hitAny(e.theme + " " + e.title, ks)){
          out.push(String(ls[j]).replace(/^[-　\s]+/, ""));
          if(out.length >= 60) break;
        }
      }
    }
    return out;
  }

  /* ---------- 对照范文：真题大作文 + 求是文章 + 可用素材 ---------- */
  function isEssayQ(q){
    return !!(q && /作文|文章|议论|策论|写作/.test(String(q.qtype || "")));
  }
  function findCompare(topic){
    var ks = keywords(topic), ps = papers(), as = articles();
    var res = { qs:[], arts:[], mats:[], ks:ks };
    if(!ks.length) return res;
    var i, j, p, q, blob;
    for(i=0;i<ps.length && res.qs.length < 4;i++){
      p = ps[i]; if(!p || !isArr(p.questions)) continue;
      for(j=0;j<p.questions.length;j++){
        q = p.questions[j]; if(!isEssayQ(q)) continue;
        blob = [ isArr(q.stem) ? q.stem.join(" ") : q.stem,
                 isArr(q.material) ? q.material.join(" ") : "",
                 isArr(q.points) ? q.points.map(function(x){ return x && x.text; }).join(" ") : "" ].join(" ");
        if(!hitAny(blob, ks)) continue;
        res.qs.push({
          head : (p.year || "") + " " + (p.province || "") + " " + (p.paper || "") + " 第" + (q.no || "?") + "题",
          stem : (isArr(q.stem) ? q.stem.join(" ") : String(q.stem || "")).slice(0, 160),
          pts  : (isArr(q.points) ? q.points : []).slice(0, 6)
                   .map(function(x){ return String((x && x.text) || ""); }),
          rev  : (isArr(q.review) ? q.review : []).slice(0, 3),
          ai   : (isArr(q.ai) ? q.ai : []).slice(0, 2)
        });
        if(res.qs.length >= 4) break;
      }
    }
    for(i=0;i<as.length && res.arts.length < 8;i++){
      var a = as[i]; if(!a) continue;
      if(hitAny([a.title, a.author, (isArr(a.themes) ? a.themes.join(" ") : "")].join(" "), ks)){
        res.arts.push(a);
      }
    }
    res.mats = matLines(topic).slice(0, 8);
    return res;
  }

  /* ---------- 草稿（localStorage） ---------- */
  function loadDrafts(){

    }catch(e){ return []; }

    try{ localStorage.setItem(STORE, JSON.stringify(arr.slice(0, MAXDRAFT))); return true; }
    catch(e){ return false; }

  function fmtTs(ts){
    try{
      var d = new Date(ts), z = function(n){ return (n < 10 ? "0" : "") + n; };
      return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()) +
             " " + z(d.getHours()) + ":" + z(d.getMinutes());
    }catch(e){ return "—"; }
  }

  /* ---------- 全文拼接 / 字数 ---------- */
  function fullText(sk){
    if(!sk) return "";
    var lines = [String(sk.title || "").trim(), String(sk.intro || "").trim()], i, p;
    for(i=0;i<sk.pts.length;i++){
      p = sk.pts[i];
      lines.push([String(p.c || "").trim(), String(p.r || "").trim(), String(p.e || "").trim()]
                 .filter(Boolean).join(""));
    }
    lines.push(String(sk.concl || "").trim());
    return lines.filter(Boolean).join("\n");
  }

           '<b>金句 / 规范词 / 案例</b></div><ul>' +
        c.mats.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    }
    return h + "</div>";
  }

  function draftHtml(){
    var ds = loadDrafts(), h = "";
    h += '<div class="b14-card" id="b14-s5"><div class="b14-h3"><span class="b14-num">5</span>我的草稿' +
         '<span class="b14-sub">存在本机浏览器（' + esc(STORE) + '），不上传任何服务器　共 ' + ds.length + ' 份</span></div>';
    if(!ds.length){
      return h + '<div class="b14-empty">还没有草稿。搭好骨架后点「💾 存草稿」，下次可一键回载继续打磨。</div></div>';
    }
    h += ds.map(function(d, i){
      return '<div class="b14-draft"><span class="dt">' + esc(fmtTs(d.ts)) + '</span>' +
        '<span class="dn">' + esc(d.title || d.topic || "无标题") + '</span>' +
        '<span class="dw">' + esc(d.topic || "") + '　' + (d.words || 0) + ' 字　' + esc(modeName(d.mode)) + '</span>' +
        '<span class="sp"></span>' +
        '<button class="b14-mini" data-b14="load" data-i="' + i + '">↩ 回载</button>' +
        '<button class="b14-mini del" data-b14="del" data-i="' + i + '">删除</button></div>';
    }).join("");
    return h + "</div>";
  }

  function draw(){
    ensureCss();
    var box = document.getElementById("content");
    if(!box) return;
    try{
      if(typeof renderSimpleNav === "function"){
        var nav = [{ label:"① 输入主题", target:"b14-s1" },
                   { label:"② 编辑骨架", target:"b14-s2" }];
        if(S.sk)  nav.push({ label:"③ 实时预览", target:"b14-s3" });
        if(S.cmp) nav.push({ label:"④ 对照范文", target:"b14-s4" });
        nav.push({ label:"⑤ 我的草稿", target:"b14-s5" });
        renderSimpleNav("大作文速构器", nav);
      }
    }catch(e){}
    try{
      var st = document.getElementById("stats");
      if(st) st.textContent = "大作文速构器 — 主题→骨架→素材→范文，四步搭出一篇 1000 字议论文（纯本地模板，不联网）";
    }catch(e){}

    var body = "";
    if(S.sk){
      body = '<div class="b14-cols"><div>' + step2Html() + (S.cmp ? cmpHtml() : "") + '</div>' +
             "<div>" + prevHtml() + "</div></div>";
    }else{
      body = '<div class="b14-empty" id="b14-s2">输入主题后点「⚡ 生成骨架」，' +
             '这里会出现<b>标题 + 开头 + 3 个分论点 + 结尾</b>的可编辑骨架，右侧同步预览全文。</div>';
    }

    box.innerHTML =
      '<div class="b14-wrap"><div class="b14-head">' +
        "<h2>✍️ 大作文速构器</h2>" +
        '<div class="b14-lead">大作文难，难在<b>下不去笔</b>。本模块把它拆成可练的步骤：' +
        '选主题 → 一键生成标准结构骨架 → 逐个填掉【坑位】 → 对照真题范文改。' +
        '模板全部本地生成，<b>不调模型、不联网</b>，草稿只存你自己的浏览器。</div></div>' +
        step1Html() + body + draftHtml() +
      "</div>";

    S.flash = "";
    autoGrowAll();
    bind(box);
  }

  /* ---------- 文本框自适应高度 ---------- */
  function autoGrow(el){
    try{
      if(!el || el.tagName !== "TEXTAREA") return;
      el.style.height = "auto";
      el.style.height = (el.scrollHeight + 2) + "px";
    }catch(e){}
  }
  function autoGrowAll(){
    try{
      var ts = document.querySelectorAll("#content .b14-ta"), i;
      for(i=0;i<ts.length;i++) autoGrow(ts[i]);
    }catch(e){}
  }

  /* ---------- 表单 → 状态 ---------- */
  function syncField(el){
    var f = el && el.getAttribute && el.getAttribute("data-f");
    if(!f) return false;
    var v = el.value == null ? "" : el.value;
    if(f === "topic"){ S.topic = v; return false; }
    if(!S.sk) return false;
    if(f === "title"){ S.sk.title = v; return true; }
    if(f === "intro"){ S.sk.intro = v; return true; }
    if(f === "concl"){ S.sk.concl = v; return true; }
    var m = /^p(\d+)([cre])$/.exec(f);
    if(m && S.sk.pts[+m[1]]){ S.sk.pts[+m[1]][m[2]] = v; return true; }
    return false;
  }

  /* 只刷新预览，避免重绘导致输入框失焦 */
  function updatePreview(){
    if(!S.sk) return;
    try{
      var wrap = document.getElementById("b14-s3");
      if(!wrap) return;
      var tmp = document.createElement("div");
      tmp.innerHTML = prevHtml();
      var np = tmp.querySelector("#b14-paper"), nc = tmp.querySelector("#b14-count");
      var op = document.getElementById("b14-paper"), oc = document.getElementById("b14-count");
      if(np && op) op.innerHTML = np.innerHTML;
      if(nc && oc) oc.innerHTML = nc.innerHTML;
    }catch(e){}
  }

  function readTopic(){
    try{
      var el = document.getElementById("b14-topic");
      if(el) S.topic = String(el.value || "").trim();
    }catch(e){}
    return S.topic;
  }

  /* ---------- 事件（委托到 #content，不用内联 onclick） ---------- */
  function bind(root){
    if(root.__b14bound) return;
    root.__b14bound = true;

    root.addEventListener("input", function(ev){
      var el = ev.target;
      if(!el || !el.getAttribute || !el.getAttribute("data-f")) return;
      autoGrow(el);
      if(syncField(el)) updatePreview();
    });

    root.addEventListener("keydown", function(ev){
      if(ev.keyCode === 13 && ev.target && ev.target.id === "b14-topic"){
        ev.preventDefault(); act("build", null);
      }
    });

    root.addEventListener("click", function(ev){
      var el = ev.target, a = null;
      while(el && el !== root){
        a = el.getAttribute && el.getAttribute("data-b14");
        if(a) break;
        el = el.parentNode;
      }
      if(!a) return;
      ev.preventDefault();
      try{ act(a, el); }catch(err){ try{ console.error("[_b14]", err); }catch(e){} }
    });
  }

  /* ---------- 动作 ---------- */
  function act(a, el){
    var i;
    if(a === "pick"){
      S.topic = el.getAttribute("data-t") || "";
      var tin = document.getElementById("b14-topic");
      if(tin){ tin.value = S.topic; tin.focus(); }
      return;
    }
    if(a === "mode"){
      readTopic();
      S.mode = el.getAttribute("data-m") || "wwh";
      if(S.sk){ S.sk = buildSk(S.sk.topic, S.mode); S.flash = "已切换角度并重生成骨架"; }
      draw(); return;
    }
    if(a === "build" || a === "rebuild"){
      readTopic();
      if(!S.topic){
        S.flash = "";
        try{
          var t2 = document.getElementById("b14-topic");
          if(t2){ t2.focus(); t2.placeholder = "先写一个主题，例如：以高质量发展托举民生幸福"; }
        }catch(e){}
        return;
      }
      S.sk = buildSk(S.topic, S.mode);
      S.pick = [0, 0, 0];
      S.cmp = null;
      S.flash = "骨架已生成，逐个填掉【坑位】即可成文";
      draw(); return;
    }
    if(a === "clear"){ S.sk = null; S.cmp = null; draw(); return; }
    if(a === "title"){
      i = parseInt(el.getAttribute("data-k"), 10);
      if(S.sk && !isNaN(i) && S.sk.cands[i]){
        S.sk.title = S.sk.cands[i];
        var tel = document.querySelector('#content [data-f="title"]');
        if(tel) tel.value = S.sk.title;
        updatePreview();
      }
      return;
    }
    if(a === "mat"){
      i = parseInt(el.getAttribute("data-i"), 10);
      if(!S.sk || isNaN(i) || !S.sk.pts[i]) return;
      var ls = matLines(S.sk.topic);
      if(!ls.length){ S.flash = "素材库里没找到同主题内容，先去「热点专题 / 文章清单」找"; draw(); return; }
      var k = (S.pick[i] || 0) % ls.length;
      S.pick[i] = k + 1;
      var cur = String(S.sk.pts[i].e || "");
      S.sk.pts[i].e = /^【素材：/.test(cur) ? ls[k] : (cur ? cur + "\n" + ls[k] : ls[k]);
      var box = document.querySelector('#content [data-f="p' + i + 'e"]');
      if(box){ box.value = S.sk.pts[i].e; autoGrow(box); }
      updatePreview();
      return;
    }
    if(a === "cmp"){
      if(!S.sk) return;
      S.cmp = findCompare(S.sk.topic);
      draw();
      try{ var n = document.getElementById("b14-s4"); if(n) n.scrollIntoView({ behavior:"smooth" }); }catch(e){}
      return;
    }
    if(a === "cmpclose"){ S.cmp = null; draw(); return; }
    if(a === "save"){
      if(!S.sk) return;
      var ds = loadDrafts();
      ds.unshift({
        ts: Date.now(), topic: S.sk.topic, mode: S.sk.mode, title: S.sk.title,
        cands: S.sk.cands, intro: S.sk.intro, pts: S.sk.pts, concl: S.sk.concl,
        words: countOf(S.sk)
      });
      S.flash = saveDrafts(ds) ? "已存草稿（本机）" : "浏览器拒绝写入本地存储，草稿未保存";
      draw(); return;
    }
    if(a === "load"){
      i = parseInt(el.getAttribute("data-i"), 10);
      var d = loadDrafts()[i];
      if(!d) return;
      S.topic = d.topic || "";
      S.mode  = d.mode || "wwh";
      S.sk = {
        topic: S.topic, mode: S.mode,
        cands: isArr(d.cands) ? d.cands : titleCands(S.topic),
        title: d.title || "", intro: d.intro || "",
        pts: isArr(d.pts) ? d.pts : ptsOf(S.mode, S.topic, coreWords(S.topic).a, coreWords(S.topic).b),
        concl: d.concl || "", ts: d.ts || Date.now()
      };
      S.cmp = null;
      S.flash = "已回载草稿：" + (d.title || d.topic || "");
      draw();
      try{ var s2 = document.getElementById("b14-s2"); if(s2) s2.scrollIntoView({ behavior:"smooth" }); }catch(e){}
      return;
    }
    if(a === "del"){
      i = parseInt(el.getAttribute("data-i"), 10);
      var arr = loadDrafts();
      if(isNaN(i) || !arr[i]) return;
      arr.splice(i, 1);
      saveDrafts(arr);
      S.flash = "已删除 1 份草稿";
      draw(); return;
    }
    if(a === "copy"){
      if(!S.sk) return;
      var txt = fullText(S.sk), ok = false;
      try{
        var ta = document.createElement("textarea");
        ta.value = txt;
        ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand("copy");
        document.body.removeChild(ta);
      }catch(e){ ok = false; }
      S.flash = ok ? "全文已复制到剪贴板" : "复制失败，请在预览区手动选中复制";
      draw(); return;
    }
  }

  /* ================= 路由入口 ================= */
  window.renderEssayBuilder = function(){
    try{
      draw();
    }catch(err){
      try{
        var box = document.getElementById("content");
        if(box) box.innerHTML = '<div class="b14-empty">大作文速构器运行出错：' +
          esc(String((err && err.message) || err)) + "</div>";
      }catch(e){}
      try{ console.error("[_b14]", err); }catch(e){}
    }
  };

})();

</script>
<script>/* === _b15.js === */
(function(){
  "use strict";
  /* ==================================================================
     _b15 答题助手（规范词 / 金句 主动召回）
     A. window.renderRecall()            —— 独立页面：搜索 + 类型筛选 + 分组列表
     B. window.b15MountRecall(pid,qno)   —— 作答弹窗内 #b15Recall 面板：按题型召回
     C. window.b15OnInput(text)          —— 作答框输入时轻量过滤召回列表
     纯前端 / 离线 / 零依赖，全部类名 b15- 前缀，不改主站任何全局。
     ================================================================== */

  /* ---------- 自带 HTML 转义 ---------- */
  var esc = window.esc || function(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };
  /* 属性值转义（额外处理引号） */
  function escA(s){
    return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* ---------- 通用小工具 ---------- */
  function arrOf(a){ return Object.prototype.toString.call(a) === "[object Array]" ? a : []; }
  function cut(s, n){ s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n) + "…" : s; }

  /* 安全读取 DATA.entries */
  function entries(){
    try{
      if(typeof DATA === "undefined" || !DATA) return [];
      return arrOf(DATA.entries);
    }catch(e){ return []; }
  }
  function entryAt(i){
    var list = entries();
    i = parseInt(i, 10);
    return (i >= 0 && i < list.length && list[i]) ? list[i] : null;
  }
  function textOf(e){
    if(!e) return "";
    return String(e.title || "") + " " + arrOf(e.lines).join(" ");
  }
  function fullText(e){
    if(!e) return "";
    var ls = arrOf(e.lines);
    return String(e.title || "") + (ls.length ? "\n" + ls.join("\n") : "");
  }

  /* ---------- 分词 ---------- */
  /* 搜索框：空格分词 = 同时包含 */
  function tokens(s){
    return String(s == null ? "" : s).trim().split(/\s+/).filter(function(t){ return !!t; });
  }
  /* 作答正文：抽中文 2-gram + 英数词，做轻量任一命中 */
  function softTokens(s){
    s = String(s == null ? "" : s);
    if(s.length > 300) s = s.slice(-300);
    var chunks = s.match(/[\u4e00-\u9fa5]+|[A-Za-z0-9]{2,}/g) || [];
    var out = [], seen = {}, i, j, c, g;
    for(i = 0; i < chunks.length && out.length < 80; i++){
      c = chunks[i];
      if(/^[A-Za-z0-9]+$/.test(c)){
        if(!seen[c]){ seen[c] = 1; out.push(c); }
        continue;
      }
      if(c.length <= 2){
        if(c.length === 2 && !seen[c]){ seen[c] = 1; out.push(c); }
        continue;
      }
      for(j = 0; j + 2 <= c.length && out.length < 80; j++){
        g = c.slice(j, j + 2);
        if(!seen[g]){ seen[g] = 1; out.push(g); }
      }
    }
    return out;
  }
  function hitAll(txt, toks){
    if(!toks.length) return true;
    for(var i = 0; i < toks.length; i++){ if(txt.indexOf(toks[i]) < 0) return false; }
    return true;
  }
  function hitAny(txt, toks){
    for(var i = 0; i < toks.length; i++){ if(txt.indexOf(toks[i]) >= 0) return true; }
    return false;
  }

  /* ---------- 库标签样式映射 ---------- */
  var TAGCLS = { "规范词库":"b15-t-norm", "金句库":"b15-t-gold", "案例库":"b15-t-case", "框架库":"b15-t-frame" };
  function tagCls(lib){ return TAGCLS[lib] || "b15-t-other"; }
  var LIBORDER = ["规范词库", "金句库", "案例库", "框架库"];

  /* ---------- 轻提示 ---------- */
  var toastTimer = null;
  function toast(msg){
    try{
      if(!document.body) return;
      var el = document.getElementById("b15Toast");
      if(!el){
        el = document.createElement("div");
        el.id = "b15Toast";
        el.className = "b15-toast";
        document.body.appendChild(el);
      }
      el.textContent = String(msg == null ? "" : msg);
      el.classList.add("b15-toast-on");
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){
        try{ el.classList.remove("b15-toast-on"); }catch(e){}
      }, 1300);
    }catch(e){}
  }

  /* ---------- 复制（clipboard → textarea 降级） ---------- */
  function copyFallback(s){
    try{
      var ta = document.createElement("textarea");
      ta.value = s;
      ta.setAttribute("readonly", "readonly");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
      document.body.removeChild(ta);
      toast(ok ? "已复制" : "复制失败，请手动选中");
    }catch(e){ toast("复制失败，请手动选中"); }
  }
  function copyText(t){
    var s = String(t == null ? "" : t);
    try{
      if(navigator && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(s).then(function(){ toast("已复制"); }, function(){ copyFallback(s); });
        return;
      }
    }catch(e){}
    copyFallback(s);
  }

  /* ---------- 插入到作答文本框 ---------- */
  function insertToAns(txt){
    try{
      var ta = document.getElementById("ansText");
      if(!ta){ toast("未找到作答框"); return false; }
      var s = String(txt == null ? "" : txt);
      var v = ta.value == null ? "" : String(ta.value);
      var a = (typeof ta.selectionStart === "number") ? ta.selectionStart : v.length;
      var b = (typeof ta.selectionEnd === "number") ? ta.selectionEnd : a;
      if(a > v.length) a = v.length;
      if(b < a) b = a;
      ta.value = v.slice(0, a) + s + v.slice(b);
      var pos = a + s.length;
      try{ ta.focus(); ta.setSelectionRange(pos, pos); }catch(e){}
      try{ ta.dispatchEvent(new Event("input", { bubbles:true })); }catch(e){}
      toast("已插入");
      return true;
    }catch(e){ return false; }
  }

  /* ==================================================================
     A. 独立页面 window.renderRecall
     ================================================================== */
  var P = { kw:"", lib:"全部" };
  var CHIPS = ["全部", "规范词库", "金句库", "案例库"];

  function pageShell(){
    var i, h = "";
    for(i = 0; i < CHIPS.length; i++){
      h += '<button type="button" class="b15-chip' + (P.lib === CHIPS[i] ? " b15-chip-on" : "") +
           '" data-lib="' + escA(CHIPS[i]) + '">' + esc(CHIPS[i]) + '</button>';
    }
    return '' +
      '<div class="b15-wrap">' +
        '<div class="b15-hd">' +
          '<div class="b15-h1">🧰 答题助手 · 主动召回</div>' +
          '<div class="b15-h2">搜规范词 / 金句 / 案例，空格分词 = 同时包含；复制后直接用进答案。</div>' +
        '</div>' +
        '<div class="b15-bar">' +
          '<input id="b15-kw" class="b15-input" type="text" autocomplete="off" ' +
            'placeholder="输入关键词，如：乡村振兴 治理" value="' + escA(P.kw) + '">' +
          '<div class="b15-chips">' + h + '</div>' +
        '</div>' +
        '<div id="b15-list" class="b15-list"></div>' +
      '</div>';
  }

  function itemHTML(i, e){
    var lines = arrOf(e.lines);
    var lib = String(e.lib || "其他");
    var h = '<div class="b15-item">' +
      '<div class="b15-row">' +
        '<span class="b15-tag ' + tagCls(lib) + '">' + esc(lib) + '</span>' +
        '<span class="b15-ttl">' + esc(e.title || "(无标题)") + '</span>' +
        '<span class="b15-sp"></span>' +
        (lines.length ? '<button type="button" class="b15-btn b15-tg" data-i="' + i + '">展开 ▾</button>' : '') +
        '<button type="button" class="b15-btn b15-cp" data-i="' + i + '">📋 复制</button>' +
      '</div>';
    if(lines.length){
      h += '<div class="b15-lines" id="b15-ln-' + i + '" hidden>';
      for(var k = 0; k < lines.length; k++){
        h += '<div class="b15-line">' + esc(lines[k]) + '</div>';
      }
      h += '</div>';
    }
    return h + '</div>';
  }

  function paintList(){
    var box;
    try{ box = document.getElementById("b15-list"); }catch(e){ box = null; }
    if(!box) return;
    try{
      var list = entries();
      if(!list.length){
        box.innerHTML = '<div class="b15-empty">素材数据未就绪（DATA.entries 为空）。</div>';
        return;
      }
      var toks = tokens(P.kw), buckets = {}, order = [], i, e, lib, n = 0;
      for(i = 0; i < list.length; i++){
        e = list[i];
        if(!e) continue;
        lib = String(e.lib || "其他");
        if(P.lib !== "全部" && lib !== P.lib) continue;
        if(toks.length && !hitAll(textOf(e), toks)) continue;
        if(!buckets[lib]){ buckets[lib] = []; order.push(lib); }
        buckets[lib].push(itemHTML(i, e));
        n++;
      }
      if(!n){
        box.innerHTML = '<div class="b15-empty">没有命中的素材。<br>试试减少关键词，或把类型切回「全部」。</div>';
        return;
      }
      /* 固定顺序在前，其余按出现顺序追加 */
      var seq = [], k;
      for(k = 0; k < LIBORDER.length; k++){ if(buckets[LIBORDER[k]]) seq.push(LIBORDER[k]); }
      for(k = 0; k < order.length; k++){ if(seq.indexOf(order[k]) < 0) seq.push(order[k]); }

      var html = '<div class="b15-count">共命中 <b>' + n + '</b> 条</div>';
      for(k = 0; k < seq.length; k++){
        lib = seq[k];
        html += '<div class="b15-group">' +
                  '<div class="b15-gh"><span class="b15-tag ' + tagCls(lib) + '">' + esc(lib) + '</span>' +
                  '<span class="b15-gn">' + buckets[lib].length + ' 条</span></div>' +
                  buckets[lib].join("") +
                '</div>';
      }
      box.innerHTML = html;
    }catch(err){
      try{ box.innerHTML = '<div class="b15-empty">列表渲染出错，已跳过。</div>'; }catch(e2){}
    }
  }

  window.renderRecall = function(){
    try{
      var host = document.getElementById("content");
      if(!host) return;
      host.innerHTML = pageShell();
      paintList();
    }catch(err){
      try{
        var h2 = document.getElementById("content");
        if(h2) h2.innerHTML = '<div class="b15-empty">答题助手加载失败，请返回重试。</div>';
      }catch(e){}
    }
  };

  /* ==================================================================
     B. 作答弹窗内召回面板 window.b15MountRecall
     ================================================================== */
  var RC = { qtype:"", filter:"", norm:[], gold:[] };

  /* 题型同义扩展（宽松匹配，数据里没有也不影响） */
  var QSYN = {
    "概括":["概括","归纳","要点","总结","梳理"],
    "归纳":["概括","归纳","要点","总结"],
    "分析":["分析","原因","内涵","理解","阐释","本质"],
    "对策":["对策","措施","建议","办法","解决","路径"],
    "公文":["公文","讲话","倡议","方案","通知","发言","汇报","提纲"],
    "应用":["公文","应用","方案","倡议","发言","提纲"],
    "作文":["论证","论述","立意","开头","结尾","文章","主题"],
    "评论":["评价","评论","看法","观点","论证"]
  };
  function qkeys(qt){
    var keys = [], base;
    qt = String(qt == null ? "" : qt).trim();
    if(!qt) return keys;
    keys.push(qt);
    base = qt.replace(/题$/, "");
    if(base && keys.indexOf(base) < 0) keys.push(base);
    for(var k in QSYN){
      if(!Object.prototype.hasOwnProperty.call(QSYN, k)) continue;
      if(base.indexOf(k) >= 0){
        for(var i = 0; i < QSYN[k].length; i++){
          if(keys.indexOf(QSYN[k][i]) < 0) keys.push(QSYN[k][i]);
        }
      }
    }
    return keys;
  }

  /* 取某库前 n 条，按题型相关性排序（title 命中 +2，lines 命中 +1） */
  function pick(lib, qt, n){
    var out = [];
    try{
      var list = entries(), keys = qkeys(qt), i, j, e, sc, t, ls;
      for(i = 0; i < list.length; i++){
        e = list[i];
        if(!e || String(e.lib || "") !== lib) continue;
        sc = 0;
        if(keys.length){
          t = String(e.title || "");
          ls = arrOf(e.lines).join(" ");
          for(j = 0; j < keys.length; j++){
            if(t.indexOf(keys[j]) >= 0) sc += 2;
            else if(ls.indexOf(keys[j]) >= 0) sc += 1;
          }
        }
        out.push({ i:i, e:e, s:sc, o:out.length });
      }
      out.sort(function(a, b){ return b.s - a.s || a.o - b.o; });
      out = out.slice(0, n);
    }catch(err){ out = []; }
    return out;
  }

  function cardHTML(it){
    var e = it.e, ls = arrOf(e.lines);
    var sub = ls.length ? ls[0] : "";
    return '<div class="b15-card">' +
      '<div class="b15-card-t">' + esc(e.title || "(无标题)") + '</div>' +
      (sub ? '<div class="b15-card-s">' + esc(cut(sub, 42)) + '</div>' : '') +
      '<div class="b15-card-a">' +
        '<button type="button" class="b15-mini b15-ins" data-i="' + it.i + '">➕插入</button>' +
        '<button type="button" class="b15-mini b15-cp" data-i="' + it.i + '">📋复制</button>' +
      '</div></div>';
  }

  function groupHTML(title, cls, arr){
    if(!arr.length) return "";
    var h = '<div class="b15-rg"><div class="b15-rg-h"><span class="b15-tag ' + cls + '">' +
            esc(title) + '</span><span class="b15-gn">' + arr.length + '</span></div><div class="b15-cards">';
    for(var i = 0; i < arr.length; i++) h += cardHTML(arr[i]);
    return h + '</div></div>';
  }

  function filterArr(arr, toks){
    if(!toks.length) return arr;
    var out = [];
    for(var i = 0; i < arr.length; i++){
      if(hitAny(textOf(arr[i].e), toks)) out.push(arr[i]);
    }
    return out;
  }

  function panelHTML(){
    var toks = softTokens(RC.filter);
    var nm = filterArr(RC.norm, toks), gd = filterArr(RC.gold, toks);
    var note = "";
    if(toks.length && !nm.length && !gd.length){
      nm = RC.norm; gd = RC.gold;
      note = '<div class="b15-note">当前正文暂无匹配，已回到默认推荐。</div>';
    }else if(toks.length){
      note = '<div class="b15-note">已按你正在写的内容过滤。</div>';
    }
    var body = groupHTML("规范词库", "b15-t-norm", nm) + groupHTML("金句库", "b15-t-gold", gd);
    if(!body) body = '<div class="b15-empty b15-empty-s">暂无可召回素材，不影响作答。</div>';
    return '<div class="b15-tip">💡 写答案时可直接点「➕插入」规范词，让表达更对路' +
             (RC.qtype ? '<span class="b15-qt">当前题型：' + esc(RC.qtype) + '</span>' : '') +
           '</div>' + note + '<div class="b15-scroll">' + body + '</div>';
  }

  window.b15MountRecall = function(pid, qno){
    var box = null;
    try{ box = document.getElementById("b15Recall"); }catch(e){ box = null; }
    if(!box) return;
    try{
      var qt = "";
      try{
        if(typeof findQ === "function"){
          var r = findQ(pid, qno);
          if(r && r.q && r.q.qtype) qt = String(r.q.qtype);
        }
      }catch(e1){ qt = ""; }
      RC.qtype = qt;
      RC.filter = "";
      RC.norm = pick("规范词库", qt, 8);
      RC.gold = pick("金句库", qt, 8);
      box.innerHTML = panelHTML();
    }catch(err){
      try{ box.innerHTML = ""; }catch(e2){}
    }
  };

  /* ==================================================================
     C. 作答框输入联动 window.b15OnInput
     ================================================================== */
  window.b15OnInput = function(text){
    try{
      var box = document.getElementById("b15Recall");
      if(!box) return;
      RC.filter = String(text == null ? "" : text);
      if(!RC.norm.length && !RC.gold.length){
        RC.norm = pick("规范词库", RC.qtype, 8);
        RC.gold = pick("金句库", RC.qtype, 8);
      }
      box.innerHTML = panelHTML();
    }catch(err){}
  };

  /* ==================================================================
     事件委托（页面 + 弹窗共用，只绑一次）
     ================================================================== */
  function upTo(el, cls){
    var n = el;
    while(n && n !== document){
      if(n.classList && n.classList.contains(cls)) return n;
      n = n.parentNode;
    }
    return null;
  }

  try{
    document.addEventListener("click", function(ev){
      try{
        var t = ev.target, b;
        if(!t) return;

        if((b = upTo(t, "b15-chip"))){
          P.lib = b.getAttribute("data-lib") || "全部";
          var cs = document.querySelectorAll(".b15-chip"), i;
          for(i = 0; i < cs.length; i++) cs[i].classList.remove("b15-chip-on");
          b.classList.add("b15-chip-on");
          paintList();
          return;
        }
        if((b = upTo(t, "b15-tg"))){
          var id = "b15-ln-" + (b.getAttribute("data-i") || "");
          var ln = document.getElementById(id);
          if(ln){
            var open = ln.hasAttribute("hidden");
            if(open) ln.removeAttribute("hidden"); else ln.setAttribute("hidden", "hidden");
            b.textContent = open ? "收起 ▴" : "展开 ▾";
          }
          return;
        }
        if((b = upTo(t, "b15-cp"))){
          var e1 = entryAt(b.getAttribute("data-i"));
          if(e1) copyText(fullText(e1)); else toast("条目已失效");
          return;
        }
        if((b = upTo(t, "b15-ins"))){
          var e2 = entryAt(b.getAttribute("data-i"));
          if(e2) insertToAns(String(e2.title || "")); else toast("条目已失效");
          return;
        }
      }catch(err){}
    }, false);

    document.addEventListener("input", function(ev){
      try{
        var t = ev.target;
        if(t && t.id === "b15-kw"){
          P.kw = t.value == null ? "" : String(t.value);
          paintList();
        }
      }catch(err){}
    }, false);
  }catch(e){}

})();

</script>
<script>/* === _b16.js === */
/* =====================================================================
   第十六批：申论成长史时间线（Growth Timeline）  (_b16.js)
   把历次作答 + 过程笔记 + 命中率聚成一条可搜索的时间线，
   直观看出「一个月前我总卡归纳，现在卡格式」式的成长轨迹。
   依赖（全部带守卫，缺失即降级）：
     DATA / findQ / openAnswerModal / b8OpenCompare / localStorage
   只读 localStorage("shenlun_answers_v2")，不写任何数据。
   类名统一 b16- 前缀；样式复用主站 :root 变量。
   入口：window.renderGrowth()
   ===================================================================== */
(function(){
  "use strict";

  var STORE_KEY = "shenlun_answers_v2";
  var PAGE = 20;    /* 每屏条数 */
  var PASS = 60;    /* 命中率达标线：≥ 红/达标，< 绿/待提升 */
  var WIN  = 5;     /* 趋势对比窗口：近 5 次 vs 此前 5 次 */

  var esc = window.esc || function(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  };

  /* 模块内状态（不碰主站 state） */
  var S     = { q:"", limit:PAGE, desc:true };
  var ITEMS = [];   /* 全部记录，按时间升序 */
  var VIEW  = [];   /* 当前过滤 + 排序后的可见集合 */
  var TOP   = [];   /* 最常卡的难点标签 Top N */

  /* ---------------- 基础工具 ---------------- */
  function isArr(x){ return Object.prototype.toString.call(x) === "[object Array]"; }

  function ensureCss(){
    try{
      var ls = document.getElementsByTagName("link"), i;
      for(i=0;i<ls.length;i++){
        if(String(ls[i].getAttribute("href") || "").indexOf("_b16.css") >= 0) return;
      }
      var el = document.createElement("link");
      el.rel = "stylesheet"; el.href = "_b16.css";
      (document.head || document.documentElement).appendChild(el);
    }catch(e){}
  }

  function pad(n){ return (n < 10 ? "0" : "") + n; }

  function dateOf(ts){
    if(typeof ts !== "number" || !isFinite(ts) || ts <= 0) return null;
    try{ var d = new Date(ts); return isNaN(d.getTime()) ? null : d; }catch(e){ return null; }
  }
  function fmtDT(d){
    if(!d) return "时间未记录";
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  function fmtD(d){
    if(!d) return "—";
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function monthOf(d){
    if(!d) return "时间未记录的早期作答";
    return d.getFullYear()+" 年 "+(d.getMonth()+1)+" 月";
  }
  function avg(a){
    if(!a || !a.length) return null;
    var s = 0, i;
    for(i=0;i<a.length;i++) s += a[i];
    return Math.round(s / a.length);
  }

  /* ---------------- 数据安全访问 ---------------- */
  function papers(){
    try{
      var D = (typeof DATA !== "undefined" && DATA) ? DATA : (window.DATA || null);
      return (D && isArr(D.papers)) ? D.papers : [];
    }catch(e){ return []; }
  }

  function localFind(pid, qno){
    var ps = papers(), i, j, qs;
    for(i=0;i<ps.length;i++){
      if(!ps[i] || String(ps[i].id) !== String(pid)) continue;
      qs = isArr(ps[i].questions) ? ps[i].questions : [];
      for(j=0;j<qs.length;j++){
        if(qs[j] && String(qs[j].no) === String(qno)) return { p:ps[i], q:qs[j] };
      }
      return { p:ps[i], q:null };   /* 套卷在、题号对不上时也保留套卷信息 */
    }
    return null;
  }

  function getPair(pid, qno){
    try{
      if(typeof findQ === "function"){
        var f = findQ(pid, qno);
        if(!f && String(Number(qno)) === String(qno)) f = findQ(pid, Number(qno));
        if(f && f.p) return f;
      }
    }catch(e){}
    try{ return localFind(pid, qno); }catch(e){ return null; }
  }

  function loadRecs(){
    try{
      if(typeof localStorage === "undefined" || !localStorage) return null;
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      var o = JSON.parse(raw);
      return (o && typeof o === "object") ? o : null;
    }catch(e){ return null; }
  }

  function scoreOf(rec){
    var s;
    try{ s = rec.score; }catch(e){ return null; }
    if(typeof s !== "number" || isNaN(s)){
      if(rec && typeof rec.rate === "number" && !isNaN(rec.rate)) s = rec.rate * 100;
      else return null;
    }
    s = Math.round(s);
    if(s < 0) s = 0;
    if(s > 100) s = 100;
    return s;
  }

  /* ---------------- 建时间线 ---------------- */
  function buildItems(){
    ITEMS = [];
    var map = loadRecs();
    if(!map) return;

    var keys;
    try{ keys = Object.keys(map); }catch(e){ return; }

    for(var i=0;i<keys.length;i++){
      var k = String(keys[i]), rec = null;
      try{ rec = map[keys[i]]; }catch(e){ rec = null; }
      if(!rec || typeof rec !== "object") continue;

      var cut = k.lastIndexOf("#");
      var pid = cut > 0 ? k.slice(0, cut) : k;
      var qno = cut > 0 ? k.slice(cut + 1) : "";

      var pair = getPair(pid, qno);
      var p = (pair && pair.p) ? pair.p : null;
      var q = (pair && pair.q) ? pair.q : null;

      var pr = (rec.process && typeof rec.process === "object") ? rec.process : null;
      var tags = [];
      if(pr && isArr(pr.tags)){
        for(var t=0;t<pr.tags.length;t++){
          var tv = String(pr.tags[t] == null ? "" : pr.tags[t]).trim();
          if(tv) tags.push(tv);
        }
      }
      var note = (pr && typeof pr.note === "string") ? pr.note.trim() : "";
      var d = dateOf(rec.ts);

      var it = {
        i: 0, idx: i, key: k, pid: pid, qno: qno,
        d: d, ts: (d ? d.getTime() : null),
        year:  (p && p.year != null)  ? String(p.year)  : "",
        paper: (p && p.paper)         ? String(p.paper) : "",
        prov:  (p && p.province)      ? String(p.province) : "",
        qtype: String(rec.qtype || (q && q.qtype) || "").trim(),
        score: scoreOf(rec),
        hit:   (typeof rec.hitCount === "number" && !isNaN(rec.hitCount)) ? rec.hitCount : null,
        total: (typeof rec.total === "number" && !isNaN(rec.total)) ? rec.total : null,
        tags: tags, note: note,
        text: (typeof rec.text === "string") ? rec.text : "",
        hasImg: !!(pr && (pr.img || pr.noteImg || pr.materialImg))
      };
      it.blob = [fmtD(d), it.year, it.paper, it.prov, "题" + it.qno, it.qtype,
                 tags.join(" "), note, it.text].join(" ").toLowerCase();
      ITEMS.push(it);
    }

    /* 升序：有 ts 按 ts，无 ts 的按 key 原始顺序垫在最前（视作更早的历史记录） */
    ITEMS.sort(function(a, b){
      if(a.ts == null && b.ts == null) return a.idx - b.idx;
      if(a.ts == null) return -1;
      if(b.ts == null) return 1;
      if(a.ts !== b.ts) return a.ts - b.ts;
      return a.idx - b.idx;
    });
    for(var j=0;j<ITEMS.length;j++) ITEMS[j].i = j;
  }

  function buildTop(n){
    var cnt = {}, i, j, t, out = [];
    for(i=0;i<ITEMS.length;i++){
      for(j=0;j<ITEMS[i].tags.length;j++){
        t = ITEMS[i].tags[j];
        cnt[t] = (cnt[t] || 0) + 1;
      }
    }
    try{
      out = Object.keys(cnt).map(function(k){ return { t:k, c:cnt[k] }; });
    }catch(e){ out = []; }
    out.sort(function(a, b){ return (b.c - a.c) || (a.t < b.t ? -1 : 1); });
    return out.slice(0, n);
  }

  function applyFilter(){
    var terms = S.q ? S.q.toLowerCase().split(/\s+/) : [];
    var use = [], i, j;
    for(i=0;i<terms.length;i++) if(terms[i]) use.push(terms[i]);

    var out = [];
    for(i=0;i<ITEMS.length;i++){
      var ok = true;
      for(j=0;j<use.length;j++){
        if(ITEMS[i].blob.indexOf(use[j]) < 0){ ok = false; break; }
      }
      if(ok) out.push(ITEMS[i]);
    }
    if(S.desc) out.reverse();
    VIEW = out;
  }

  /* ---------------- 片段 ---------------- */
  function trendHtml(){
    var sc = [], i;
    for(i=0;i<ITEMS.length;i++) if(ITEMS[i].score != null) sc.push(ITEMS[i].score);
    if(sc.length < 2) return '<span class="b16-flat">作答次数还太少，再做几题就能算出趋势</span>';

    var n = sc.length;
    var rec = sc.slice(Math.max(0, n - WIN));
    var pre = sc.slice(Math.max(0, n - rec.length - WIN), n - rec.length);
    var ra  = avg(rec);
    if(!pre.length){
      return '近 ' + rec.length + ' 次平均 <b>' + ra + '%</b> <span class="b16-flat">（还没有更早的对照样本）</span>';
    }
    var ba = avg(pre), d = ra - ba;
    var cls  = d > 0 ? "up" : (d < 0 ? "down" : "flat");
    var mark = d > 0 ? ("🔺 +" + d + " 个百分点")
                     : (d < 0 ? ("🔻 " + d + " 个百分点") : "➖ 持平");
    return '近 ' + rec.length + ' 次平均 <b>' + ra + '%</b> · 此前 ' + pre.length + ' 次平均 <b>' + ba + '%</b> · ' +
           '<span class="b16-trend ' + cls + '">' + mark + '</span>';
  }

  function overviewHtml(){
    var first = null, last = null, i;
    for(i=0;i<ITEMS.length;i++){ if(ITEMS[i].d){ first = ITEMS[i].d; break; } }
    for(i=ITEMS.length-1;i>=0;i--){ if(ITEMS[i].d){ last = ITEMS[i].d; break; } }

    var tagHtml = "";
    if(TOP.length){
      for(i=0;i<TOP.length;i++){
        tagHtml += '<span class="b16-chip hot" data-b16="top" data-i="' + i + '">' +
                     esc(TOP[i].t) + '<i>' + TOP[i].c + '</i></span>';
      }
    }else{
      tagHtml = '<span class="b16-flat">还没记过难点标签。作答提交时勾一勾「卡在哪」，这里就能长出你的薄弱画像</span>';
    }

    return '<div class="b16-card b16-ov">' +
             '<div class="b16-ovh">📈 成长概览</div>' +
             '<div class="b16-ovg">' +
               '<div class="b16-kv"><span>总作答次数</span><b>' + ITEMS.length + '</b></div>' +
               '<div class="b16-kv"><span>最早作答</span><b>' + esc(fmtD(first)) + '</b></div>' +
               '<div class="b16-kv"><span>最近作答</span><b>' + esc(fmtD(last)) + '</b></div>' +
             '</div>' +
             '<div class="b16-line"><span class="b16-lb">命中率趋势</span>' + trendHtml() + '</div>' +
             '<div class="b16-line"><span class="b16-lb">最常卡的难点</span>' + tagHtml + '</div>' +
           '</div>';
  }

  function itemHtml(it){
    var lv    = (it.score == null) ? "na" : (it.score >= PASS ? "pass" : "low");
    var scTxt = (it.score == null) ? "—" : (it.score + '<i>%</i>');
    var scTip = (it.score == null) ? "未评分" : (it.score >= PASS ? "达标" : "待提升");

    var meta = [];
    if(it.year)  meta.push(esc(it.year));
    if(it.prov)  meta.push(esc(it.prov));
    if(it.paper) meta.push(esc(it.paper));
    var title = meta.join(" · ") || esc(it.pid);

    var h = '<div class="b16-item">' +
              '<span class="b16-dot ' + lv + '"></span>' +
              '<div class="b16-card b16-it">' +
                '<div class="b16-ih">' +
                  '<div class="b16-il">' +
                    '<div class="b16-date">🗓 ' + esc(fmtDT(it.d)) + '</div>' +
                    '<div class="b16-tt">' + title +
                      '<span class="b16-qn">题 ' + esc(it.qno || "?") + '</span>' +
                      (it.qtype ? '<span class="b16-qt">' + esc(it.qtype) + '</span>' : "") +
                    '</div>' +
                  '</div>' +
                  '<div class="b16-ir ' + lv + '">' +
                    '<div class="b16-sc">' + scTxt + '</div>' +
                    '<div class="b16-sct">' + scTip +
                      ((it.hit != null && it.total) ? ' · 命中 ' + it.hit + '/' + it.total : "") +
                    '</div>' +
                  '</div>' +
                '</div>';

    if(it.tags.length || it.note || it.hasImg){
      h += '<div class="b16-proc">';
      if(it.tags.length){
        h += '<div class="b16-tags">';
        for(var j=0;j<it.tags.length;j++){
          h += '<span class="b16-chip" data-b16="tag" data-i="' + it.i + '" data-j="' + j + '">' +
                 esc(it.tags[j]) + '</span>';
        }
        h += '</div>';
      }
      if(it.note) h += '<div class="b16-note">' + esc(it.note) + '</div>';
      if(it.hasImg) h += '<div class="b16-imgtip">📎 该次作答另存有手写/材料图片</div>';
      h += '</div>';
    }

    h += '<div class="b16-acts">' +
           '<button class="b16-btn" data-b16="redo" data-i="' + it.i + '">✍️ 重做</button>' +
           '<button class="b16-btn ghost" data-b16="cmp" data-i="' + it.i + '">🔍 答案对照</button>' +
         '</div>' +
        '</div></div>';
    return h;
  }

  function paintList(){
    applyFilter();

    var cnt = document.getElementById("b16-cnt");
    if(cnt){
      cnt.innerHTML = '命中 <b>' + VIEW.length + '</b> 条' +
        (S.q ? '（共 ' + ITEMS.length + ' 条记录）' : '') +
        ' · 当前 ' + (S.desc ? "新 → 旧" : "旧 → 新");
    }

    var box = document.getElementById("b16-list");
    if(!box) return;

    if(!VIEW.length){
      box.innerHTML = '<div class="b16-card b16-empty">没有匹配的记录，换个题型 / 关键词 / 标签试试。</div>';
      var m0 = document.getElementById("b16-more");
      if(m0) m0.innerHTML = "";

    }

    var show = VIEW.slice(0, S.limit);
    var h = '<div class="b16-tl">', curMon = null, i;
    for(i=0;i<show.length;i++){
      var mon = monthOf(show[i].d);
      if(mon !== curMon){
        curMon = mon;
        h += '<div class="b16-mon"><span class="b16-mdot"></span>' + esc(mon) + '</div>';
      }

    h += '</div>';

  /* ---------------- 渲染 ---------------- */
  function draw(){

      var st = document.getElementById("stats");

    }catch(e){}

      box.innerHTML = '<div class="b16-wrap">' +
          '<div class="b16-head"><h2>🌱 申论成长史</h2>' +
          '<p class="b16-lead">把历次作答、过程笔记和命中率串成一条时间线，看清自己是怎么一步步变强的。</p></div>' +
          '<div class="b16-card b16-empty">还没有作答记录，去真题库做几题，这里会沉淀你的成长史。</div>' +

        '<div class="b16-head">' +
          '<h2>🌱 申论成长史</h2>' +

            '对比<b>近 ' + WIN + ' 次</b>与<b>此前 ' + WIN + ' 次</b>，就能看出难点是不是从「归纳」挪到了「格式」。</p>' +
        '</div>' +
